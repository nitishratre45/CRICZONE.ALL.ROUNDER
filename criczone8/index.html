.hero-info { animation-delay: .16s; }

.tools,
.separator-line {

.channel-card:nth-child(3) { animation-delay: .08s; }

    to { opacity: 1; transform: translateY(0); }

@keyframes cardReveal {
    from { opacity: 0; transform: translateY(16px) scale(.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

    from { transform: translate3d(0, -12px, 0) scale(.98); }

    /* =====================================================

    setupEvents() {

                        button.classList.add(

                        );


                        this.currentFilter =

                        this.applyFilters();

                    }
                );

            });


        window.addEventListener(

            }
        );

    /* =====================================================
       FIREBASE CONNECTION
       ===================================================== */

    async setupFirebaseConnection() {

        const ready =
            await firebaseReady;


        if (
            !ready ||
            !database
        ) {

            return;

        }

        const connectedRef =
            ref(
                database,
                ".info/connected"
            );


        onValue(
            connectedRef,
            snapshot => {

                this.firebaseConnected =
                    snapshot.val() === true;


                console.log(
                    "Firebase connected:",
                    this.firebaseConnected
                );


                if (
                    this.firebaseConnected &&
                    this.currentStreamId !== null
                ) {

                    this.enterViewer(
                        this.currentStreamId
                    );

                }

            }
        );

    }


    /* =====================================================
       ENTER VIEWER
       ===================================================== */

    async enterViewer(channelId) {

        try {

            await this.leaveViewer();


            if (
                !this.firebaseConnected
            ) {

                return;

            }


            const safeId =
                this.safeFirebaseKey(
                    channelId
                );


            const viewersRef =
                ref(
                    database,
                    "liveViewers/" +
                    safeId
                );


            this.presenceRef =
                push(
                    viewersRef
                );


            this.presenceDisconnect =
                onDisconnect(
                    this.presenceRef
                );


            await this.presenceDisconnect
                .remove();


            await set(
                this.presenceRef,
                {

                    online:
                        true,

                    channelId:
                        String(channelId),

                    joinedAt:
                        serverTimestamp()

                }
            );


            this.listenViewerCount(
                safeId
            );


        } catch (error) {

            console.error(
                "Firebase viewer error:",
                error
            );

            this.viewerCount = 0;

            this.updateViewerCount();

        }

    }


    /* =====================================================
       LEAVE VIEWER
       ===================================================== */

    async leaveViewer() {

        try {

            if (
                this.presenceRef
            ) {

                await remove(
                    this.presenceRef
                );

            }

        } catch (error) {

            console.warn(
                "Viewer cleanup:",
                error
            );

        }


        this.presenceRef = null;

        this.presenceDisconnect = null;


        if (
            this.viewerListener
        ) {

            try {

                this.viewerListener();

            } catch (error) {}

        }


        this.viewerListener = null;

        this.viewerCount = 0;

        this.updateViewerCount();

    }


    /* =====================================================
       VIEWER LISTENER
       ===================================================== */

    listenViewerCount(channelId) {

        if (
            this.viewerListener
        ) {

            try {

                this.viewerListener();

            } catch (error) {}

        }


        const viewersRef =
            ref(
                database,
                "liveViewers/" +
                channelId
            );


        this.viewerListener =
            onValue(
                viewersRef,
                snapshot => {

                    const data =
                        snapshot.val();


                    if (
                        !data
                    ) {

                        this.viewerCount =
                            0;

                    } else {

                        this.viewerCount =
                            Object.keys(
                                data
                            ).length;

                    }


                    this.updateViewerCount();

                },
                error => {

                    console.error(
                        "Viewer count error:",
                        error
                    );

                    this.viewerCount = 0;

                    this.updateViewerCount();

                }
            );

    }


    /* =====================================================
       UPDATE WATCHING COUNT
       ===================================================== */

    updateViewerCount() {

        if (
            !this.$ ||
            !this.$.viewerCount
        ) {

            return;

        }


        const total =
            this.viewerBaseCount +
            this.viewerCount;


        this.$.viewerCount.textContent =
            String(total);

    }


    /* =====================================================
       SAFE FIREBASE KEY
       ===================================================== */

    safeFirebaseKey(value) {

        return String(value)
            .replace(
                /[.#$[\]/]/g,
                "_"
            );

    }


    /* =====================================================
       FETCH CHANNELS
       ===================================================== */

    async fetchChannels() {

        try {

            const response =
                await fetch(
                    window.CricConfig.sourceUrl,
                    {
                        cache:
                            "no-store"
                    }
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const data =
                await response.json();


            if (
                Array.isArray(data)
            ) {

                this.masterChannels =
                    data;

            } else {

                this.masterChannels =
                    data.iframes ||
                    data.channels ||
                    data.streams ||
                    data.data ||
                    [];

            }


            if (
                !Array.isArray(
                    this.masterChannels
                )
            ) {

                this.masterChannels =
                    [];

            }


            this.renderChannels();

            this.applyFilters();

            this.handleUrl();

        } catch (error) {

            console.error(
                "CRICZONE feed error:",
                error
            );


            this.$.grid.innerHTML = `

                <div class="state">

                    Unable to load channels.

                </div>

            `;

        }

    }


    /* =====================================================
       RENDER CHANNELS
       ===================================================== */

    renderChannels() {

        this.$.grid.innerHTML = "";


        if (
            !this.masterChannels.length
        ) {

            this.$.grid.innerHTML = `

                <div class="state">

                    No channels found.

                </div>

            `;

            return;

        }


        this.masterChannels.forEach(
            (channel, index) => {

                const id =
                    channel.id !== undefined
                        ? channel.id
                        : index;


                const title =

                    channel.title ||

                    channel.name ||

                    channel.channel ||

                    `Channel ${index + 1}`;


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "channel-card";


                card.dataset.id =
                    String(id);


                card.dataset.title =
                    String(title)
                        .toLowerCase();


                card.innerHTML = `

                    <div class="card-title">

                        ${this.escapeHtml(
                            title
                        )}

                    </div>


                    <div class="card-meta">

                        <span>
                            HD FEED
                        </span>

                        <span class="watch">
                            WATCH NOW →
                        </span>

                    </div>

                `;


                card.onclick = () => {

                    this.openPlayer(id);

                };


                this.$.grid.appendChild(
                    card
                );

            }
        );

    }


    /* =====================================================
       FILTER
       ===================================================== */

    applyFilters() {

        const query =
            (
                this.$.search.value ||
                ""
            )
            .toLowerCase()
            .trim();


        const filter =
            this.currentFilter;


        this.shadow
            .querySelectorAll(
                ".channel-card"
            )
            .forEach(card => {

                const title =
                    card.dataset.title ||
                    "";


                const searchMatch =
                    !query ||
                    title.includes(
                        query
                    );


                let filterMatch =
                    true;


                if (
                    filter === "sony"
                ) {

                    filterMatch =
                        title.includes(
                            "sony"
                        );

                }


                if (
                    filter === "star"
                ) {

                    filterMatch =
                        title.includes(
                            "star"
                        );

                }


                if (
                    filter === "sports"
                ) {

                    filterMatch =
                        title.includes(
                            "sports"
                        );

                }


                if (
                    filter === "cricket"
                ) {

                    filterMatch =
                        title.includes(
                            "cricket"
                        );

                }


                if (
                    filter === "hd"
                ) {

                    filterMatch =
                        title.includes(
                            "hd"
                        );

                }


                card.style.display =
                    searchMatch &&
                    filterMatch
                        ? ""
                        : "none";

            });

    }


    /* =====================================================
       OPEN PLAYER
       ===================================================== */

    async openPlayer(identifier) {

        const target =
            this.masterChannels.find(
                (channel, index) => {

                    const id =
                        channel.id !== undefined
                            ? channel.id
                            : index;

                    return String(id) ===
                        String(identifier);

                }
            );


        if (
            !target
        ) {

            return;

        }


        await this.leaveViewer();


        /*
         * Keep ORIGINAL URL resolution.
         */
        let streamUrl =

            target.iframeSrc ||

            target.url ||

            target.link ||

            target.stream ||

            target.file ||

            target.source ||

            target.src;


        if (
            !streamUrl
        ) {

            streamUrl =
                "https://sonucdn-v2.pages.dev/star.html?id=" +
                encodeURIComponent(
                    target.id !== undefined
                        ? target.id
                        : identifier
                );

        }


        this.currentStreamId =
            target.id !== undefined
                ? target.id
                : identifier;


        this.currentChannelTitle =

            target.title ||

            target.name ||

            target.channel ||

            "Live Stream";


        this.$.playerTitle.textContent =
            this.currentChannelTitle;


        this.viewerCount = 0;

        this.updateViewerCount();


        this.$.home.classList.add(
            "hidden"
        );


        this.$.playerView.classList.add(
            "active"
        );


        history.pushState(
            {
                id:
                    this.currentStreamId
            },
            "",
            "?id=" +
            encodeURIComponent(
                this.currentStreamId
            )
        );


        this.enterViewer(
            this.currentStreamId
        );


        /*
         * Load stream.
         */
        await this.loadStream(
            streamUrl
        );


        /*
         * Start 60-second Telegram timer.
         */
        this.startPreviewTimer();

    }


    /* =====================================================
       LOAD STREAM
       ===================================================== */

    async loadStream(streamUrl) {

        /*
         * Reset player.
         */

        try {

            this.$.player.pause();

        } catch (e) {}


        /*
         * Destroy previous Shaka instance.
         */

        if (
            this.shakaPlayer
        ) {

            try {

                await this.shakaPlayer.destroy();

            } catch (error) {

                console.warn(
                    "Previous Shaka destroy:",
                    error
                );

            }

            this.shakaPlayer =
                null;

        }


        /*
         * Detect direct media.
         */

        const url =
            String(
                streamUrl || ""
            );


        const lowerUrl =
            url.toLowerCase();


        const isDirectManifest =

            lowerUrl.includes(
                ".m3u8"
            ) ||

            lowerUrl.includes(
                ".mpd"
            );


        /*
         * Direct HLS/DASH:
         * use Shaka.
         */

        if (
            isDirectManifest &&
            window.shaka
        ) {

            try {

                shaka.polyfill.installAll();


                if (
                    !shaka.Player
                        .isBrowserSupported()
                ) {

                    throw new Error(
                        "Shaka Player is not supported"
                    );

                }


                this.shakaPlayer =
                    new shaka.Player(
                        this.$.player
                    );


                this.shakaPlayer
                    .addEventListener(
                        "error",
                        event => {

                            console.error(
                                "Shaka error:",
                                event.detail
                            );

                        }
                    );


                await this.shakaPlayer.load(
                    url
                );


                this.setPlayerStatus(
                    "LIVE"
                );


                try {

                    await this.$.player.play();

                } catch (e) {

                    console.log(
                        "Autoplay requires interaction."
                    );

                }


                return;

            } catch (error) {

                console.error(
                    "Shaka load failed:",
                    error
                );

            }

        }


        /*
         * If the existing source is an HTML
         * player page, keep the original
         * URL unchanged and use a compatible
         * embedded frame.
         *
         * This preserves existing feed links.
         */

        this.loadEmbeddedPlayer(
            url
        );

    }


    /* =====================================================
       EMBEDDED PLAYER FALLBACK
       ===================================================== */

    loadEmbeddedPlayer(url) {

        /*
         * Replace video element with iframe
         * only for existing HTML player URLs.
         */

        const oldVideo =
            this.$.player;


        const iframe =
            document.createElement(
                "iframe"
            );


        iframe.id =
            "player";


        iframe.className =
            "shaka-video";


        iframe.allow =
            "autoplay; fullscreen; encrypted-media; picture-in-picture";

        iframe.setAttribute(
            "referrerpolicy",
            "no-referrer"
        );

        // Block popup windows and top-level ad redirects from embedded player pages.
        iframe.setAttribute(
            "sandbox",
            "allow-scripts allow-same-origin allow-forms allow-presentation"
        );


        iframe.loading =
            "eager";


        iframe.src =
            url;


        oldVideo.replaceWith(
            iframe
        );


        this.$.player =
            iframe;


        this.setPlayerStatus(
            "LIVE"
        );

    }


    /* =====================================================
       PLAYER STATUS
       ===================================================== */

    setPlayerStatus(text) {

        if (
            !this.$ ||
            !this.$.playerStatus
        ) {

            return;

        }


        this.$.playerStatus.innerHTML = `

            <span class="status-dot"></span>

            ${this.escapeHtml(text)}

        `;

    }


    /* =====================================================
       CLOSE PLAYER
       ===================================================== */

    async closePlayer() {

        this.stopPreviewTimer();

        await this.leaveViewer();


        /*
         * Destroy Shaka.
         */

        if (
            this.shakaPlayer
        ) {

            try {

                await this.shakaPlayer.destroy();

            } catch (error) {

                console.warn(
                    "Shaka destroy:",
                    error
                );

            }

            this.shakaPlayer =
                null;

        }


        /*
         * Stop current media/frame.
         */

        if (
            this.$.player
        ) {

            try {

                if (
                    this.$.player.tagName ===
                    "VIDEO"
                ) {

                    this.$.player.pause();

                    this.$.player.removeAttribute(
                        "src"
                    );

                    this.$.player.load();

                } else {

                    this.$.player.src =
                        "about:blank";

                }

            } catch (error) {}

        }


        this.$.playerView
            .classList
            .remove(
                "active"
            );


        this.$.home
            .classList
            .remove(
                "hidden"
            );


        this.currentStreamId =
            null;


        this.currentChannelTitle =
            "";


        /*
         * Re-create video element so
         * next stream can use Shaka again.
         */

        const currentPlayer =
            this.$.player;


        if (
            currentPlayer &&
            currentPlayer.tagName !==
            "VIDEO"
        ) {

            const video =
                document.createElement(
                    "video"
                );


            video.id =
                "player";


            video.className =
                "shaka-video";


            video.autoplay =
                true;


            video.playsInline =
                true;


            video.controls =
                true;


            video.preload =
                "auto";


            currentPlayer.replaceWith(
                video
            );


            this.$.player =
                video;

        }


        if (
            window.location.search
        ) {

            history.pushState(
                {},
                "",
                window.location.pathname
            );

        }

    }


    /* =====================================================
       URL
       ===================================================== */

    handleUrl() {

        const id =
            new URLSearchParams(
                window.location.search
            ).get("id");


        if (
            !id
        ) {

            return;

        }


        if (
            this.masterChannels.length
        ) {

            this.openPlayer(id);

        }

    }


    /* =====================================================
       TELEGRAM PREVIEW
       ===================================================== */

    startPreviewTimer() {

        this.stopPreviewTimer();


        if (
            this.isUnlocked
        ) {

            return;

        }


        this.lockTimer =
            setTimeout(
                () => {

                    this.showTelegramModal();

                },

                60000
            );

    }


    stopPreviewTimer() {

        if (
            this.lockTimer
        ) {

            clearTimeout(
                this.lockTimer
            );

            this.lockTimer =
                null;

        }

    }


    /* =====================================================
       TELEGRAM MODAL
       ===================================================== */

    showTelegramModal() {

        if (
            this.isUnlocked
        ) {

            return;

        }


        this.$.modal
            .classList
            .add(
                "show"
            );


        /*
         * Pause actual video.
         */

        try {

            if (
                this.$.player &&
                this.$.player.tagName ===
                "VIDEO"
            ) {

                this.$.player.pause();

            }

        } catch (error) {}

    }


    closeModal() {

        this.$.modal
            .classList
            .remove(
                "show"
            );

    }


    /* =====================================================
       JOIN TELEGRAM
       ===================================================== */

    joinTelegram() {

        localStorage.setItem(
            "criczone_unlocked_time",
            String(
                Date.now()
            )
        );


        this.isUnlocked =
            true;


        this.closeModal();


        window.open(
            window.CricConfig.telegramLink,
            "_blank",
            "noopener,noreferrer"
        );


        /*
         * Resume actual video.
         */

        try {

            if (
                this.$.player &&
                this.$.player.tagName ===
                "VIDEO"
            ) {

                this.$.player.play();

            }

        } catch (error) {}

    }


    /* =====================================================
       UNLOCK
       ===================================================== */

    checkUnlock() {

        const saved =
            localStorage.getItem(
                "criczone_unlocked_time"
            );


        if (
            !saved
        ) {

            return;

        }


        const timestamp =
            Number(
                saved
            );


        if (
            Date.now() -
            timestamp <
            24 * 60 * 60 * 1000
        ) {

            this.isUnlocked =
                true;

        } else {

            localStorage.removeItem(
                "criczone_unlocked_time"
            );

        }

    }


    /* =====================================================
       SHARE
       ===================================================== */

    async shareStream() {

        try {

            if (
                navigator.share
            ) {

                await navigator.share({

                    title:
                        "CRICZONE LIVE",

                    text:
                        this.$.playerTitle
                            .textContent,

                    url:
                        window.location.href

                });

                return;

            }


            await navigator.clipboard
                .writeText(
                    window.location.href
                );


            const oldText =
                this.$.share
                    .textContent;


            this.$.share
                .textContent =
                "COPIED!";


            setTimeout(
                () => {

                    this.$.share
                        .textContent =
                        oldText;

                },
                1800
            );

        } catch (error) {

            console.warn(
                "Share:",
                error
            );

        }

    }


    /* =====================================================
       BACKGROUND
       ===================================================== */

    setupBackground() {

        const canvas =
            this.shadow.querySelector(
                "#bgCanvas"
            );


        const ctx =
            canvas.getContext(
                "2d"
            );


        const resize = () => {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

        };


        resize();


        window.addEventListener(
            "resize",
            resize
        );


        for (
            let i = 0;
            i < 90;
            i++
        ) {

            this.stars.push({

                x:
                    Math.random() *
                    window.innerWidth,

                y:
                    Math.random() *
                    window.innerHeight,

                length:
                    10 +
                    Math.random() *
                    35,

                speed:
                    .4 +
                    Math.random() *
                    1.3,

                alpha:
                    .08 +
                    Math.random() *
                    .28

            });

        }


        const draw = () => {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            this.stars.forEach(
                star => {

                    ctx.strokeStyle =
                        `rgba(
                            0,
                            255,
                            204,
                            ${star.alpha}
                        )`;


                    ctx.lineWidth =
                        1;


                    ctx.beginPath();


                    ctx.moveTo(
                        star.x,
                        star.y
                    );


                    ctx.lineTo(
                        star.x +
                        star.length,
                        star.y
                    );


                    ctx.stroke();


                    star.x +=
                        star.speed;


                    if (
                        star.x >
                        canvas.width
                    ) {

                        star.x =
                            -star.length;

                        star.y =
                            Math.random() *
                            canvas.height;

                    }

                }
            );


            this.animationFrameId =
                requestAnimationFrame(
                    draw
                );

        };


        draw();

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    escapeHtml(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }

}


/* =========================================================
   REGISTER
   ========================================================= */

customElements.define(
    "criczone-ui",
    CriczoneUI
);


console.log(
    "CRICZONE LIVE + Shaka + Firebase initialized"
);

</script>
