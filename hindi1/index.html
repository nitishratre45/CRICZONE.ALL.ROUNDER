<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}

.shaka-video-container{
position:fixed;
inset:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
}

video{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}

.custom-watermark{
position:absolute;
z-index:40;
pointer-events:none;
top:65%;
left:6%;
transform:translateY(-50%);
font-size:11px;
font-weight:600;
color:rgba(255,255,255,0.12);
}

.block-overlay{
position:fixed;
inset:0;
z-index:99999;
display:flex;
align-items:center;
justify-content:center;
background:radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
text-align:center;
}

.block-box{
padding:40px;
max-width:500px;
width:90%;
background:rgba(20, 20, 20, 0.95);
border-radius:16px;
border:1px solid rgba(255, 255, 255, 0.1);
box-shadow:0 20px 50px rgba(0,0,0,0.5);
animation: fadeInUp 0.6s ease-out;
}

@keyframes fadeInUp {
from { opacity: 0; transform: translateY(30px); }
to { opacity: 1; transform: translateY(0); }
}

.block-title{
font-size:42px;
font-weight:800;
color:#ffffff;
text-transform:uppercase;
letter-spacing:2px;
margin-bottom:20px;
}

.block-sub{
font-size:14px;
color:rgba(255,255,255,0.6);
line-height:1.6;
}

@media(max-width:700px){
.custom-watermark{font-size:9px;top:60%;left:16%}
.block-title{font-size:28px}
.block-box{padding:25px}
.block-sub{font-size:12px}
}

/* CRICZONE premium UI + Telegram popup */
:root { color-scheme: dark; --cz-accent:#27d7a1; --cz-blue:#50b7ff; }
.shaka-video-container { background: radial-gradient(ellipse at top, #101b30 0%, #02040a 58%, #000 100%); }
.shaka-controls-container .shaka-overflow-menu,
.shaka-controls-container .shaka-settings-menu { border:1px solid rgba(90,190,255,.18); border-radius:14px; backdrop-filter:blur(18px); }
.cz-tg-backdrop {
 position:fixed; inset:0; z-index:1000000; display:flex; align-items:center; justify-content:center;
 padding:20px; background:rgba(2,6,16,.76); backdrop-filter:blur(10px);
 opacity:0; visibility:hidden; transition:opacity .28s ease, visibility .28s ease;
}
.cz-tg-backdrop.cz-show { opacity:1; visibility:visible; }
.cz-tg-card {
 position:relative; width:min(100%,420px); overflow:hidden; padding:34px 28px 28px; text-align:center;
 color:#f6fbff; border:1px solid rgba(133,206,255,.24); border-radius:24px;
 background:linear-gradient(150deg,rgba(17,35,59,.98),rgba(6,12,24,.98));
 box-shadow:0 28px 90px rgba(0,0,0,.65),0 0 48px rgba(39,166,255,.12);
 transform:translateY(18px) scale(.97); transition:transform .3s cubic-bezier(.2,.8,.2,1);
 font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
.cz-tg-backdrop.cz-show .cz-tg-card { transform:translateY(0) scale(1); }
.cz-tg-card:before { content:""; position:absolute; top:0; left:12%; right:12%; height:2px; background:linear-gradient(90deg,transparent,var(--cz-accent),var(--cz-blue),transparent); }
.cz-tg-close { position:absolute; top:12px; right:13px; width:35px; height:35px; border:1px solid rgba(255,255,255,.13); border-radius:50%; color:#dceeff; background:rgba(255,255,255,.06); font-size:24px; cursor:pointer; }
.cz-tg-icon { display:grid; place-items:center; width:68px; height:68px; margin:0 auto 18px; border-radius:21px; color:#fff; font-size:31px; background:linear-gradient(145deg,#36c8ff,#177ce7); box-shadow:0 12px 35px rgba(34,157,255,.3); }
.cz-tg-tag { margin:0 0 10px; color:#76edc6; font-size:11px; font-weight:800; letter-spacing:2.5px; }
.cz-tg-card h2 { margin:0 0 12px; font-size:clamp(23px,6vw,30px); line-height:1.18; letter-spacing:-.7px; }
.cz-tg-card h2 span { color:#55c9ff; }
.cz-tg-copy { margin:0 auto 24px; max-width:310px; color:#aebed1; font-size:14px; line-height:1.7; }
.cz-tg-join { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:52px; border-radius:14px; color:#04111c; background:linear-gradient(100deg,#65edc3,#55caff); font-weight:900; text-decoration:none; box-shadow:0 10px 28px rgba(56,205,217,.2); transition:transform .2s,filter .2s; }
.cz-tg-join:hover { transform:translateY(-2px); filter:brightness(1.06); }
.cz-tg-later { display:inline-block; margin-top:16px; padding:8px 12px; border:0; color:#94a8bd; background:transparent; font:600 13px inherit; cursor:pointer; }
.cz-tg-later:hover { color:#fff; }
@media(max-width:480px) { .cz-tg-card { padding:31px 21px 22px; border-radius:21px; } .cz-tg-copy {font-size:13px;} }
@media(prefers-reduced-motion:reduce) { .cz-tg-backdrop,.cz-tg-card,.cz-tg-join {transition:none;} }

</style>



</head>

<body>

<div class="shaka-video-container shaka-mobile" id="player-container" shaka-controls="true">

  <video id="video" autoplay muted playsinline preload="metadata" class="shaka-video"></video>

  <div class="custom-watermark"></div>

</div>

<script>
  (function(){

  function isSandboxedEnv(){
    try {
      if (window.self === window.top) return false;
      if (window.frameElement && window.frameElement.hasAttribute("sandbox")) return true;

      try {
        document.domain = document.domain;
      } catch (e) {
        return true;
      }
      return false;
    } catch(e) {
      return true;
    }
  }

  function triggerBlockScreen(title, message){
    const container = document.getElementById("player-container");
    const video = document.getElementById("video");

    try {
      video.pause();
      video.removeAttribute('src');
      video.load();
    } catch(e){}

    const overlay = document.createElement("div");
    overlay.className = "block-overlay";
    overlay.innerHTML = `
      <div class="block-box">
        <div class="block-title">${title}</div>
        <div class="block-sub">${message}</div>
      </div>
    `;
    document.body.appendChild(overlay);
    container.style.display = 'none';
  }

  if(isSandboxedEnv()){
    triggerBlockScreen('Disable Sandbox', 'Opening Chrome Browser Only & Disable Ad blocker');
    return;
  }

  const CONFIG={
    streamUrl:"https://jiotvmblive.cdn.jio.com/bpk-tv/Ten_3_MOB/WDVLive/index.mpd",
    keyId:"68318f7c97c55ba6ab8d0398a88fed3e",
    key:"d312fb3325b4eb9462b4a0d2b6794adf",
    cookieUrl:"https://allrounder2-0.pages.dev/api/Sony-3.json"
  };

  document.addEventListener("DOMContentLoaded",async()=>{

    shaka.polyfill.installAll();
    if(!shaka.Player.isBrowserSupported()) return;

    const video=document.getElementById("video");
    const container=document.getElementById("player-container");

    video.muted=true;

    const player=new shaka.Player();
    await player.attach(video);

    const ui=new shaka.ui.Overlay(player,container,video);

    ui.configure({
      addBigPlayButton: true,
      controlPanelElements: [
        "mute",
        "play_pause",
        "time_and_duration",
        "spacer",
        "quality",
        "picture_in_picture",
        "fullscreen"
      ],
      seekBarColors: {
        base: "white",
        buffered: "red", 
        played: "green"
      }
    });

    player.configure({
      drm:{clearKeys:{[CONFIG.keyId]:CONFIG.key}},
      manifest:{defaultPresentationDelay:5},
      streaming:{
        lowLatencyMode:true,
        bufferingGoal:10,
        rebufferingGoal:2,
        safeSeekOffset:5
      }
    });

    let cookieValue="";

    try{
      const response=await fetch(CONFIG.cookieUrl,{cache:"no-store"});
      const data=await response.json();
      cookieValue=data.cookie||"";
    }catch(e){}

    if(cookieValue){
      player.getNetworkingEngine().registerRequestFilter((type,request)=>{
        request.headers["Referer"]="https://www.jiotv.com/";
        request.headers["User-Agent"]="plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
        request.headers["Cookie"]=cookieValue;

        let urlCookie=cookieValue.startsWith("__hdnea__=")?cookieValue.substring(10):cookieValue;

        if((type===shaka.net.NetworkingEngine.RequestType.MANIFEST||
        type===shaka.net.NetworkingEngine.RequestType.SEGMENT)&&
        !request.uris[0].includes("__hdnea__")){
          const sep=request.uris[0].includes("?")?"&":"?";
          request.uris[0]+=sep+"__hdnea__="+urlCookie;
        }
      });
    }

    try{
      await player.load(CONFIG.streamUrl);
      video.play().catch(()=>{});
    }catch(e){}

    video.addEventListener("play",()=>{
      video.muted=false;
    });

  });

})();
</script>


<!-- CRICZONE Telegram community popup -->
<div class="cz-tg-backdrop" id="czTelegramPopup" aria-hidden="true">
  <section class="cz-tg-card" role="dialog" aria-modal="true" aria-labelledby="czTgTitle">
    <button class="cz-tg-close" id="czTgClose" type="button" aria-label="Close popup">×</button>
    <div class="cz-tg-icon" aria-hidden="true">➤</div>
    <p class="cz-tg-tag">CRICZONE COMMUNITY</p>
    <h2 id="czTgTitle">Match updates. <span>One place.</span></h2>
    <p class="cz-tg-copy">Join our Telegram community for match updates and important announcements.</p>
    <a class="cz-tg-join" href="https://t.me/criczonelive" target="_blank" rel="noopener noreferrer">✈ Join Telegram</a>
    <button class="cz-tg-later" id="czTgLater" type="button">Maybe later</button>
  </section>
</div>
<script>
(function(){
 const popup=document.getElementById('czTelegramPopup');
 if(!popup) return;
 const closeBtn=document.getElementById('czTgClose');
 const laterBtn=document.getElementById('czTgLater');
 let showTimer;
 function closePopup(){
   popup.classList.remove('cz-show');
   popup.setAttribute('aria-hidden','true');
   try { sessionStorage.setItem('czTelegramDismissed','1'); } catch(e){}
 }
 function showPopup(){
   try { if(sessionStorage.getItem('czTelegramDismissed')==='1') return; } catch(e){}
   popup.classList.add('cz-show');
   popup.setAttribute('aria-hidden','false');
 }
 closeBtn.addEventListener('click',closePopup);
 laterBtn.addEventListener('click',closePopup);
 popup.addEventListener('click',e=>{if(e.target===popup) closePopup();});
 document.addEventListener('keydown',e=>{if(e.key==='Escape' && popup.classList.contains('cz-show')) closePopup();});
 try { if(sessionStorage.getItem('czTelegramDismissed')!=='1') showTimer=setTimeout(showPopup,60000); }
 catch(e){ showTimer=setTimeout(showPopup,60000); }
})();
</script>
