<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criczone Live - Sports TV</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/criczone6/style.css">
  <link rel="stylesheet" href="../site-polish.css?v=20261019-premium-ui">
</head>

<body>

    <criczone-ui></criczone-ui>

    <script src="/criczone6/script.js"></script>
<script>
// Restrict the embedded player so taps cannot open pop-under tabs or navigate the top page.
customElements.whenDefined('criczone-ui').then(() => {
  const host = document.querySelector('criczone-ui');
  if (!host || !host.shadowRoot) return;
  const applyPlayerSandbox = () => {
    const frame = host.shadowRoot.querySelector('iframe#player');
    if (frame && !frame.hasAttribute('sandbox')) {
      frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation');
    }
  };
  const observer = new MutationObserver(applyPlayerSandbox);
  observer.observe(host.shadowRoot, { childList: true, subtree: true });
  applyPlayerSandbox();
});
</script>



<!-- CRICZONE Telegram community popup -->
<div class="cz-telegram-backdrop" id="czTelegramPopup" aria-hidden="true">
  <section class="cz-telegram-modal" role="dialog" aria-modal="true" aria-labelledby="czTelegramTitle">
    <button class="cz-telegram-close" id="czTelegramClose" type="button" aria-label="Close popup">×</button>
    <div class="cz-telegram-icon" aria-hidden="true">✈</div>
    <p class="cz-telegram-kicker">JOIN THE COMMUNITY</p>
    <h2 id="czTelegramTitle">Stay Connected with <span>CRICZONE</span></h2>
    <p class="cz-telegram-copy">Get match updates, important announcements and community news on our Telegram channel.</p>
    <a class="cz-telegram-join" href="https://t.me/+5hrS9VoLS8tjOTM1" target="_blank" rel="noopener noreferrer">Join Telegram <span>↗</span></a>
    <button class="cz-telegram-later" id="czTelegramLater" type="button">Maybe later</button>
  </section>
</div>
<script>
(() => {
  const popup = document.getElementById('czTelegramPopup');
  const close = document.getElementById('czTelegramClose');
  const later = document.getElementById('czTelegramLater');
  if (!popup) return;
  const hide = () => {
    popup.classList.remove('is-visible');
    popup.setAttribute('aria-hidden', 'true');
    try { sessionStorage.setItem('czTelegramDismissed', '1'); } catch (_) {}
  };
  const show = () => {
    try { if (sessionStorage.getItem('czTelegramDismissed') === '1') return; } catch (_) {}
    popup.classList.add('is-visible');
    popup.setAttribute('aria-hidden', 'false');
  };
  close?.addEventListener('click', hide);
  later?.addEventListener('click', hide);
  popup.addEventListener('click', event => { if (event.target === popup) hide(); });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') hide(); });
  window.setTimeout(show, 60000);
})();
</script>

</body>
</html>
