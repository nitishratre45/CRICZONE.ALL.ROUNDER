<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071522">
  <meta name="robots" content="noindex,nofollow">
  <title>CRICZONE • Join Telegram</title>
  <style>
    *{box-sizing:border-box}
    :root{color-scheme:dark}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#123b58 0%,#0a2031 38%,#050d16 78%);color:#f4f9ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    body:before,body:after{content:"";position:fixed;width:280px;height:280px;border-radius:50%;filter:blur(90px);opacity:.2;pointer-events:none}
    body:before{background:#159bd7;top:-130px;left:-100px}
    body:after{background:#19d3b0;right:-140px;bottom:-150px}
    .card{position:relative;width:min(100%,410px);padding:34px 28px 27px;text-align:center;border:1px solid rgba(133,198,226,.2);border-radius:28px;background:linear-gradient(155deg,rgba(17,43,60,.94),rgba(5,17,28,.97));box-shadow:0 24px 80px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:26px;color:#b7cbd8;font-size:11px;font-weight:850;letter-spacing:2.3px}
    .brand-mark{width:27px;height:27px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(135deg,#c4ff27,#73d94a);color:#10220a;font-size:14px;letter-spacing:0}
    .telegram{width:82px;height:82px;margin:0 auto 22px;display:grid;place-items:center;border-radius:26px;background:linear-gradient(145deg,#35b9f4,#1688c7);box-shadow:0 12px 30px rgba(24,157,218,.3),inset 0 1px 0 rgba(255,255,255,.35)}
    .telegram svg{width:42px;height:42px;fill:white}
    .eyebrow{margin:0 0 9px;color:#9edfff;font-size:10px;font-weight:850;letter-spacing:2px;text-transform:uppercase}
    h1{margin:0;font-size:27px;line-height:1.15;letter-spacing:-.8px}
    .desc{max-width:290px;margin:12px auto 24px;color:#a9bdca;font-size:14px;line-height:1.65}
    .join{width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:15px;background:linear-gradient(100deg,#c4ff27,#a9f51b);color:#101b08;text-decoration:none;font-size:13px;font-weight:950;letter-spacing:.45px;box-shadow:0 8px 24px rgba(173,245,27,.17);transition:transform .18s,filter .18s}
    .join:hover{transform:translateY(-2px);filter:brightness(1.05)}
    .join:active{transform:scale(.985)}
    .note{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:19px;color:#8199a8;font-size:11px}
    .dot{width:7px;height:7px;border-radius:50%;background:#35dfaa;box-shadow:0 0 10px #35dfaa}
    .loader{width:13px;height:13px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:380px){.card{padding:29px 21px 23px;border-radius:24px}h1{font-size:24px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="brand-mark">C</span> CRICZONE COMMUNITY</div>
    <div class="telegram" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M21.8 4.2 18.6 19c-.24 1.05-.86 1.3-1.75.81l-4.84-3.57-2.34 2.25c-.26.26-.48.48-.98.48l.35-4.93 8.97-8.1c.39-.35-.09-.55-.61-.2L6.31 12.9l-4.75-1.49c-1.03-.32-1.05-1.03.22-1.53L20.35 2.7c.86-.31 1.61.21 1.45 1.5Z"/></svg>
    </div>
    <p class="eyebrow">You're invited</p>
    <h1>Join the CRICZONE<br>Telegram Community</h1>
    <p class="desc">Get match updates, cricket news and community announcements in one place.</p>
    <a class="join" href="https://t.me/+MueCDjlpoS8yNmJl">JOIN TELEGRAM <span aria-hidden="true">↗</span></a>
    <div class="note"><span class="loader" aria-hidden="true"></span> Opening Telegram…</div>
  </main>
  <script>
    // Give the branded landing screen a brief moment, then redirect automatically.
    window.setTimeout(function(){ window.location.replace("https://t.me/+MueCDjlpoS8yNmJl"); }, 1100);
  </script>
</body>
</html>
