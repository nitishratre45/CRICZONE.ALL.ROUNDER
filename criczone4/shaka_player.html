    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player-container,
        #player-container:fullscreen,
        #player-container:-webkit-full-screen {
            position: fixed;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000 !important;
        }
        video,
        :fullscreen video,
        :-webkit-full-screen video,
        :-moz-full-screen video,
        :-ms-fullscreen video,
        .shaka-video-container video {
            width: 100% !important;
            height: 100% !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            object-fit: contain !important;
            background: #000000 !important;
        }
        /* Hide Shaka's built-in spinner */
        .shaka-spinner-container, .shaka-spinner, .shaka-spinner-svg { display: none !important; }
        
        /* Cool Minimalist Loader Overlay */
        #loading {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: #0c0e12;
            z-index: 100; opacity: 1; visibility: visible;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s ease;
            pointer-events: none;
        }
        #loading.hidden { opacity: 0; visibility: hidden; }

        .cool-loader {
            position: relative;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cool-loader-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.07);
            border-top-color: #3b82f6;
            border-right-color: rgba(59, 130, 246, 0.45);
            animation: loader-spin 0.8s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.4));
        }
        .cool-loader-core {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3b82f6;
            box-shadow: 0 0 12px #3b82f6;
            animation: loader-pulse 1.2s ease-in-out infinite;
        }
        @keyframes loader-spin {
            to { transform: rotate(360deg); }
        }
        @keyframes loader-pulse {
            0%, 100% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.25); opacity: 1; }
        }

        /* Professional Status Toast Banner */
        #status-toast {
            position: fixed; top: 18px; left: 50%; transform: translateX(-50%) translateY(-25px);
            opacity: 0; pointer-events: none;
            padding: 8px 18px; border-radius: 30px; font-size: 12.5px; font-weight: 500;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; align-items: center; gap: 8px; z-index: 200;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            letter-spacing: 0.2px;
        }
        #status-toast.show {
            opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto;
        }
        #status-toast.success {
            background: rgba(6, 78, 59, 0.85); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.3);
        }
        #status-toast.error {
            background: rgba(127, 29, 29, 0.85); color: #fca5a5; border: 1px solid rgba(248, 113, 113, 0.3);
        }
        #status-toast.warning {
            background: rgba(120, 53, 15, 0.9); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.4);
        }
        #geo-banner {
            position: fixed; top: 60px; left: 50%; transform: translateX(-50%);

            text-align: center; max-width: 90%;
        }
        #geo-banner.show { display: flex; }

                            var m3uKey = '';
                            if (/ten3|892|sten3/i.test(targetKey)) m3uKey = 'ten3-hd';
                            else if (/ten4|3514|stent|tamil/i.test(targetKey)) m3uKey = 'ten4-hd';
                            else if (/1773|telugu|stentu/i.test(targetKey)) m3uKey = 'ten4';
                            else if (/ten1|162|sten1/i.test(targetKey)) m3uKey = 'ten1-hd';
                            else if (/ten2|891|sten2/i.test(targetKey)) m3uKey = 'ten2-hd';
                            else if (/ten5|155|sten5/i.test(targetKey)) m3uKey = 'ten5-hd';

                            if (m3uKey) {
                                var fbUrl = await getFreshSonyM3uUrl(m3uKey);
                                if (fbUrl) {
                                    player.configure({ drm: { clearKeys: {} } });
                                    showToast('● Connecting backup stream...', 'warning');
                                    await player.load(fbUrl);
                                    return;
                                }
                            }
                        } catch(fbErr) {
                            console.warn('M3U8 fallback error:', fbErr);
                        }
                    }

                    var isGeo = isGeoBlocked(activeMpd);
                    showError(isGeo ? 'US VPN REQUIRED TO PLAY' : 'Playback error – reconnecting...', isGeo);
                    if (CH_ID || activeKid) {
                        try {
                            var targetId = CH_ID || activeKid;
                            var freshCookie = await fetchFreshCookie(targetId);
                            var refreshed = await fetchChannelData(targetId);
                            if (refreshed) {
                                activeMpd = refreshed.stream_url;
                                activeKid = refreshed.key_id;
                                activeKey = refreshed.key;
                                activeCookie = freshCookie || refreshed.cookie || '';
                                activeRawCookie = rawCookie(activeCookie);
                                if (refreshed.clearKeys && Object.keys(refreshed.clearKeys).length > 0) {
                                    activeClearKeys = refreshed.clearKeys;
                                } else if (activeKid && activeKey) {
                                    activeClearKeys = {};
                                    activeClearKeys[activeKid.toLowerCase()] = activeKey.toLowerCase();
                                }
                                if (Object.keys(activeClearKeys).length > 0) {
                                    player.configure({ drm: { clearKeys: activeClearKeys } });
                                }
                            } else if (freshCookie) {
                                activeCookie = freshCookie;
                                activeRawCookie = rawCookie(activeCookie);
                            }
                        } catch(e) {}
                    }
                    if (!isGeo) {
                        setTimeout(function() { player.load(activeMpd).catch(function(){}); }, 3000);
                    }
                });
            } catch(e) {
                console.error('Init error:', e);
                var isGeo = isGeoBlocked(activeMpd);
                showError(isGeo ? 'US VPN REQUIRED TO PLAY' : 'Stream load failed – retrying...', isGeo);
                if (!isGeo) {
                    setTimeout(function() { location.reload(); }, 4000);
                }
            }
        }

        initPlayer();

        // Unmute and trigger direct link ad (strictly once per session)
        var shakaAdFiredCount = 0;
        var maxShakaAds = 1;

        function triggerShakaAd() {
            try {
                if (sessionStorage.getItem('shaka_ad_shown') === 'true') return;
            } catch(e) {}
            if (shakaAdFiredCount >= maxShakaAds) return;
            shakaAdFiredCount++;
            try {
                sessionStorage.setItem('shaka_ad_shown', 'true');
                window.open('https://budgetezy.org/4/6da983d7e115700ad4dc612c0e107ec8', '_blank');
            } catch (err) {}
        }

        function unmuteAndAd() {
            $video.muted = false;
            triggerShakaAd();
        }
        document.addEventListener('click', unmuteAndAd, { once: true });

        // ── Mobile Screen Auto-Rotate & Fullscreen Fit ───────────────────
        function lockLandscape() {
            try {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(function() {});
                } else if (screen.lockOrientation) {
                    screen.lockOrientation('landscape');
                } else if (screen.mozLockOrientation) {
                    screen.mozLockOrientation('landscape');
                } else if (screen.msLockOrientation) {
                    screen.msLockOrientation('landscape');
                }
            } catch (e) {}
        }

        function unlockOrientation() {
            try {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                } else if (screen.unlockOrientation) {
                    screen.unlockOrientation();
                } else if (screen.mozUnlockOrientation) {
                    screen.mozUnlockOrientation();
                } else if (screen.msUnlockOrientation) {
                    screen.msUnlockOrientation();
                }
            } catch (e) {}
        }

        function handleFullscreenChange() {
            var isFs = !!(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement
            );
            if (isFs) {
                lockLandscape();
            } else {
                unlockOrientation();
            }
        }
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('mozfullscreenchange', handleFullscreenChange);
        document.addEventListener('MSFullscreenChange', handleFullscreenChange);

        if (window.matchMedia) {
            try {
                var landscapeMql = window.matchMedia('(orientation: landscape)');
                function onOrientationMqlChange(e) {
                    var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth <= 900 && 'ontouchstart' in window);
                    if (!isMobile) return;
                    var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
                    if (e.matches && !isFs) {
                        if ($video && !$video.paused) {
                            var container = document.getElementById('player-container') || $video;
                            if (container.requestFullscreen) {
                                container.requestFullscreen().catch(function() {});
                            } else if ($video.webkitEnterFullscreen) {
                                $video.webkitEnterFullscreen();
                            }
                        }
                    } else if (!e.matches && isFs) {
                        if (document.exitFullscreen) {
                            document.exitFullscreen().catch(function() {});
                        }
                    }
                }
                if (landscapeMql.addEventListener) {
                    landscapeMql.addEventListener('change', onOrientationMqlChange);
                } else if (landscapeMql.addListener) {
                    landscapeMql.addListener(onOrientationMqlChange);
                }
            } catch (e) {}
        }
    })();
    </script>
