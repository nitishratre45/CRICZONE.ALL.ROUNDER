<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Plyr + HLS.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js" crossorigin="anonymous"></script>

    <style>
        /* Reset & Fullscreen */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            background: #000;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .player-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .plyr {
            width: 100%;
            height: 100%;
        }

        .plyr__video-wrapper {
            height: 100%;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Custom watermark */
        .custom-watermark {
            position: absolute;
            z-index: 40;
            pointer-events: none;
            bottom: 80px;
            right: 20px;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.10);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Loading overlay */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: #000;
            color: #fff;
            z-index: 2000;
            font-size: 18px;
            pointer-events: none;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, .15);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Plyr overrides for dark theme */
        .plyr--video {
            background: #000;
        }
        .plyr__controls {
            background: rgba(0, 0, 0, 0.75) !important;
            backdrop-filter: blur(8px);
        }
        .plyr__control--overlaid {
            background: rgba(255, 59, 48, 0.9) !important;
        }
        .plyr__control--overlaid svg {
            fill: #fff !important;
        }
        .plyr__progress__buffer {
            background: rgba(255, 255, 255, 0.2) !important;
        }
        .plyr__progress__played {
            background: #ff3b30 !important;
        }
        .plyr__menu__container {
            background: rgba(20, 20, 20, 0.95) !important;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
        }
        .plyr__menu__container .plyr__control--back {
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .plyr__volume input[type="range"] {
            background: rgba(255,255,255,0.2) !important;
        }
        .plyr__volume input[type="range"]::-webkit-slider-thumb {
            background: #ff3b30 !important;
        }
        .plyr__volume input[type="range"]::-moz-range-thumb {
            background: #ff3b30 !important;
        }



        /* Mobile rotate / fullscreen button */
        .mobile-rotate-btn {
            display: none;
            position: absolute;
            z-index: 70;
            right: 14px;
            bottom: 130px;
            width: 42px;
            height: 42px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 50%;
            background: rgba(0,0,0,.68);
            color: #fff;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
        }

        .mobile-rotate-btn:active {
            transform: scale(.94);
        }

        @media (max-width: 700px) {
            .mobile-rotate-btn {
                display: flex;
            }

            .custom-watermark {
                font-size: 9px;
                bottom: 70px;
                right: 14px;
            }
        }
    </style>
</head>
<body>

<div class="player-container" id="playerContainer">
    <video id="video" autoplay muted playsinline preload="metadata"></video>
    <div class="custom-watermark">CRICZONE · LIVE</div>
    <button id="rotateBtn" class="mobile-rotate-btn" type="button" aria-label="Rotate and fullscreen">
        ⟳
    </button>

    <!-- Loading overlay -->
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        Loading stream...
    </div>
</div>

<script>
    (function() {
        'use strict';

        /* ========== CONFIG ========== */
        const STREAM_URL =
            "https://sunny-relay-friend.lovable.app/api/public/px/sony?url=https%3A%2F%2Fin-mc-flive.fancode.com%2Fmumbai%2F4249233_hindi_hls_2e75e343d930961_1ta-di_h264%2F1080p.m3u8%3Fhdntl%3DExpires%3D1791471355~_GO%3DGenerated~acl%3D%2Fmumbai%2F4249233_hindi_hls_2e75e343d930961_1ta-di_h264%2F*~SessionID%3D68af7a8f728b9df6_fc-app_sportsguruand_e1dc9dbb-8389-41~Signature%3DAXZsC1BXvTvxcbuv1aEHNED23L9-UZr7M6YYj62eZ1mJDf7prVBbX5M0pFXi6YkV2kjNd7bcc4XTAWPHZtM7GmolTlkF";

        const DOM = {
            video: document.getElementById('video'),
            container: document.getElementById('playerContainer'),
            loading: document.getElementById('loading'),
        };

        let hlsInstance = null;
        let plyrInstance = null;
        let userPaused = false;
        let isInitialized = false;

        /* ========== HELPERS ========== */
        function hideLoading() {
            if (DOM.loading) DOM.loading.style.display = 'none';
        }

        function showLoading() {
            if (DOM.loading) DOM.loading.style.display = 'flex';
        }

        function destroyPlayer() {
            if (hlsInstance) {
                try { hlsInstance.destroy(); } catch (_) {}
                hlsInstance = null;
            }
            if (plyrInstance) {
                try { plyrInstance.destroy(); } catch (_) {}
                plyrInstance = null;
            }
        }

        /* ========== PAUSE/RESUME LOGIC (from original) ========== */
        function setupPauseResumeLogic(video) {
            // Reset userPaused flag on play
            video.addEventListener('play', function() {
                userPaused = false;
            });

            // Detect user-initiated pause via click on play/pause button
            document.addEventListener('click', function(e) {
                const pauseBtn = e.target.closest('.plyr__control--pressed') || 
                                e.target.closest('.plyr__control[data-plyr="play"]');
                if (pauseBtn) {
                    if (!video.paused) {
                        userPaused = true;
                    } else {
                        userPaused = false;
                    }
                }
            });

            // Handle automatic pauses (buffering, etc.)
            video.addEventListener('pause', function() {
                if (!video.ended && !userPaused && isInitialized) {
                    // Auto-resume after a short delay
                    setTimeout(() => {
                        if (video.paused && !video.ended && !userPaused) {
                            video.play().catch(() => {});
                        }
                    }, 500);
                }
                // Reset flag after pause event
                setTimeout(() => {
                    userPaused = false;
                }, 100);
            });

            // Periodic check: if video is stuck paused, resume
            setInterval(() => {
                if (video.paused && !video.ended && !userPaused && isInitialized) {
                    video.play().catch(() => {});
                }
            }, 3000);
        }

        /* ========== INIT PLAYER ========== */
        async function initPlayer() {
            const video = DOM.video;
            const container = DOM.container;

            showLoading();
            destroyPlayer();

            try {
                // --- Try HLS.js first ---
                if (Hls.isSupported()) {
                    const hls = new Hls({
                        maxMaxBufferLength: 100,
                        liveSyncDurationCount: 3,
                        liveMaxLatencyDurationCount: 6,
                        enableWorker: true,
                        xhrSetup: (xhr) => { xhr.withCredentials = false; }
                    });

                    hlsInstance = hls;
                    hls.loadSource(STREAM_URL);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        // Get quality levels
                        const levels = hls.levels
                            .map(l => l.height)
                            .filter(Boolean)
                            .sort((a, b) => a - b);

                        // Init Plyr
                        plyrInstance = new Plyr(video, {
                            controls: [
                                'play-large', 'play', 'progress', 'current-time',
                                'mute', 'volume', 'settings', 'fullscreen'
                            ],
                            settings: ['quality'],
                            quality: {
                                default: levels[levels.length - 1] || 720,
                                options: levels.length ? levels : [360, 480, 720, 1080],
                                forced: true,
                                onChange: (newQuality) => {
                                    hls.levels.forEach((level, index) => {
                                        if (level.height === newQuality) hls.currentLevel = index;
                                    });
                                }
                            }
                        });

                        // ========== KEY CHANGE: Start with pause but unmuted ==========
                        // First ensure video is unmuted
                        video.muted = false;

                        // Load the stream but don't autoplay - keep it paused
                        // The video will be paused initially with the big play button visible
                        // We need to make sure it stays paused after loading
                        video.pause();

                        // Mark as initialized so the auto-resume logic doesn't kick in
                        isInitialized = true;

                        // Hide loading once stream is ready
                        video.addEventListener('loadeddata', hideLoading);
                        setTimeout(hideLoading, 3000);

                        // Setup pause/resume logic
                        setupPauseResumeLogic(video);

                        // Also handle quality changes via Plyr settings
                        plyrInstance.on('qualitychange', (quality) => {
                            // quality is already handled by the onChange above
                        });
                    });

                    hls.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                                hls.startLoad();
                            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                                hls.recoverMediaError();
                            } else {
                                console.warn('Fatal HLS error:', data);
                                // Try fallback
                                fallbackToNative(video);
                            }
                        }
                    });

                } else {
                    // --- Fallback to native HLS (Safari) ---
                    fallbackToNative(video);
                }

            } catch (err) {
                console.error('Init error:', err);
                fallbackToNative(video);
            }
        }

        /* ========== FALLBACK: Native HLS ========== */
        function fallbackToNative(video) {
            console.log('Using native HLS fallback');
            destroyPlayer();

            video.src = STREAM_URL;

            // ========== KEY CHANGE: Start with pause but unmuted ==========
            video.muted = false;

            // Init Plyr without quality settings
            plyrInstance = new Plyr(video, {
                controls: [
                    'play-large', 'play', 'progress', 'current-time',
                    'mute', 'volume', 'settings', 'fullscreen'
                ]
            });

            // Keep it paused initially
            video.pause();

            // Mark as initialized
            isInitialized = true;

            video.addEventListener('loadeddata', hideLoading);
            setTimeout(hideLoading, 3000);

            setupPauseResumeLogic(video);
        }

        /* ========== START ========== */
        document.addEventListener('DOMContentLoaded', () => {
            initPlayer();
        });



        /* ========== MOBILE ROTATE + FULLSCREEN ========== */
        async function enterMobileFullscreenLandscape() {
            const container = DOM.container;

            try {
                if (!document.fullscreenElement) {
                    if (container.requestFullscreen) {
                        await container.requestFullscreen();
                    } else if (DOM.video.webkitEnterFullscreen) {
                        DOM.video.webkitEnterFullscreen();
                    }
                }

                if (
                    screen.orientation &&
                    screen.orientation.lock
                ) {
                    try {
                        await screen.orientation.lock('landscape');
                    } catch (_) {}
                }
            } catch (err) {
                console.warn('Fullscreen/orientation request failed:', err);
            }
        }

        async function exitMobileFullscreenLandscape() {
            try {
                if (document.fullscreenElement && document.exitFullscreen) {
                    await document.exitFullscreen();
                }
            } catch (_) {}
        }

        const rotateButton = document.getElementById('rotateBtn');

        if (rotateButton) {
            rotateButton.addEventListener('click', async () => {
                if (document.fullscreenElement) {
                    await exitMobileFullscreenLandscape();
                } else {
                    await enterMobileFullscreenLandscape();
                }
            });
        }

        document.addEventListener('fullscreenchange', async () => {
            if (document.fullscreenElement) {
                if (screen.orientation && screen.orientation.lock) {
                    try {
                        await screen.orientation.lock('landscape');
                    } catch (_) {}
                }
            } else if (
                screen.orientation &&
                screen.orientation.unlock
            ) {
                try {
                    screen.orientation.unlock();
                } catch (_) {}
            }
        });

        // Handle visibility change to resume if needed
        document.addEventListener('visibilitychange', () => {
            const video = DOM.video;
            if (!document.hidden && video && video.paused && !video.ended && isInitialized) {
                video.play().catch(() => {});
            }
        });

    })();
</script>
