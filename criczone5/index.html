<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18"><meta name="referrer" content="strict-origin-when-cross-origin">
<title>CRICZONE5 — Live Channels</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#111d30;--line:#263b58;--muted:#9aabc2;--text:#f5f8ff;--blue:#2588ff;--gold:#ffc857}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#1b3a65 0,transparent 45%),var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#080d18ed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.head{max-width:1400px;margin:auto;padding:15px 22px;display:flex;align-items:center;gap:18px}.brand{font-size:22px;font-weight:900;letter-spacing:1px}.brand span{color:var(--gold)}.live{margin-left:auto;color:#ff6878;font-size:11px;font-weight:900;letter-spacing:1px}.live:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff425d;margin-right:7px}
main{max-width:1400px;margin:auto;padding:26px 22px 60px}.hero{padding:25px 28px;border:1px solid #29486d;border-radius:20px;background:linear-gradient(110deg,#15345a,#101c30);margin-bottom:25px}.hero h1{font-size:clamp(25px,4vw,40px);margin:0 0 8px}.hero h1 span{color:var(--gold)}.hero p{margin:0;color:#b5c6dc;font-size:13px}
.toolbar{display:flex;gap:12px;align-items:center;margin:20px 0 13px;flex-wrap:wrap}.toolbar h2{font-size:18px;margin:0}.count{color:var(--muted);font-size:12px;margin-left:auto}input{min-width:210px;flex:1;max-width:440px;background:#101b2d;color:white;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;outline:none}input:focus{border-color:var(--blue)}
.filters{display:flex;gap:8px;overflow:auto;padding:5px 0 16px}.filter{border:1px solid var(--line);background:#111d30;color:#bdcbe0;border-radius:24px;padding:9px 14px;white-space:nowrap;cursor:pointer}.filter.active{background:#176bd0;border-color:#398fff;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:14px}.channel{border:1px solid var(--line);background:linear-gradient(145deg,#15243b,#0e1727);border-radius:16px;padding:15px;cursor:pointer;min-width:0;transition:.18s}.channel:hover{border-color:#398fff;transform:translateY(-3px)}.logo{height:82px;display:grid;place-items:center;background:#0b1423;border-radius:11px;margin-bottom:12px;padding:10px}.logo img{max-width:95%;max-height:65px;object-fit:contain}.fallback{font-size:26px;font-weight:900;color:#7fa9dc}.name{font-size:13px;font-weight:800;line-height:1.4;min-height:36px}.meta{font-size:10px;color:var(--muted);margin-top:5px}.watch{display:block;width:100%;margin-top:12px;border:0;border-radius:9px;padding:10px;background:#176bd0;color:white;font-weight:800;cursor:pointer}
.empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.loading{text-align:center;padding:40px;color:var(--muted)}
.player{display:none;position:fixed;inset:0;z-index:20;background:#030711f5;align-items:center;justify-content:center;padding:14px}.player.open{display:flex}.playerbox{width:min(1100px,100%);background:#0d1727;border:1px solid #345071;border-radius:16px;overflow:hidden}.playerhead{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line)}.playerhead strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.close{margin-left:auto;border:1px solid #526985;background:#1b304a;color:white;border-radius:10px;padding:10px 14px;font-size:18px;cursor:pointer}.screen{position:relative;background:#000;aspect-ratio:16/9;max-height:72vh}.screen video{width:100%;height:100%;object-fit:contain}.screen video.mode-fill{object-fit:fill}.screen video.mode-cover{object-fit:cover}.fit-pill{font-size:10px;font-weight:800;letter-spacing:.3px;padding:3px 7px;border:1px solid #71829a;border-radius:5px;color:#e8f1ff;white-space:nowrap}.sp-fit-btn{height:34px;padding:0 7px;background:transparent;color:#fff;border:0;cursor:pointer;display:flex;align-items:center}.sp-fit-btn.mode-fill .fit-pill{border-color:#38bdf8;color:#38bdf8}.sp-fit-btn.mode-cover .fit-pill{border-color:#a78bfa;color:#a78bfa}.status{padding:10px 14px;color:var(--muted);font-size:12px}.fitbutton{height:34px;padding:0 8px;background:transparent;color:white;border:1px solid #667;border-radius:5px;cursor:pointer}
@media(max-width:600px){.head,main{padding-left:13px;padding-right:13px}.hero{padding:21px 18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.channel{padding:10px}.logo{height:72px}.player{padding:6px}.playerbox{border-radius:10px}.screen{max-height:65vh}}
</style></head>
<body>
<header><div class="head"><div class="brand">CRIC<span>ZONE</span>5</div><div class="live">LIVE CHANNELS</div></div></header>
<main>
<section class="hero"><h1>Choose your <span>channel.</span></h1><p>Browse the channel list first. Playback starts only after you select a channel.</p></section>
<div class="toolbar"><h2>All Channels</h2><span class="count" id="count">Loading…</span><input id="search" type="search" placeholder="Search channels…" aria-label="Search channels"></div>
<nav class="filters" id="filters"></nav><section class="grid" id="grid"><div class="loading">Loading channel list…</div></section>
</main>
<div class="player" id="player" role="dialog" aria-modal="true" aria-label="Channel player"><div class="playerbox"><div class="playerhead"><strong id="playingTitle">Now Playing</strong><button class="close" id="close" aria-label="Close player">✕</button></div><div class="screen" id="videoContainer" data-shaka-player-container><video id="video" data-shaka-player playsinline controls></video></div><div class="status" id="status" role="status">Select a channel to start playback.</div></div></div>
<script>
(()=>{"use strict";
const M3U_URL="https://raw.githubusercontent.com/sportlive18/Sonyliv-Playlist-Autoupdate/main/sony.m3u";
const $=id=>document.getElementById(id);let channels=[],genre="All",player=null,ui=null,activeUrl="";
function parseM3U(text){const lines=text.split(/\r?\n/);const out=[];let item=null;for(const raw of lines){const line=raw.trim();if(!line)continue;if(line.startsWith("#EXTINF:")){item={title:"Live Channel",genre:"Other",logo:"",streamUrl:""};const g=line.match(/group-title="([^"]+)"/i),l=line.match(/tvg-logo="([^"]+)"/i),n=line.match(/tvg-name="([^"]+)"/i),comma=line.lastIndexOf(",");if(g)item.genre=g[1];if(l)item.logo=l[1];if(comma>=0&&line.slice(comma+1).trim())item.title=line.slice(comma+1).trim();else if(n)item.title=n[1];}else if(!line.startsWith("#")&&item){item.streamUrl=line;out.push(item);item=null;}}return out;}
function renderFilters(){const groups=["All",...new Set(channels.map(c=>c.genre||"Other"))];$("filters").innerHTML=groups.map(g=>'<button class="filter '+(genre===g?'active':'')+'" data-genre="'+esc(g)+'">'+esc(g)+'</button>').join("");$("filters").querySelectorAll("button").forEach(b=>b.onclick=()=>{genre=b.dataset.genre;renderFilters();render();});}
function esc(s){return String(s||"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));}
function render(){const q=$("search").value.trim().toLowerCase();const list=channels.filter(c=>(genre==="All"||c.genre===genre)&&(!q||(c.title+" "+c.genre).toLowerCase().includes(q)));$("count").textContent=list.length+" channels";$("grid").innerHTML=list.length?list.map((c,i)=>'<article class="channel" data-index="'+channels.indexOf(c)+'"><div class="logo">'+(c.logo?'<img loading="lazy" src="'+esc(c.logo)+'" alt="" onerror="this.remove()">':'<span class="fallback">TV</span>')+'</div><div class="name">'+esc(c.title)+'</div><div class="meta">'+esc(c.genre||"Live TV")+'</div><button class="watch" type="button">▶ Watch Live</button></article>').join(""):'<div class="empty">No matching channels found.</div>';$("grid").querySelectorAll(".channel").forEach(card=>card.onclick=()=>openChannel(channels[Number(card.dataset.index)]));}
function injectFitButton(){const panel=$("videoContainer").querySelector(".shaka-controls-button-panel");if(!panel||panel.querySelector(".sp-fit-btn"))return;const btn=document.createElement("button");btn.type="button";btn.className="sp-fit-btn";btn.title="Video fit: Fit";btn.setAttribute("aria-label","Cycle video fit mode");btn.innerHTML='<span class="fit-pill">Fit</span>';const anchor=panel.querySelector(".shaka-fullscreen-button");if(anchor)panel.insertBefore(btn,anchor);else panel.appendChild(btn);const modes=["contain","fill","cover"],labels=["Fit","Fill","Zoom"];let index=0;btn.addEventListener("click",e=>{e.stopPropagation();index=(index+1)%modes.length;$("video").classList.remove("mode-fill","mode-cover");if(modes[index]!=="contain")$("video").classList.add("mode-"+modes[index]);btn.querySelector(".fit-pill").textContent=labels[index];btn.title="Video fit: "+labels[index];});document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement){index=0;$("video").classList.remove("mode-fill","mode-cover");btn.querySelector(".fit-pill").textContent="Fit";}});}
async function openChannel(c){if(!c||!c.streamUrl)return;$("player").classList.add("open");$("playingTitle").textContent=c.title;$("status").textContent="Loading selected channel…";activeUrl=c.streamUrl;try{if(!window.shaka||!shaka.Player.isBrowserSupported())throw Error("Shaka Player is not supported in this browser.");if(!player){shaka.polyfill.installAll();player=new shaka.Player();await player.attach($("video"));const net=player.getNetworkingEngine();if(net){net.registerRequestFilter((type,request)=>{request.allowCrossSiteCredentials=false;});}player.configure({streaming:{retryParameters:{maxAttempts:3,baseDelay:500,backoffFactor:2,timeout:30000},bufferingGoal:20,rebufferingGoal:2},manifest:{retryParameters:{maxAttempts:2,baseDelay:500,backoffFactor:2,timeout:20000}}});player.addEventListener("error",event=>{const d=event.detail||{};const code=d.code?("Shaka error "+d.code):"Playback error";$("status").textContent=code+": "+(d.message||"The stream request was rejected by the source server.");});ui=new shaka.ui.Overlay(player,$("videoContainer"),$("video"));ui.configure({addBigPlayButton:true,controlPanelElements:["play_pause","mute","time_and_duration","spacer","quality","picture_in_picture","fullscreen"]});let fitAttempts=0;const fitTimer=setInterval(()=>{injectFitButton();fitAttempts++;if($("videoContainer").querySelector(".sp-fit-btn")||fitAttempts>=12)clearInterval(fitTimer);},150);}else await player.unload();await player.load(c.streamUrl);$("status").textContent="Stream loaded. Press play if playback does not start automatically.";const p=$("video").play();if(p&&p.catch)p.catch(()=>{});}catch(e){$("status").textContent="Playback unavailable: "+(e.message||"This stream may require provider-authorized access or DRM configuration.");}}
async function closePlayer(){if(player){try{await player.unload();}catch(e){}}$("video").pause();$("player").classList.remove("open");$("status").textContent="Select a channel to start playback.";activeUrl="";}
$("close").onclick=closePlayer;$("player").addEventListener("click",e=>{if(e.target===$("player"))closePlayer();});document.addEventListener("keydown",e=>{if(e.key==="Escape")closePlayer();});$("search").addEventListener("input",render);
async function init(){try{const r=await fetch(M3U_URL,{cache:"no-store"});if(!r.ok)throw Error("Channel source returned HTTP "+r.status);channels=parseM3U(await r.text());if(!channels.length)throw Error("No channels found in the playlist.");renderFilters();render();}catch(e){$("count").textContent="Unavailable";$("grid").innerHTML='<div class="empty">Channel list load nahi hui: '+esc(e.message)+'<br>Refresh karke dobara try karein.</div>';}}
init();
})();
</script>

<script src="/assets/js/cz-global-community.js" defer></script>
</body></html>
