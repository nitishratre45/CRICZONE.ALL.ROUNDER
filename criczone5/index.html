    <meta charset="UTF-8">

    <meta name="referrer" content="no-referrer">

        document.head.appendChild(css);

<body>
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <header>
        <div class="header-inner">
            <a href="#" class="brand">
                <div class="brand-icon"><i class="fas fa-play"></i></div>
                <span class="brand-name">Cric Hype</span>
            </a>
            <div class="live-pill">
                <div class="live-dot"></div>
                Live Stream
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="player-card">
            <div id="playerContainer" data-shaka-player-container class="hidden" style="width:100%; height:100%;">
    <video data-shaka-player id="video" poster="https://liv18.pages.dev/P.jpg" autoplay playsinline style="width:100%; height:100%;"></video>
</div>

            <iframe id="iframePlayer" class="hidden" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
            
            <div class="error-overlay" id="errorOverlay">
                <p id="errorMsg">Stream is currently offline</p>
                <button class="retry-btn" onclick="location.reload()">Try Again</button>
            </div>
        </div>

        <div class="glass-card">
            <div class="card-title"><i class="fas fa-bullhorn"></i> Join Community</div>
            <p style="font-size: 0.9rem; color: var(--text-secondary);">Join our official channels for backup links and schedules.</p>
            <div class="promo-buttons">
                <a href="https://telegram.me/CricHype" target="_blank" class="btn-social btn-tg"><i class="fab fa-telegram-plane"></i> Telegram</a>
                <a href="https://instagram.com/realCricHype" target="_blank" class="btn-social btn-ig"><i class="fab fa-instagram"></i> Instagram</a>
            </div>
        </div>

        <div class="glass-card">
            <div class="card-title"><i class="fas fa-info-circle"></i> Support Us</div>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 15px;">
                For best experience, use <b>Google Chrome</b>. If stream lags, try refreshing the page.
            </p>
            <button class="btn-social btn-share" onclick="shareLink()"><i class="fas fa-share-alt"></i> Share Link with Friends</button>
        </div>
    </main>

    <div id="toast" class="toast"></div>
