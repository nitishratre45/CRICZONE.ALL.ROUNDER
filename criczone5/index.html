<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="CRICZONE live sports channels.">
  <title>CRICZONE | Live Sports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../site-polish.css?v=20261022-criczone5">
  <style>
    html, body { margin:0; min-height:100%; background:#050609; }
    body { color:#fff; font-family:Manrope,sans-serif; }
    .criczone5-label {
      position:relative; z-index:10; width:min(1480px,92vw); margin:0 auto;
      padding:18px 0 0; display:flex; align-items:center; justify-content:space-between;
      color:#fff; gap:12px;
    }
    .criczone5-brand { font:800 18px/1 'Space Grotesk',sans-serif; letter-spacing:1px; }
    .criczone5-brand span { color:#ff3d71; }
    .criczone5-sub { display:block; margin-top:5px; color:#a4a7b2; font:700 9px/1.3 Manrope,sans-serif; letter-spacing:2px; }
    .criczone5-badge { border:1px solid rgba(255,61,113,.35); background:rgba(255,61,113,.09); color:#ff789b; border-radius:999px; padding:8px 11px; font-size:10px; font-weight:800; letter-spacing:1px; }
    criczone-ui { display:block; }
    @media(max-width:520px) {
      .criczone5-label { width:calc(100% - 28px); padding-top:13px; }
      .criczone5-brand { font-size:16px; }
      .criczone5-badge { font-size:9px; padding:7px 9px; }
    }
  </style>
</head>
<body>
  <header class="criczone5-label">
    <div class="criczone5-brand">CRIC<span>ZONE</span><small class="criczone5-sub">LIVE SPORTS</small></div>
    <div class="criczone5-badge">SPORTS PLAYER</div>
  </header>

  <criczone-ui></criczone-ui>

  <script src="/criczone6/script.js?v=criczone5-player1"></script>
  <script>
    // Keep the player embedded on this page; do not allow it to navigate the parent page.
    customElements.whenDefined('criczone-ui').then(() => {
      const host = document.querySelector('criczone-ui');
      if (!host || !host.shadowRoot) return;

      // Styles inside a Shadow DOM must be linked inside that Shadow Root.
      // A normal <link> in the page head cannot style the player's internal UI.
      const shadow = host.shadowRoot;
      if (!shadow.querySelector('link[data-criczone-theme]')) {
        const theme = document.createElement('link');
        theme.rel = 'stylesheet';
        theme.href = '/criczone6/style.css?v=criczone5-shadow-ui2';
        theme.dataset.criczoneTheme = 'true';
        shadow.prepend(theme);
      }

      const applyPlayerSandbox = () => {
        const frame = shadow.querySelector('iframe#player');
        if (frame && !frame.hasAttribute('sandbox')) {
          frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation');
        }
      };
      const observer = new MutationObserver(applyPlayerSandbox);
      observer.observe(shadow, { childList: true, subtree: true });
      applyPlayerSandbox();
    });
  </script>


<script src="/assets/js/telegram-membership-gate.js" defer></script>
</body>
</html>
