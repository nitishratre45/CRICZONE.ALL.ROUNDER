    (function() {

        /* ========== CONFIG ========== */

        const DOM = {
            video: document.getElementById('video'),
            container: document.getElementById('playerContainer'),
            loading: document.getElementById('loading'),
        };

        let hlsInstance = null;
        let plyrInstance = null;
        let userPaused = false;
        let isInitialized = false;

        /* ========== HELPERS ========== */
        function hideLoading() {
            if (DOM.loading) DOM.loading.style.display = 'none';
        }

        function showLoading() {
            if (DOM.loading) DOM.loading.style.display = 'flex';
        }

        function destroyPlayer() {
            if (hlsInstance) {
                try { hlsInstance.destroy(); } catch (_) {}
                hlsInstance = null;
            }
            if (plyrInstance) {
                try { plyrInstance.destroy(); } catch (_) {}
                plyrInstance = null;
            }
        }

        /* ========== PAUSE/RESUME LOGIC (from original) ========== */
        function setupPauseResumeLogic(video) {
            // Reset userPaused flag on play
            video.addEventListener('play', function() {
                userPaused = false;
            });

            // Detect user-initiated pause via click on play/pause button
            document.addEventListener('click', function(e) {
                const pauseBtn = e.target.closest('.plyr__control--pressed') || 
                                e.target.closest('.plyr__control[data-plyr="play"]');
                if (pauseBtn) {
                    if (!video.paused) {
                        userPaused = true;
                    } else {
                        userPaused = false;
                    }
                }
            });

            // Handle automatic pauses (buffering, etc.)
            video.addEventListener('pause', function() {
                if (!video.ended && !userPaused && isInitialized) {
                    // Auto-resume after a short delay
                    setTimeout(() => {
                        if (video.paused && !video.ended && !userPaused) {
                            video.play().catch(() => {});
                        }
                    }, 500);
                }
                // Reset flag after pause event
                setTimeout(() => {
                    userPaused = false;
                }, 100);
            });

            // Periodic check: if video is stuck paused, resume
            setInterval(() => {
                if (video.paused && !video.ended && !userPaused && isInitialized) {
                    video.play().catch(() => {});
                }
            }, 3000);
        }

        /* ========== INIT PLAYER ========== */
        async function initPlayer() {
            const video = DOM.video;
            const container = DOM.container;

            showLoading();
            destroyPlayer();

            try {
                // --- Try HLS.js first ---
                if (Hls.isSupported()) {
                    const hls = new Hls({
                        maxMaxBufferLength: 100,
                        liveSyncDurationCount: 3,
                        liveMaxLatencyDurationCount: 6,
                        enableWorker: true,
                        xhrSetup: (xhr) => { xhr.withCredentials = false; }
                    });

                    hlsInstance = hls;
                    hls.loadSource(STREAM_URL);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        // Get quality levels
                        const levels = hls.levels
                            .map(l => l.height)
                            .filter(Boolean)
                            .sort((a, b) => a - b);

                        // Init Plyr
                        plyrInstance = new Plyr(video, {
                            controls: [
                                'play-large', 'play', 'progress', 'current-time',
                                'mute', 'volume', 'settings', 'fullscreen'
                            ],
                            settings: ['quality'],
                            quality: {
                                default: levels[levels.length - 1] || 720,
                                options: levels.length ? levels : [360, 480, 720, 1080],
                                forced: true,
                                onChange: (newQuality) => {
                                    hls.levels.forEach((level, index) => {
                                        if (level.height === newQuality) hls.currentLevel = index;
                                    });
                                }
                            }
                        });

                        // ========== KEY CHANGE: Start with pause but unmuted ==========
                        // First ensure video is unmuted
                        video.muted = false;

                        // Load the stream but don't autoplay - keep it paused
                        // The video will be paused initially with the big play button visible
                        // We need to make sure it stays paused after loading
                        video.pause();

                        // Mark as initialized so the auto-resume logic doesn't kick in
                        isInitialized = true;

                        // Hide loading once stream is ready
                        video.addEventListener('loadeddata', hideLoading);
                        setTimeout(hideLoading, 3000);

                        // Setup pause/resume logic
                        setupPauseResumeLogic(video);

                        // Also handle quality changes via Plyr settings
                        plyrInstance.on('qualitychange', (quality) => {
                            // quality is already handled by the onChange above
                        });
                    });

                    hls.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                                hls.startLoad();
                            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                                hls.recoverMediaError();
                            } else {
                                console.warn('Fatal HLS error:', data);
                                // Try fallback
                                fallbackToNative(video);
                            }
                        }
                    });

                } else {
                    // --- Fallback to native HLS (Safari) ---
                    fallbackToNative(video);
                }

            } catch (err) {
                console.error('Init error:', err);
                fallbackToNative(video);
            }
        }

        /* ========== FALLBACK: Native HLS ========== */
        function fallbackToNative(video) {
            console.log('Using native HLS fallback');
            destroyPlayer();

            video.src = STREAM_URL;

            // ========== KEY CHANGE: Start with pause but unmuted ==========
            video.muted = false;

            // Init Plyr without quality settings
            plyrInstance = new Plyr(video, {
                controls: [
                    'play-large', 'play', 'progress', 'current-time',
                    'mute', 'volume', 'settings', 'fullscreen'
                ]
            });

            // Keep it paused initially
            video.pause();

            // Mark as initialized
            isInitialized = true;

            video.addEventListener('loadeddata', hideLoading);
            setTimeout(hideLoading, 3000);

            setupPauseResumeLogic(video);
        }

        /* ========== START ========== */
        document.addEventListener('DOMContentLoaded', () => {
            initPlayer();
        });

        // Handle visibility change to resume if needed
        document.addEventListener('visibilitychange', () => {
            const video = DOM.video;
            if (!document.hidden && video && video.paused && !video.ended && isInitialized) {
                video.play().catch(() => {});
            }
        });

    })();
