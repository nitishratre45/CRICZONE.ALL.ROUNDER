<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>CRICZONE Match Center</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#080d18;--panel:#111a2a;--panel2:#172338;--line:#26364d;--txt:#edf4ff;--muted:#91a2bb;--gold:#f6c453;--green:#28d69a;--red:#ff536d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1c3152 0,transparent 55%),var(--bg);color:var(--txt);font:14px Inter,Arial,sans-serif;min-height:100vh}.wrap{max-width:1200px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 0 26px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#f6c453,#e68a28);display:grid;place-items:center;color:#101827;font-size:23px;font-weight:900}.brand h1{font:700 23px 'Space Grotesk';margin:0}.brand p{color:var(--muted);font-size:11px;letter-spacing:2px;margin:3px 0 0}.admin{color:#111827;background:var(--gold);font-weight:800;padding:11px 16px;border-radius:11px;text-decoration:none}.hero{padding:24px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(120deg,#172842,#111a2a 65%);margin-bottom:24px}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:2px}.hero h2{font:700 clamp(25px,5vw,38px) 'Space Grotesk';margin:8px 0}.hero p{color:var(--muted);margin:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}.search{flex:1;min-width:190px}.search,input,select{background:#0b1422;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;font:inherit}.tabs{display:flex;gap:8px}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}.tab.active{background:#f6c453;color:#111827;border-color:#f6c453}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:15px}.card{background:linear-gradient(160deg,#142137,#101827);border:1px solid var(--line);border-radius:18px;padding:17px;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#b58b3d}.cardtop,.foot{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{font-size:10px;letter-spacing:1px;font-weight:800;color:var(--muted);text-transform:uppercase}.status{font-size:10px;font-weight:900;letter-spacing:1px;padding:6px 9px;border-radius:30px;background:#26364d;color:#b8c8dd}.status.live{background:#48202d;color:#ff8294}.status.upcoming{background:#49391d;color:#ffdc85}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:9px;padding:24px 0}.team{text-align:center;min-width:0}.team img{width:55px;height:55px;object-fit:contain;margin:0 auto 9px;background:#202d40;border-radius:50%;padding:5px}.team b{display:block;overflow-wrap:anywhere;font-size:13px}.vs{color:var(--gold);font:700 18px 'Space Grotesk'}.meta{color:var(--muted);font-size:11px;text-align:center;margin-top:7px}.foot{border-top:1px solid var(--line);padding-top:14px}.foot span{color:var(--muted);font-size:12px}.watch{background:var(--gold);color:#111827;text-decoration:none;padding:10px 15px;border-radius:10px;font-weight:900}.empty{text-align:center;color:var(--muted);padding:60px 15px;border:1px dashed var(--line);border-radius:18px}.empty strong{display:block;color:var(--txt);font-size:18px;margin-bottom:7px}@media(max-width:520px){.wrap{padding:14px}.hero{padding:19px}.brand h1{font-size:20px}.toolbar{align-items:stretch}.tabs{width:100%}.tab{flex:1}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="logo">C</div><div><h1>CRICZONE</h1><p>MATCH CENTER</p></div></div><a class="admin" href="admin/">⚙ Admin Panel</a></header><section class="hero"><div class="eyebrow">LIVE • FIXTURES • RESULTS</div><h2>Every match. One destination.</h2><p>Choose a match, select your available stream and watch in the built-in player.</p></section><div class="toolbar"><input id="search" class="search" placeholder="Search teams or tournament…"><div class="tabs"><button class="tab active" data-filter="all">All</button><button class="tab" data-filter="live">Live</button><button class="tab" data-filter="upcoming">Upcoming</button><button class="tab" data-filter="completed">Results</button></div></div><div id="featured"></div><div id="grid" class="grid"><div class="empty">Loading matches…</div></div></main><script>
const STORE='cz_matchcenter_matches_v1';let matches=[],filter='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showDate(v){if(!v)return '';const m=String(v).match(/^(\\d{4})-(\\d{2})-(\\d{2})$/);if(m)return new Date(Number(m[1]),Number(m[2])-1,Number(m[3])).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}function showTime(v){if(!v)return '';const m=String(v).match(/^(\\d{1,2}):(\\d{2})$/);if(!m)return v;let h=Number(m[1]);return ((h%12)||12)+':'+m[2]+' '+(h>=12?'PM':'AM')+' IST'}
async function load(){try{const r=await fetch('../api/matchcenter',{cache:'no-store'});const j=await r.json();if(j.ok&&Array.isArray(j.matches)){matches=j.matches;render();return}}catch{}try{const r=await fetch('matches.json?'+Date.now(),{cache:'no-store'});const j=await r.json();matches=Array.isArray(j)?j:(j.matches||[])}catch{matches=[]}try{const local=JSON.parse(localStorage.getItem(STORE)||'null');if(Array.isArray(local))matches=local}catch{}render()}
function render(){const featured=matches.find(m=>m.featured&&m.status==='live')||matches.find(m=>m.featured);document.getElementById('featured').innerHTML=featured?'<div class="card" style="margin-bottom:16px;border-color:#f6c453;background:linear-gradient(120deg,#263c5a,#111a2a)"><div class="tag" style="color:#f6c453">★ FEATURED MATCH</div><div style="display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin-top:10px">'+(featured.poster?'<img src="'+esc(featured.poster)+'" style="width:140px;height:90px;object-fit:cover;border-radius:10px" alt="">':'')+'<div style="flex:1"><h2 style="margin:0 0 6px">'+esc((featured.teamA?.name||'Team A')+' vs '+(featured.teamB?.name||'Team B'))+'</h2><span class="tag">'+esc(featured.status||'upcoming')+' • '+esc(featured.tournament||'Cricket')+'</span></div><a class="watch" href="ply/?id='+encodeURIComponent(featured.id)+'">WATCH NOW →</a></div></div>':'';const q=document.getElementById('search').value.toLowerCase();const rows=[...matches].sort((x,y)=>Number(!!y.featured)-Number(!!x.featured)).filter(m=>(filter==='all'||String(m.status||'upcoming').toLowerCase()===filter)&&[m.title,m.tournament,m.teamA?.name,m.teamB?.name].join(' ').toLowerCase().includes(q));document.getElementById('grid').innerHTML=rows.length?rows.map(m=>{const a=m.teamA||{},b=m.teamB||{},streams=(m.streams||[]).filter(s=>s.url);return '<article class="card">'+(m.poster?'<img src="'+esc(m.poster)+'" alt="" style="width:100%;height:130px;object-fit:cover;border-radius:12px;margin-bottom:12px">':'')+'<div class="cardtop"><span class="tag">'+esc(m.tournament||'CRICKET')+'</span><span class="status '+esc(m.status||'upcoming')+'">'+esc(m.status||'upcoming')+'</span></div><div class="teams"><div class="team">'+'<b>'+esc(a.name||'Team A')+'</b></div><div class="vs">VS</div><div class="team">'+'<b>'+esc(b.name||'Team B')+'</b></div></div><div class="meta">'+esc(showDate(m.date||''))+(m.time?' • '+esc(showTime(m.time)):'')+(m.venue?' • '+esc(m.venue):'')+'</div><div class="foot"><span>'+streams.length+' stream option'+(streams.length===1?'':'s')+'</span><span style="display:flex;gap:7px"><button class="tab" onclick="shareMatch(\''+encodeURIComponent(m.id)+'\')">Share</button><a class="watch" href="ply/?id='+encodeURIComponent(m.id)+'">VIEW MATCH →</a></span></div></article>'}).join(''):'<div class="empty" style="grid-column:1/-1"><strong>No matches found</strong>Add matches from the Admin Panel or adjust your search.</div>'}
window.shareMatch=async id=>{const url=location.origin+location.pathname+'ply/?id='+id;try{if(navigator.share)await navigator.share({title:'CRICZONE Match',url});else{await navigator.clipboard.writeText(url);alert('Match link copied')}}catch{}};document.getElementById('search').addEventListener('input',render);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelector('.tab.active').classList.remove('active');b.classList.add('active');filter=b.dataset.filter;render()});load();setInterval(load,60000);
</script></body></html>
