<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>CRICZONE Match Player</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#080d18;color:#edf4ff;font:14px Inter,Arial;min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:18px}.back{display:inline-block;color:#f6c453;text-decoration:none;font-weight:700;margin:7px 0 20px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.head h1{font:700 clamp(21px,4vw,30px) 'Space Grotesk';margin:0}.muted{color:#91a2bb;margin:7px 0 18px}.screen{background:#000;border:1px solid #26364d;border-radius:16px;overflow:hidden;aspect-ratio:16/9;position:relative}.screen iframe{width:100%;height:100%;border:0;display:block;background:#000}.placeholder{height:100%;display:grid;place-items:center;color:#91a2bb;text-align:center;padding:20px}.panel{margin-top:17px;background:#111a2a;border:1px solid #26364d;border-radius:15px;padding:16px}.panel h2{font:700 17px 'Space Grotesk';margin:0 0 12px}.streams{display:flex;gap:9px;flex-wrap:wrap}.stream{background:#1a2940;border:1px solid #30435e;color:#dce8f8;padding:11px 15px;border-radius:10px;font-weight:700;cursor:pointer}.stream.active{background:#f6c453;color:#111827;border-color:#f6c453}.result{color:#f6c453;font-weight:700}.warn{font-size:11px;color:#91a2bb;margin-top:12px}@media(max-width:550px){.wrap{padding:12px}.screen{border-radius:10px}.panel{padding:13px}}
</style></head><body><main class="wrap"><a class="back" href="../">← Match Center</a><header class="head"><h1 id="title">Loading match…</h1><span id="status" class="result"></span></header><p class="muted" id="meta"></p><section class="screen" id="screen"><div class="placeholder">Loading player…</div></section><section class="panel"><h2>Match Score</h2><div id="scoreline" class="result"></div><p id="commentary" class="muted"></p></section><section class="panel"><h2>Choose Stream</h2><div id="streams" class="streams"></div><p class="warn">If a stream does not load, choose another available source. Playback depends on the stream provider and iframe permissions.</p></section></main><script>
const KEY='cz_matchcenter_matches_v1';const id=new URLSearchParams(location.search).get('id');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){let rows=[];try{const r=await fetch('../../api/matchcenter',{cache:'no-store'});const j=await r.json();if(j.ok&&Array.isArray(j.matches))rows=j.matches;else throw Error()}catch{try{const r=await fetch('../matches.json?'+Date.now());const j=await r.json();rows=Array.isArray(j)?j:(j.matches||[])}catch{}try{const local=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(local))rows=local}catch{}}const m=rows.find(x=>String(x.id)===String(id));if(!m){$('title').textContent='Match not found';$('screen').innerHTML='<div class="placeholder">This match is not available. Return to Match Center.</div>';return}$('title').textContent=(m.teamA?.name||'Team A')+' vs '+(m.teamB?.name||'Team B');$('status').textContent=String(m.status||'upcoming').toUpperCase();$('meta').textContent=[m.tournament,m.date,m.time,m.venue,m.result].filter(Boolean).join(' • ');$('scoreline').textContent=[m.scoreA,m.scoreB].filter(Boolean).join('  •  ')||m.result||'Score not added yet';$('commentary').textContent=m.commentary||'No commentary updates yet.';const streams=(m.streams||[]).filter(s=>s.url);$('streams').innerHTML=streams.length?streams.map((s,i)=>'<button class="stream" data-index="'+i+'">'+esc(s.name||'Stream '+(i+1))+(s.quality?' · '+esc(s.quality):'')+'</button>').join(''):'<span class="muted">No stream links have been added for this match yet.</span>';document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>play(streams[Number(b.dataset.index)],b));if(streams.length)play(streams[0],document.querySelector('[data-index="0"]'));setInterval(async()=>{try{const r=await fetch('../../api/matchcenter',{cache:'no-store'});const j=await r.json();const fresh=j.matches?.find(x=>String(x.id)===String(id));if(fresh){$('status').textContent=String(fresh.status||'upcoming').toUpperCase();$('scoreline').textContent=[fresh.scoreA,fresh.scoreB].filter(Boolean).join('  •  ')||fresh.result||'Score not added yet';$('commentary').textContent=fresh.commentary||'No commentary updates yet.'}}catch{}},60000)}function $(id){return document.getElementById(id)}function play(s,btn){document.querySelectorAll('.stream').forEach(x=>x.classList.remove('active'));btn?.classList.add('active');let u;try{u=new URL(s.url,location.href);if(!['http:','https:'].includes(u.protocol))throw Error()}catch{$('screen').innerHTML='<div class="placeholder">Invalid stream URL.</div>';return}const frame=document.createElement('iframe');frame.src=u.href;frame.title=s.name||'Match stream';frame.allow='autoplay; fullscreen; picture-in-picture; encrypted-media';frame.allowFullscreen=true;frame.referrerPolicy='no-referrer';$('screen').replaceChildren(frame)}init();
</script></body></html>
