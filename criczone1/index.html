<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Criczone Live — Premium Cricket Hub</title>

  <meta name="theme-color" content="#050812">
  <meta name="referrer" content="no-referrer">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <script src="../theme.js"></script>
</head>

<body>

  <criczone-ui></criczone-ui>

  <script>

    (() => {

      class CriczoneUI extends HTMLElement {

        constructor() {

          super();

          this.shadow = this.attachShadow({
            mode: "open"
          });

          this.config = {

            telegramLink:
              "https://t.me/+MueCDjlpoS8yNmJl",

            jsonUrl:
              "/api/channels?feed=directory"

          };

          this.state = {

            channels: [],

            filteredChannels: [],

            currentChannel: null

          };

          this.viewerPresenceRef = null;
          this.viewerCountUnsubscribe = null;
          this.firebaseConnectionUnsubscribe = null;
          this.firebaseRemove = null;
          this.viewerCountStarted = false;
          this.viewerJoinInFlight = false;

        }


        connectedCallback() {

          this.render();

          window.CriczoneTheme.bind(
            this.shadow.getElementById("themeToggle"),
            this
          );

          this.initEvents();

          this.loadChannelsData();

          this.setupViewerCount();

        }


        disconnectedCallback() {

          this.cleanupViewerCount();

        }


        /* =====================================================
           RENDER
        ===================================================== */

        render() {

          this.shadow.innerHTML = `

            <style>

              /* =================================================
                 ROOT
              ================================================= */

              :host {

                --bg:
                  #050812;

                --bg2:
                  #080d18;

                --card:
                  rgba(255,255,255,.045);

                --card-hover:
                  rgba(255,255,255,.075);

                --text:
                  #f7f9fc;

                --muted:
                  #8995a8;

                --blue:
                  #4b82ff;

                --blue2:
                  #2961e8;

                --cyan:
                  #27d9ff;

                --green:
                  #25e58a;

                --red:
                  #ff526b;

                --border:
                  rgba(255,255,255,.08);

                --shadow:
                  0 25px 70px rgba(0,0,0,.4);

                display: block;

                min-height: 100vh;

                color: var(--text);

                font-family:
                  Inter,
                  Arial,
                  sans-serif;

                background:
                  var(--bg);

              }


              * {

                box-sizing: border-box;

                margin: 0;

                padding: 0;

                -webkit-tap-highlight-color:
                  transparent;

              }


              button,
              input {

                font-family: inherit;

              }


              button {

                cursor: pointer;

              }


              body {

                margin: 0;

              }


              /* =================================================
                 APP BACKGROUND
              ================================================= */

              .app {

                min-height: 100vh;

                position: relative;

                overflow: hidden;

                background:

                  radial-gradient(
                    circle at 10% -5%,
                    rgba(53,105,255,.18),
                    transparent 32%
                  ),

                  radial-gradient(
                    circle at 95% 5%,
                    rgba(0,214,190,.08),
                    transparent 28%
                  ),

                  linear-gradient(
                    180deg,
                    #050812 0%,
                    #070c17 100%
                  );

              }


              .background-glow {

                position: fixed;

                width: 420px;

                height: 420px;

                border-radius: 50%;

                pointer-events: none;

                filter: blur(110px);

                opacity: .45;

                z-index: 0;

              }


              .glow-one {

                top: -250px;

                left: -150px;

                background:
                  rgba(47,100,255,.18);

              }


              .glow-two {

                right: -250px;

                bottom: -100px;

                background:
                  rgba(0,210,180,.10);

              }


              .container {

                width:
                  min(
                    1240px,
                    calc(100% - 40px)
                  );

                margin:
                  0 auto;

                position:
                  relative;

                z-index: 2;

              }


              /* =================================================
                 HEADER
              ================================================= */

              .header {

                height: 76px;

                display: flex;

                align-items: center;

                justify-content:
                  space-between;

                border-bottom:
                  1px solid
                  rgba(255,255,255,.055);

              }


              .brand {

                display: flex;

                align-items: center;

                gap: 11px;

              }


              .brand-logo {

                width: 42px;

                height: 42px;

                border-radius: 13px;

                display: grid;

                place-items: center;

                font-size: 20px;

                background:
                  linear-gradient(
                    145deg,
                    #4d8dff,
                    #2853d6

                box-shadow:
                  0 10px 30px
                  rgba(55,105,255,.3),

                  inset 0 1px

              }


              .brand-name {

                font-size: 18px;

                font-weight: 800;

                letter-spacing:
                  -.5px;

              }


              .brand-sub {

                color:
                  #68778e;

                font-size: 8px;

                font-weight: 700;

                letter-spacing:
                  2px;

                margin-top: 4px;

              }


              .live-badge {

                display: flex;

                align-items: center;

                gap: 7px;

                padding:
                  8px 12px;

                border-radius:
                  999px;

                color:
                  var(--green);

                background:
                  rgba(37,229,138,.07);

                border:
                  1px solid
                  rgba(37,229,138,.18);

                font-size: 10px;

                font-weight: 800;

                letter-spacing:
                  .7px;

              }


              .viewer-count {

                padding-left: 8px;

                border-left:
                  1px solid
                  rgba(37,229,138,.25);

                color:
                  #d5e2ed;

                font-size:
                  9px;

                font-weight:
                  700;

                letter-spacing:
                  0;

                white-space:
                  nowrap;

              }


              .live-dot {

                width: 7px;

                height: 7px;

                border-radius: 50%;

                background:
                  var(--green);

                box-shadow:
                  0 0 0 0
                  rgba(37,229,138,.6);

                animation:
                  livePulse 1.7s infinite;

              }


              @keyframes livePulse {

                0% {

                  box-shadow:
                    0 0 0 0
                    rgba(37,229,138,.6);

                }

                70% {

                  box-shadow:
                    0 0 0 7px
                    rgba(37,229,138,0);

                }

                100% {

                  box-shadow:
                    0 0 0 0
                    rgba(37,229,138,0);

                }

              }


              /* =================================================
                 HERO
              ================================================= */

              .hero {

                padding:
                  62px 0 42px;

              }


              .hero-small {

                display: inline-flex;

                align-items: center;

                gap: 8px;

                color:
                  #7190ca;

                font-size: 10px;

                font-weight: 800;

                letter-spacing:
                  1.8px;

                text-transform:
                  uppercase;

                margin-bottom:
                  15px;

              }


              .hero-small-line {

                width: 25px;

                height: 1px;

                background:
                  var(--blue);

              }


              .hero h1 {

                max-width:
                  780px;

                font-size:
                  clamp(
                    36px,
                    5.5vw,
                    64px
                  );

                line-height:
                  1.02;

                letter-spacing:
                  -3px;

                font-weight:
                  800;

              }


              .gradient-text {

                background:
                  linear-gradient(
                    100deg,
                    #ffffff 15%,
                    #72a2ff 65%,
                    #35d8c3
                  );

                -webkit-background-clip:
                  text;

                background-clip:
                  text;

                color:
                  transparent;

              }


              .hero p {

                max-width:
                  620px;

                color:
                  var(--muted);

                font-size:
                  14px;

                line-height:
                  1.7;

                margin-top:
                  19px;

              }


              /* =================================================
                 CHANNEL SECTION
              ================================================= */

              .toolbar {

                display:
                  flex;

                align-items:
                  flex-end;

                justify-content:
                  space-between;

                gap:
                  20px;

                margin-bottom:
                  19px;

              }


              .section-title {

                font-size:
                  20px;

                font-weight:
                  800;

                letter-spacing:
                  -.6px;

              }


              .section-count {

                color:
                  #68768b;

                font-size:
                  11px;

                margin-top:
                  5px;

              }


              .search {

                position:
                  relative;

                width:
                  280px;

              }


              .search input {

                width:
                  100%;

                height:
                  44px;

                border-radius:
                  13px;

                outline:
                  none;

                border:
                  1px solid
                  var(--border);

                background:
                  rgba(255,255,255,.04);

                color:
                  white;

                padding:
                  0 14px 0 40px;

                font-size:
                  12px;

                transition:
                  .25s ease;

              }


              .search input::placeholder {

                color:
                  #657389;

              }


              .search input:focus {

                border-color:
                  rgba(75,130,255,.55);

                background:
                  rgba(255,255,255,.06);

                box-shadow:
                  0 0 0 4px
                  rgba(75,130,255,.07);

              }


              .search-icon {

                position:
                  absolute;

                left:
                  14px;

                top:
                  50%;

                transform:
                  translateY(-50%);

                color:
                  #73829a;

                font-size:
                  15px;

              }


              /* =================================================
                 CHANNEL GRID
              ================================================= */

              .channels-grid {

                display:
                  grid;

                grid-template-columns:
                  repeat(
                    auto-fill,
                    minmax(245px, 1fr)
                  );

                gap:
                  14px;

                padding-bottom:
                  70px;

              }


              .channel-card {

                min-height:
                  150px;

                position:
                  relative;

                overflow:
                  hidden;

                padding:
                  18px;

                border-radius:
                  19px;

                border:
                  1px solid
                  var(--border);

                background:
                  linear-gradient(
                    145deg,
                    rgba(255,255,255,.055),
                    rgba(255,255,255,.018)
                  );

                box-shadow:
                  0 10px 35px
                  rgba(0,0,0,.12);

                cursor:
                  pointer;

                display:
                  flex;

                flex-direction:
                  column;

                justify-content:
                  space-between;

                transition:
                  .25s ease;

                animation:
                  cardIn .45s ease both;

              }


              @keyframes cardIn {

                from {

                  opacity: 0;

                  transform:
                    translateY(12px);

                }

                to {

                  opacity: 1;

                  transform:
                    translateY(0);

                }

              }


              .channel-card::after {

                content: "";

                position:
                  absolute;

                width:
                  150px;

                height:
                  150px;

                border-radius:
                  50%;

                right:
                  -85px;

                top:
                  -85px;

                background:
                  rgba(75,130,255,.09);

                filter:
                  blur(4px);

              }


              .channel-card:hover {

                transform:
                  translateY(-5px);

                border-color:
                  rgba(75,130,255,.42);

                background:
                  linear-gradient(
                    145deg,
                    rgba(75,130,255,.09),
                    rgba(255,255,255,.025)
                  );

                box-shadow:
                  0 20px 50px
                  rgba(0,0,0,.28);

              }


              .channel-top {

                display:
                  flex;

                align-items:
                  center;

                justify-content:
                  space-between;

              }


              .channel-icon {

                width:
                  43px;

                height:
                  43px;

                border-radius:
                  13px;

                display:
                  grid;

                place-items:
                  center;

                background:
                  linear-gradient(
                    145deg,
                    rgba(75,130,255,.18),
                    rgba(39,217,255,.04)
                  );

                border:
                  1px solid
                  rgba(75,130,255,.16);

                font-size:
                  19px;

              }


              .channel-live {

                display:
                  flex;

                align-items:
                  center;

                gap:
                  5px;

                padding:
                  5px 8px;

                border-radius:
                  7px;

                background:
                  rgba(37,229,138,.07);

                color:
                  var(--green);

                font-size:
                  8px;

                font-weight:
                  800;

                letter-spacing:
                  .8px;

              }


              .channel-live::before {

                content: "";

                width:
                  5px;

                height:
                  5px;

                border-radius:
                  50%;

                background:
                  var(--green);

              }


              .channel-bottom {

                display:
                  flex;

                align-items:
                  flex-end;

                justify-content:
                  space-between;

                gap:
                  10px;

                margin-top:
                  18px;

              }


              .channel-name {

                color:
                  #f0f4fa;

                font-size:
                  14px;

                font-weight:
                  700;

                line-height:
                  1.35;

              }


              .watch-arrow {

                width:
                  31px;

                height:
                  31px;

                flex-shrink:
                  0;

                display:
                  grid;

                place-items:
                  center;

                border-radius:
                  10px;

                background:
                  rgba(255,255,255,.055);

                color:
                  #8da1c3;

                transition:
                  .2s ease;

              }


              .channel-card:hover
              .watch-arrow {

                background:
                  var(--blue);

                color:
                  white;

                transform:
                  translateX(2px);

              }


              /* =================================================
                 LOADING
              ================================================= */

              .loading {

                grid-column:
                  1 / -1;

                min-height:
                  220px;

                display:
                  flex;

                flex-direction:
                  column;

                align-items:
                  center;

                justify-content:
                  center;

                gap:
                  14px;

                color:
                  #728096;

                font-size:
                  12px;

              }


              .loader {

                width:
                  35px;

                height:
                  35px;

                border:
                  3px solid
                  rgba(255,255,255,.08);

                border-top-color:
                  var(--blue);

                border-radius:
                  50%;

                animation:
                  spin .8s linear infinite;

              }


              @keyframes spin {

                to {

                  transform:
                    rotate(360deg);

                }

              }


              /* =================================================
                 COMMUNITY
              ================================================= */

              .community {

                padding:
                  60px 0 90px;

                border-top:
                  1px solid
                  rgba(255,255,255,.05);

                background:
                  radial-gradient(
                    circle at 50% 100%,
                    rgba(52,100,255,.08),
                    transparent 45%
                  );

              }


              .community-head {

                text-align:
                  center;

                max-width:
                  600px;

                margin:
                  0 auto 30px;

              }


              .community-mini {

                color:
                  var(--blue);

                font-size:
                  9px;

                font-weight:
                  800;

                letter-spacing:
                  1.7px;

                text-transform:
                  uppercase;

              }


              .community-head h2 {

                font-size:
                  28px;

                letter-spacing:
                  -1px;

                margin-top:
                  9px;

              }


              .community-head p {

                color:
                  #728096;

                font-size:
                  12px;

                line-height:
                  1.6;

                margin-top:
                  9px;

              }


              .community-grid {

                display:
                  grid;

                grid-template-columns:
                  repeat(2, 1fr);

                gap:
                  14px;

              }


              .community-card {

                display:
                  flex;

                align-items:
                  center;

                justify-content:
                  space-between;

                gap:
                  15px;

                padding:
                  21px;

                border:
                  1px solid
                  var(--border);

                border-radius:
                  19px;

                background:
                  linear-gradient(
                    145deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.015)
                  );

              }


              .community-left {

                display:
                  flex;

                align-items:
                  center;

                gap:
                  13px;

              }


              .community-icon {

                width:
                  46px;

                height:
                  46px;

                flex-shrink:
                  0;

                display:
                  grid;

                place-items:
                  center;

                border-radius:
                  13px;

                background:
                  rgba(0,136,204,.12);

                border:
                  1px solid
                  rgba(0,136,204,.18);

                font-size:
                  19px;

              }


              .community-card h3 {

                font-size:
                  13px;

                margin-bottom:
                  5px;

              }


              .community-card p {

                color:
                  #718096;

                font-size:
                  10px;

                line-height:
                  1.5;

              }


              .telegram-btn {

                border:
                  none;

                padding:
                  10px 15px;

                border-radius:
                  10px;

                background:
                  linear-gradient(
                    135deg,
                    #0088cc,
                    #006db1
                  );

                color:
                  white;

                font-size:
                  10px;

                font-weight:
                  800;

                white-space:
                  nowrap;

              }


              /* =================================================
                 PLAYER
              ================================================= */

              .hub-view {

                display:
                  block;

              }


              .hub-view.hidden {

                display:
                  none;

              }


              .player-view {

                display:
                  none;

                padding-bottom:
                  80px;

              }


              .player-view.active {

                display:
                  block;

              }


              .player-header {

                padding:
                  26px 0 18px;

                display:
                  flex;

                align-items:
                  center;

                justify-content:
                  space-between;

                gap:
                  15px;

              }


              .player-title {

                display:
                  flex;

                align-items:
                  center;

                gap:
                  11px;

                min-width:
                  0;

              }


              .player-icon {

                width:
                  43px;

                height:
                  43px;

                flex-shrink:
                  0;

                display:
                  grid;

                place-items:
                  center;

                border-radius:
                  13px;

                background:
                  rgba(75,130,255,.12);

                border:
                  1px solid
                  rgba(75,130,255,.18);

              }


              .player-title h2 {

                font-size:
                  17px;

                white-space:
                  nowrap;

                overflow:
                  hidden;

                text-overflow:
                  ellipsis;

              }


              .player-title p {

                color:
                  #68768b;

                font-size:
                  9px;

                margin-top:
                  4px;

                font-weight:
                  700;

                letter-spacing:
                  1px;

              }


              .player-actions {

                display:
                  flex;

                gap:
                  7px;

              }


              .action-btn {

                height:
                  40px;

                padding:
                  0 13px;

                border-radius:
                  11px;

                border:
                  1px solid

                background:
                  rgba(255,255,255,.045);

                color:
                  #d8dfeb;

                font-size:
                  10px;

                font-weight:
                  700;

              }


              .action-btn:hover {

                background:
                  rgba(255,255,255,.08);

              }


              .video-shell {

                padding:

                border-radius:
                  23px;

                background:
                  linear-gradient(
                    135deg,
                    rgba(75,130,255,.35),
                    rgba(255,255,255,.04),
                    rgba(39,217,255,.18)
                  );

                box-shadow:
                  0 30px 80px
                  rgba(0,0,0,.4);

              }


              .video-card {

                overflow:
                  hidden;

                border-radius:
                  22px;

                background:
                  #000;

              }


              .video-container {

                width:
                  100%;

                aspect-ratio:
                  16 / 9;

                background:
                  #000;

                position:
                  relative;

              }


              .video-container iframe {

                position:
                  absolute;

                inset:
                  0;

                width:
                  100%;

                height:
                  100%;

                border:
                  0;

                display:
                  block;

                background:
                  #000;

              }


              .video-info {

                min-height:
                  72px;

                display:
                  flex;

                align-items:
                  center;

                justify-content:
                  space-between;

                gap:
                  15px;

                padding:
                  15px 19px;

                background:
                  linear-gradient(
                    180deg,
                    #101722,
                    #0b111b
                  );

                border-top:
                  1px solid
                  rgba(255,255,255,.06);

              }


              .now-playing {

                display:
                  flex;

                align-items:
                  center;

                gap:
                  10px;

                min-width:
                  0;

              }


              .now-dot {

                width:
                  8px;

                height:
                  8px;

                flex-shrink:
                  0;

                border-radius:
                  50%;

                background:
                  var(--green);

                box-shadow:
                  0 0 12px
                  rgba(37,229,138,.55);

              }


              .now-playing strong {

                display:
                  block;

                font-size:
                  12px;

                white-space:
                  nowrap;

                overflow:
                  hidden;

                text-overflow:
                  ellipsis;

              }


              .now-playing span {

                display:
                  block;

                color:
                  #68768a;

                font-size:
                  9px;

                margin-top:
                  3px;

              }


              /* =================================================
                 FLOATING TELEGRAM
              ================================================= */

              .floating-telegram {

                position:
                  fixed;

                right:
                  22px;

                bottom:
                  22px;

                width:
                  54px;

                height:
                  54px;

                z-index:
                  500;

                border:
                  none;

                border-radius:
                  17px;

                display:
                  grid;

                place-items:
                  center;

                background:
                  linear-gradient(
                    145deg,
                    #0088cc,
                    #006db1
                  );

                box-shadow:
                  0 12px 35px
                  rgba(0,136,204,.3);

                transition:
                  .25s ease;

              }


              .floating-telegram:hover {

                transform:
                  translateY(-4px);

              }


              .floating-telegram svg {

                width:
                  24px;

                height:
                  24px;

                fill:
                  white;

              }


              /* =================================================
                 MODAL
              ================================================= */

                position:
                  fixed;

                inset:
                  0;

                z-index:
                  9999;

                display:
                  flex;

                align-items:
                  center;

                justify-content:
                  center;

                padding:
                  20px;

                background:
                  rgba(0,0,0,.74);

                backdrop-filter:
                  blur(12px);

                opacity:
                  0;

                visibility:
                  hidden;

                transition:
                  .3s ease;

              }


              .modal.show {

                opacity:
                  1;

                visibility:
                  visible;

              }


              .modal-card {

                width:
                  min(
                    390px,
                    100%
                  );

                padding:
                  29px 24px;

                border-radius:
                  23px;

                text-align:
                  center;

                background:
                  linear-gradient(
                    145deg,
                    #121b2b,
                    #0a101a
                  );

        async setupViewerCount() {

          const countElement =
            this.shadow.getElementById(
              "viewerCount"
            );


          if (
            !countElement ||
            this.viewerCountStarted
          ) {

            return;

          }


          this.viewerCountStarted = true;


          try {

            const [firebaseAppSdk, firebaseDatabaseSdk] =
              await Promise.all([
                import(
                  "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js"
                ),
                import(
                  "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js"
                )
              ]);


            const firebaseConfig = {
              apiKey: "AIzaSyDm3DIHJfRPEqNqrUlYJutRQm8XIA6H3fs",
              authDomain: "cricket-live-39106.firebaseapp.com",
              databaseURL: "https://cricket-live-39106-default-rtdb.asia-southeast1.firebasedatabase.app",
              projectId: "cricket-live-39106",
              storageBucket: "cricket-live-39106.firebasestorage.app",
              messagingSenderId: "841890143",
              appId: "1:841890143:web:ca5b87c9395bdc19145eea"
            };


            const appName =
              "criczone1-live-viewers";


            const firebaseApp =
              firebaseAppSdk.getApps().find(
                app => app.name === appName
              ) ||
              firebaseAppSdk.initializeApp(
                firebaseConfig,
                appName
              );


            const database =
              firebaseDatabaseSdk.getDatabase(
                firebaseApp
              );


            const viewersRef =
              firebaseDatabaseSdk.ref(
                database,
                "liveViewers/page_criczone1"
              );


            this.firebaseRemove =
              firebaseDatabaseSdk.remove;


            this.viewerCountUnsubscribe =
              firebaseDatabaseSdk.onValue(
                viewersRef,
                snapshot => {

                  const records =
                    Object.values(
                      snapshot.val() || {}
                    );


                  const onlineCount =
                    records.filter(
                      record =>
                        record?.online === true
                    ).length;


                  countElement.textContent =
                    `${onlineCount} watching`;

                },
                error => {

                  console.error(
                    "Firebase viewer count failed:",
                    error
                  );

                  countElement.textContent =
                    "Unavailable";

                }
              );


            this.firebaseConnectionUnsubscribe =
              firebaseDatabaseSdk.onValue(
                firebaseDatabaseSdk.ref(
                  database,
                  ".info/connected"
                ),
                snapshot => {

                  if (
                    snapshot.val() !== true ||
                    this.viewerJoinInFlight
                  ) {

                    return;

                  }


                  this.viewerJoinInFlight = true;


                  void (async () => {

                    try {

                      if (!this.viewerPresenceRef) {

                        this.viewerPresenceRef =
                          firebaseDatabaseSdk.push(
                            viewersRef
                          );

                      }


                      await firebaseDatabaseSdk
                        .onDisconnect(
                          this.viewerPresenceRef
                        )
                        .remove();


                      await firebaseDatabaseSdk.set(
                        this.viewerPresenceRef,
                        {
                          online: true,
                          joinedAt:
                            firebaseDatabaseSdk.serverTimestamp()
                        }
                      );

                    } catch (error) {

                      console.error(
                        "Firebase viewer presence failed:",
                        error
                      );

                      countElement.textContent =
                        "Unavailable";

                    } finally {

                      this.viewerJoinInFlight = false;

                    }

                  })();

                }
              );


            window.addEventListener(
              "pagehide",
              () => this.cleanupViewerCount(),
              { once: true }
            );

          } catch (error) {

            console.error(
              "Firebase viewer setup failed:",
              error
            );

            countElement.textContent =
              "Unavailable";

          }

        }


        cleanupViewerCount() {

          if (
            this.viewerPresenceRef &&
            this.firebaseRemove
          ) {

            this.firebaseRemove(
              this.viewerPresenceRef
            ).catch(
              error =>
                console.warn(
                  "Firebase viewer cleanup failed:",
                  error
                )
            );

          }


          this.viewerPresenceRef = null;


          if (this.viewerCountUnsubscribe) {

            this.viewerCountUnsubscribe();

            this.viewerCountUnsubscribe = null;

          }


          if (this.firebaseConnectionUnsubscribe) {

            this.firebaseConnectionUnsubscribe();

            this.firebaseConnectionUnsubscribe = null;

          }

        }


        /* =====================================================
           LOAD JSON
        ===================================================== */

        async loadChannelsData() {

          let data = null;


          try {

            const response =
              await fetch(
                this.config.jsonUrl,
                {
                  cache: "no-store"
                }
              );


            if (response.ok) {

              data =
                await response.json();

            }

          } catch (error) {

            console.warn(
              "Direct JSON fetch failed:",
              error
            );

          }


          /*
             Fallback
          */

          if (!data) {

            try {

              const proxy =
                "https://api.allorigins.win/raw?url=" +
                encodeURIComponent(
                  this.config.jsonUrl
                );


              const response =
                await fetch(
                  proxy,
                  {
                    cache: "no-store"
                  }
                );


              if (response.ok) {

                data =
                  await response.json();

              }

            } catch (error) {

              console.warn(
                "Fallback fetch failed:",
                error
              );

            }

          }


          if (!data) {

            this.showError(
              "Failed to load channels."
            );

            return;

          }


          /*
             Supports:

             [
               {...}
             ]

             OR

             {
               "channels": [...]
             }

             OR

             {
               "streams": [...]
             }

             OR

             {
               "iframes": [...]
             }
          */

          const channels =
            Array.isArray(data)
              ? data
              : (
                  data.channels ||
                  data.streams ||
                  data.iframes ||
                  []
                );


          this.state.channels =
            channels;


          this.state.filteredChannels =
            channels;


          this.renderChannels(
            channels
          );


          /*
             Deep link:

             ?id=eng

             ?id=143
          */

          const params =
            new URLSearchParams(
              window.location.search
            );


          const targetId =
            params.get("id");


          if (targetId) {

            const matched =
              this.state.channels.find(
                channel =>
                  String(channel.id) ===
                  String(targetId)
              );


            if (matched) {

              this.playChannel(
                matched
              );

            }

          }

        }


        /* =====================================================
           RENDER CHANNELS
        ===================================================== */

        renderChannels(channels) {

          const grid =
            this.shadow.getElementById(
              "channelsGrid"
            );


          const count =
            this.shadow.getElementById(
              "channelCount"
            );


          count.textContent =
            `${channels.length} channel${channels.length === 1 ? "" : "s"} available`;


          if (!channels.length) {

            grid.innerHTML = `

              <div class="loading">

                <div style="
                  font-size:28px;
                ">
                  🔎
                </div>

                <span>
                  No channels found.
                </span>

              </div>

            `;

            return;

          }


          grid.innerHTML =
            channels
              .map(
                (channel, index) => {

                  const name =
                    this.escapeHTML(
                      channel.name ||
                      `Channel ${channel.id || index + 1}`
                    );


                  const id =
                    this.escapeAttr(
                      channel.id ??
                      index
                    );


                  return `

                    <div
                      class="channel-card"
                      data-channel-id="${id}"
                      style="
                        animation-delay:
                        ${Math.min(
                          index * 25,
                          450
                        )}ms
                      "
                    >

                      <div class="channel-top">

                        <div class="channel-icon">
                          📺
                        </div>

                        <div class="channel-live">
                          LIVE
                        </div>

                      </div>


                      <div class="channel-bottom">

                        <div class="channel-name">
                          ${name}
                        </div>

                        <div class="watch-arrow">
                          →
                        </div>

                      </div>

                    </div>

                  `;

                }
              )
              .join("");


          /*
             Click handling
          */

          grid.onclick =
            event => {

              const card =
                event.target.closest(
                  "[data-channel-id]"
                );


              if (!card) return;


              const id =
                card.dataset.channelId;


              const channel =
                this.state.channels.find(
                  item =>
                    String(item.id) ===
                    String(id)
                );


              if (channel) {

                this.playChannel(
                  channel
                );

              }

            };

        }


        /* =====================================================
           SEARCH
        ===================================================== */

        filterChannels(query) {

          const value =
            query
              .trim()
              .toLowerCase();


          const filtered =
            this.state.channels.filter(
              channel => {

                const name =
                  String(
                    channel.name || ""
                  ).toLowerCase();


                return name.includes(
                  value
                );

              }
            );


          this.state.filteredChannels =
            filtered;


          this.renderChannels(
            filtered
          );

        }


        /* =====================================================
           PLAY CHANNEL
        ===================================================== */

        playChannel(channel) {

          this.state.currentChannel =
            channel;


          const name =
            channel.name ||
            "Criczone Live";


          this.shadow
            .getElementById(
              "channelNameDisplay"
            )
            .textContent =
            name;


          this.shadow
            .getElementById(
              "playerChannelName"
            )
            .textContent =
            name;


          /*
             Supports:

             iframeSrc
             stream_url
             url
          */

          const source =
            channel.iframeSrc ||
            channel.stream_url ||
            channel.url ||
            "";


          const iframe =
            this.shadow
              .getElementById(
                "streamIframe"
              );


          iframe.src =
            source;


          /*
             Hide hub
          */

          this.shadow
            .getElementById(
              "hubView"
            )
            .classList.add(
              "hidden"
            );


          /*
             Show player
          */

          this.shadow
            .getElementById(
              "playerView"
            )
            .classList.add(
              "active"
            );


          /*
             Update URL

             /CRICZONE/?id=eng
          */

          try {

            const url =
              new URL(
                window.location.href
              );


            url.searchParams.set(
              "id",
              channel.id
            );


            window.history.replaceState(
              {},
              "",
              url
            );

          } catch (error) {}


          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }


        /* =====================================================
           SHOW HUB
        ===================================================== */

        showHub() {

          const iframe =
            this.shadow
              .getElementById(
                "streamIframe"
              );


          if (iframe) {

            iframe.src =
              "";

          }


          this.state.currentChannel =
            null;


          this.shadow
            .getElementById(
              "playerView"
            )
            .classList.remove(
              "active"
            );


          this.shadow
            .getElementById(
              "hubView"
            )
            .classList.remove(
              "hidden"
            );


          /*
             Remove ?id
          */

          try {

            const url =
              new URL(
                window.location.href
              );


            url.searchParams.delete(
              "id"
            );


            window.history.replaceState(
              {},
              "",
              url
            );

          } catch (error) {}


          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }


        /* =====================================================
           SHARE
        ===================================================== */

        async shareChannel() {

          const channel =
            this.state.currentChannel;


          if (!channel) {

            return;

          }


          const url =
            new URL(
              window.location.href
            );


          url.searchParams.set(
            "id",
            channel.id
          );


          const shareUrl =
            url.toString();


          if (
            navigator.share
          ) {

            try {

              await navigator.share({

                title:
                  `Criczone Live — ${channel.name || "Live Channel"}`,

                url:
                  shareUrl

              });

            } catch (error) {}

            return;

          }


          try {

            await navigator.clipboard.writeText(
              shareUrl
            );


            this.showToast(
              "Stream link copied!"
            );

          } catch (error) {

            this.showToast(
              shareUrl
            );

          }

        }


        /* =====================================================
           TELEGRAM
        ===================================================== */

        openTelegram() {

          window.open(
            this.config.telegramLink,
            "_blank",
            "noopener,noreferrer"
          );


          this.closeModal();

        }


        openModal() {

          this.shadow
            .getElementById(
              "telegramModal"
            )
            .classList.add(
              "show"
            );

        }


        closeModal() {

          this.shadow
            .getElementById(
              "telegramModal"
            )
            .classList.remove(
              "show"
            );

        }


        /* =====================================================
           TOAST
        ===================================================== */

        showToast(message) {

          const toast =
            this.shadow
              .getElementById(
                "toast"
              );


          toast.textContent =
            message;


          toast.classList.add(
            "show"
          );


          clearTimeout(
            this.toastTimer
          );


          this.toastTimer =
            setTimeout(
              () => {

                toast.classList.remove(
                  "show"
                );

              },
              2500
            );

        }


        /* =====================================================
           ERROR
        ===================================================== */

        showError(message) {

          const grid =
            this.shadow
              .getElementById(
                "channelsGrid"
              );


          grid.innerHTML = `

            <div class="loading">

              <div style="
                font-size:32px;
              ">
                ⚠️
              </div>

              <span>
                ${this.escapeHTML(message)}
              </span>

              <button
                id="retryButton"
                style="
                  margin-top:5px;
                  padding:10px 16px;
                  border:0;
                  border-radius:10px;
                  background:#3e72e8;
                  color:white;
                  font-size:11px;
                  font-weight:700;
                  cursor:pointer;
                "
              >
                RETRY
              </button>

            </div>

          `;


          const retry =
            this.shadow
              .getElementById(
                "retryButton"
              );


          if (retry) {

            retry.onclick =
              () =>
                this.loadChannelsData();

          }

        }


        /* =====================================================
           ESCAPE HTML
        ===================================================== */

        escapeHTML(value) {

          return String(value)

            .replaceAll(
              "&",
              "&amp;"
            )

            .replaceAll(
              "<",
              "&lt;"
            )

            .replaceAll(
              ">",
              "&gt;"
            )

            .replaceAll(
              '"',
              "&quot;"
            )

            .replaceAll(
              "'",
              "&#039;"
            );

        }


        escapeAttr(value) {

          return this.escapeHTML(
            value ?? ""
          );

        }

      }


      customElements.define(
        "criczone-ui",
        CriczoneUI
      );


    })();

  </script>

</body>
</html>
