<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Criczone Live — Premium Cricket Hub</title>

  <meta name="theme-color" content="#050812">
  <meta name="referrer" content="no-referrer">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
</head>

<body>

<criczone-ui></criczone-ui>

<script>
(() => {

  class CriczoneUI extends HTMLElement {

    constructor() {
      super();

      this.shadow = this.attachShadow({
        mode: "open"
      });

      /* =========================================
         EXISTING CONFIG — DO NOT CHANGE
      ========================================= */

      this.config = {
        telegramLink:
          "https://t.me/+MueCDjlpoS8yNmJl",

        jsonUrl:
          "https://allrounderid2.pages.dev/id.json"
      };

      /* =========================================
         STATE
      ========================================= */

      this.state = {
        channels: [],
        filteredChannels: [],
        currentChannel: null
      };

      /* =========================================
         LIVE WATCHING
      ========================================= */

      this.BASE_WATCHING = 345;

      this.firebaseApp = null;
      this.firebaseDB = null;
      this.firebaseReady = false;

      this.firebaseRef = null;
      this.firebasePush = null;
      this.firebaseSet = null;
      this.firebaseRemove = null;
      this.firebaseOnDisconnect = null;
      this.firebaseOnValue = null;

      this.viewerRef = null;
      this.viewerListener = null;
      this.viewerChannelId = null;

      this.toastTimer = null;
    }


    /* =========================================
       CONNECTED
    ========================================= */

    connectedCallback() {

      this.render();

      this.initEvents();

      this.initFirebaseViewers();

      this.loadChannelsData();

    }


    /* =========================================
       RENDER
    ========================================= */

    render() {

      this.shadow.innerHTML = `

        <style>

          :host {
            --bg: #050812;
            --bg2: #080d18;
            --card: rgba(255,255,255,.045);
            --card-hover: rgba(255,255,255,.075);
            --text: #f7f9fc;
            --muted: #8995a8;
            --blue: #4b82ff;
            --blue2: #2961e8;
            --cyan: #27d9ff;
            --green: #25e58a;
            --red: #ff526b;
            --border: rgba(255,255,255,.08);

            display: block;
            min-height: 100vh;
            color: var(--text);
            font-family: Inter, Arial, sans-serif;
            background: var(--bg);
          }

          * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
          }

          body {
            margin: 0;
          }

          button,
          input {
            font-family: inherit;
          }

          button {
            cursor: pointer;
          }

          .app {
            min-height: 100vh;
            position: relative;
            overflow: hidden;

            background:
              radial-gradient(
                circle at 10% -5%,
                rgba(53,105,255,.18),
                transparent 32%
              ),
              radial-gradient(
                circle at 95% 5%,
                rgba(0,214,190,.08),
                transparent 28%
              ),
              linear-gradient(
                180deg,
                #050812 0%,
                #070c17 100%
              );
          }

          .background-glow {
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(110px);
            opacity: .45;
            z-index: 0;
          }

          .glow-one {
            top: -250px;
            left: -150px;
            background: rgba(47,100,255,.18);
          }

          .glow-two {
            right: -250px;
            bottom: -100px;
            background: rgba(0,210,180,.10);
          }

          .container {
            width: min(1240px, calc(100% - 40px));
            margin: 0 auto;
            position: relative;
            z-index: 2;
          }

          /* =====================================
             HEADER
          ===================================== */

          .header {
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,.055);
          }

          .brand {
            display: flex;
            align-items: center;
            gap: 11px;
          }

          .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 13px;

            display: grid;
            place-items: center;

            font-size: 20px;

            background:
              linear-gradient(
                145deg,
                #4d8dff,
                #2853d6
              );

            box-shadow:
              0 10px 30px rgba(55,105,255,.3),
              inset 0 1px rgba(255,255,255,.25);
          }

          .brand-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -.5px;
          }

          .brand-sub {
            color: #68778e;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 4px;
          }

          .live-badge {
            display: flex;
            align-items: center;
            gap: 7px;

            padding: 8px 12px;
            border-radius: 999px;

            color: var(--green);
            background: rgba(37,229,138,.07);
            border: 1px solid rgba(37,229,138,.18);

            font-size: 10px;
            font-weight: 800;
            letter-spacing: .7px;
          }

          .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);

            animation: pulse 1.7s infinite;
          }

          @keyframes pulse {

            0% {
              box-shadow: 0 0 0 0 rgba(37,229,138,.6);
            }

            70% {
              box-shadow: 0 0 0 7px rgba(37,229,138,0);
            }

            100% {
              box-shadow: 0 0 0 0 rgba(37,229,138,0);
            }

          }


          /* =====================================
             HERO
          ===================================== */

          .hero {
            padding: 62px 0 42px;
          }

          .hero-small {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            color: #7190ca;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.8px;
            text-transform: uppercase;

            margin-bottom: 15px;
          }

          .hero-small-line {
            width: 25px;
            height: 1px;
            background: var(--blue);
          }

          .hero h1 {
            max-width: 780px;

            font-size: clamp(36px,5.5vw,64px);
            line-height: 1.02;
            letter-spacing: -3px;
            font-weight: 800;
          }

          .gradient-text {
            background:
              linear-gradient(
                100deg,
                #ffffff 15%,
                #72a2ff 65%,
                #35d8c3
              );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
          }

          .hero p {
            max-width: 620px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
            margin-top: 19px;
          }


          /* =====================================
             TOOLBAR
          ===================================== */

          .toolbar {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 19px;
          }

          .section-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -.6px;
          }

          .section-count {
            color: #68768b;
            font-size: 11px;
            margin-top: 5px;
          }

          .search {
            position: relative;
            width: 280px;
          }

          .search input {
            width: 100%;
            height: 44px;

            border-radius: 13px;
            outline: none;
            border: 1px solid var(--border);

            background: rgba(255,255,255,.04);
            color: white;

            padding: 0 14px 0 40px;
            font-size: 12px;

            transition: .25s ease;
          }

          .search input::placeholder {
            color: #657389;
          }

          .search input:focus {
            border-color: rgba(75,130,255,.55);

            background: rgba(255,255,255,.06);

            box-shadow:
              0 0 0 4px
              rgba(75,130,255,.07);
          }

          .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #73829a;
            font-size: 15px;
          }


          /* =====================================
             CHANNEL GRID
          ===================================== */

          .channels-grid {
            display: grid;

            grid-template-columns:
              repeat(
                auto-fill,
                minmax(245px,1fr)
              );

            gap: 14px;
            padding-bottom: 70px;
          }

          .channel-card {
            min-height: 150px;
            position: relative;
            overflow: hidden;

            padding: 18px;
            border-radius: 19px;

            border: 1px solid var(--border);

            background:
              linear-gradient(
                145deg,
                rgba(255,255,255,.055),
                rgba(255,255,255,.018)
              );

            box-shadow:
              0 10px 35px rgba(0,0,0,.12);

            cursor: pointer;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            transition: .25s ease;

            animation: cardIn .45s ease both;
          }

          @keyframes cardIn {

            from {
              opacity: 0;
              transform: translateY(12px);
            }

            to {
              opacity: 1;
              transform: translateY(0);
            }

          }

          .channel-card::after {
            content: "";

            position: absolute;

            width: 150px;
            height: 150px;

            border-radius: 50%;

            right: -85px;
            top: -85px;

            background: rgba(75,130,255,.09);

            filter: blur(4px);
          }

          .channel-card:hover {
            transform: translateY(-5px);

            border-color:
              rgba(75,130,255,.42);

            background:
              linear-gradient(
                145deg,
                rgba(75,130,255,.09),
                rgba(255,255,255,.025)
              );

            box-shadow:
              0 20px 50px rgba(0,0,0,.28);
          }

          .channel-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
          }

          .channel-icon {
            width: 43px;
            height: 43px;

            border-radius: 13px;

            display: grid;
            place-items: center;

            background:
              linear-gradient(
                145deg,
                rgba(75,130,255,.18),
                rgba(39,217,255,.04)
              );

            border:
              1px solid
              rgba(75,130,255,.16);

            font-size: 19px;
          }

          .channel-live {
            display: flex;
            align-items: center;
            gap: 5px;

            padding: 5px 8px;

            border-radius: 7px;

            background: rgba(37,229,138,.07);
            color: var(--green);

            font-size: 8px;
            font-weight: 800;
            letter-spacing: .8px;
          }

          .channel-live::before {
            content: "";

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: var(--green);
          }

          .channel-bottom {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            gap: 10px;
            margin-top: 18px;
          }

          .channel-name {
            color: #fff;

            font-size: 13px;
            font-weight: 700;
            line-height: 1.4;

            max-width: 85%;
          }

          .watch-arrow {
            width: 30px;
            height: 30px;

            flex-shrink: 0;

            border-radius: 10px;

            display: grid;
            place-items: center;

            color: #9bb5ef;

            background:
              rgba(75,130,255,.08);

            font-size: 16px;

            transition: .25s ease;
          }

          .channel-card:hover .watch-arrow {
            background: var(--blue);
            color: white;
            transform: translateX(2px);
          }


          /* =====================================
             PLAYER
          ===================================== */

          .player-view {
            display: none;
            padding: 28px 0 70px;
          }

          .player-view.active {
            display: block;
          }

          .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
            margin-bottom: 16px;
          }

          .player-title {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
          }

          .player-icon {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border-radius: 12px;

            display: grid;
            place-items: center;

            background:
              rgba(75,130,255,.1);

            font-size: 18px;
          }

          .player-title h2 {
            font-size: 17px;
            font-weight: 800;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          }

          .player-title p {
            color: var(--green);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-top: 3px;
          }

          .player-actions {
            display: flex;
            align-items: center;
            gap: 8px;
          }

          .action-btn {
            height: 38px;
            padding: 0 13px;

            border: 1px solid var(--border);
            border-radius: 11px;

            background:
              rgba(255,255,255,.04);

            color: white;

            font-size: 10px;
            font-weight: 700;

            transition: .2s ease;
          }

          .action-btn:hover {
            background:
              rgba(255,255,255,.08);
          }

          .video-shell {
            overflow: hidden;
            position: relative;

            width: 100%;

            border-radius: 18px;

            background: #000;

            border:
              1px solid
              rgba(255,255,255,.08);

            box-shadow:
              0 30px 80px
              rgba(0,0,0,.45);
          }

          .video-card {
            width: 100%;
          }

          .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            min-height: 320px;

            position: relative;

            background: #000;
          }

          #streamIframe {
            width: 100%;
            height: 100%;

            position: absolute;
            inset: 0;

            border: 0;
            background: #000;
          }

          .video-info {
            min-height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            padding: 12px 15px;

            background:
              linear-gradient(
                180deg,
                #0a1020,
                #080d18
              );
          }

          .now-playing {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
          }

          .now-dot {
            width: 9px;
            height: 9px;

            flex-shrink: 0;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
              0 0 12px
              rgba(37,229,138,.65);
          }

          .now-playing div {
            min-width: 0;
          }

          .now-playing strong {
            display: block;

            font-size: 11px;
            font-weight: 800;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          }

          .now-playing span {
            display: block;

            color: #68768b;

            font-size: 9px;
            margin-top: 3px;
          }


          /* =====================================
             LIVE WATCHING
          ===================================== */

          .live-watching {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 7px 11px;

            border-radius: 999px;

            background:
              rgba(37,229,138,.07);

            border:
              1px solid
              rgba(37,229,138,.16);

            color: #8c99ad;

            font-size: 9px;
            font-weight: 700;

            white-space: nowrap;
          }

          .live-watching strong {
            color: white;
            font-size: 10px;
          }

          .live-watching-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
              0 0 10px
              rgba(37,229,138,.65);

            animation:
              watchingPulse 1.5s infinite;
          }

          @keyframes watchingPulse {

            0% {
              box-shadow:
                0 0 0 0
                rgba(37,229,138,.45);
            }

            70% {
              box-shadow:
                0 0 0 6px
                rgba(37,229,138,0);
            }

            100% {
              box-shadow:
                0 0 0 0
                rgba(37,229,138,0);
            }

          }


          /* =====================================
             LOADING
          ===================================== */

          .loading {
            min-height: 240px;

            grid-column: 1 / -1;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 10px;

            color: var(--muted);
            font-size: 12px;
          }

          .loader {
            width: 28px;
            height: 28px;

            border:
              3px solid
              rgba(255,255,255,.08);

            border-top-color:
              var(--blue);

            border-radius: 50%;

            animation:
              spin .8s linear infinite;
          }

          @keyframes spin {
            to {
              transform: rotate(360deg);
            }
          }


          /* =====================================
             COMMUNITY
          ===================================== */

          .community {
            padding: 25px 0 70px;
          }

          .community-head {
            margin-bottom: 20px;
          }

          .community-mini {
            color: #7190ca;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
          }

          .community-head h2 {
            font-size: 24px;
            font-weight: 800;
          }

          .community-head p {
            color: var(--muted);
            font-size: 12px;
            margin-top: 7px;
          }

          .community-grid {
            display: grid;

            grid-template-columns:
              repeat(2,1fr);

            gap: 12px;
          }

          .community-card {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            padding: 18px;

            border:
              1px solid
              var(--border);

            border-radius: 16px;

            background:
              rgba(255,255,255,.035);
          }

          .community-left {
            display: flex;
            align-items: center;
            gap: 12px;
          }

          .community-icon {
            width: 42px;
            height: 42px;

            display: grid;
            place-items: center;

            border-radius: 12px;

            background:
              rgba(75,130,255,.1);

            font-size: 18px;
          }

          .community-card h3 {
            font-size: 12px;
            font-weight: 800;
          }

          .community-card p {
            color: #68768b;
            font-size: 9px;
            margin-top: 4px;
          }

          .telegram-btn {
            height: 36px;

            padding: 0 14px;

            border: 0;
            border-radius: 10px;

            color: white;

            background:
              linear-gradient(
                135deg,
                #0088cc,
                #006db1
              );

            font-size: 10px;
            font-weight: 800;
          }


          /* =====================================
             TELEGRAM FLOAT
          ===================================== */

          .floating-telegram {
            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 100;

            width: 50px;
            height: 50px;

            border: 0;
            border-radius: 15px;

            display: grid;
            place-items: center;

            background: #229ed9;
            color: white;

            box-shadow:
              0 15px 35px
              rgba(34,158,217,.28);

            transition: .25s ease;
          }

          .floating-telegram:hover {
            transform: translateY(-4px);
          }

          .floating-telegram svg {
            width: 23px;
            height: 23px;
            fill: currentColor;
          }


          /* =====================================
             MODAL
          ===================================== */

          .modal {
            position: fixed;
            inset: 0;

            z-index: 1000;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
              rgba(0,0,0,.65);

            backdrop-filter:
              blur(10px);
          }

          .modal.show {
            display: flex;
          }

          .modal-card {
            width: min(420px,100%);

            padding: 28px;

            border-radius: 20px;

            border:
              1px solid
              var(--border);

            background: #0a1020;

            box-shadow:
              0 30px 90px
              rgba(0,0,0,.5);

            text-align: center;
          }

          .modal-icon {
            font-size: 36px;
            margin-bottom: 12px;
          }

          .modal-card h3 {
            font-size: 20px;
            font-weight: 800;
          }

          .modal-card p {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
            margin: 10px 0 20px;
          }

          .modal-buttons {
            display: flex;
            gap: 8px;
          }

          .modal-buttons button {
            flex: 1;
            height: 42px;

            border: none;
            border-radius: 11px;

            font-size: 10px;
            font-weight: 800;
          }

          .modal-join {
            color: white;

            background:
              linear-gradient(
                135deg,
                #0088cc,
                #006db1
              );
          }

          .modal-close {
            color: #b6c0d0;

            background:
              rgba(255,255,255,.06);

            border:
              1px solid
              rgba(255,255,255,.07) !important;
          }


          /* =====================================
             TOAST
          ===================================== */

          .toast {
            position: fixed;

            left: 50%;
            bottom: 26px;

            z-index: 10000;

            transform:
              translate(-50%,20px);

            opacity: 0;

            pointer-events: none;

            padding: 11px 16px;

            border-radius: 11px;

            color: white;

            background: #141d2b;

            border:
              1px solid
              rgba(255,255,255,.08);

            box-shadow:
              0 15px 40px
              rgba(0,0,0,.35);

            font-size: 11px;

            transition: .25s ease;
          }

          .toast.show {
            opacity: 1;

            transform:
              translate(-50%,0);
          }


          /* =====================================
             FOOTER
          ===================================== */

          .footer {
            padding: 0 0 35px;

            color: #566277;

            text-align: center;

            font-size: 9px;
            letter-spacing: .2px;
          }


          /* =====================================
             MOBILE
          ===================================== */

          @media (max-width:760px) {

            .container {
              width: calc(100% - 24px);
            }

            .header {
              height: 68px;
            }

            .brand-logo {
              width: 38px;
              height: 38px;
              border-radius: 11px;
            }

            .brand-name {
              font-size: 16px;
            }

            .brand-sub {
              font-size: 7px;
            }

            .live-badge {
              padding: 7px 9px;
              font-size: 8px;
            }

            .hero {
              padding: 43px 0 32px;
            }

            .hero h1 {
              font-size: 39px;
              letter-spacing: -2.1px;
            }

            .hero p {
              font-size: 12px;
              line-height: 1.65;
            }

            .toolbar {
              flex-direction: column;
              align-items: stretch;
              gap: 13px;
            }

            .search {
              width: 100%;
            }

            .channels-grid {
              grid-template-columns:
                repeat(2,minmax(0,1fr));

              gap: 9px;

    /* =========================================
       LOAD CHANNEL JSON
    ========================================= */

    async loadChannelsData() {

      let data = null;


      /*
        Direct request
      */

      try {

        const response =
          await fetch(
            this.config.jsonUrl,
            {
              cache: "no-store"
            }
          );


        if (response.ok) {

          data =
            await response.json();

        }

      } catch (error) {

        console.warn(
          "Direct JSON fetch failed:",
          error
        );

      }


      /*
        Fallback proxy
      */

      if (!data) {

        try {

          const proxy =
            "https://api.allorigins.win/raw?url=" +
            encodeURIComponent(
              this.config.jsonUrl
            );


          const response =
            await fetch(
              proxy,
              {
                cache: "no-store"
              }
            );


          if (response.ok) {

            data =
              await response.json();

          }

        } catch (error) {

          console.warn(
            "Fallback fetch failed:",
            error
          );

        }

      }


      if (!data) {

        this.showError(
          "Failed to load channels."
        );

        return;

      }


      /*
        Support all existing formats.
      */

      const channels =
        Array.isArray(data)
          ? data
          : (
              data.channels ||
              data.streams ||
              data.iframes ||
              []
            );


      this.state.channels =
        channels;


      this.state.filteredChannels =
        channels;


      this.renderChannels(
        channels
      );


      /*
        Deep link:
        ?id=143
      */

      const params =
        new URLSearchParams(
          window.location.search
        );


      const targetId =
        params.get("id");


      if (targetId) {

        const matched =
          this.state.channels.find(
            channel =>
              String(channel.id) ===
              String(targetId)
          );


        if (matched) {

          this.playChannel(
            matched
          );

        }

      }

    }


    /* =========================================
       RENDER CHANNELS
    ========================================= */

    renderChannels(channels) {

      const grid =
        this.shadow.getElementById(
          "channelsGrid"
        );


      const count =
        this.shadow.getElementById(
          "channelCount"
        );


      count.textContent =
        `${channels.length} channel${channels.length === 1 ? "" : "s"} available`;


      if (!channels.length) {

        grid.innerHTML = `

          <div class="loading">

            <div style="font-size:28px">
              🔎
            </div>

            <span>
              No channels found.
            </span>

          </div>

        `;

        return;

      }


      grid.innerHTML =
        channels
          .map(
            (channel,index) => {

              const name =
                this.escapeHTML(
                  channel.name ||
                  `Channel ${channel.id || index + 1}`
                );


              const id =
                this.escapeAttr(
                  channel.id ??
                  index
                );


              return `

                <div
                  class="channel-card"
                  data-channel-id="${id}"
                  style="
                    animation-delay:${Math.min(
                      index * 25,
                      450
                    )}ms
                  "
                >

                  <div class="channel-top">

                    <div class="channel-icon">
                      📺
                    </div>

                    <div class="channel-live">
                      LIVE
                    </div>

                  </div>


                  <div class="channel-bottom">

                    <div class="channel-name">
                      ${name}
                    </div>

                    <div class="watch-arrow">
                      →
                    </div>

                  </div>

                </div>

              `;

            }
          )
          .join("");


      grid.onclick =
        event => {

          const card =
            event.target.closest(
              "[data-channel-id]"
            );


          if (!card) return;


          const id =
            card.dataset.channelId;


          const channel =
            this.state.channels.find(
              item =>
                String(item.id) ===
                String(id)
            );


          if (channel) {

            this.playChannel(
              channel
            );

          }

        };

    }


    /* =========================================
       SEARCH
    ========================================= */

    filterChannels(query) {

      const value =
        query
          .trim()
          .toLowerCase();


      const filtered =
        this.state.channels.filter(
          channel => {

            const name =
              String(
                channel.name || ""
              ).toLowerCase();


            return name.includes(
              value
            );

          }
        );


      this.state.filteredChannels =
        filtered;


      this.renderChannels(
        filtered
      );

    }


    /* =========================================
       START VIEWER PRESENCE
    ========================================= */

    async startViewerPresence(channel) {

      /*
        Firebase may still be initializing.
      */

      if (!this.firebaseReady) {

        for (
          let i = 0;
          i < 20 &&
          !this.firebaseReady;
          i++
        ) {

          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                250
              )
          );

        }

      }


      if (!this.firebaseReady) {

        this.updateLiveWatching(0);

        return;

      }


      /*
        Remove old channel presence.
      */

      this.stopViewerPresence();


      if (!channel) {
        return;
      }


      const channelId =
        String(
          channel.id ??
          channel.name ??
          "unknown"
        );


      this.viewerChannelId =
        channelId;


      try {

        const viewersRef =
          this.firebaseRef(
            this.firebaseDB,
            "liveViewers/" +
            this.safeFirebaseKey(
              channelId
            )
          );


        /*
          Create unique viewer node.
        */

        const viewerRef =
          this.firebasePush(
            viewersRef
          );


        this.viewerRef =
          viewerRef;


        /*
          Add viewer.
        */

        await this.firebaseSet(
          viewerRef,
          {
            joinedAt: Date.now()
          }
        );


        /*
          Remove automatically
          when connection closes.
        */

        await this.firebaseOnDisconnect(
          viewerRef
        ).remove();


        /*
          Listen to channel viewers.
        */

        this.viewerListener =
          this.firebaseOnValue(
            viewersRef,
            snapshot => {

              const data =
                snapshot.val() || {};


              const realViewers =
                Object.keys(
                  data
                ).length;


              this.updateLiveWatching(
                realViewers
              );

            },
            error => {

              console.warn(
                "Viewer listener error:",
                error
              );

              this.updateLiveWatching(
                0
              );

            }
          );


      } catch (error) {

        console.warn(
          "Viewer presence error:",
          error
        );

        this.updateLiveWatching(
          0
        );

      }

    }


    /* =========================================
       STOP VIEWER PRESENCE
    ========================================= */

    stopViewerPresence() {

      try {

        /*
          Stop listener.
        */

        if (
          this.viewerListener
        ) {

          this.viewerListener();

          this.viewerListener =
            null;

        }


        /*
          Remove current viewer.
        */

        if (
          this.viewerRef &&
          this.firebaseRemove
        ) {

          this.firebaseRemove(
            this.viewerRef
          ).catch(
            () => {}
          );

        }

      } catch (error) {

        console.warn(
          "Viewer cleanup error:",
          error
        );

      }


      this.viewerRef = null;
      this.viewerChannelId = null;


      this.updateLiveWatching(
        0
      );

    }


    /* =========================================
       UPDATE WATCHING COUNT
    ========================================= */

    updateLiveWatching(
      realViewers = 0
    ) {

      const counter =
        this.shadow.getElementById(
          "liveWatchingCount"
        );


      if (!counter) {
        return;
      }


      const total =
        this.BASE_WATCHING +
        Number(
          realViewers || 0
        );


      counter.textContent =
        total.toLocaleString(
          "en-IN"
        );

    }


    /* =========================================
       FIREBASE SAFE KEY
    ========================================= */

    safeFirebaseKey(value) {

      return String(value)
        .replace(
          /[.#$[\]\/]/g,
          "_"
        );

    }


    /* =========================================
       PLAY CHANNEL
    ========================================= */

    playChannel(channel) {

      this.state.currentChannel =
        channel;


      /*
        Start viewer tracking.
      */

      this.startViewerPresence(
        channel
      );


      const name =
        channel.name ||
        "Criczone Live";


      const channelNameDisplay =
        this.shadow.getElementById(
          "channelNameDisplay"
        );


      const playerChannelName =
        this.shadow.getElementById(
          "playerChannelName"
        );


      if (channelNameDisplay) {
        channelNameDisplay.textContent =
          name;
      }


      if (playerChannelName) {
        playerChannelName.textContent =
          name;
      }


      /*
        IMPORTANT:
        Existing stream links are preserved.
      */

      const source =
        channel.iframeSrc ||
        channel.stream_url ||
        channel.url ||
        "";


      const iframe =
        this.shadow.getElementById(
          "streamIframe"
        );


      if (iframe) {
        iframe.src =
          source;
      }


      /*
        Hide hub.
      */

      this.shadow
        .getElementById("hubView")
        .classList.add("hidden");


      /*
        Show player.
      */

      this.shadow
        .getElementById("playerView")
        .classList.add("active");


      /*
        Update URL.
      */

      try {

        const url =
          new URL(
            window.location.href
          );


        url.searchParams.set(
          "id",
          channel.id
        );


        window.history.replaceState(
          {},
          "",
          url
        );

      } catch (error) {}


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =========================================
       SHOW HUB
    ========================================= */

    showHub() {

      /*
        Stop viewer count.
      */

      this.stopViewerPresence();


      const iframe =
        this.shadow.getElementById(
          "streamIframe"
        );


      if (iframe) {
        iframe.src = "";
      }


      this.state.currentChannel =
        null;


      this.shadow
        .getElementById("playerView")
        .classList.remove("active");


      this.shadow
        .getElementById("hubView")
        .classList.remove("hidden");


      try {

        const url =
          new URL(
            window.location.href
          );


        url.searchParams.delete(
          "id"
        );


        window.history.replaceState(
          {},
          "",
          url
        );

      } catch (error) {}


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =========================================
       SHARE
    ========================================= */

    async shareChannel() {

      const channel =
        this.state.currentChannel;


      if (!channel) {
        return;
      }


      const url =
        new URL(
          window.location.href
        );


      url.searchParams.set(
        "id",
        channel.id
      );


      const shareUrl =
        url.toString();


      if (navigator.share) {

        try {

          await navigator.share({

            title:
              `Criczone Live — ${
                channel.name ||
                "Live Channel"
              }`,

            url:
              shareUrl

          });

        } catch (error) {}

        return;

      }


      try {

        await navigator.clipboard.writeText(
          shareUrl
        );


        this.showToast(
          "Stream link copied!"
        );

      } catch (error) {

        this.showToast(
          shareUrl
        );

      }

    }

    openModal() {

      const modal =
        this.shadow.getElementById(
          "telegramModal"
        );


      if (modal) {
        modal.classList.add("show");
      }

    }


    closeModal() {

      const modal =
        this.shadow.getElementById(
          "telegramModal"
        );


      if (modal) {
        modal.classList.remove("show");
      }

    }


    /* =========================================
       TOAST
    ========================================= */

    showToast(message) {

      const toast =
        this.shadow.getElementById(
          "toast"
        );


      if (!toast) {
        return;
      }


      toast.textContent =
        message;


      toast.classList.add(
        "show"
      );


      clearTimeout(
        this.toastTimer
      );


      this.toastTimer =
        setTimeout(
          () => {

            toast.classList.remove(
              "show"
            );

          },
          2500
        );

    }


    /* =========================================
       ERROR
    ========================================= */

    showError(message) {

      const grid =
        this.shadow.getElementById(
          "channelsGrid"
        );


      if (!grid) {
        return;
      }


      grid.innerHTML = `

        <div class="loading">

          <div style="font-size:32px">
            ⚠️
          </div>

          <span>
            ${this.escapeHTML(message)}
          </span>

          <button
            id="retryButton"
            style="
              margin-top:5px;
              padding:10px 16px;
              border:0;
              border-radius:10px;
              background:#3e72e8;
              color:white;
              font-size:11px;
              font-weight:700;
              cursor:pointer;
            "
          >
            RETRY
          </button>

        </div>

      `;


      const retry =
        this.shadow.getElementById(
          "retryButton"
        );


      if (retry) {

        retry.onclick =
          () =>
            this.loadChannelsData();

      }

    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    escapeHTML(value) {

      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* =========================================
       ESCAPE ATTRIBUTE
    ========================================= */

    escapeAttr(value) {

      return this.escapeHTML(
        value ?? ""
      );

    }


    /* =========================================
       DISCONNECTED
    ========================================= */

    disconnectedCallback() {

      this.stopViewerPresence();

    }

  }


  /* =========================================
     CUSTOM ELEMENT
  ========================================= */

  customElements.define(
    "criczone-ui",
    CriczoneUI
  );

})();
</script>

</body>
</html>
