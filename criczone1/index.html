<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#070b09">
    <title>CRICKCAST — Live Channels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #070b09;
            --panel: #111a14;
            --line: #223129;
            --green: #10b981;
            --mint: #34d399;
            --text: #edf5f0;
            --muted: #8a9a90
        }

        body {
            background: radial-gradient(ellipse at 50% -15%, #10b98126, transparent 55%), var(--bg);
            color: var(--text);
            font-family: Manrope, system-ui, sans-serif;
            min-height: 100vh
        }

        button,
        input {
            font: inherit
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: var(--bg);
            color: var(--muted);
            font-size: 13px
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #1b2a21;
            border-top-color: var(--mint);
            border-radius: 50%;
            animation: spin .8s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        #app {
            display: none;
            min-height: 100vh
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #070b09ed;
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #ffffff0c;
            padding: 16px clamp(14px, 4vw, 48px)
        }

        .toprow {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 1500px;
            margin: auto
        }

        .brand {
            font-family: Archivo, sans-serif;
            font-size: clamp(20px, 3vw, 27px);
            font-weight: 900;
            letter-spacing: 2px;
            color: white;
            white-space: nowrap
        }

        .brand span {
            color: var(--mint)
        }

        .live {
            font-size: 9px;
            letter-spacing: 1px;
            font-weight: 900;
            color: #ff8989;
            border: 1px solid #673333;
            background: #2a1212;
            border-radius: 20px;
            padding: 5px 8px
        }

        .spacer {
            flex: 1
        }

        .tg {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 10px;
            background: linear-gradient(135deg, #20a7e8, #1476bb);
            color: white;
            text-decoration: none;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap
        }

        .tg svg {
            width: 17px;
            height: 17px;
            fill: currentColor
        }

        main {
            max-width: 1500px;
            margin: auto;
            padding: 22px clamp(14px, 4vw, 48px) 45px
        }

        .intro {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 14px;
            margin: 4px 0 18px
        }

        h1 {
            font-family: Archivo, sans-serif;
            font-size: clamp(22px, 4vw, 32px);
            font-weight: 900
        }

        .subtitle {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px
        }

        #count {
            color: var(--muted);
            font-size: 11px;
            white-space: nowrap
        }

        .searchbox {
            position: relative;
            margin-bottom: 12px
        }

        .searchbox span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #7b8b81
        }

        #search {
            width: 100%;
            padding: 13px 42px;
            border-radius: 12px;
            background: #101712;
            border: 1px solid var(--line);
            outline: none;
            color: white;
            font-size: 13px
        }

        #search:focus {
            border-color: var(--green)
        }

        #clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            background: none;
            border: 0;
            color: #a9b6ae;
            padding: 6px;
            cursor: pointer
        }

        #filters {
            display: flex;
            gap: 8px;
            overflow: auto;
            padding: 4px 0 14px;
            scrollbar-width: none
        }

        #filters::-webkit-scrollbar {
            display: none
        }

        .pill {
            border: 1px solid var(--line);
            border-radius: 30px;
            background: #101712;
            color: #a0afa5;
            padding: 8px 13px;
            white-space: nowrap;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .5px;
            cursor: pointer
        }

        .pill.active {
            color: #04130d;
            border-color: transparent;
            background: linear-gradient(135deg, var(--green), var(--mint))
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 15px
        }

        .card {
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 15px;
            background: linear-gradient(160deg, #142019, #0c120e);
            cursor: pointer;
            transition: transform .18s, border-color .18s
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #27784f
        }

        .poster {
            aspect-ratio: 16/9;
            position: relative;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: linear-gradient(135deg, #14261b, #0b120e)
        }

        .poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        .poster:after {
            content: '▶';
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 25px;
            color: var(--mint);
            background: linear-gradient(180deg, #0000, #0007);
            pointer-events: none
        }

        .fallback {
            font-family: Archivo, sans-serif;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--mint)
        }

        .cardbody {
            padding: 12px 13px 14px
        }

        .channelname {
            font-size: 13px;
            font-weight: 800;
            line-height: 1.4;
            overflow-wrap: anywhere
        }

        .category {
            margin-top: 7px;
            font-size: 9px;
            letter-spacing: .9px;
            font-weight: 800;
            color: var(--muted);
            text-transform: uppercase
        }

        #empty {
            display: none;
            text-align: center;
            color: var(--muted);
            padding: 60px 15px;
            font-size: 13px
        }

        footer {
            border-top: 1px solid #ffffff0c;
            padding: 20px 16px;
            text-align: center;
            color: #68786e;
            font-size: 11px
        }

        footer a {
            color: var(--mint);
            text-decoration: none
        }

        #player {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 30;
            background: #000
        }

        #frame {
            width: 100%;
            height: 100%;
            border: 0;
            background: #000
        }

        .playerbar {
            position: absolute;
            z-index: 2;
            top: max(12px, env(safe-area-inset-top));
            left: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none
        }

        .playerbar button,
        .playertitle {
            pointer-events: auto;
            background: #050805d9;
            color: white;
            border: 1px solid #ffffff25;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 12px
        }

        .playerbar button {
            cursor: pointer;
            font-weight: 800
        }

        .playertitle {
            margin-left: auto;
            max-width: 65%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        #error {
            max-width: 650px;
            padding: 20px;
            line-height: 1.7;
            text-align: center
        }

        #error strong {
            display: block;
            color: #ff8585;
            margin-bottom: 8px
        }

        #retry {
            display: block;
            margin: 14px auto 0;
            border: 0;
            border-radius: 9px;
            padding: 10px 16px;
            background: var(--mint);
            color: #04130d;
            font-weight: 900;
            cursor: pointer
        }

        @media(max-width:560px) {
            .topbar {
                padding: 14px
            }

            .tg {
                padding: 9px 10px;
                font-size: 11px
            }

            .tglabel {
                display: none
            }

            main {
                padding-top: 17px
            }

            #grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px
            }

            .cardbody {
                padding: 9px
            }

            .channelname {
                font-size: 11px
            }

            .category {
                font-size: 8px
            }
        }
    </style>

</head>

<body>
    <div id="loading">
        <div class="spinner"></div>
        <div id="loadingText">Loading CRICKCAST channels…</div>
    </div>
    <div id="app">
        <header class="topbar">
            <div class="toprow">
                <div class="brand">CRICK<span>CAST</span></div><span class="live">● LIVE</span>
                <div class="spacer"></div>
                <a class="tg" href="https://t.me/crickcast18" target="_blank" rel="noopener noreferrer"
                    aria-label="Join CRICKCAST on Telegram">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M23.05 2.1 19.6 21.3c-.26 1.15-.94 1.43-1.9.9l-5.26-3.88-2.54 2.45c-.28.28-.52.52-1.06.52l.38-5.4L19.9 5.8c.46-.4-.1-.63-.72-.23L7.5 13.03l-5.24-1.64c-1.14-.36-1.16-1.14.24-1.68L21.6.9c.95-.36 1.78.23 1.45 1.2z" />
                    </svg><span class="tglabel">Join Telegram</span></a>
            </div>
        </header>
        <main>
            <div class="intro">
                <div>
                    <h1>Live Channels</h1>
                    <p class="subtitle">Your matchday starts here.</p>
                </div>
                <div id="count">0 channels</div>
            </div>
            <div class="searchbox"><span>⌕</span><input id="search" type="search"
                    placeholder="Search channels or categories…" autocomplete="off"><button id="clear" type="button"
                    aria-label="Clear search">✕</button></div>
            <nav id="filters" aria-label="Channel categories"></nav>
            <section id="grid" aria-label="Available channels"></section>
            <div id="empty">📺<br><br>No channels match your search.</div>
        </main>
        <footer>Made for cricket fans · <a href="https://t.me/crickcast18" target="_blank"
                rel="noopener noreferrer">Join CRICKCAST on Telegram ↗</a></footer>
    </div>
    <section id="player"><iframe id="frame" title="CRICKCAST player"
            allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen
            referrerpolicy="no-referrer"></iframe>
        <div class="playerbar"><button id="back" type="button">← All channels</button>
            <div class="playertitle" id="playerTitle"></div>
        </div>
    </section>
    <script>
        (() => {
            'use strict';
            const JSON_URLS = ['https://sportlink-json.pages.dev/id.json'];
            const FETCH_TIMEOUT = 10000, $ = id => document.getElementById(id);
            let channels = [], activeCategory = 'All', query = '';
            function normalize(raw) { if (Array.isArray(raw)) return raw; if (!raw || typeof raw !== 'object') return []; if (Array.isArray(raw.iframes)) return raw.iframes; if (Array.isArray(raw.channels)) return raw.channels; if (Array.isArray(raw.data)) return raw.data; return [raw] }
            async function fetchJson(url) { const controller = new AbortController(), timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT); try { const r = await fetch(url, { cache: 'no-store', headers: { Accept: 'application/json' }, signal: controller.signal }); if (!r.ok) throw Error('HTTP ' + r.status); return await r.json() } finally { clearTimeout(timer) } }
            function toChannel(x) { if (!x || x.id == null || !x.name || !x.iframeSrc) return null; return { id: String(x.id), name: String(x.name), iframeSrc: String(x.iframeSrc), category: String(x.category || 'General'), logo: String(x.logourl || x.logo || x.logoUrl || '') } }
            async function loadChannels() { const results = await Promise.allSettled(JSON_URLS.map(fetchJson)), seen = new Set(), out = [], errors = []; results.forEach((r, i) => { if (r.status === 'rejected') { const e = r.reason; errors.push(JSON_URLS[i] + ' — ' + (e?.name === 'AbortError' ? 'timed out' : e?.message || 'failed')); return } normalize(r.value).forEach(x => { const c = toChannel(x); if (c && !seen.has(c.id)) { seen.add(c.id); out.push(c) } }) }); if (!out.length) throw Error('No valid channels could be loaded. ' + errors.join(' | ')); return out }
            function esc(v) { return String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }
            function renderFilters() { const cats = ['All', ...Array.from(new Set(channels.map(c => c.category).filter(c => c && c !== 'General'))).sort()]; $('filters').innerHTML = cats.map(c => '<button type="button" class="pill ' + (c === activeCategory ? 'active' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>').join(''); $('filters').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { activeCategory = b.dataset.cat; renderFilters(); render() })) }
            function render() { const q = query.trim().toLowerCase(), list = channels.filter(c => (activeCategory === 'All' || c.category === activeCategory) && (!q || c.name.toLowerCase().includes(q) || c.category.toLowerCase().includes(q))); $('count').textContent = list.length + (list.length === 1 ? ' channel' : ' channels'); $('empty').style.display = list.length ? 'none' : 'block'; $('grid').style.display = list.length ? 'grid' : 'none'; $('grid').innerHTML = list.map(c => '<article class="card" tabindex="0" role="button" aria-label="Play ' + esc(c.name) + '" data-id="' + esc(c.id) + '"><div class="poster">' + (c.logo ? '<img loading="lazy" src="' + esc(c.logo) + '" alt="' + esc(c.name) + '" onerror="this.remove()">' : '<span class="fallback">CC</span>') + '</div><div class="cardbody"><div class="channelname">' + esc(c.name) + '</div>' + (c.category !== 'General' ? '<div class="category">' + esc(c.category) + '</div>' : '') + '</div></article>').join(''); $('grid').querySelectorAll('.card').forEach(card => { const play = () => { const c = channels.find(x => x.id === card.dataset.id); if (c) openPlayer(c) }; card.addEventListener('click', play); card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play() } }) }) }
            function openPlayer(c, push = true) { let url; try { url = new URL(c.iframeSrc, location.href); if (!['https:', 'http:'].includes(url.protocol)) throw Error() } catch { showError('This channel has an invalid player URL.'); return } if (push) { const next = new URL(location.href); next.searchParams.set('id', c.id); history.pushState({ id: c.id }, '', next) } $('playerTitle').textContent = c.name; $('frame').src = url.href; $('player').style.display = 'block'; $('app').style.display = 'none'; document.title = 'CRICKCAST · ' + c.name }
            function closePlayer(push = true) { $('frame').src = 'about:blank'; $('player').style.display = 'none'; $('app').style.display = 'block'; document.title = 'CRICKCAST — Live Channels'; if (push) { const next = new URL(location.href); next.searchParams.delete('id'); history.pushState({}, '', next) } }
            function route() { const id = new URLSearchParams(location.search).get('id'), c = channels.find(x => x.id === id); if (c) openPlayer(c, false); else closePlayer(false) }
            function showError(msg) { $('loadingText').innerHTML = '<div id="error"><strong>Unable to load channels</strong>' + esc(msg) + '<br><button id="retry" type="button">Try again</button></div>'; $('retry').addEventListener('click', () => location.reload()) }
            $('search').addEventListener('input', e => { query = e.target.value; $('clear').style.display = query ? 'block' : 'none'; render() }); $('clear').addEventListener('click', () => { $('search').value = ''; query = ''; $('clear').style.display = 'none'; render(); $('search').focus() }); $('back').addEventListener('click', () => closePlayer(true)); window.addEventListener('popstate', route);
            (async () => { try { channels = await loadChannels(); renderFilters(); render(); $('loading').style.display = 'none'; $('app').style.display = 'block'; route() } catch (e) { showError(e?.message || 'Unexpected error') } })();
        })();
    </script>

</body>
