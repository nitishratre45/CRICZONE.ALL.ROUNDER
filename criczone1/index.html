<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050a0f">
<title>CRICZONE 1 · LIVE CHANNELS</title>
<style>
:root{--bg:#050a0f;--panel:#0a141e;--text:#f4f8fb;--muted:#8fa2b1;--accent:#00f5c8;--accent2:#2fa7ff;--border:rgba(0,245,200,.16)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0%,rgba(0,245,200,.09),transparent 28%),radial-gradient(circle at 90% 10%,rgba(47,167,255,.08),transparent 25%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
body{padding:24px}
.wrap{width:min(1500px,100%);margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.brand{font-size:28px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:5px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge,.btn{height:40px;border-radius:12px;border:1px solid var(--border);background:rgba(7,18,28,.82);color:var(--text);padding:0 14px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.badge{color:var(--accent)}
.btn{cursor:pointer;text-decoration:none}.btn:hover{border-color:rgba(0,245,200,.45)}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.search{flex:1;min-width:240px;height:48px;border:1px solid var(--border);background:rgba(7,18,28,.82);border-radius:13px;color:#fff;padding:0 15px;outline:none}
.search:focus{border-color:rgba(0,245,200,.55);box-shadow:0 0 0 3px rgba(0,245,200,.07)}
.count{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}
.card{position:relative;overflow:hidden;border:1px solid rgba(120,160,190,.18);background:linear-gradient(145deg,rgba(12,25,37,.95),rgba(5,14,22,.94));border-radius:16px;padding:18px;cursor:pointer;min-height:128px;transition:.2s transform,.2s border-color,.2s box-shadow}
.card:hover{transform:translateY(-3px);border-color:rgba(0,245,200,.38);box-shadow:0 18px 40px rgba(0,0,0,.32)}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--accent),transparent)}
.title{font-size:16px;font-weight:900;line-height:1.3;margin-bottom:14px}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px}
.live{color:var(--accent);font-weight:900}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
.overlay.show{display:flex}
.modal{width:min(1200px,100%);height:min(760px,90vh);background:#03080d;border:1px solid rgba(0,245,200,.24);border-radius:18px;overflow:hidden;box-shadow:0 30px 100px rgba(0,0,0,.55);display:flex;flex-direction:column}
.modal-head{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid rgba(255,255,255,.07);background:#07111a}
.now{font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:12px}
.close{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#0c1823;color:#fff;font-size:20px;cursor:pointer}
.frame-wrap{flex:1;background:#000;position:relative}
.frame-wrap iframe{width:100%;height:100%;border:0;background:#000}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9db0bd;background:#000;z-index:2}
.loading.hide{display:none}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:700px){body{padding:14px}.brand{font-size:23px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:14px;min-height:112px}.title{font-size:14px}.modal{height:86vh;border-radius:14px}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.toolbar{display:block}.search{width:100%;margin-bottom:9px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="brand">CRIC<span>ZONE</span> 1</div>
      <div class="sub">Live channel directory powered by your Cloudflare channel API.</div>
    </div>
    <div class="actions">
      <div class="badge" id="status">LOADING…</div>
      <a class="btn" href="https://criczone.pages-1.workers.dev/channels" target="_blank" rel="noopener">API</a>
    </div>
  </div>

  <div class="toolbar">
    <input id="search" class="search" placeholder="Search channels…">
    <div class="count" id="count">Loading channels…</div>
  </div>

  <div id="grid" class="grid"><div class="empty">Loading channels…</div></div>
</div>

<div id="overlay" class="overlay" aria-hidden="true">
  <div class="modal">
    <div class="modal-head">
      <div id="now" class="now">Live Channel</div>
      <button id="close" class="close" type="button" aria-label="Close player">×</button>
    </div>
    <div class="frame-wrap">
      <div id="loading" class="loading">Loading player…</div>
      <iframe id="player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"></iframe>
    </div>
  </div>
</div>

<script>
const API_URL="https://criczone.pages-1.workers.dev/channels";
const grid=document.getElementById("grid"), search=document.getElementById("search"), count=document.getElementById("count"), status=document.getElementById("status"), overlay=document.getElementById("overlay"), player=document.getElementById("player"), now=document.getElementById("now"), loading=document.getElementById("loading");

let channels=[];
let filtered=[];

function normalize(x,i){
  return {
    id:x?.id ?? String(i+1),
    name:x?.name || x?.channel || ("Channel "+(i+1)),
    type:x?.type || "iframe",
    src:x?.iframeSrc || x?.url || x?.src || ""
  };
}

function render(){
  const q=search.value.trim().toLowerCase();
  filtered=channels.filter(c => c.name.toLowerCase().includes(q) || c.id.toLowerCase().includes(q));
  count.textContent=`${filtered.length} of ${channels.length} channels`;
  if(!filtered.length){grid.innerHTML='<div class="empty">No channels found.</div>';return;}
  grid.innerHTML="";
  const frag=document.createDocumentFragment();
  filtered.forEach((c,idx)=>{
    const el=document.createElement("button");
    el.type="button";
    el.className="card";
    el.innerHTML=`<div class="title">${escapeHtml(c.name)}</div><div class="meta"><span>${escapeHtml(c.type)}</span><span class="live">LIVE · ${String(idx+1).padStart(2,"0")}</span></div>`;
    el.addEventListener("click",()=>openPlayer(c));
    frag.appendChild(el);
  });
  grid.appendChild(frag);
}

function escapeHtml(s){
  return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function openPlayer(c){
  if(!c.src){alert("No player URL available for this channel.");return;}
  now.textContent=c.name;
  loading.classList.remove("hide");
  player.src=c.src;
  overlay.classList.add("show");
  overlay.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
}

function closePlayer(){
  player.src="about:blank";
  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
}

player.addEventListener("load",()=>loading.classList.add("hide"));
document.getElementById("close").addEventListener("click",closePlayer);
overlay.addEventListener("click",e=>{if(e.target===overlay)closePlayer();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePlayer();});
search.addEventListener("input",render);

async function load(){
  try{
    const res=await fetch(API_URL,{cache:"no-store"});
    if(!res.ok) throw new Error("API "+res.status);
    const data=await res.json();
    const list=Array.isArray(data?.iframes)?data.iframes:[];
    channels=list.map(normalize).filter(x=>x.src);
    status.textContent=`${channels.length} LIVE CHANNELS`;
    render();
  }catch(err){
    console.error(err);
    status.textContent="API ERROR";
    grid.innerHTML='<div class="empty">Unable to load channels right now.</div>';
    count.textContent="API unavailable";
  }
}
load();
</script>
</body>
</html>
