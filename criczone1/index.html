  <meta

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Criczone Live — Premium Cricket Hub</title>

  <meta name="theme-color" content="#050812">
  <meta name="referrer" content="no-referrer">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link

<body>

  <criczone-ui></criczone-ui>

          super();

          this.shadow = this.attachShadow({
            mode: "open"
          });

          this.config = {

            telegramLink:
              "https://t.me/+MueCDjlpoS8yNmJl",

            jsonUrl:
              "https://allrounderid2.pages.dev/id.json"

          };

          this.state = {

            channels: [],

            filteredChannels: [],

            currentChannel: null

          };

          /* =====================================================
             LIVE WATCHING
          ===================================================== */

          this.BASE_WATCHING = 345;

          this.viewerRef = null;

          this.viewerListener = null;

          this.viewerChannelId = null;

          this.firebaseDB = null;

          this.firebaseReady = false;

        }


        connectedCallback() {

          this.render();

          this.initEvents();

          this.initFirebaseViewers();

          this.loadChannelsData();

        }

          root
            .getElementById("backBtn")
            .addEventListener(
              "click",
              () => this.showHub()
            );


          root
            .getElementById("shareBtn")
            .addEventListener(
              "click",
              () => this.shareChannel()
            );


          root
            .getElementById("searchInput")
            .addEventListener(
              "input",
              event =>
                this.filterChannels(
                  event.target.value
                )
            );


          root
            .getElementById("floatTelegram")
            .addEventListener(
              "click",
              () => this.openTelegram()
            );


          root
            .getElementById("modalClose")
            .addEventListener(
              "click",
              () => this.closeModal()
            );


          root
            .getElementById("modalJoin")
            .addEventListener(
              "click",
              () => this.openTelegram()
            );


          root
            .getElementById("telegramModal")
            .addEventListener(
              "click",
              event => {

                if (

                  "telegramModal"
                ) {

                  this.closeModal();

                }

              }
            );

        /* =====================================================
           FIREBASE VIEWER PRESENCE
        ===================================================== */

        async initFirebaseViewers() {

          try {

              initializeApp
            } = await import(
              "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js"
            );


            const {
              getDatabase,
              ref,
              push,
              set,
              remove,
              onDisconnect,
              onValue
            } = await import(
              "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js"
            );


            const firebaseConfig = {

              apiKey:
                "AIzaSyDm3DIHJfRPEqNqrUlYJutRQm8XIA6H3fs",

              authDomain:
                "cricket-live-39106.firebaseapp.com",

              databaseURL:
                "https://cricket-live-39106-default-rtdb.asia-southeast1.firebasedatabase.app",

              projectId:
                "cricket-live-39106",

              storageBucket:
                "cricket-live-39106.firebasestorage.app",

              messagingSenderId:
                "841890143",

              appId:
                "1:841890143:web:ca5b87c9395bdc19145eea",

              measurementId:
                "G-ZNEZC8YVMX"

            };


            this.firebaseApp =
              initializeApp(
                firebaseConfig
              );


            this.firebaseDB =
              getDatabase(
                this.firebaseApp
              );


            /*
              Save Firebase functions
              so other class methods
              can use them.
            */

            this.firebaseRef =
              ref;

            this.firebasePush =
              push;

            this.firebaseSet =
              set;

            this.firebaseRemove =
              remove;

            this.firebaseOnDisconnect =
              onDisconnect;

            this.firebaseOnValue =
              onValue;


            this.firebaseReady =
              true;


          } catch (error) {

            console.warn(
              "Firebase initialization failed:",
              error
            );

            this.firebaseReady =
              false;

          }

        }


        /* =====================================================
           LOAD JSON
        ===================================================== */

        async loadChannelsData() {

          let data = null;


          try {

            const response =
              await fetch(
                this.config.jsonUrl,
                {
                  cache:
                    "no-store"
                }
              );


            if (response.ok) {

              data =
                await response.json();

            }

          } catch (error) {

            console.warn(
              "Direct JSON fetch failed:",
              error
            );

          }


          /*
             Fallback
          */

          if (!data) {

            try {

              const proxy =
                "https://api.allorigins.win/raw?url=" +
                encodeURIComponent(
                  this.config.jsonUrl
                );


              const response =
                await fetch(
                  proxy,
                  {
                    cache:
                      "no-store"
                  }
                );


              if (response.ok) {

                data =
                  await response.json();

              }

            } catch (error) {

              console.warn(
                "Fallback fetch failed:",
                error
              );

            }

          }


          if (!data) {

            this.showError(
              "Failed to load channels."
            );

            return;

          }


          /*
             Supports:

             [
               {...}
             ]

             OR

             {
               "channels": [...]
             }

             OR

             {
               "streams": [...]
             }

             OR

             {
               "iframes": [...]
             }
          */

          const channels =
            Array.isArray(data)
              ? data
              : (
                  data.channels ||
                  data.streams ||
                  data.iframes ||
                  []
                );


          this.state.channels =
            channels;


          this.state.filteredChannels =
            channels;


          this.renderChannels(
            channels
          );


          /*
             Deep link:

             ?id=eng

             ?id=143
          */

          const params =
            new URLSearchParams(
              window.location.search
            );


          const targetId =
            params.get("id");


          if (targetId) {

            const matched =
              this.state.channels.find(
                channel =>
                  String(channel.id) ===
                  String(targetId)
              );


            if (matched) {

              this.playChannel(
                matched
              );

            }

          }

        }

                /* =====================================================
           RENDER CHANNELS
        ===================================================== */

        renderChannels(channels) {

          const grid =
            this.shadow.getElementById(
              "channelsGrid"
            );


          const count =
            this.shadow.getElementById(
              "channelCount"
            );


          count.textContent =
            `${channels.length} channel${channels.length === 1 ? "" : "s"} available`;


          if (!channels.length) {

            grid.innerHTML = `

              <div class="loading">

                <div style="
                  font-size:28px;
                ">
                  🔎
                </div>

                <span>
                  No channels found.
                </span>

              </div>

            `;

            return;

          }


          grid.innerHTML =
            channels
              .map(
                (channel, index) => {

                  const name =
                    this.escapeHTML(
                      channel.name ||
                      `Channel ${channel.id || index + 1}`
                    );


                  const id =
                    this.escapeAttr(
                      channel.id ??
                      index
                    );


                  return `

                    <div
                      class="channel-card"
                      data-channel-id="${id}"
                      style="
                        animation-delay:
                        ${Math.min(
                          index * 25,
                          450
                        )}ms
                      "
                    >

                      <div class="channel-top">

                        <div class="channel-icon">
                          📺
                        </div>

                        <div class="channel-live">
                          LIVE
                        </div>

                      </div>


                      <div class="channel-bottom">

                        <div class="channel-name">
                          ${name}
                        </div>

                        <div class="watch-arrow">
                          →
                        </div>

                      </div>

                    </div>

                  `;

                }
              )
              .join("");


          /*
             Click handling
          */

          grid.onclick =
            event => {

              const card =
                event.target.closest(
                  "[data-channel-id]"
                );


              if (!card) return;


              const id =
                card.dataset.channelId;


              const channel =
                this.state.channels.find(
                  item =>
                    String(item.id) ===
                    String(id)
                );


              if (channel) {

                this.playChannel(
                  channel
                );

              }

            };

        }


        /* =====================================================
           SEARCH
        ===================================================== */

        filterChannels(query) {

          const value =
            query
              .trim()
              .toLowerCase();


          const filtered =
            this.state.channels.filter(
              channel => {

                const name =
                  String(
                    channel.name || ""
                  ).toLowerCase();


                return name.includes(
                  value
                );

              }
            );


          this.state.filteredChannels =
            filtered;


          this.renderChannels(
            filtered
          );

        }


        /* =====================================================
           LIVE VIEWER PRESENCE
        ===================================================== */

        async startViewerPresence(channel) {

          /*
             Firebase may still be loading
             when a channel is opened.
          */

          if (!this.firebaseReady) {

            this.updateLiveWatching(0);

            /*
              Give Firebase a little time to initialize.
            */

            for (
              let i = 0;
              i < 20 &&
              !this.firebaseReady;
              i++
            ) {

              await new Promise(
                resolve =>
                  setTimeout(
                    resolve,
                    250
                  )
              );

            }

          }


          if (!this.firebaseReady) {

            this.updateLiveWatching(0);

            return;

          }


          /*
             Remove previous viewer presence
             before creating a new one.
          */

          this.stopViewerPresence();


          if (!channel) {

            return;

          }


          const channelId =
            String(
              channel.id ??
              channel.name ??
              "unknown"
            );


          this.viewerChannelId =
            channelId;


          try {

            const viewersRef =
              this.firebaseRef(
                this.firebaseDB,
                "liveViewers/" +
                this.safeFirebaseKey(
                  channelId
                )
              );


            const viewerRef =
              this.firebasePush(
                viewersRef
              );


            this.viewerRef =
              viewerRef;


            /*
               Add this viewer.
            */

            await this.firebaseSet(
              viewerRef,
              {
                joinedAt:
                  Date.now()
              }
            );


            /*
               Automatically remove this viewer
               when browser/tab disconnects.
            */

            await this.firebaseOnDisconnect(
              viewerRef
            ).remove();


            /*
               Listen for all viewers
               watching the same channel.
            */

            this.viewerListener =
              this.firebaseOnValue(
                viewersRef,
                snapshot => {

                  const data =
                    snapshot.val() || {};


                  const realViewers =
                    Object.keys(
                      data
                    ).length;


                  this.updateLiveWatching(
                    realViewers
                  );

                },
                error => {

                  console.warn(
                    "Viewer listener error:",
                    error
                  );

                  this.updateLiveWatching(
                    0
                  );

                }
              );


          } catch (error) {

            console.warn(
              "Viewer presence error:",
              error
            );


            this.updateLiveWatching(
              0
            );

          }

        }


        /* =====================================================
           STOP VIEWER PRESENCE
        ===================================================== */

        stopViewerPresence() {

          try {

            /*
               Stop Firebase listener.
            */

            if (
              this.viewerListener
            ) {

              this.viewerListener();

              this.viewerListener =
                null;

            }


            /*
               Remove current viewer node.
            */

            if (
              this.viewerRef &&
              this.firebaseRemove
            ) {

              this.firebaseRemove(
                this.viewerRef
              ).catch(
                () => {}
              );

            }


          } catch (error) {

            console.warn(
              "Viewer cleanup error:",
              error
            );

          }


          this.viewerRef =
            null;

          this.viewerChannelId =
            null;


          /*
             Reset UI back to base count.
          */

          this.updateLiveWatching(
            0
          );

        }


        /* =====================================================
           UPDATE LIVE WATCHING COUNT
        ===================================================== */

        updateLiveWatching(
          realViewers = 0
        ) {

          const counter =
            this.shadow.getElementById(
              "liveWatchingCount"
            );


          if (!counter) {

            return;

          }


          const total =
            this.BASE_WATCHING +
            Number(
              realViewers || 0
            );


          counter.textContent =
            total.toLocaleString(
              "en-IN"
            );

        }


        /* =====================================================
           FIREBASE SAFE KEY
        ===================================================== */

        safeFirebaseKey(value) {

          return String(value)
            .replace(
              /[.#$[\]/]/g,
              "_"
            );

        }


        /* =====================================================
           PLAY CHANNEL
        ===================================================== */

        playChannel(channel) {

          /*
             Start viewer presence
             for selected channel.
          */

          this.startViewerPresence(
            channel
          );


          this.state.currentChannel =
            channel;


          const name =
            channel.name ||
            "Criczone Live";


          this.shadow
            .getElementById(
              "channelNameDisplay"
            )
            .textContent =
            name;


          this.shadow
            .getElementById(
              "playerChannelName"
            )
            .textContent =
            name;


          /*
             Supports:

             iframeSrc
             stream_url
             url
          */

          const source =
            channel.iframeSrc ||
            channel.stream_url ||
            channel.url ||
            "";


          const iframe =
            this.shadow
              .getElementById(
                "streamIframe"
              );


          iframe.src =
            source;


          /*
             Hide hub
          */

          this.shadow
            .getElementById(
              "hubView"
            )
            .classList.add(
              "hidden"
            );


          /*
             Show player
          */

          this.shadow
            .getElementById(
              "playerView"
            )
            .classList.add(
              "active"
            );


          /*
             Update URL

             /CRICZONE/?id=eng
          */

          try {

            const url =
              new URL(
                window.location.href
              );


            url.searchParams.set(
              "id",
              channel.id
            );


            window.history.replaceState(
              {},
              "",
              url
            );

          } catch (error) {}


          window.scrollTo({

            top: 0,

            behavior: "smooth"

          });

        }


        /* =====================================================
           SHOW HUB
        ===================================================== */

        showHub() {

          /*
             Stop counting this viewer
             when leaving player.
          */

          this.stopViewerPresence();


          const iframe =
            this.shadow
              .getElementById(
                "streamIframe"
              );


          if (iframe) {

            iframe.src =
              "";

          }


          this.state.currentChannel =
            null;


          this.shadow
            .getElementById(
              "playerView"
            )
            .classList.remove(
              "active"
            );


          this.shadow
            .getElementById(
              "hubView"
            )
            .classList.remove(
              "hidden"
            );


          /*
             Remove ?id
          */

          try {

            const url =
              new URL(
                window.location.href
              );


            url.searchParams.delete(
              "id"
            );


            window.history.replaceState(
              {},
              "",
              url
            );

          } catch (error) {}


          window.scrollTo({

            top: 0,

            behavior: "smooth"

          });

        }


        /* =====================================================
           SHARE
        ===================================================== */

        async shareChannel() {

          const channel =
            this.state.currentChannel;


          if (!channel) {

            return;

          }


          const url =
            new URL(
              window.location.href
            );


          url.searchParams.set(
            "id",
            channel.id
          );


          const shareUrl =
            url.toString();


          if (
            navigator.share
          ) {

            try {

              await navigator.share({

                title:
                  `Criczone Live — ${channel.name || "Live Channel"}`,

                url:
                  shareUrl

              });

            } catch (error) {}

            return;

          }


          try {

            await navigator.clipboard.writeText(
              shareUrl
            );


            this.showToast(
              "Stream link copied!"
            );

          } catch (error) {

            this.showToast(
              shareUrl
            );

          }

        }


        /* =====================================================
           TELEGRAM
        ===================================================== */

        openTelegram() {

          window.open(
            this.config.telegramLink,
            "_blank",
            "noopener,noreferrer"
          );


          this.closeModal();

        }


        openModal() {

          this.shadow
            .getElementById(
              "telegramModal"
            )
            .classList.add(
              "show"
            );

        }


        closeModal() {

          this.shadow
            .getElementById(
              "telegramModal"
            )
            .classList.remove(
              "show"
            );

        }


        /* =====================================================
           TOAST
        ===================================================== */

        showToast(message) {

          const toast =
            this.shadow
              .getElementById(
                "toast"
              );


          toast.textContent =
            message;


          toast.classList.add(
            "show"
          );


          clearTimeout(
            this.toastTimer
          );


          this.toastTimer =
            setTimeout(
              () => {

                toast.classList.remove(
                  "show"
                );

              },
              2500
            );

        }


        /* =====================================================
           ERROR
        ===================================================== */

        showError(message) {

          const grid =
            this.shadow
              .getElementById(
                "channelsGrid"
              );


          grid.innerHTML = `

            <div class="loading">

              <div style="
                font-size:32px;
              ">
                ⚠️
              </div>

              <span>
                ${this.escapeHTML(message)}
              </span>

              <button
                id="retryButton"
                style="
                  margin-top:5px;
                  padding:10px 16px;
                  border:0;
                  border-radius:10px;
                  background:#3e72e8;
                  color:white;
                  font-size:11px;
                  font-weight:700;
                  cursor:pointer;
                "
              >
                RETRY
              </button>

            </div>

          `;


          const retry =
            this.shadow
              .getElementById(
                "retryButton"
              );


          if (retry) {

            retry.onclick =
              () =>
                this.loadChannelsData();

          }

        }

                /* =====================================================
           ESCAPE HTML
        ===================================================== */

        escapeHTML(value) {

          return String(value)

            .replaceAll(
              "&",
              "&amp;"
            )

            .replaceAll(
              "<",
              "&lt;"
            )

            .replaceAll(
              ">",
              "&gt;"
            )

            .replaceAll(
              '"',
              "&quot;"
            )

            .replaceAll(
              "'",
              "&#039;"
            );

        }


        /* =====================================================
           ESCAPE ATTRIBUTE
        ===================================================== */

        escapeAttr(value) {

          return this.escapeHTML(
            value ?? ""
          );

        }


        /* =====================================================
           DISCONNECTED
        ===================================================== */

        disconnectedCallback() {

          /*
             Remove this viewer from
             Firebase when the component
             is removed from the page.
          */

          this.stopViewerPresence();

        }

      }


      /* =====================================================
         CUSTOM ELEMENT
      ===================================================== */

      customElements.define(
        "criczone-ui",
        CriczoneUI
      );


    })();

  </script>
