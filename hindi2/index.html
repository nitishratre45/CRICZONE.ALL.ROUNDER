<head>

    name="viewport"

<script src="https://cdn.jsdelivr.net/npm/shaka-player@5.1.10/dist/shaka-player.ui.min.js"></script>

    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/shaka-player@5.1.10/dist/controls.min.css"
>

<style>

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}

.shaka-video-container {
    width: 100%;
    height: 100%;
    background: #000;
}

#videoPlayer {
    width: 100%;
    height: 100%;
    background: #000;
    object-fit: contain;
}

</style>

</head>

<body>

<div
    id="videoContainer"
    class="shaka-video-container"
>

    <video
        id="videoPlayer"
        playsinline
        autoplay
        muted
    ></video>

</div>


<script>

const STREAM_URL =
    "https://jiotvmblive.cdn.jio.com/bpk-tv/Ten_3_MOB/WDVLive/index.mpd";


const DRM_KEYS =
    "68318f7c97c55ba6ab8d0398a88fed3e:d312fb3325b4eb9462b4a0d2b6794adf";


const COOKIE_JSON_URL =
    "https://sonujson-v4.pages.dev/Data/sports.json";


const CHANNEL_ID =
    "STEN3";


const videoElement =
    document.getElementById(
        "videoPlayer"
    );


const videoContainer =
    document.getElementById(
        "videoContainer"
    );


let player;
let ui;


function parseDrmKeys(value) {

    const clearKeys = {};

    const pairs =
        String(value || "")
            .split(",")
            .map(
                pair =>
                    pair.trim()
            )
            .filter(Boolean);


    for (
        const pair of pairs
    ) {

        const separator =
            pair.indexOf(":");


        if (
            separator === -1
        ) {

            console.warn(
                "Invalid DRM pair:",
                pair
            );

            continue;
        }


        const kid =
            pair
                .slice(
                    0,
                    separator
                )
                .trim()
                .toLowerCase();


        const key =
            pair
                .slice(
                    separator + 1
                )
                .trim()
                .toLowerCase();


        if (
            !kid ||
            !key
        ) {

            continue;
        }


        clearKeys[kid] =
            key;

    }


    return clearKeys;
}


async function getCookie() {

    const response =
        await fetch(
            COOKIE_JSON_URL,
            {
                method: "GET",
                cache: "no-store"
            }
        );


    if (
        !response.ok
    ) {

        throw new Error(
            "Cookie JSON request failed: " +
            response.status
        );

    }


    const data =
        await response.json();


    if (
        !data ||
        !Array.isArray(
            data.channels
        )
    ) {

        throw new Error(
            "Invalid JSON format."
        );

    }


    const channel =
        data.channels.find(
            item =>
                String(
                    item.id || ""
                )
                    .trim()
                    .toLowerCase() ===
                CHANNEL_ID
                    .toLowerCase()
        );


    if (!channel) {

        throw new Error(
            "Channel not found: " +
            CHANNEL_ID
        );

    }


    const cookie =
        String(
            channel.cookie || ""
        ).trim();


    if (!cookie) {

        throw new Error(
            "Cookie not found for " +
            CHANNEL_ID
        );

    }


    return cookie;
}


function configureStreamRequests(
    cookie
) {

    if (!cookie) {
        return;
    }


    const networkingEngine =
        player.getNetworkingEngine();


    if (!networkingEngine) {
        return;
    }


    networkingEngine.registerRequestFilter(
        (type, request) => {

            if (
                !request.uris ||
                !request.uris[0]
            ) {

                return;
            }


            request.headers =
                request.headers || {};


            request.headers["Cookie"] =
                cookie;


            const url =
                request.uris[0];


            if (
                (type === 0 || type === 1) &&
                !url.includes(
                    "__hdnea="
                ) &&
                !url.includes(
                    "__hdnea__"
                ) &&
                !url.includes(
                    "hdnts="
                )
            ) {

                request.uris[0] =
                    url +
                    (
                        url.includes("?")
                            ? "&"
                            : "?"
                    ) +
                    cookie;

            }

        }
    );
}


function configureDrm() {

    const clearKeys =
        parseDrmKeys(
            DRM_KEYS
        );


    player.configure({

        drm: {
            clearKeys:
                clearKeys
        },

        manifest: {
            defaultPresentationDelay: 5
        },

        streaming: {
            lowLatencyMode: true,
            bufferingGoal: 10,
            rebufferingGoal: 2,
            safeSeekOffset: 5
        }

    });
}


async function initPlayer() {

    try {

        shaka.polyfill.installAll();


        if (
            !shaka.Player
                .isBrowserSupported()
        ) {

            throw new Error(
                "This browser does not support Shaka Player."
            );

        }


        player =
            new shaka.Player();


        await player.attach(
            videoElement
        );


        ui =
            new shaka.ui.Overlay(
                player,
                videoContainer,
                videoElement
            );


        ui.configure({

            controlPanelElements: [
                "play_pause",
                "time_and_duration",
                "mute",
                "volume",
                "spacer",
                "quality",
                "picture_in_picture",
                "fullscreen"
            ]

        });


        player.addEventListener(
            "error",
            event => {

                console.error(
                    "Shaka Player Error:",
                    event.detail
                );

            }
        );


        const cookie =
            await getCookie();


        configureStreamRequests(
            cookie
        );


        configureDrm();


        await player.load(
            STREAM_URL
        );


        try {

            await videoElement.play();

        } catch (error) {

            console.log(
                "Autoplay blocked."
            );

        }


    } catch (error) {

        console.error(
            "Player initialization failed:",
            error
        );

    }

}


initPlayer();


window.addEventListener(
    "beforeunload",
    () => {

        if (player) {

            player.destroy()
                .catch(
                    () => {}
                );

        }

    }
);

</script>


<style>
/* CRICZONE premium player ambience + Telegram community popup */
:root{color-scheme:dark;--cz-accent:#27d7a1;--cz-blue:#50b7ff}
.shaka-video-container{background:radial-gradient(ellipse at top,#101b30 0%,#02040a 58%,#000 100%)}

.cz-tg-backdrop.cz-show{opacity:1;visibility:visible}

.cz-tg-backdrop.cz-show .cz-tg-card{transform:translateY(0) scale(1)}

.cz-tg-tag{margin:0 0 10px;color:#76edc6;font-size:11px;font-weight:800;letter-spacing:2.5px}

.cz-tg-card h2 span{color:#55c9ff}
.cz-tg-copy{margin:0 auto 24px;max-width:310px;color:#aebed1;font-size:14px;line-height:1.7}
.cz-tg-join{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:14px;color:#04111c;background:linear-gradient(100deg,#65edc3,#55caff);font-weight:900;text-decoration:none;box-shadow:0 10px 28px rgba(56,205,217,.2);transition:transform .2s,filter .2s}
.cz-tg-join:hover{transform:translateY(-2px);filter:brightness(1.06)}
.cz-tg-later{display:inline-block;margin-top:16px;padding:8px 12px;border:0;color:#94a8bd;background:transparent;font:600 13px system-ui,sans-serif;cursor:pointer}
.cz-tg-later:hover{color:#fff}
@media(max-width:480px){.cz-tg-card{padding:31px 21px 22px;border-radius:21px}.cz-tg-copy{font-size:13px}}
@media(prefers-reduced-motion:reduce){.cz-tg-backdrop,.cz-tg-card,.cz-tg-join{transition:none}}
</style>

<!-- CRICZONE Telegram popup, using the existing community link from other site folder -->
<div class="cz-tg-backdrop" id="czTelegramPopup" aria-hidden="true">
  <section class="cz-tg-card" role="dialog" aria-modal="true" aria-labelledby="czTgTitle">
    <button class="cz-tg-close" id="czTgClose" type="button" aria-label="Close popup">×</button>
    <div class="cz-tg-icon" aria-hidden="true">➤</div>
    <p class="cz-tg-tag">CRICZONE COMMUNITY</p>
    <h2 id="czTgTitle">Match updates. <span>One place.</span></h2>
    <p class="cz-tg-copy">Join our Telegram community for match updates and important announcements.</p>
    <a class="cz-tg-join" href="https://t.me/criczonelive" target="_blank" rel="noopener noreferrer">✈ Join Telegram</a>
    <button class="cz-tg-later" id="czTgLater" type="button">Maybe later</button>
  </section>
</div>
<script>
(function(){
  const popup=document.getElementById('czTelegramPopup');
  if(!popup)return;
  const closeBtn=document.getElementById('czTgClose');
  const laterBtn=document.getElementById('czTgLater');
  let showTimer;
  function closePopup(){
    popup.classList.remove('cz-show');
    popup.setAttribute('aria-hidden','true');
    try{sessionStorage.setItem('czTelegramDismissed','1')}catch(e){}
  }
  function showPopup(){
    try{if(sessionStorage.getItem('czTelegramDismissed')==='1')return}catch(e){}
    popup.classList.add('cz-show');
    popup.setAttribute('aria-hidden','false');
  }
  closeBtn.addEventListener('click',closePopup);
  laterBtn.addEventListener('click',closePopup);
  popup.addEventListener('click',e=>{if(e.target===popup)closePopup()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&popup.classList.contains('cz-show'))closePopup()});
  try{if(sessionStorage.getItem('czTelegramDismissed')!=='1')showTimer=setTimeout(showPopup,12000)}catch(e){showTimer=setTimeout(showPopup,12000)}
  window.addEventListener('pagehide',()=>clearTimeout(showTimer));
})();
</script>
