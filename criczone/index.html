    connectedCallback() {

        this.shadow.querySelector(
            "#navJoinBtn"
        ).href =
            window.CricConfig.telegramLink;


        this.checkUnlockStatus();

        this.initWarpField();

        this.initEventListeners();

        this.setupMessageListener();

        this.fetchChannels();

        window.addEventListener(
            "popstate",
            () => this.handleUrlRouting()
        );

    }


    disconnectedCallback() {

        if (this.animationFrameId) {

            cancelAnimationFrame(
                this.animationFrameId
            );

        }


        if (this.lockTimer) {

            clearTimeout(
                this.lockTimer
            );

        }

    }


    checkUnlockStatus() {

        const saved =
            localStorage.getItem(
                "criczone_unlocked_time"
            );


        if (saved) {

            if (

                Date.now() -
                parseInt(saved, 10)

                <

                24 *
                60 *
                60 *
                1000

            ) {

                this.isUnlocked =
                    true;

            } else {

                localStorage.removeItem(
                    "criczone_unlocked_time"
                );

            }

        }


        if (!this.isUnlocked) {

            setTimeout(() => {

                const desc =
                    this.shadow.querySelector(
                        "#tgModalDesc"
                    );


                const modal =
                    this.shadow.querySelector(
                        "#tgPremiumModal"
                    );


                if (desc) {

                    desc.innerText =
                        "Join our CRICZONE Telegram channel for 24-hour full access to uninterrupted HD live streams and updates.";

                }


                if (modal) {

                    modal.classList.add(
                        "show"
                    );

                }

            }, 200);

        }

    }


    async fetchChannels() {

        const grid =
            this.shadow.querySelector(
                "#channels-grid"
            );


        try {

            const res =
                await fetch(
                    window.CricConfig.sourceUrl
                );


            if (!res.ok) {

                throw new Error(
                    "HTTP " +
                    res.status
                );

            }


            const data =
                await res.json();


            this.masterChannels =
                Array.isArray(data)

                    ? data

                    : (
                        data.iframes ||
                        data.channels ||
                        data.streams ||
                        data.data ||
                        []
                    );


            if (
                this.masterChannels.length === 0
            ) {

                grid.innerHTML =
                    `
                    <div class="state-container">
                        No channels found.
                    </div>
                    `;

                return;
            }


            this.renderGrid();

            this.handleUrlRouting();


        } catch (err) {

            console.error(
                "Channel feed error:",
                err
            );


            grid.innerHTML =
                `
                <div
                    class="state-container"
                    style="color:#ef4444;"
                >
                    Failed to load channels feed.
                </div>
                `;

            if (this.initialPendingId) {

                this.closePlayer();

            }

        }

    }


    renderGrid() {

        const grid =
            this.shadow.querySelector(
                "#channels-grid"
            );


        grid.innerHTML =
            "";


        this.masterChannels.forEach(
            (channel, index) => {

                const channelId =
                    channel.id !== undefined
                        ? channel.id
                        : index;


                const title =
                    channel.title ||
                    channel.name ||
                    channel.channel ||
                    `Channel ${index + 1}`;


                const poster =
                    channel.poster ||
                    channel.image ||
                    channel.logo ||
                    channel.img ||
                    "";


                const lowerTitle =
                    title.toLowerCase();


                const isSony =
                    lowerTitle.includes(
                        "sony"
                    );


                const isStar =
                    lowerTitle.includes(
                        "star"
                    );


                let tagText =
                    title.split(" ")[0] ||
                    "LIVE";


                let thumbHtml =
                    "";


                if (isStar) {

                    tagText =
                        "STAR";


                    thumbHtml =
                        `
                        <div
                            class="card-thumbnail"
                        >

                            <div
                                class="channel-logo-box"
                            >

                                <img
                                    class="channel-logo"
                                    src="${window.CricConfig.starLogo}"
                                    alt="Star Sports"
                                    loading="lazy"
                                    referrerpolicy="no-referrer"
                                >

                            </div>


                            <span
                                class="card-network-tag"
                            >
                                STAR
                            </span>


                            <div
                                class="play-overlay-icon"
                            >

                                <svg
                                    viewBox="0 0 24 24"
                                >

                                    <path
                                        d="M8 5v14l11-7z"
                                    />

                                </svg>

                            </div>

                        </div>
                        `;


                } else if (isSony) {

                    tagText =
                        "SONY";


                    thumbHtml =
                        `
                        <div
                            class="card-thumbnail"
                        >

                            <div
                                class="channel-logo-box"
                            >

                                <img
                                    class="channel-logo"
                                    src="${window.CricConfig.sonyLogo}"
                                    alt="Sony Sports"
                                    loading="lazy"
                                    referrerpolicy="no-referrer"
                                >

                            </div>


                            <span
                                class="card-network-tag"
                            >
                                SONY
                            </span>


                            <div
                                class="play-overlay-icon"
                            >

                                <svg
                                    viewBox="0 0 24 24"
                                >

                                    <path
                                        d="M8 5v14l11-7z"
                                    />

                                </svg>

                            </div>

                        </div>
                        `;


                } else if (poster) {

                    thumbHtml =
                        `
                        <div
                            class="card-thumbnail"
                            style="
                                background-image:
                                url('${poster.replace(
                                    /'/g,
                                    "%27"
                                )}')
                            "
                        >

                            <div
                                class="play-overlay-icon"
                            >

                                <svg
                                    viewBox="0 0 24 24"
                                >

                                    <path
                                        d="M8 5v14l11-7z"
                                    />

                                </svg>

                            </div>

                        </div>
                        `;


                } else {

                    const badgeIcon =
                        `
                        <svg
                            viewBox="0 0 24 24"
                        >

                            <path
                                d="
                                M12 2L2 7l10 5 10-5-10-5z
                                M2 17l10 5 10-5
                                M2 12l10 5 10-5
                                "
                            />

                        </svg>
                        `;


                    thumbHtml =
                        `
                        <div
                            class="card-thumbnail"
                        >

                            <div
                                class="channel-badge-box"
                            >
                                ${badgeIcon}
                            </div>


                            <span
                                class="card-network-tag"
                            >
                                ${this.escapeHtml(
                                    tagText
                                )}
                            </span>


                            <div
                                class="play-overlay-icon"
                            >

                                <svg
                                    viewBox="0 0 24 24"
                                >

                                    <path
                                        d="M8 5v14l11-7z"
                                    />

                                </svg>

                            </div>

                        </div>
                        `;

                }


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "channel-card";


                card.onclick =
                    () =>
                        this.openPlayer(
                            channelId
                        );


                card.innerHTML =
                    `

                    ${thumbHtml}


                    <div class="card-body">

                        <div
                            class="card-title"
                        >
                            ${this.escapeHtml(
                                title
                            )}
                        </div>


                        <div
                            class="card-meta"
                        >

                            <span>
                                HD FEED
                            </span>


                            <span
                                style="
                                    color:
                                    var(--accent);
                                "
                            >
                                WATCH NOW
                            </span>

                        </div>

                    </div>

                    `;


                grid.appendChild(
                    card
                );

            }
        );

    }


    escapeHtml(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    openPlayer(identifier) {

        const target =
            this.masterChannels.find(
                (ch, idx) =>
                    ch.id == identifier ||
                    idx == identifier
            );


        if (!target) {
            this.closePlayer();
            return;
        }


        let streamUrl =

            target.iframeSrc ||

            target.url ||

            target.link ||

            target.stream ||

            target.file ||

            target.source ||

            target.src;


        if (!streamUrl) {

            streamUrl =
                `https://sonucdn-v2.pages.dev/star.html?id=${encodeURIComponent(
                    target.id ||
                    identifier
                )}`;

        }


        const title =

            target.title ||

            target.name ||

            target.channel ||

            "Live Broadcast";


        this.currentStreamId =
            identifier;


        this.shadow.querySelector(
            "#activeStreamTitleDisplay"
        ).innerText =
            title;


        this.shadow.querySelector(
            "#player"
        ).src =
            streamUrl;


        const loadingOverlay =
            this.shadow.querySelector(
                "#streamLoadingOverlay"
            );


        if (loadingOverlay) {

            loadingOverlay.classList.add(
                "hidden"
            );

        }


        this.shadow.querySelector(
            "#home-view"
        ).classList.remove(
            "active"
        );


        this.shadow.querySelector(
            "#player-view"
        ).classList.add(
            "active"
        );


        if (!this.isUnlocked) {

            if (this.lockTimer) {

                clearTimeout(
                    this.lockTimer
                );

            }


            this.lockTimer =
                setTimeout(
                    () =>
                        this.triggerLock(),

                    window.CricConfig
                        .previewDuration
                );

        }


        const query =
            `?id=${encodeURIComponent(
                identifier
            )}`;


        if (
            window.location.search !==
            query
        ) {

            history.pushState(
                {
                    playerOpen:
                        true,

                    id:
                        identifier
                },

                "",

                query
            );

        }


        window.scrollTo(
            0,
            0
        );

    }


    closePlayer() {

        this.shadow.querySelector(
            "#player"
        ).src =
            "about:blank";


        const loadingOverlayEl =
            this.shadow.querySelector(
                "#streamLoadingOverlay"
            );


        if (loadingOverlayEl) {

            loadingOverlayEl.classList.add(
                "hidden"
            );

        }


        if (this.lockTimer) {

            clearTimeout(
                this.lockTimer
            );

            this.lockTimer =
                null;

        }


        this.currentStreamId =
            null;


        this.shadow.querySelector(
            "#player-view"
        ).classList.remove(
            "active"
        );


        this.shadow.querySelector(
            "#home-view"
        ).classList.add(
            "active"
        );


        if (
            window.location.search
        ) {

            history.pushState(
                {},
                "",
                window.location.pathname
            );

        }


        window.scrollTo(
            0,
            0
        );

    }


    handleUrlRouting() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const id =
            params.get("id");


        if (id !== null) {

            this.openPlayer(id);

        } else if (
            id === null &&
            this.currentStreamId !== null
        ) {

            this.closePlayer();

        }

    }


    triggerLock() {

        if (this.isUnlocked)
            return;


        const iframe =
            this.shadow.querySelector(
                "#player"
            );


        try {

            if (
                iframe &&
                iframe.contentWindow
            ) {

                iframe.contentWindow.postMessage(
                    "criczone-force-pause",
                    "*"
                );

            }

        } catch (e) {}


        try {

            if (
                document.fullscreenElement
            ) {

                document.exitFullscreen()
                    .catch(
                        () => {}
                    );

            }

        } catch (err) {}


        this.shadow.querySelector(
            "#tgModalDesc"
        ).innerText =
            "Free preview ended! Join our CRICZONE Telegram to unlock 24-hour uninterrupted access.";


        this.shadow.querySelector(
            "#tgPremiumModal"
        ).classList.add(
            "show"
        );

    }

        );


        this.isUnlocked =

        this.shadow.querySelector(

        window.open(

        );


        const laterBtn =
            this.shadow.querySelector(
                "#tgLaterModalBtn"
            );


        if (laterBtn) {

            laterBtn.style.display =
                "flex";

        }


        const iframe =
            this.shadow.querySelector(
                "#player"
            );


        try {

            if (
                iframe &&
                iframe.contentWindow
            ) {

                iframe.contentWindow.postMessage(
                    "criczone-force-play",
                    "*"
                );

            }

        } catch (e) {}

    }


    handleLater() {

        this.laterCount++;


        if (
            this.laterCount >= 2
        ) {

            const laterBtn =
                this.shadow.querySelector(
                    "#tgLaterModalBtn"
                );


            if (laterBtn) {

                laterBtn.style.display =
                    "none";

            }


            this.shadow.querySelector(
                "#tgModalDesc"
            ).innerText =
                "Access limit reached! Please join our CRICZONE Telegram channel to proceed.";


            return;

        }


        this.shadow.querySelector(
            "#tgPremiumModal"
        ).classList.remove(
            "show"
        );


        const iframe =
            this.shadow.querySelector(
                "#player"
            );


        try {

            if (
                iframe &&
                iframe.contentWindow
            ) {

                iframe.contentWindow.postMessage(
                    "criczone-force-play",
                    "*"
                );

            }

        } catch (e) {}

    }


    toggleFullscreen() {

        const rig =
            this.shadow.querySelector(
                "#playerContainer"
            );


        const themeDeck =
            this.shadow.querySelector(
                "#themeSwitchDeck"
            );


        const fsIconSvg =
            this.shadow.querySelector(
                "#fsIconSvg"
            );


        if (!rig)
            return;


        const isFull =
            document.fullscreenElement ||
            rig.classList.contains(
                "fs-active"
            );


        if (!isFull) {

            rig.classList.add(
                "fs-active"
            );


            if (themeDeck) {

                themeDeck.classList.add(
                    "hidden"
                );

            }


            if (fsIconSvg) {

                fsIconSvg.innerHTML =
                    `
                    <path
                        d="
                        M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6
                        11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z
                        "
                    />
                    `;

            }


            try {

                if (
                    rig.requestFullscreen
                ) {

                    rig.requestFullscreen()
                        .catch(
                            () => {}
                        );

                }

            } catch (err) {}


        } else {

            rig.classList.remove(
                "fs-active"
            );


            if (themeDeck) {

                themeDeck.classList.remove(
                    "hidden"
                );

            }


            if (fsIconSvg) {

                fsIconSvg.innerHTML =
                    `
                    <path
                        d="
                        M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12
                        7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z
                        "
                    />
                    `;

            }


            try {

                if (
                    document.exitFullscreen
                ) {

                    document.exitFullscreen()
                        .catch(
                            () => {}
                        );

                }

            } catch (err) {}

        }

    }


    setupMessageListener() {

        window.addEventListener(
            "message",
            (e) => {

                if (

                    e.data ===
                    "criczone-playing" &&

                    !this.isUnlocked &&

                    !this.lockTimer

                ) {

                    this.lockTimer =
                        setTimeout(

                            () =>
                                this.triggerLock(),

                            window.CricConfig
                                .previewDuration

                        );

                }

            }
        );


        document.addEventListener(
            "fullscreenchange",
            () => {

                const rig =
                    this.shadow.querySelector(
                        "#playerContainer"
                    );


                const themeDeck =
                    this.shadow.querySelector(
                        "#themeSwitchDeck"
                    );


                const fsIconSvg =
                    this.shadow.querySelector(
                        "#fsIconSvg"
                    );


                if (

                    !document.fullscreenElement &&

                    !document.webkitIsFullScreen &&

                    rig

                ) {

                    rig.classList.remove(
                        "fs-active"
                    );


                    if (themeDeck) {

                        themeDeck.classList.remove(
                            "hidden"
                        );

                    }


                    if (fsIconSvg) {

                        fsIconSvg.innerHTML =
                            `
                            <path
                                d="
                                M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12
                                7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z
                                "
                            />
                            `;

                    }

                }

            }
        );

    }


    initEventListeners() {

        this.shadow.querySelector(
            "#backHomeBtn"
        ).onclick =
            () =>
                this.closePlayer();


        this.shadow.querySelector(
            "#brandHomeLink"
        ).onclick =
            () =>
                this.closePlayer();


        this.shadow.querySelector(
            "#tgJoinModalBtn"
        ).onclick =
            () =>
                this.handleJoinTelegram();


        this.shadow.querySelector(
            "#tgLaterModalBtn"
        ).onclick =
            () =>
                this.handleLater();


        this.shadow.querySelector(
            "#blendedFsBtn"
        ).onclick =
            () =>
                this.toggleFullscreen();


        this.shadow.querySelector(
            "#themeDarkBtn"
        ).onclick =
            () => {

                this.removeAttribute(
                    "data-theme"
                );


                this.shadow.querySelector(
                    "#themeDarkBtn"
                ).classList.add(
                    "active"
                );


                this.shadow.querySelector(
                    "#themeLightBtn"
                ).classList.remove(
                    "active"
                );

            };


        this.shadow.querySelector(
            "#themeLightBtn"
        ).onclick =
            () => {

                this.setAttribute(
                    "data-theme",
                    "light"
                );


                this.shadow.querySelector(
                    "#themeLightBtn"
                ).classList.add(
                    "active"
                );


                this.shadow.querySelector(
                    "#themeDarkBtn"
                ).classList.remove(
                    "active"
                );

            };


        const btnShare =
            this.shadow.querySelector(
                "#btnShare"
            );


        const shareText =
            this.shadow.querySelector(
                "#shareBtnText"
            );


        btnShare.onclick =
            async () => {

                try {

                    if (
                        navigator.share
                    ) {

                        await navigator.share({

                            title:
                                "CRICZONE LIVE",

                            url:
                                window.location.href

                        });

                    } else {

                        await navigator.clipboard
                            .writeText(
                                window.location.href
                            );


                        shareText.textContent =
                            "COPIED!";


                        setTimeout(
                            () => {

                                shareText.textContent =
                                    "SHARE STREAM";

                            },
                            1800
                        );

                    }

                } catch (err) {}

            };

    }


    initWarpField() {

        const canvas =
            this.shadow.getElementById(
                "warpGridCanvas"
            );


        if (!canvas)
            return;


        const ctx =
            canvas.getContext(
                "2d"
            );


        const resize =
            () => {

                canvas.width =
                    window.innerWidth;

                canvas.height =
                    window.innerHeight;

            };


        window.addEventListener(
            "resize",
            resize
        );


        resize();


        for (
            let i = 0;
            i < 100;
            i++
        ) {

            this.stars.push({

                x:
                    Math.random() *
                    canvas.width,

                y:
                    Math.random() *
                    canvas.height,

                length:
                    Math.random() *
                    20 +
                    10,

                speed:
                    Math.random() *
                    2 +
                    1,

                alpha:
                    Math.random() *
                    0.5 +
                    0.1

            });

        }


        const render =
            () => {

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                ctx.lineWidth =
                    1.2;


                this.stars.forEach(
                    star => {

                        ctx.beginPath();

                        ctx.moveTo(
                            star.x,
                            star.y
                        );

                        ctx.lineTo(
                            star.x -
                            star.length,
                            star.y +
                            star.length
                        );

                        ctx.strokeStyle =
                            `rgba(
                                0,
                                255,
                                204,
                                ${star.alpha}
                            )`;

                        ctx.stroke();


                        star.x -=
                            star.speed;

                        star.y +=
                            star.speed;


                        if (
                            star.x <
                                -star.length ||
                            star.y >
                                canvas.height +
                                star.length
                        ) {

                            star.x =
                                canvas.width +
                                star.length;

                            star.y =
                                Math.random() *
                                canvas.height;

                        }

                    }
                );


                this.animationFrameId =
                    requestAnimationFrame(
                        render
                    );

            };


        render();

    }

}


customElements.define(
    "criczone-ui",
    CriczoneUI
);

</script>


<criczone-ui></criczone-ui>

</body>
</html>
