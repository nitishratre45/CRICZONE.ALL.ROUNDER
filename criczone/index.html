<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://sportlink-jtv.pages.dev">
<link rel="dns-prefetch" href="https://sportlink-jtv.pages.dev">
<link rel="preconnect" href="https://sportlink-tv11.pages.dev/">
<link rel="dns-prefetch" href="https://www.jiotv.com/">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/5.2.0/controls.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;background:#0a0a0a;overflow:hidden;
  font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none
}
#overlay{
  position:fixed;inset:0;background:#0a0a0a;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:16px
}
#overlay svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#overlay p{
  color:#505050;font-size:12px;letter-spacing:.5px;
  text-align:center;padding:0 24px;font-weight:500
}
#channel-list{
  position:fixed;inset:0;background:#0a0a0a;z-index:9998;
  display:none;flex-direction:column;overflow-y:auto;
  padding:max(20px,env(safe-area-inset-top)) 16px
           max(20px,env(safe-area-inset-bottom)) 16px
}
#ch-header{
  display:flex;align-items:center;justify-content:center;
  gap:10px;margin-bottom:20px;padding-bottom:14px;
  border-bottom:1px solid #181818
}
.brand-dot{
  width:8px;height:8px;border-radius:50%;background:#38bdf8;
  flex-shrink:0;box-shadow:0 0 8px rgba(56,189,248,.55);
  animation:brand-pulse 2.2s ease-in-out infinite
}
@keyframes brand-pulse{
  0%,100%{opacity:1;box-shadow:0 0 8px rgba(56,189,248,.55)}
  50%{opacity:.65;box-shadow:0 0 16px rgba(56,189,248,.85)}
}
#ch-header h1{color:#e0e0e0;font-size:15px;font-weight:600;letter-spacing:.8px}
#ch-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px
}
.ch-card{
  background:#111;border:1px solid #1c1c1c;border-radius:10px;
  padding:16px 12px;cursor:pointer;text-decoration:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:10px;
  transition:background .18s,border-color .18s,transform .12s;
  -webkit-tap-highlight-color:transparent;min-height:130px
}
.ch-card:hover{background:#161616;border-color:#282828}
.ch-card:active{transform:scale(.95);background:#1c1c1c}
.ch-card:focus-visible{outline:2px solid #38bdf8;outline-offset:2px}
.ch-card span{color:#d8d8d8;font-size:12px;font-weight:500;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;max-height:34px;width:100%}
.ch-logo{
  width:100%;max-width:90px;height:50px;object-fit:contain;
  border-radius:6px;flex-shrink:0;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))
}
.ch-logo-fallback{
  width:90px;height:50px;border-radius:6px;
  background:linear-gradient(135deg,#1a1a2e,#16213e);
  border:1px solid #2a2a4a;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;color:#38bdf8;
  letter-spacing:1px;flex-shrink:0
}
@media(max-width:480px){
  #ch-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
  .ch-card{padding:12px 8px;min-height:110px;border-radius:8px}
  .ch-logo,.ch-logo-fallback{max-width:70px;height:40px}
  .ch-logo-fallback{font-size:14px}
  .ch-card span{font-size:10px;max-height:28px}
}
#pc{
  position:fixed;inset:0;background:#000;display:none;
  align-items:center;justify-content:center;touch-action:manipulation
}
video{width:100%;height:100%;object-fit:contain;background:#000}
video.mode-fill{object-fit:fill}
video.mode-cover{object-fit:cover}
#status{
  position:fixed;
  top:max(14px,env(safe-area-inset-top));
  right:12%;
  transform:translateY(-10px);
  z-index:9997;
  display:flex;align-items:center;gap:7px;
  padding:6px 15px 6px 11px;
  background:rgba(10,10,10,.92);
  border:1px solid rgba(255,255,255,.07);
  font-size:11.5px;font-weight:500;letter-spacing:.2px;
  border-radius:24px;pointer-events:none;opacity:0;
  transition:opacity .25s ease,transform .25s ease;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;
  box-shadow:0 2px 14px rgba(0,0,0,.45)
}
#status.show{opacity:1;transform:translateY(0)}
.st-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
#status.ok   {color:#c0c0c0} #status.ok   .st-dot{background:#60a5fa}
#status.live {color:#c8c8c8} #status.live .st-dot{background:#22d3a0;animation:dot-pulse 2s ease-in-out infinite}
#status.warn {color:#fcd34d} #status.warn .st-dot{background:#fb923c;animation:dot-pulse 1s ease-in-out infinite}
#status.err  {color:#fca5a5} #status.err  .st-dot{background:#f87171}
@keyframes dot-pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.35;transform:scale(.55)}
}
.sp-btn{
  background:transparent!important;border:none!important;
  cursor:pointer!important;padding:0 8px!important;
  opacity:.75;display:flex;align-items:center;justify-content:center;
  height:100%;min-width:36px;
  transition:opacity .15s,color .15s;
  color:#fff!important;-webkit-tap-highlight-color:transparent
}
.sp-btn:hover{opacity:1}
.sp-btn:active{opacity:1;transform:scale(.9)}
.sp-btn:focus-visible{outline:2px solid #38bdf8;outline-offset:2px;border-radius:6px}
.sp-btn.active{opacity:1;color:#38bdf8!important}
.sp-fit-btn{padding:0 7px!important;min-width:auto!important}
.fit-pill{
  font-size:10px;font-weight:700;letter-spacing:.4px;
  padding:3px 7px;border-radius:4px;line-height:1;
  border:1.5px solid rgba(255,255,255,.28);
  color:rgba(255,255,255,.8);
  pointer-events:none;white-space:nowrap;
  transition:border-color .2s,color .2s
}
.sp-fit-btn:hover      .fit-pill{border-color:rgba(255,255,255,.55);color:#fff}
.sp-fit-btn.mode-fill  .fit-pill{border-color:#38bdf8;color:#38bdf8}
.sp-fit-btn.mode-cover .fit-pill{border-color:#a78bfa;color:#a78bfa}
.shaka-controls-container button{color:#fff!important}
.shaka-video-container{background-color:#000!important}
@media(max-width:380px){
  .fit-pill{font-size:9px;padding:2px 5px}
  .sp-btn{padding:0 5px!important}
}
</style>
</head>
<body>

<div id="overlay">
  <svg width="34" height="34" viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="20" r="16" stroke="#1a1a1a" stroke-width="4"/>
    <path d="M20 4a16 16 0 0 1 16 16" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <p id="loadMsg">Loading.....</p>
</div>

<div id="status"></div>

<div id="channel-list">
  <div id="ch-header">
    <span class="brand-dot"></span>
    <h1>Channels</h1>
  </div>
  <div id="ch-grid"></div>
</div>

<div id="pc">\n  <button type="button" aria-label="Back to channels" style="position:fixed;z-index:10000;top:max(12px,env(safe-area-inset-top));left:12px;padding:10px 14px;border:1px solid #333;border-radius:10px;background:rgba(12,12,12,.88);color:#fff;font-weight:600" onclick="history.back()">← Channels</button>
  <video id="v" playsinline webkit-playsinline
    preload="none"
    x5-video-player-type="h5"
    x5-video-player-fullscreen="true">
  </video>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/5.2.0/shaka-player.ui.min.js"></script>
<script>
(function () {
  "use strict";
  const API = "https://sportlink-tv11.pages.dev/Star3.json";
  const $ = id => document.getElementById(id);
  const overlay = $("overlay"), loadMsg = $("loadMsg"), status = $("status");
  const list = $("channel-list"), grid = $("ch-grid"), playerBox = $("pc"), video = $("v");
  let player = null, channels = [], statusTimer = null;

  function showStatus(message, kind) {
    status.textContent = message;
    status.className = "show " + (kind || "ok");
    clearTimeout(statusTimer);
    if (kind !== "err" && kind !== "warn") statusTimer = setTimeout(() => status.className = "", 3500);
  }
  function showOverlay(message) { loadMsg.textContent = message; overlay.style.display = "flex"; }
  function hideOverlay() { overlay.style.display = "none"; }
  function idOf(ch, i) { return String(ch.id ?? ch.channel_id ?? ch.cid ?? i); }
  function nameOf(ch) { return String(ch.name || ch.title || ch.channel || ch.channel_name || "Live Channel"); }
  function urlOf(ch) {
    const values = [ch.stream_url, ch.streamUrl, ch.url, ch.src, ch.file, ch.manifest];
    return values.find(v => typeof v === "string" && /^https?:\/\//i.test(v.trim()))?.trim() || "";
  }
  function normalize(data) {
    if (Array.isArray(data)) return data;
    if (!data || typeof data !== "object") return [];
    if (Array.isArray(data.channels)) return data.channels;
    if (Array.isArray(data.data)) return data.data;
    if (Array.isArray(data.streams)) return data.streams;
    if (data.stream_url || data.streamUrl || data.url || data.src || data.file) {
      return [{ ...data, id: data.id || "STEN3", name: nameOf(data) }];
    }
    return Object.entries(data)
      .filter(([, value]) => value && typeof value === "object" && !Array.isArray(value))
      .map(([id, value]) => ({ id, ...value }));
  }
  async function fetchChannels() {
    showOverlay("Fetching channels…");
    try {
      const response = await fetch(API, { cache: "no-store", headers: { Accept: "application/json" } });
      if (!response.ok) throw new Error("Feed HTTP " + response.status);
      channels = normalize(await response.json()).filter(ch => ch && typeof ch === "object");
      renderChannels();
      const requested = new URLSearchParams(location.search).get("id");
      if (requested) {
        const index = channels.findIndex((ch, i) => idOf(ch, i) === requested);
        if (index >= 0) await openChannel(index, false);
        else showError("Channel not found in JSON feed.");
      } else showChannelList();
    } catch (error) {
      console.error("CRICZONE feed error:", error);
      showError("Channels could not load. Check the JSON feed and try again.");
    }
  }
  function renderChannels() {
    grid.innerHTML = "";
    if (!channels.length) {
      const empty = document.createElement("p");
      empty.textContent = "No channels found in Star3.json.";
      empty.style.cssText = "color:#999;text-align:center;padding:30px;grid-column:1/-1";
      grid.appendChild(empty);
      return;
    }
    channels.forEach((ch, index) => {
      const card = document.createElement("a");
      card.className = "ch-card";
      card.href = "?id=" + encodeURIComponent(idOf(ch, index));
      const logo = ch.logo || ch.logo_url || ch.image || "";
      if (logo) {
        const img = document.createElement("img");
        img.className = "ch-logo"; img.src = logo; img.alt = nameOf(ch);
        img.loading = "lazy"; img.onerror = () => img.remove();
        card.appendChild(img);
      } else {
        const fallback = document.createElement("div");
        fallback.className = "ch-logo-fallback";
        fallback.textContent = nameOf(ch).split(/\s+/).slice(0, 2).map(x => x[0] || "").join("").toUpperCase();
        card.appendChild(fallback);
      }
      const title = document.createElement("span");
      title.textContent = nameOf(ch); card.appendChild(title);
      card.addEventListener("click", event => { event.preventDefault(); openChannel(index, true); });
      grid.appendChild(card);
    });
  }
  function showChannelList() {
    hideOverlay(); playerBox.style.display = "none"; list.style.display = "flex";
    status.className = ""; history.replaceState({}, "", location.pathname);
  }
  function showError(message) {
    playerBox.style.display = "none"; list.style.display = "none";
    showOverlay(message); showStatus(message, "err"); console.error("CRICZONE:", message);
  }
  async function openChannel(index, push) {
    const ch = channels[index];
    if (!ch) return;
    const url = urlOf(ch);
    if (!url) { showError("No playable stream URL is configured for " + nameOf(ch) + "."); return; }
    if (push) history.pushState({ id: idOf(ch, index) }, "", "?id=" + encodeURIComponent(idOf(ch, index)));
    document.title = nameOf(ch) + " | CRICZONE";
    list.style.display = "none"; playerBox.style.display = "flex";
    showOverlay("Loading " + nameOf(ch) + "…"); showStatus("Connecting to stream…", "warn");
    try {
      if (player) { await player.destroy(); player = null; }
      video.pause(); video.removeAttribute("src"); video.load();
      const isManifest = /\.(m3u8|mpd)(\?|$)/i.test(url);
      if (isManifest && window.shaka) {
        shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) throw new Error("This browser does not support Shaka Player.");
        player = new shaka.Player();
        await player.attach(video);
        new shaka.ui.Overlay(player, playerBox, video).configure({
          controlPanelElements: ["play_pause", "mute", "volume", "time_and_duration", "spacer", "quality", "picture_in_picture", "fullscreen"],
          seekBarColors: { base: "#828282", buffered: "#ffc336", played: "#1fc7ff" }
        });
        player.addEventListener("error", event => {
          const detail = event.detail || {};
          console.error("Shaka playback error:", detail);
          showStatus("Playback error " + (detail.code || ""), "err");
        });
        await player.load(url);
      } else {
        video.src = url;
        await new Promise((resolve, reject) => {
          video.addEventListener("loadedmetadata", resolve, { once: true });
          video.addEventListener("error", () => reject(new Error("Browser could not load this media URL.")), { once: true });
          video.load();
        });
      }
      hideOverlay(); showStatus("Ready — tap play", "ok");
      try { await video.play(); } catch (_) {}
    } catch (error) {
      console.error("CRICZONE player error:", error);
      showOverlay("Stream could not be played. The source must allow playback from this website.");
      showStatus("Playback unavailable", "err");
    }
  }
  window.addEventListener("popstate", () => {
    const requested = new URLSearchParams(location.search).get("id");
    if (!requested) showChannelList();
    else {
      const index = channels.findIndex((ch, i) => idOf(ch, i) === requested);
      if (index >= 0) openChannel(index, false);
    }
  });
  document.addEventListener("DOMContentLoaded", fetchChannels);
})();
</script>
</body>
</html>
