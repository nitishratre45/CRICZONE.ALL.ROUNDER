<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://sportlink-jtv.pages.dev">
<link rel="dns-prefetch" href="https://sportlink-jtv.pages.dev">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;background:#0a0a0a;overflow:hidden;
  font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none
}
#overlay{
  position:fixed;inset:0;background:#0a0a0a;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:16px
}
#overlay svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#overlay p{
  color:#505050;font-size:12px;letter-spacing:.5px;
  text-align:center;padding:0 24px;font-weight:500
}
#channel-list{
  position:fixed;inset:0;background:#0a0a0a;z-index:9998;
  display:none;flex-direction:column;overflow-y:auto;
  padding:max(20px,env(safe-area-inset-top)) 16px
           max(20px,env(safe-area-inset-bottom)) 16px
}
#ch-header{
  display:flex;align-items:center;justify-content:center;
  gap:10px;margin-bottom:20px;padding-bottom:14px;
  border-bottom:1px solid #181818
}
.brand-dot{
  width:8px;height:8px;border-radius:50%;background:#38bdf8;
  flex-shrink:0;box-shadow:0 0 8px rgba(56,189,248,.55);
  animation:brand-pulse 2.2s ease-in-out infinite
}
@keyframes brand-pulse{
  0%,100%{opacity:1;box-shadow:0 0 8px rgba(56,189,248,.55)}
  50%{opacity:.65;box-shadow:0 0 16px rgba(56,189,248,.85)}
}
#ch-header h1{color:#e0e0e0;font-size:15px;font-weight:600;letter-spacing:.8px}
#ch-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px
}
.ch-card{
  background:#111;border:1px solid #1c1c1c;border-radius:10px;
  padding:16px 12px;cursor:pointer;text-decoration:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:10px;
  transition:background .18s,border-color .18s,transform .12s;
  -webkit-tap-highlight-color:transparent;min-height:130px
}
.ch-card:hover{background:#161616;border-color:#282828}
.ch-card:active{transform:scale(.95);background:#1c1c1c}
.ch-card:focus-visible{outline:2px solid #38bdf8;outline-offset:2px}
.ch-card span{color:#d8d8d8;font-size:12px;font-weight:500;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;max-height:34px;width:100%}
.ch-logo{
  width:100%;max-width:90px;height:50px;object-fit:contain;
  border-radius:6px;flex-shrink:0;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))
}
.ch-logo-fallback{
  width:90px;height:50px;border-radius:6px;
  background:linear-gradient(135deg,#1a1a2e,#16213e);
  border:1px solid #2a2a4a;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;color:#38bdf8;
  letter-spacing:1px;flex-shrink:0
}
@media(max-width:480px){
  #ch-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
  .ch-card{padding:12px 8px;min-height:110px;border-radius:8px}
  .ch-logo,.ch-logo-fallback{max-width:70px;height:40px}
  .ch-logo-fallback{font-size:14px}
  .ch-card span{font-size:10px;max-height:28px}
}
#pc{
  position:fixed;inset:0;background:#000;display:none;
  align-items:center;justify-content:center;touch-action:manipulation
}
video{width:100%;height:100%;object-fit:contain;background:#000}
video.mode-fill{object-fit:fill}
video.mode-cover{object-fit:cover}
#status{
  position:fixed;
  top:max(14px,env(safe-area-inset-top));
  right:12%;
  transform:translateY(-10px);
  z-index:9997;
  display:flex;align-items:center;gap:7px;
  padding:6px 15px 6px 11px;
  background:rgba(10,10,10,.92);
  border:1px solid rgba(255,255,255,.07);
  font-size:11.5px;font-weight:500;letter-spacing:.2px;
  border-radius:24px;pointer-events:none;opacity:0;
  transition:opacity .25s ease,transform .25s ease;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;
  box-shadow:0 2px 14px rgba(0,0,0,.45)
}
#status.show{opacity:1;transform:translateY(0)}
.st-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
#status.ok   {color:#c0c0c0} #status.ok   .st-dot{background:#60a5fa}
#status.live {color:#c8c8c8} #status.live .st-dot{background:#22d3a0;animation:dot-pulse 2s ease-in-out infinite}
#status.warn {color:#fcd34d} #status.warn .st-dot{background:#fb923c;animation:dot-pulse 1s ease-in-out infinite}
#status.err  {color:#fca5a5} #status.err  .st-dot{background:#f87171}
@keyframes dot-pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.35;transform:scale(.55)}
}
.sp-btn{
  background:transparent!important;border:none!important;
  cursor:pointer!important;padding:0 8px!important;
  opacity:.75;display:flex;align-items:center;justify-content:center;
  height:100%;min-width:36px;
  transition:opacity .15s,color .15s;
  color:#fff!important;-webkit-tap-highlight-color:transparent
}
.sp-btn:hover{opacity:1}
.sp-btn:active{opacity:1;transform:scale(.9)}
.sp-btn:focus-visible{outline:2px solid #38bdf8;outline-offset:2px;border-radius:6px}
.sp-btn.active{opacity:1;color:#38bdf8!important}
.sp-fit-btn{padding:0 7px!important;min-width:auto!important}
.fit-pill{
  font-size:10px;font-weight:700;letter-spacing:.4px;
  padding:3px 7px;border-radius:4px;line-height:1;
  border:1.5px solid rgba(255,255,255,.28);
  color:rgba(255,255,255,.8);
  pointer-events:none;white-space:nowrap;
  transition:border-color .2s,color .2s
}
.sp-fit-btn:hover      .fit-pill{border-color:rgba(255,255,255,.55);color:#fff}
.sp-fit-btn.mode-fill  .fit-pill{border-color:#38bdf8;color:#38bdf8}
.sp-fit-btn.mode-cover .fit-pill{border-color:#a78bfa;color:#a78bfa}
.shaka-controls-container button{color:#fff!important}
.shaka-video-container{background-color:#000!important}
@media(max-width:380px){
  .fit-pill{font-size:9px;padding:2px 5px}
  .sp-btn{padding:0 5px!important}
}

// Keep the live viewer badge inside the active fullscreen subtree.
(function keepViewerBadgeInFullscreen(){
  var badge=document.getElementById("viewerBadge");
  var player=document.getElementById("pc");
  if(!badge||!player)return;
  function syncBadge(){
    var fs=document.fullscreenElement||document.webkitFullscreenElement;
    var isPlayerFullscreen=!!(fs&&(fs===player||player.contains(fs)||fs.contains(player)));
    if(isPlayerFullscreen){
      if(fs!==badge.parentElement)fs.appendChild(badge);
      badge.classList.add("is-fullscreen");
    }else{
      if(badge.parentElement!==player)player.appendChild(badge);
      badge.classList.remove("is-fullscreen");
    }
  }
  ["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){document.addEventListener(ev,syncBadge);});
  syncBadge();
})();

function getTier(){
  var mem   = navigator.deviceMemory || 4;
  var cores = navigator.hardwareConcurrency || 4;
  var mob   = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var conn  = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  var net   = conn ? (conn.effectiveType || "4g") : "4g";
  if(!mob) return "high";
  if(mem <= 1.5 || cores <= 2 || net === "slow-2g" || net === "2g") return "low";
  if(mem <= 3   || cores <= 4) return "mid";
  return "high";
}

var TIER = getTier();
var PROF = {
  low:  {buf:4,  reBuf:1.5, behind:10, maxH:480,  maxBw:1000000, bwEst:400000 },
  mid:  {buf:7,  reBuf:1.5, behind:20, maxH:720,  maxBw:3000000, bwEst:1000000},
  high: {buf:10, reBuf:1.5, behind:25, maxH:1080, maxBw:0,       bwEst:2000000}
}[TIER];

var FITS       = ["contain","fill","cover"];
var FIT_LABELS = {contain:"Fit", fill:"Fill", cover:"Zoom"};

function toast(msg, type, dur){
  $status.innerHTML = '<span class="st-dot"></span><span>' + msg + '</span>';
  $status.className = "show " + (type || "ok");
  if(_stTmr){ clearTimeout(_stTmr); _stTmr = null; }
  if(dur !== 0){
    _stTmr = setTimeout(function(){
      $status.className = $status.className.replace("show","").trim();
      _stTmr = null;
    }, dur || 4000);
  }
}

function setMsg(m)    { if($loadMsg) $loadMsg.textContent = m; }
function hideOverlay(){ if($overlay) $overlay.style.display = "none"; }
function getChId()    { return new URLSearchParams(location.search).get("id") || ""; }

function rawCookie(c){
  return c && c.startsWith("__hdnea__=") ? c.slice(10) : (c || "");
}
function withCookie(u, r){
  if(!u || !r) return u;
  if(u.indexOf("__hdnea__") !== -1) return u;
  return u + (u.indexOf("?") !== -1 ? "&" : "?") + "__hdnea__=" + r;
}

function isNonEmpty(v){
  return typeof v === "string" && v.trim().length > 0;
}

function normalizeKidKey(kid, key){
  if(!isNonEmpty(kid) || !isNonEmpty(key)) return null;
  return {
    kid: kid.trim().toLowerCase(),
    key: key.trim().toLowerCase()
  };
}

function buildClearKeys(ch){
  var out = {};

  if(Array.isArray(ch.sportlink) && ch.sportlink.length > 0){
    ch.sportlink.forEach(function(entry){
      if(typeof entry !== "string") return;
      var parts = entry.split(":");
      if(parts.length < 2) return;
      var pair = normalizeKidKey(parts[0], parts[1]);
      if(pair) out[pair.kid] = pair.key;
    });
    if(Object.keys(out).length > 0) return out;
  }

  if(Array.isArray(ch.sonuxs) && ch.sonuxs.length > 0){
    ch.sonuxs.forEach(function(entry){
      if(typeof entry !== "string") return;
      var parts = entry.split(":");
      if(parts.length < 2) return;
      var pair = normalizeKidKey(parts[0], parts[1]);
      if(pair) out[pair.kid] = pair.key;
    });
    if(Object.keys(out).length > 0) return out;
  }

  var single = normalizeKidKey(ch.key_id, ch.key);
  if(single) out[single.kid] = single.key;

  return out;
}

function keyModeOf(ch){
  var hasSportlink = Array.isArray(ch.sportlink) && ch.sportlink.length > 0;
  var hasSonuxs    = Array.isArray(ch.sonuxs) && ch.sonuxs.length > 0;
  var hasMulti     = hasSportlink || hasSonuxs;
  var hasSingle    = isNonEmpty(ch.key_id) && isNonEmpty(ch.key);
  if(hasMulti && hasSingle) return "mixed";
  if(hasMulti)              return "multi";
  if(hasSingle)             return "single";
  return "none";
}

async function loadData(){
  try {
    var r = await fetch(API, {cache:"no-store", headers:{Accept:"application/json"}});
    if(r.ok) {
      var d = await r.json();
      if(Array.isArray(d) && d.length > 0){
        return { channels: d };
      }
      if(d && Array.isArray(d.channels) && d.channels.length > 0){
        return d;
      }
    }
  } catch(e) {
    console.warn("API failed:", e);
  }

  return { channels: [] };
}

function renderList(channels){

  var f = document.createDocumentFragment();

    a.className = "ch-card";

    var logoUrl = ch.logo || LOGO_MAP[ch.id] || "";

        this.style.display = "none";
        var fallback = document.createElement("div");
        fallback.className = "ch-logo-fallback";
        fallback.textContent = initials;
        if (this.parentNode) {

      };
      a.appendChild(img);
    } else {
      var fallback = document.createElement("div");
      fallback.className = "ch-logo-fallback";
      fallback.textContent = initials;
      a.appendChild(fallback);
    }

    var span = document.createElement("span");
    span.textContent = ch.name;
    a.appendChild(span);

    f.appendChild(a);
  });

  $grid.appendChild(f);
  $list.style.display = "flex";
}

function shakaErrStr(e){
  if(!e) return "Playback Error";
  var cat = {1:"Network",2:"Text",3:"Media",4:"Manifest",5:"Stream",6:"DRM",7:"Player"};
  var s = (cat[e.category] || "Error") + " " + e.category + ":" + e.code;
  if(e.data && e.data[0] && typeof e.data[0] === "string")
    s += " — " + e.data[0].slice(0, 72);
  return s;
}

function ratioLabel(w, h){
  if(!w || !h) return "—";
  function gcd(a, b){ return b ? gcd(b, a % b) : a; }
  var g = gcd(w, h) || 1, rw = w/g, rh = h/g;
  var named = {
    "16:9":16/9, "4:3":4/3, "21:9":21/9, "1:1":1,
    "9:16":9/16, "3:2":3/2, "5:4":5/4, "2:1":2
  };
  var real = w/h, best = null, bestD = 0.02;
  Object.keys(named).forEach(function(k){
    var d = Math.abs(named[k] - real);
    if(d < bestD){ bestD = d; best = k; }
  });
  if(best) return best;
  if(rw <= 40 && rh <= 40) return rw + ":" + rh;
  return real.toFixed(2) + ":1";
}

function injectControls(container, vid){
  var panel = container.querySelector(".shaka-controls-button-panel");
  if(!panel) return false;

  var anchor = panel.querySelector(".shaka-fullscreen-button");
  var fitIdx  = 0;
  var fitBtn  = document.createElement("button");
  fitBtn.className = "sp-btn sp-fit-btn";
  fitBtn.title     = "Video Fit: " + FIT_LABELS.contain;
  fitBtn.setAttribute("aria-label", "Cycle Video Fit Mode");
  fitBtn.innerHTML = '<span class="fit-pill">—</span>';

  if(anchor) panel.insertBefore(fitBtn, anchor);
  else       panel.appendChild(fitBtn);

  var currentRatio = "—";
  function applyFit(i){
    fitIdx = i;
    var m = FITS[i];
    vid.classList.remove("mode-fill","mode-cover");
    if(m === "fill")  vid.classList.add("mode-fill");
    if(m === "cover") vid.classList.add("mode-cover");
    fitBtn.classList.remove("mode-fill","mode-cover");
    if(m !== "contain") fitBtn.classList.add("mode-" + m);
    fitBtn.title = "Video Fit: " + FIT_LABELS[m];
    var pill = fitBtn.querySelector(".fit-pill");
    if(pill) pill.textContent = (m === "contain") ? currentRatio : FIT_LABELS[m];
  }

  fitBtn.addEventListener("click", function(e){
    e.stopPropagation();
    applyFit((fitIdx + 1) % FITS.length);
  });

  // Preserve selected Fit / Fill / Zoom mode across fullscreen changes.
  ["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){
    document.addEventListener(ev, function(){
      requestAnimationFrame(function(){ applyFit(fitIdx); });
    });
  });

  var _ratioTries = 0;
  function updateRatio(){
    var pill = fitBtn.querySelector(".fit-pill");
    if(!pill) return;
    if(vid.videoWidth > 0){
      currentRatio = ratioLabel(vid.videoWidth, vid.videoHeight);
      if(FITS[fitIdx] === "contain") pill.textContent = currentRatio;
      _ratioTries = 0;
    } else if(_ratioTries < 15){
      _ratioTries++;
      setTimeout(updateRatio, 700);
    }
  }

  vid.addEventListener("loadedmetadata", function(){ _ratioTries = 0; updateRatio(); });
  vid.addEventListener("resize", updateRatio);
  vid.addEventListener("timeupdate", function onFirstFrame(){
    vid.removeEventListener("timeupdate", onFirstFrame);
    updateRatio();
  });
  updateRatio();

  return true;
}

async function startPlayer(ch){
  $pc.style.display = "flex";
  var playerName = document.getElementById("cz-player-channel-name");
  if(playerName) playerName.textContent = ch.name || "Live Channel";
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){ errMsg("Browser Not Supported."); return; }

  var player = new shaka.Player();
  await player.attach($vid);

  new shaka.ui.Overlay(player, $pc, $vid).configure({
    controlPanelElements:[
      "play_pause","mute","volume",
      "time_and_duration","spacer",
      "quality","picture_in_picture","fullscreen"
    ],
    seekBarColors:{
      base:    "#828282",
      buffered:"#ffc336",
      played:  "#1fc7ff"
    }
  });

  var _injectCount = 0;
  (function tryInject(){
    if(injectControls($pc, $vid)) return;
    if(++_injectCount < 5) setTimeout(tryInject, 150);
  })();

  var cookie = ch.cookie;
  var raw    = rawCookie(cookie);
  var url    = ch.stream_url;
  var drmKeys = buildClearKeys(ch);
  var keyMode = keyModeOf(ch);

  var restrictionsRelaxed = false;
  var thermalApplied      = false;
  var sessionStart        = Date.now();

  if(Object.keys(drmKeys).length === 0){
    toast("No DRM Keys Available","err",0);
    return;
  }

  var thermalTimer = setInterval(function(){
    if(Date.now() - sessionStart < 60*60*1000) return;
    clearInterval(thermalTimer);
    if(thermalApplied) return;
    thermalApplied = true;
    try{
      player.configure("streaming.bufferBehind", 8);
      if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
        player.configure("abr.restrictions.maxHeight", Math.min(PROF.maxH, 720));
      }
    }catch(_){}
  }, 60000);

  function buildCfg(){
    var effMaxH = (thermalApplied && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent))
      ? Math.min(PROF.maxH, 720) : PROF.maxH;
    var restr = {};
    if(!restrictionsRelaxed){
      if(effMaxH < 1080) restr.maxHeight    = effMaxH;
      if(PROF.maxBw > 0) restr.maxBandwidth = PROF.maxBw;
    }
    return {
      drm:{ clearKeys: drmKeys },
      manifest:{
        defaultPresentationDelay:4,
        ignoreTextStreamFailures:true,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
      },
      streaming:{
        lowLatencyMode:false,
        bufferingGoal:PROF.buf,
        rebufferingGoal:PROF.reBuf,
        bufferBehind:PROF.behind,
        safeSeekOffset:4,
        stallEnabled:true,
        stallThreshold:1,
        stallSkip:.3,
        inaccurateManifestTolerance:0,
        retryParameters:{maxAttempts:5,baseDelay:500,backoffFactor:2,fuzzFactor:.5,timeout:30000}
      },
      abr:{
        enabled:true,
        defaultBandwidthEstimate:PROF.bwEst,
        switchInterval:4,
        restrictions:restr
      }
    };
  }

  player.configure(buildCfg());

  var T = shaka.net.NetworkingEngine.RequestType;
  player.getNetworkingEngine().registerRequestFilter(function(type, req){
    req.headers["Referer"]    = "https://www.jiotv.com/";
    req.headers["User-Agent"] = "Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";
    req.headers["Cookie"]     = cookie;
    if(type === T.MANIFEST || type === T.SEGMENT)
      req.uris = req.uris.map(function(u){ return withCookie(u, raw); });
  });

  var refreshing = false;
  var retries    = 0;
  var edgeTried  = false;
  var lastTry    = 0;
  var started    = false;
  var stallTmr   = null;

  function unmuteOnce(){ $vid.muted = false; }
  $pc.addEventListener("pointerdown", unmuteOnce, {capture:true,once:true});
  $pc.addEventListener("click",       unmuteOnce, {capture:true,once:true});
  $pc.addEventListener("keydown",     unmuteOnce, {capture:true,once:true});

  function goLiveEdge(){
    if(refreshing) return;
    try{
      player.goToLive();
      edgeTried = true;
      toast("Syncing To Live Edge…","warn",2000);
    }catch(_){ reload(); }
  }

  async function reload(){
    var now = Date.now();
    if(refreshing || now - lastTry < 1500) return;
    if(retries >= 5){ toast("Stream Unavailable. Please Try Again Later.","err",0); return; }
    refreshing = true; lastTry = now; retries++;
    toast("Reconnecting… (" + retries + " / 5)","warn",0);
    try{
      var d     = await loadData();
      var fresh = (d.channels || []).find(function(c){ return c.id === ch.id; });
      if(!fresh) throw new Error("missing");
      var freshKeys = buildClearKeys(fresh);
      if(Object.keys(freshKeys).length === 0) throw new Error("no_keys");
      cookie  = fresh.cookie;
      raw     = rawCookie(cookie);
      drmKeys = freshKeys;
      keyMode = keyModeOf(fresh);
      url     = fresh.stream_url;
      player.configure(buildCfg());
      await player.load(url);
      $vid.play().catch(function(){});
      retries = 0; edgeTried = false;
      toast("Live","live",4000);
    }catch(_){
      setTimeout(reload, Math.min(1000 * Math.pow(2, retries - 1), 8000));
    }finally{ refreshing = false; }
  }

  var RECOVERABLE = [1001,1002,1003,4012,6006,6007,7000,7001,7002];

  player.addEventListener("error", function(ev){
    var err  = ev.detail;
    var code = err && err.code;
    if(code === 4014 && !restrictionsRelaxed){
      restrictionsRelaxed = true;
      refreshing = true;
      player.configure(buildCfg());
      toast("Adjusting Quality…","warn",2000);
      player.load(url)
        .then(function(){ $vid.play().catch(function(){}); toast("Live","live",4000); })
        .catch(function(){ reload(); })
        .finally(function(){ refreshing = false; });
      return;
    }
    if(RECOVERABLE.indexOf(code) !== -1){
      toast("Buffering…","warn",0);
      setTimeout(function(){ if(!refreshing) reload(); }, 700);
    } else {
      toast(shakaErrStr(err),"err",6000);
    }
  });

  try{
    setMsg("Loading Stream…");
    toast("Loading Stream…","warn",0);
    await player.load(url);
    hideOverlay();
    toast("Ready — Tap ▶ To Play","ok",5000);
  }catch(_){
    hideOverlay();
    toast("Connection Error — Retrying…","warn",0);
    setTimeout(reload, 1500);
    return;
  }

  function onStall(){
    if(stallTmr) return;
    toast("Buffering…","warn",0);
    if(!started || refreshing) return;
    stallTmr = setTimeout(function(){
      stallTmr = null;
      if(!edgeTried) goLiveEdge(); else reload();
    }, 5000);
  }

  function onPlaying(){
    started = true;
    if(stallTmr){ clearTimeout(stallTmr); stallTmr = null; }
    edgeTried = false;
    if(!refreshing) toast("Live","live",3000);
  }

  $vid.addEventListener("waiting", onStall);
  $vid.addEventListener("stalled", onStall);
  $vid.addEventListener("playing", onPlaying);
  $vid.addEventListener("error",   function(){
    if(!refreshing){
      toast("Buffering…","warn",0);
      setTimeout(function(){ if(!refreshing) reload(); }, 700);
    }
  });

  document.addEventListener("visibilitychange", function(){
    if(!document.hidden){
      setTimeout(function(){
        if(started && $vid.paused && !refreshing) $vid.play().catch(function(){});
      }, 400);
    }
  });

  var netConn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if(netConn){
    netConn.addEventListener("change", function(){
      if(!player || restrictionsRelaxed) return;
      var t = netConn.effectiveType || "4g";
      var h = t === "slow-2g" || t === "2g" ? 240 : t === "3g" ? 480 : PROF.maxH;
      try{ player.configure("abr.restrictions.maxHeight", h); }catch(_){}
      if(h < PROF.maxH) toast("Slow Network — Reducing Quality","warn",3000);
    });
  }
}

async function main(){
  var id = getChId(), data;
  try{
    setMsg("Fetching Channels…");
    data = await loadData();
  }catch(_){
    errMsg("Connection Error. Please Check Your Internet.");
    return;
  }

  var channels = data.channels || [];

  if(!id){ renderList(channels); return; }

  var ch = channels.find(function(c){ return c.id === id; });
  if(!ch){
    errMsg("Channel Not Found.");
    return;
  }
  document.title = ch.name;
  await startPlayer(ch);
  if (window.startRealtimeWatching) window.startRealtimeWatching(ch.id || id);
}

var playerBackButton=document.getElementById("cz-player-back");
if(playerBackButton) playerBackButton.addEventListener("click",function(){location.href=location.pathname;});
document.addEventListener("DOMContentLoaded", main);
})();
</script>

  let viewerRef = null;
  let countUnsubscribe = null;
  let firebaseApp = null;
  let analyticsInstance = null;
  let totalVisitsStarted = false;
  let totalVisitsUnsubscribe = null;

  // Count every website visit once per page load; counter starts at 330.
  async function startTotalVisitCounter() {
    if (totalVisitsStarted) return;
    totalVisitsStarted = true;
    const totalEl = document.getElementById("totalVisits");
    if (totalEl) totalEl.textContent = "330";
    try {
      firebaseApp = firebaseApp || initializeApp(firebaseConfig);
      const db = getDatabase(firebaseApp);
      await signInAnonymously(getAuth(firebaseApp));
      const totalRef = ref(db, "siteStats/totalVisits");
      const result = await runTransaction(totalRef, current => current === null ? 331 : current + 1);
      if (!result.committed) throw new Error("Total visits transaction was not committed");
      totalVisitsUnsubscribe = onValue(totalRef, snapshot => {
        if (totalEl) totalEl.textContent = Math.max(330, Number(snapshot.val()) || 330).toLocaleString("en-IN");
      }, error => console.warn("Total visits listener:", error));
    } catch (error) {
      console.warn("Total visit counter unavailable:", error);
      if (totalEl) totalEl.textContent = "330";
    }
  }
  startTotalVisitCounter();

  window.startRealtimeWatching = async function(streamId) {
    const count = document.getElementById("watchingCount");
    if (count) count.textContent = "330";
    try {
      if (countUnsubscribe) { countUnsubscribe(); countUnsubscribe = null; }
      if (viewerRef) { await remove(viewerRef).catch(() => {}); viewerRef = null; }

      firebaseApp = firebaseApp || initializeApp(firebaseConfig);
      if (!analyticsInstance && await isSupported().catch(() => false)) {
        try { analyticsInstance = getAnalytics(firebaseApp); } catch (analyticsError) { console.warn("Firebase Analytics unavailable:", analyticsError); }
      }
      const db = getDatabase(firebaseApp);
      const auth = getAuth(firebaseApp);
      await signInAnonymously(auth);

      const safeId = String(streamId || "all").replace(/[^a-zA-Z0-9_-]/g, "_");
      const viewerId = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "_" + Math.random().toString(36).slice(2));
      const path = "liveViewers/" + safeId;
      viewerRef = ref(db, path + "/" + viewerId);
      await onDisconnect(viewerRef).remove();
      await set(viewerRef, { joinedAt: Date.now() });

      countUnsubscribe = onValue(ref(db, path), snapshot => {
        const actual = snapshot.size ?? snapshot.numChildren();
        if (count) count.textContent = (330 + actual).toLocaleString("en-IN");
      }, error => console.warn("Firebase viewer count:", error));
      console.log("CRICZONE Firebase watching active:", safeId);
    } catch (error) {
      console.warn("Firebase watching unavailable; keeping base display:", error);
      if (count) count.textContent = "330";
    }
  };

  window.stopRealtimeWatching = async function() {
    if (countUnsubscribe) { countUnsubscribe(); countUnsubscribe = null; }
    if (viewerRef) { await remove(viewerRef).catch(() => {}); viewerRef = null; }
    const count = document.getElementById("watchingCount");
    if (count) count.textContent = "330";
  };

  window.addEventListener("pagehide", () => {
    if (viewerRef) remove(viewerRef).catch(() => {});
  });
</script>
