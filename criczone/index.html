            <button
                class="join"
                id="joinBtn"
            >
                JOIN TELEGRAM
            </button>

        </div>

    </div>

</div>

`;


        this.cacheElements();

        this.setupEvents();

        this.setupBackground();

        this.checkUnlock();

        this.fetchChannels();

        this.handleUrl();


        window.addEventListener(
            "popstate",
            () => this.handleUrl()
        );

    }


    /* =====================================================
       ELEMENT CACHE
       ===================================================== */

    cacheElements() {

        this.$ = {

            home:
                this.shadow.querySelector(
                    "#homeView"
                ),

            playerView:
                this.shadow.querySelector(
                    "#playerView"
                ),

            grid:
                this.shadow.querySelector(
                    "#channelsGrid"
                ),

            search:
                this.shadow.querySelector(
                    "#searchInput"
                ),

            player:
                this.shadow.querySelector(
                    "#player"
                ),

            playerBox:
                this.shadow.querySelector(
                    "#playerBox"
                ),

            playerTitle:
                this.shadow.querySelector(
                    "#playerTitle"
                ),

            modal:
                this.shadow.querySelector(
                    "#telegramModal"
                )

        };

    }


    /* =====================================================
       EVENTS
       ===================================================== */

    setupEvents() {

        this.shadow.querySelector(
            "#brandHome"
        ).onclick = () => {

            this.closePlayer();

        };


        this.shadow.querySelector(
            "#backBtn"
        ).onclick = () => {

            this.closePlayer();

        };


        this.shadow.querySelector(
            "#joinBtn"
        ).onclick = () => {

            this.joinTelegram();

        };


        this.shadow.querySelector(
            "#laterBtn"
        ).onclick = () => {

            this.closeModal();

        };


        this.shadow.querySelector(
            "#fullscreenBtn"
        ).onclick = () => {

            this.toggleFullscreen();

        };


        this.shadow.querySelector(
            "#shareBtn"
        ).onclick = () => {

            this.shareStream();

        };


        this.$.search.addEventListener(
            "input",
            () => this.applyFilters()
        );


        this.shadow
            .querySelectorAll(
                ".filter-btn"
            )
            .forEach(btn => {

                btn.addEventListener(
                    "click",
                    () => {

                        this.shadow
                            .querySelectorAll(
                                ".filter-btn"
                            )
                            .forEach(
                                b =>
                                    b.classList.remove(
                                        "active"
                                    )
                            );

                        btn.classList.add(
                            "active"
                        );

                        this.currentFilter =
                            btn.dataset.filter;

                        this.applyFilters();

                    }
                );

            });


        this.currentFilter =
            "all";

    }


    /* =====================================================
       FETCH CHANNELS
       ===================================================== */

    async fetchChannels() {

        try {

            const response =
                await fetch(
                    window.CricConfig.sourceUrl,
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Feed request failed"
                );

            }


            const data =
                await response.json();


            let channels = [];


            if (Array.isArray(data)) {

                channels = data;

            } else {

                channels =
                    data.iframes ||
                    data.channels ||
                    data.streams ||
                    data.data ||
                    [];

            }


            if (!Array.isArray(channels)) {

                channels = [];

            }


            this.masterChannels =
                channels;


            this.renderGrid();


            this.applyFilters();


            this.handleUrl();


        } catch (error) {

            console.error(
                "CRICZONE feed error:",
                error
            );


            this.$.grid.innerHTML = `

                <div class="state">

                    Unable to load channels.

                    <small>
                        Please refresh the page.
                    </small>

                </div>

            `;

        }

    }


    /* =====================================================
       RENDER CHANNELS
       ===================================================== */

    renderGrid() {

        this.$.grid.innerHTML = "";


        this.masterChannels.forEach(
            (channel, index) => {

                const id =
                    channel.id !== undefined
                        ? channel.id
                        : index;


                const title =
                    channel.title ||
                    channel.name ||
                    channel.channel ||
                    `Channel ${index + 1}`;


                const lower =
                    title.toLowerCase();


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "channel-card";


                card.dataset.title =
                    lower;


                card.dataset.id =
                    String(id);


                card.innerHTML = `

                    <div class="card-title">

                        ${this.escapeHtml(
                            title
                        )}

                    </div>


                    <div class="card-meta">

                        <span>
                            HD FEED
                        </span>

                        <span class="watch">
                            WATCH NOW →
                        </span>

                    </div>

                `;


                card.onclick = () => {

                    this.openPlayer(id);

                };


                this.$.grid.appendChild(
                    card
                );

            }
        );

    }


    /* =====================================================
       SEARCH / FILTER
       ===================================================== */

    applyFilters() {

        const query =
            (
                this.$.search.value ||
                ""
            )
            .trim()
            .toLowerCase();


        const filter =
            this.currentFilter ||
            "all";


        this.shadow
            .querySelectorAll(
                ".channel-card"
            )
            .forEach(card => {

                const title =
                    card.dataset.title ||
                    "";


                const matchesSearch =
                    !query ||
                    title.includes(
                        query
                    );


                let matchesFilter =
                    true;


                if (
                    filter === "sony"
                ) {

                    matchesFilter =
                        title.includes(
                            "sony"
                        );

                }


                if (
                    filter === "star"
                ) {

                    matchesFilter =
                        title.includes(
                            "star"
                        );

                }


                if (
                    filter === "sports"
                ) {

                    matchesFilter =
                        title.includes(
                            "sports"
                        );

                }


                if (
                    filter === "cricket"
                ) {

                    matchesFilter =
                        title.includes(
                            "cricket"
                        );

                }


                if (
                    filter === "hd"
                ) {

                    matchesFilter =
                        title.includes(
                            "hd"
                        );

                }


                card.style.display =
                    matchesSearch &&
                    matchesFilter
                        ? ""
                        : "none";

            });

    }


    /* =====================================================
       OPEN PLAYER
       ===================================================== */

    openPlayer(identifier) {

        const target =
            this.masterChannels.find(
                (channel, index) =>
                    String(
                        channel.id !== undefined
                            ? channel.id
                            : index
                    ) ===
                    String(identifier)
            );


        if (!target) {

            return;

        }


        let streamUrl =

            target.iframeSrc ||

            target.url ||

            target.link ||

            target.stream ||

            target.file ||

            target.source ||

            target.src;


        if (!streamUrl) {

            streamUrl =
                `https://sonucdn-v2.pages.dev/star.html?id=${encodeURIComponent(
                    target.id !== undefined
                        ? target.id
                        : identifier
                )}`;

        }


        this.currentStreamId =
            target.id !== undefined
                ? target.id
                : identifier;


        const title =
            target.title ||
            target.name ||
            target.channel ||
            "Live Stream";


        this.$.playerTitle.textContent =
            title;


        this.$.player.src =
            streamUrl;


        this.$.home.classList.add(
            "hidden"
        );


        this.$.playerView.classList.add(
            "active"
        );


        history.pushState(
            {
                id:
                    this.currentStreamId
            },
            "",
            `?id=${encodeURIComponent(
                this.currentStreamId
            )}`
        );


        this.startPreviewTimer();

    }


    /* =====================================================
       CLOSE PLAYER
       ===================================================== */

    closePlayer() {

        this.stopPreviewTimer();


        this.$.player.src =
            "about:blank";


        this.$.playerView.classList.remove(
            "active"
        );


        this.$.home.classList.remove(
            "hidden"
        );


        this.currentStreamId =
            null;


        if (
            window.location.search
        ) {

            history.pushState(
                {},
                "",
                window.location.pathname
            );

        }


        try {

            if (
                document.fullscreenElement
            ) {

                document.exitFullscreen();

            }

        } catch (e) {}

    }


    /* =====================================================
       URL ROUTING
       ===================================================== */

    handleUrl() {

        const id =
            new URLSearchParams(
                window.location.search
            ).get("id");


        if (!id) {

            return;

        }


        if (
            this.masterChannels.length
        ) {

            this.openPlayer(id);

        }

    }


    /* =====================================================
       PREVIEW TIMER
       ===================================================== */

    startPreviewTimer() {

        this.stopPreviewTimer();


        if (this.isUnlocked) {

            return;

        }


        this.lockTimer =
            setTimeout(
                () => {

                    this.showTelegramModal();

                },

                window.CricConfig
                    .previewDuration
            );

    }


    stopPreviewTimer() {

        if (
            this.lockTimer
        ) {

            clearTimeout(
                this.lockTimer
            );

            this.lockTimer =
                null;

        }

    }


    /* =====================================================
       TELEGRAM MODAL
       ===================================================== */

    showTelegramModal() {

        if (
            this.isUnlocked
        ) {

            return;

        }


        this.$.modal.classList.add(
            "show"
        );


        try {

            this.$.player.contentWindow.postMessage(
                "criczone-force-pause",
                "*"
            );

        } catch (e) {}

    }


    closeModal() {

        this.$.modal.classList.remove(
            "show"
        );

    }


    joinTelegram() {

        localStorage.setItem(
            "criczone_unlocked_time",
            Date.now().toString()
        );


        this.isUnlocked =
            true;


        this.closeModal();


        window.open(
            window.CricConfig.telegramLink,
            "_blank",
            "noopener,noreferrer"
        );


        try {

            this.$.player.contentWindow.postMessage(
                "criczone-force-play",
                "*"
            );

        } catch (e) {}

    }


    /* =====================================================
       UNLOCK STATUS
       ===================================================== */

    checkUnlock() {

        const value =
            localStorage.getItem(
                "criczone_unlocked_time"
            );


        if (!value) {

            return;

        }


        const time =
            Number(value);


        if (
            Date.now() - time <
            24 * 60 * 60 * 1000
        ) {

            this.isUnlocked =
                true;

        } else {

            localStorage.removeItem(
                "criczone_unlocked_time"
            );

        }

    }


    /* =====================================================
       FULLSCREEN
       ===================================================== */

    async toggleFullscreen() {

        const box =
            this.$.playerBox;


        try {

            if (
                !document.fullscreenElement
            ) {

                await box.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }


    /* =====================================================
       SHARE
       ===================================================== */

    async shareStream() {

        try {

            if (
                navigator.share
            ) {

                await navigator.share({

                    title:
                        "CRICZONE LIVE",

                    text:
                        this.$.playerTitle
                            .textContent,

                    url:
                        window.location.href

                });

            } else {

                await navigator.clipboard
                    .writeText(
                        window.location.href
                    );

                const btn =
                    this.shadow.querySelector(
                        "#shareBtn"
                    );


                const oldText =
                    btn.textContent;


                btn.textContent =
                    "COPIED!";


                setTimeout(
                    () => {

                        btn.textContent =
                            oldText;

                    },
                    1800
                );

            }

        } catch (error) {}

    }


    /* =====================================================
       BACKGROUND
       ===================================================== */

    setupBackground() {

        const canvas =
            this.shadow.querySelector(
                "#bgCanvas"
            );


        const ctx =
            canvas.getContext(
                "2d"
            );


        const resize =
            () => {

                canvas.width =
                    window.innerWidth;

                canvas.height =
                    window.innerHeight;

            };


        resize();


        window.addEventListener(
            "resize",
            resize
        );


        this.stars = [];


        for (
            let i = 0;
            i < 90;
            i++
        ) {

            this.stars.push({

                x:
                    Math.random() *
                    window.innerWidth,

                y:
                    Math.random() *
                    window.innerHeight,

                length:
                    10 +
                    Math.random() *
                    35,

                speed:
                    .4 +
                    Math.random() *
                    1.4,

                alpha:
                    .08 +
                    Math.random() *
                    .30

            });

        }


        const draw =
            () => {

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                for (
                    const star
                    of this.stars
                ) {

                    ctx.strokeStyle =
                        `rgba(
                            0,
                            255,
                            204,
                            ${star.alpha}
                        )`;


                    ctx.lineWidth =
                        1;


                    ctx.beginPath();


                    ctx.moveTo(
                        star.x,
                        star.y
                    );


                    ctx.lineTo(
                        star.x +
                        star.length,
                        star.y
                    );


                    ctx.stroke();


                    star.x +=
                        star.speed;


                    if (
                        star.x >
                        canvas.width
                    ) {

                        star.x =
                            -star.length;

                        star.y =
                            Math.random() *
                            canvas.height;

                    }

                }


                this.animationFrameId =
                    requestAnimationFrame(
                        draw
                    );

            };


        draw();

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    escapeHtml(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }

}


/* =========================================================
   REGISTER
   ========================================================= */

customElements.define(
    "criczone-ui",
    CriczoneUI
);

</script>
