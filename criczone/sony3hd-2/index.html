<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>CRICZONE | Sony 3 HD-2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;font-family:Inter,system-ui,Arial,sans-serif}
#loading{position:fixed;inset:0;z-index:2;display:grid;place-content:center;gap:14px;text-align:center;color:#cbd5e1;background:radial-gradient(ellipse at 50% 30%,#14264a 0,transparent 55%),#070b16;transition:opacity .25s ease}
#loading.hide{opacity:0;pointer-events:none}
.brand{font-weight:800;letter-spacing:.12em;color:#f8fafc;font-size:18px}
.sub{font-size:11px;letter-spacing:.2em;color:#8fa4c8}
.spinner{width:34px;height:34px;margin:auto;border:3px solid #253453;border-top-color:#39b8ff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div class="brand">CRICZONE</div><div class="sub">SONY 3 HD-2 · LIVE</div></div>
<iframe src="https://criczone.pages.dev/sonychannels/#sony-sports-hindi-hd" title="Sony 3 HD-2" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
const frame=document.querySelector("iframe");
frame.addEventListener("load",()=>document.getElementById("loading").classList.add("hide"),{once:true});
</script>
</body>
</html>
