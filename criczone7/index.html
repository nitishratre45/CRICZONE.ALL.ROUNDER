<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    background: #020608;

    overflow: hidden;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
}


/* =========================================================
   PLAYER CONTAINER
========================================================= */

.player-container {

    position: fixed;

    inset: 0;

    background:
        radial-gradient(
            circle at center,
            #071218 0%,
            #020608 55%,
            #000 100%
        );

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;
}


/* =========================================================
   VIDEO
========================================================= */

video {

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    display: block;
}


/* =========================================================
   PLYR
========================================================= */

.plyr {

    width: 100%;
    height: 100%;

    --plyr-color-main: #00d9ff;

    --plyr-video-background: #000;

    --plyr-menu-background: rgba(5,10,15,.97);

    --plyr-menu-color: #fff;
}

.plyr__video-wrapper {

    height: 100%;

    background: #000;
}

.plyr--video {

    background: #000;
}

.plyr__controls {

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.92),
            rgba(0,0,0,.35),
            transparent
        ) !important;

    backdrop-filter: blur(8px);

    padding-top: 40px !important;
}

.plyr__control--overlaid {

    background:
        linear-gradient(
            135deg,
            #00d9ff,
            #008cff
        ) !important;

    box-shadow:
        0 10px 40px rgba(0,180,255,.35);
}

.plyr__control--overlaid svg {

    fill: #fff !important;
}

.plyr__menu__container {

    background:
        rgba(5,10,15,.97) !important;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius: 14px;

    backdrop-filter: blur(15px);
}

.plyr__progress__played {

    background: #00d9ff !important;
}

.plyr__progress__buffer {

    background:
        rgba(255,255,255,.18) !important;
}


/* =========================================================
   CRICZONE TOP BRAND
========================================================= */

.criczone-brand {

    position: absolute;

    top: 18px;
    left: 20px;

    z-index: 80;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 8px 13px;

    border-radius: 12px;

    background:
        rgba(2,8,12,.72);

    border:
        1px solid rgba(0,217,255,.14);

    backdrop-filter: blur(12px);

    box-shadow:
        0 10px 35px rgba(0,0,0,.35);

    pointer-events: none;
}

.brand-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #00d9ff;

    box-shadow:
        0 0 14px rgba(0,217,255,.9);
}

.brand-name {

    color: #fff;

    font-size: 14px;

    font-weight: 900;

    letter-spacing: .8px;

    text-transform: uppercase;
}

.brand-name span {

    color: #00d9ff;
}


/* =========================================================
   LIVE WATCHING
========================================================= */

.live-watching {

    position: absolute;

    top: 18px;
    right: 20px;

    z-index: 80;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 8px 13px;

    border-radius: 999px;

    background:
        rgba(2,8,12,.82);

    border:
        1px solid rgba(255,255,255,.12);

    backdrop-filter: blur(14px);

    box-shadow:
        0 10px 35px rgba(0,0,0,.4);

    color: #fff;

    user-select: none;

    pointer-events: none;
}

.live-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #00e676;

    box-shadow:
        0 0 0 4px rgba(0,230,118,.12),
        0 0 14px rgba(0,230,118,.8);

    animation:
        livePulse 1.5s infinite;
}

@keyframes livePulse {

    0%,
    100% {

        transform: scale(1);

        opacity: 1;
    }

    50% {

        transform: scale(.7);

        opacity: .55;
    }
}

.live-text {

    font-size: 10px;

    font-weight: 800;

    letter-spacing: .7px;

    color: rgba(255,255,255,.62);
}

.live-count {

    min-width: 24px;

    color: #00e676;

    font-size: 13px;

    font-weight: 900;

    text-align: center;

    font-variant-numeric:
        tabular-nums;
}


/* =========================================================
   WATERMARK
========================================================= */

.custom-watermark {

    position: absolute;

    z-index: 40;

    pointer-events: none;

    bottom: 80px;

    right: 20px;

    font-size: 11px;

    font-weight: 700;

    color:
        rgba(255,255,255,.13);

    letter-spacing: .7px;

    text-transform: uppercase;
}


/* =========================================================
   LOADING
========================================================= */

.loading-overlay {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background: #000;

    color: #fff;

    z-index: 2000;

    font-size: 14px;

    pointer-events: none;

    transition:
        opacity .3s ease;
}

.loading-overlay.hidden {

    opacity: 0;

}

.spinner {

    width: 42px;

    height: 42px;

    border-radius: 50%;

    border:
        4px solid
        rgba(255,255,255,.12);

    border-top-color:
        #00d9ff;

    animation:
        spin .8s linear infinite;

    margin-bottom: 14px;
}

@keyframes spin {

    to {

        transform:
            rotate(360deg);
    }
}


/* =========================================================
   STATUS
========================================================= */

.connection-status {

    position: absolute;

    left: 20px;

    bottom: 78px;

    z-index: 70;

    padding: 7px 11px;

    border-radius: 8px;

    background:
        rgba(0,0,0,.65);

    color:
        rgba(255,255,255,.55);

    font-size: 10px;

    border:
        1px solid
        rgba(255,255,255,.07);

    backdrop-filter: blur(8px);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:700px) {

    .criczone-brand {

        top: 12px;
        left: 12px;

        padding: 7px 10px;
    }

    .brand-name {

        font-size: 12px;
    }

    .live-watching {

        top: 12px;
        right: 12px;

        padding: 7px 10px;
    }

    .live-text {

        font-size: 9px;
    }

    .live-count {

        font-size: 11px;
    }

    .live-dot {

        width: 7px;
        height: 7px;
    }

    .custom-watermark {

        right: 14px;

        bottom: 70px;

        font-size: 9px;
    }

    .connection-status {

        left: 12px;

        bottom: 70px;
    }
}

html{scroll-behavior:smooth}button,a,input,select{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid rgba(52,211,153,.9)!important;outline-offset:3px!important}.header,.nav,#ch-header,.list-header{backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15);box-shadow:0 8px 30px rgba(0,0,0,.12)}.search-box,.search input,.cc-search input,#cc-sort{border-radius:12px!important;transition:border-color .2s,box-shadow .2s,background .2s!important}.search-box:focus-within,.search input:focus,.cc-search input:focus{border-color:rgba(52,211,153,.55)!important;box-shadow:0 0 0 4px rgba(52,211,153,.09),0 10px 30px rgba(0,0,0,.14)!important}.filter-btn,.cc-chip{border-radius:999px!important;font-weight:700!important}.filter-btn:hover,.cc-chip:hover{transform:translateY(-1px);border-color:rgba(52,211,153,.45)!important}.channel-card,.ch-card{overflow:hidden;border-radius:18px!important;box-shadow:0 10px 28px rgba(0,0,0,.18)}.channel-card:hover,.ch-card:hover{transform:translateY(-5px);box-shadow:0 18px 42px rgba(0,0,0,.30),0 0 0 1px rgba(52,211,153,.14)}.channel-card img,.ch-card img{transition:transform .45s cubic-bezier(.2,.7,.2,1),filter .3s}.channel-card:hover img,.ch-card:hover img{transform:scale(1.045);filter:saturate(1.08) brightness(1.04)}#cc-hero{overflow:hidden;border-radius:22px!important;box-shadow:0 20px 55px rgba(0,0,0,.25)}*{scrollbar-width:thin;scrollbar-color:rgba(52,211,153,.35) transparent}*::-webkit-scrollbar{width:8px;height:8px}*::-webkit-scrollbar-track{background:transparent}*::-webkit-scrollbar-thumb{background:rgba(52,211,153,.28);border-radius:999px}*::-webkit-scrollbar-thumb:hover{background:rgba(52,211,153,.5)}@media(max-width:700px){.channel-card,.ch-card{border-radius:15px!important}.search-box,.search input,.cc-search input,#cc-sort{min-height:44px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<!-- =========================================================
     PLAYER
========================================================= -->

<div
    class="player-container"
    id="playerContainer"
>


    <!-- CRICZONE BRAND -->

    <div class="criczone-brand">

        <span class="brand-dot"></span>

<script>

(function () {

"use strict";


/* =========================================================
   STREAM CONFIG
========================================================= */

const STREAM_URL =
"https://cdn-vl-gcp-bornan-e-01.vos360.video/Content/LiveEvent/ea5fc9ae-d5ac-4a8f-bd7f-b67790799977/HLS_ENC/index.m3u8";


/* =========================================================
   TELEGRAM
========================================================= */

const TELEGRAM_LINK =
"https://t.me/+5hrS9VoLS8tjOTM1";


/* =========================================================
   DOM
========================================================= */

const video =
document.getElementById("video");

const container =
document.getElementById("playerContainer");

const loading =
document.getElementById("loading");

const watchingCount =
document.getElementById("watchingCount");

const connectionStatus =
document.getElementById("connectionStatus");


/* =========================================================
   PLAYER VARIABLES
========================================================= */

let hlsInstance = null;

let plyrInstance = null;

let userPaused = false;

let isInitialized = false;


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyDm3DIHJfRPEqNqrUlYJutRQm8XIA6H3fs",

    authDomain:
    "cricket-live-39106.firebaseapp.com",

    databaseURL:
    "https://cricket-live-39106-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "cricket-live-39106",

    storageBucket:
    "cricket-live-39106.firebasestorage.app",

    messagingSenderId:
    "841890143",

    appId:
    "1:841890143:web:ca5b87c9395bdc19145eea",

    measurementId:
    "G-ZNEZC8YVMX"
};


/* =========================================================
   FIREBASE INITIALIZE
========================================================= */

let database = null;

let viewerRef = null;

let viewersRef = null;

let firebaseReady = false;


try {

    firebase.initializeApp(firebaseConfig);

    database =
        firebase.database();

    firebaseReady = true;

} catch (error) {

    console.error(
        "Firebase initialization error:",
        error
    );

}


/* =========================================================
   CHANNEL ID
========================================================= */

const params =
new URLSearchParams(
    window.location.search
);

const channelId =
params.get("id") || "default";


/* =========================================================
   UNIQUE VIEWER ID
========================================================= */

const viewerId =

"viewer_" +

Date.now() +

"_" +

Math.random()
    .toString(36)
    .substring(2,10);


/* =========================================================
   FIREBASE PRESENCE
========================================================= */

function setupFirebasePresence() {

    if (!firebaseReady) {

        connectionStatus.textContent =
            "Live";

        return;
    }


    viewersRef =
        database.ref(
            "liveWatchers/" +
            channelId
        );


    viewerRef =
        viewersRef.child(
            viewerId
        );


    /*
       Firebase connection state
    */

    const connectedRef =
        database.ref(".info/connected");


    connectedRef.on(
        "value",
        function(snapshot) {

            if (
                snapshot.val() === true
            ) {

                connectionStatus.textContent =
                    "● Live";

                connectionStatus.style.color =
                    "#00e676";


                /*
                   Register viewer
                */

                viewerRef.set({

                    joinedAt:
                        firebase.database
                            .ServerValue
                            .TIMESTAMP

                });


                /*
                   Remove automatically
                   when connection drops
                */

                viewerRef
                    .onDisconnect()
                    .remove();

            } else {

                connectionStatus.textContent =
                    "Connecting...";

                connectionStatus.style.color =
                    "#aaa";
            }

        }
    );


    /*
       Real-time watcher count
    */

    viewersRef.on(
        "value",
        function(snapshot) {

            const count =
                snapshot.numChildren();


            watchingCount.textContent =
                count.toLocaleString();

        }
    );

}


/* =========================================================
   REMOVE VIEWER
========================================================= */

function removeViewer() {

    if (
        viewerRef
    ) {

        viewerRef.remove()
            .catch(function () {});

    }

}


/* =========================================================
   PAGE CLOSE
========================================================= */

window.addEventListener(
    "beforeunload",
    removeViewer
);


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    function () {

        /*
           Do not count hidden tabs
           as active viewers.
        */

        if (
            document.hidden
        ) {

            if (viewerRef) {

                viewerRef.remove()
                    .catch(function () {});

            }

        } else {

            if (
                isInitialized &&
                firebaseReady
            ) {

                viewerRef
                    .set({

                        joinedAt:
                            firebase.database
                                .ServerValue
                                .TIMESTAMP

                    })
                    .catch(function () {});

            }

        }

    }
);


/* =========================================================
   LOADING
========================================================= */

function hideLoading() {

    if (!loading) return;

    loading.classList.add(
        "hidden"
    );

    setTimeout(
        function () {

            loading.style.display =
                "none";

        },
        350
    );

}


function showLoading() {

    if (!loading) return;

    loading.style.display =
        "flex";

    loading.classList.remove(
        "hidden"
    );

}


/* =========================================================
   DESTROY PLAYER
========================================================= */

function destroyPlayer() {

    if (hlsInstance) {

        try {

            hlsInstance.destroy();

        } catch (_) {}

        hlsInstance = null;
    }


    if (plyrInstance) {

        try {

            plyrInstance.destroy();

        } catch (_) {}

        plyrInstance = null;
    }

}


/* =========================================================
   PAUSE / RESUME
========================================================= */

function setupPauseResumeLogic(
    video
) {


    video.addEventListener(
        "play",
        function () {

            userPaused = false;

        }
    );


    video.addEventListener(
        "pause",
        function () {

            if (
                !video.ended &&
                !userPaused &&
                isInitialized
            ) {

                setTimeout(
                    function () {

                        if (
                            video.paused &&
                            !video.ended &&
                            !userPaused
                        ) {

                            video.play()
                                .catch(
                                    function () {}
                                );

                        }

                    },
                    1000
                );

            }

        }
    );


    /*
       Periodic recovery
    */

    setInterval(
        function () {

            if (
                video.paused &&
                !video.ended &&
                !userPaused &&
                isInitialized
            ) {

                video.play()
                    .catch(
                        function () {}
                    );

            }

        },
        5000
    );

}


/* =========================================================
   NATIVE HLS FALLBACK
========================================================= */

function fallbackToNative(
    video
) {

    console.log(
        "Using native HLS fallback"
    );


    destroyPlayer();


    video.src =
        STREAM_URL;


    video.muted =
        false;


    plyrInstance =
        new Plyr(
            video,
            {

                controls: [

                    "play-large",

                    "play",

                    "progress",

                    "current-time",

                    "mute",

                    "volume",

                    "settings",

                    "fullscreen"

                ]

            }
        );


    video.pause();


    isInitialized =
        true;


    video.addEventListener(
        "loadeddata",
        hideLoading
    );


    setTimeout(
        hideLoading,
        3000
    );


    setupPauseResumeLogic(
        video
    );

}


/* =========================================================
   HLS PLAYER
========================================================= */

async function initPlayer() {

    showLoading();


    destroyPlayer();


    try {


        /* =========================================
           HLS.JS
        ========================================= */

        if (
            Hls.isSupported()
        ) {


            const hls =
                new Hls({

                    maxBufferLength:
                        30,

                    maxMaxBufferLength:
                        60,

                    liveSyncDurationCount:
                        3,

                    liveMaxLatencyDurationCount:
                        6,

                    enableWorker:
                        true,

                    lowLatencyMode:
                        false,

                    xhrSetup:
                        function (
                            xhr
                        ) {

                            xhr.withCredentials =
                                false;

                        }

                });


            hlsInstance =
                hls;


            hls.loadSource(
                STREAM_URL
            );


            hls.attachMedia(
                video
            );


            /* =========================================
               MANIFEST
            ========================================= */

            hls.on(
                Hls.Events.MANIFEST_PARSED,
                function () {


                    const levels =
                        hls.levels

                            .map(
                                function (level) {

                                    return level.height;

                                }
                            )

                            .filter(
                                Boolean
                            )

                            .sort(
                                function (a,b) {

                                    return a - b;

                                }
                            );


                    /* =========================================
                       PLYR
                    ========================================= */

                    plyrInstance =
                        new Plyr(
                            video,
                            {

                                controls: [

                                    "play-large",

                                    "play",

                                    "progress",

                                    "current-time",

                                    "mute",

                                    "volume",

                                    "settings",

                                    "fullscreen"

                                ],


                                settings: [

                                    "quality"

                                ],


                                quality: {

                                    default:
                                        levels[
                                            levels.length - 1
                                        ] || 720,

                                    options:
                                        levels.length
                                            ? levels
                                            : [
                                                360,
                                                480,
                                                720,
                                                1080
                                            ],

                                    forced:
                                        true,


                                    onChange:
                                        function (
                                            newQuality
                                        ) {

                                            hls.levels
                                                .forEach(
                                                    function (
                                                        level,
                                                        index
                                                    ) {

                                                        if (
                                                            level.height ===
                                                            newQuality
                                                        ) {

                                                            hls.currentLevel =
                                                                index;

                                                        }

                                                    }
                                                );

                                        }

                                }

                            }
                        );


                    /*
                       Start muted.
                       Browser autoplay rules.
                    */

                    video.muted =
                        true;


                    video.pause();


                    isInitialized =
                        true;


                    /*
                       Start Firebase
                    */

                    setupFirebasePresence();


                    /*
                       Loading
                    */

                    video.addEventListener(
                        "loadeddata",
                        hideLoading
                    );


                    setTimeout(
                        hideLoading,
                        3000
                    );


                    /*
                       Pause recovery
                    */

                    setupPauseResumeLogic(
                        video
                    );


                }
            );


            /* =========================================
               HLS ERROR
            ========================================= */

            hls.on(
                Hls.Events.ERROR,
                function (
                    event,
                    data
                ) {

                    console.warn(
                        "HLS:",
                        data
                    );


                    if (
                        data.fatal
                    ) {


                        if (
                            data.type ===
                            Hls.ErrorTypes.NETWORK_ERROR
                        ) {

                            console.log(
                                "Recovering network..."
                            );

                            hls.startLoad();


                        } else if (
                            data.type ===
                            Hls.ErrorTypes.MEDIA_ERROR
                        ) {

                            console.log(
                                "Recovering media..."
                            );

                            hls.recoverMediaError();


                        } else {

                            console.warn(
                                "Fatal HLS error"
                            );

                            fallbackToNative(
                                video
                            );

                        }

                    }

                }
            );


        } else {


            /*
               Safari / native HLS
            */

            fallbackToNative(
                video
            );

        }


    } catch (
        error
    ) {

        console.error(
            "Init error:",
            error
        );


        fallbackToNative(
            video
        );

    }

}


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        initPlayer();

    }
);


/* =========================================================
   VISIBILITY RECOVERY
========================================================= */

document.addEventListener(
    "visibilitychange",
    function () {

        if (
            !document.hidden &&
            video &&
            video.paused &&
            !video.ended &&
            isInitialized
        ) {

            video.play()
                .catch(
                    function () {}
                );

        }

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === " "
        ) {

            if (
                document.activeElement.tagName ===
                "INPUT"
            ) {

                return;
            }


            if (
                video.paused
            ) {

                video.play()
                    .catch(
                        function () {}
                    );

            } else {

                userPaused =
                    true;

                video.pause();

            }

        }

    }
);

})();

</script>
