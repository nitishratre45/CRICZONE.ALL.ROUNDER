<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{color-scheme:dark;--gold:#ffd34e;--ink:#0b0b08;--panel:#17150e;--muted:#b9ad8e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#080807;color:#fffdf5;font-family:Inter,system-ui,sans-serif}
body{min-height:100vh;min-height:100dvh;min-height:100svh}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(14px,env(safe-area-inset-left));background:linear-gradient(110deg,#211b0c,#11110d);border-bottom:1px solid #5d4818}
.brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:900;letter-spacing:.3px}.brand span{color:var(--gold)}.brand-photo{width:38px;height:38px;flex:0 0 38px;object-fit:cover;object-position:center;border-radius:12px;border:1px solid #f7d66b;box-shadow:0 0 0 3px #ffd34e18,0 6px 16px #0007;background:#17150e}
.actions{display:flex;gap:8px}.btn{min-height:40px;display:inline-flex;align-items:center;justify-content:center;padding:9px 13px;border:1px solid #6d551c;border-radius:11px;background:#29220f;color:#ffe38a;font:700 12px Inter, sans-serif;text-decoration:none;cursor:pointer}
.btn.primary{background:linear-gradient(120deg,#ffe37a,#f5bf32);color:#211805;border-color:#ffe37a}
main{width:min(100%,1050px);margin:0 auto;padding:14px}
.player-card{overflow:hidden;border:1px solid #5d4818;border-radius:16px;background:#090908;box-shadow:0 20px 70px #0008}
.player-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;background:linear-gradient(110deg,#211b0c,#11110d);border-bottom:1px solid #3d3218}
.kicker{font-size:10px;font-weight:900;letter-spacing:2px;color:var(--gold);margin-bottom:5px}.channel-name{font-size:19px;font-weight:850;overflow-wrap:anywhere}
.frame{position:relative;width:100%;aspect-ratio:16/9;min-height:0;background:#000;overflow:hidden}.frame:before{content:"";display:block;padding-top:56.25%}.frame{aspect-ratio:auto}.frame:before{display:none}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;display:block;border:0;background:#000;max-width:100%}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle,#30270f,#080807 72%);color:#fff0bd;font-size:13px;pointer-events:none}
.loading.hidden{display:none}.spinner{width:30px;height:30px;border:3px solid #6e571b;border-top-color:#ffd34e;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.telegram{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(110deg,#1d190d,#11110d);border-top:1px solid #5d4818}
.tg-icon{display:grid;place-items:center;flex:0 0 42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#ffe37a,#e8ad22);color:#211805;font-size:21px;font-weight:900}
.tg-copy{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}.tg-copy strong{font-size:13px}.tg-copy span{font-size:11px;line-height:1.4;color:var(--muted)}
.hint{padding:14px 4px 4px;text-align:center;color:#9f967e;font-size:11px}
@media(max-width:600px){.top{padding:calc(10px + env(safe-area-inset-top)) 12px 10px}.brand{font-size:14px}.brand-photo{width:34px;height:34px;flex-basis:34px;border-radius:10px}.btn{min-height:38px;padding:8px 10px;font-size:11px}main{padding:10px 8px}.player-card{border-radius:13px}.player-head{padding:11px 12px}.channel-name{font-size:17px}.telegram{padding:12px;gap:9px;flex-wrap:wrap}.tg-icon{width:36px;height:36px;flex-basis:36px;font-size:18px}.tg-copy{min-width:calc(100% - 60px)}.tg-copy strong{font-size:12px}.tg-copy span{font-size:10px}.telegram .btn{width:100%;min-height:42px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Cross-device fallbacks for Safari/iOS, Android WebView and narrow screens. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:auto}
button,a{-webkit-appearance:none;appearance:none;touch-action:manipulation}
.frame{height:auto;min-height:0}
@supports not (aspect-ratio:16/9){.frame{height:0;padding-top:56.25%}.frame iframe,.frame .loading{height:100%}}
@media(max-width:380px){.actions{gap:5px}.btn{padding:8px;font-size:10px}.channel-name{font-size:16px}main{padding-left:6px;padding-right:6px}}
@media(orientation:landscape) and (max-height:500px){main{padding-top:8px}.top{padding-top:8px;padding-bottom:8px}.player-head{padding:8px 12px}.frame{max-height:calc(100vh - 120px)}.telegram{padding:8px 12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

/* Ensure the iframe has real height on mobile: previous overrides collapsed this wrapper to 0px. */
.frame{width:100%;height:auto;min-height:180px;aspect-ratio:16/9;position:relative}
.frame:before{display:none!important;content:none!important}
.frame iframe,.frame .loading{position:absolute;inset:0;width:100%;height:100%}


/* Premium champagne-gold palette, matched to the channel directory. */
:root{--gold:#c6a66b;--ink:#0b0c0e;--panel:#17191c;--muted:#b8b1a3}
html,body{background:#090b0e;color:#f4f0e7}

.btn:hover{border-color:#c6a66b;background:linear-gradient(135deg,#373024,#1c1d1d)}
.btn.primary{background:linear-gradient(120deg,#e0d0a8,#b99b65);color:#211c12;border-color:#e8d7af;box-shadow:0 7px 20px #0003}

</style>

<style id="criczone-live-watching">
.live-watching{display:flex;align-items:center;gap:7px;margin-top:8px;min-height:20px;color:#a8bed8;font-size:11px;font-weight:700;letter-spacing:.25px}
.live-watching-dot{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:#38d996;box-shadow:0 0 10px #38d99688;animation:czLivePulse 1.5s ease-in-out infinite}

<body>
<header class="top">
  <div class="brand"><img class="brand-photo" src="../photos/photo_2026-10-28_14-52-23.jpg" alt="CRICZONE logo"><span>CRICZONE</span></div>
  <div class="actions"><a class="btn" href="./">← All Channels</a><button class="btn primary" id="reload-player" type="button">↻ Reload</button></div>
</header>
<main>
  <section class="player-card" aria-label="Live channel player">
    <div class="player-head"><div><div class="kicker">NOW PLAYING</div><div class="channel-name" id="channel-name">Loading channel…</div>
<div class="live-watching" role="status" aria-live="polite"><span class="live-watching-dot"></span><span id="live-watching-count">Connecting…</span><span class="live-watching-label">WATCHING LIVE</span></div></div><a class="btn" href="./" aria-label="Back to all channels">✕</a></div>
    <div class="frame"><div class="loading" id="loading"><span class="spinner"></span><span>Connecting to channel…</span></div><iframe id="stream-frame" title="CRICZONE live channel" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen webkitallowfullscreen playsinline referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <aside class="telegram"><div class="tg-icon" aria-hidden="true">✈</div><div class="tg-copy"><strong>Join CRICZONE on Telegram</strong><span>Get live updates, channel news and backup links.</span></div><a class="btn primary" href="https://t.me/criczonelive" target="_blank" rel="noopener noreferrer">Join Channel ↗</a></aside>
  </section>
  <p class="hint">Refresh this page to reload the same selected channel.</p>
</main>
<script src="stream.js?v=20261029-crossdevice1"></script>
<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const channelId = params.get('channel');
  const name = document.getElementById('channel-name');
  const frame = document.getElementById('stream-frame');
  const loading = document.getElementById('loading');
  const reload = document.getElementById('reload-player');
  let currentUrl = '';
  function showMessage(message) {
    loading.replaceChildren();
    const text = document.createElement('span');
    text.textContent = message;
    loading.appendChild(text);
  }
  function loadChannel() {
    const item = (window.streamsData || {})[channelId];
    if (!channelId || !item || !item.url || !(item.url.startsWith('https://') || item.url.startsWith('http://'))) {
      name.textContent = 'Channel unavailable';
      showMessage('This channel ID is missing or has no configured stream.');
      const back = document.createElement('a');
      back.className = 'btn primary';
      back.href = './';
      back.textContent = 'Back to all channels';
      loading.appendChild(back);
      return false;
    }
    currentUrl = item.url;
    name.textContent = item.name || 'Live Channel';
    document.title = 'CRICZONE — ' + name.textContent;
    loading.classList.remove('hidden');
    frame.src = currentUrl;
    return true;
  }
  frame.addEventListener('load', () => {
    // load fires for cross-origin frames too; hide the overlay after navigation has started.
    loading.classList.add('hidden');
  });
  reload.addEventListener('click', () => {
    if (!currentUrl) { loadChannel(); return; }
    loading.classList.remove('hidden');
    frame.src = 'about:blank';
    window.setTimeout(() => { frame.src = currentUrl; }, 100);
  });
  // stream.js is loaded synchronously above; retry briefly for slow Safari/WebView startup.
  if (!loadChannel()) {
    let tries = 0;
    const retry = window.setInterval(() => {
      tries += 1;
      if (loadChannel() || tries >= 20) window.clearInterval(retry);
    }, 250);
  }
})();
</script>
<script type="module">
/* Realtime live-watching presence, using the existing CRICZONE Firebase project. */
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getDatabase, ref, onValue, onDisconnect, set, remove } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCFusKEh9wF7O6yux5xLQgafvcr_jCv5aA",
  authDomain: "criczone-4daa2.firebaseapp.com",
  databaseURL: "https://criczone-4daa2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "criczone-4daa2",
  storageBucket: "criczone-4daa2.firebasestorage.app",
  messagingSenderId: "113293633217",
  appId: "1:113293633217:web:a96d9b3af3045bcd99d640",
  measurementId: "G-Q9RJ0VSSPP"
};

const countEl = document.getElementById("live-watching-count");
const params = new URLSearchParams(location.search);
const channelKey = params.get("channel");
const safeKey = String(channelKey || "unknown").replace(/[.#$\[\]\/]/g, "_");
let db, presenceRef, unsubscribeCount, presenceStarted = false;

function showCount(value) {
  if (countEl) countEl.textContent = Number(value).toLocaleString("en-IN");
}

async function startPresence() {
  if (!channelKey || presenceStarted) {
    if (!channelKey && countEl) countEl.textContent = "—";
    return;
  }
  presenceStarted = true;
  try {
    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    db = getDatabase(app);
    const auth = getAuth(app);
    await signInAnonymously(auth);
    const viewerId = globalThis.crypto?.randomUUID?.() || (Date.now() + "_" + Math.random().toString(36).slice(2));
    const channelPath = "liveViewers/" + safeKey;
    presenceRef = ref(db, channelPath + "/" + viewerId);
    await onDisconnect(presenceRef).remove();
    await set(presenceRef, { online: true, joinedAt: Date.now(), page: "criczone10" });
    unsubscribeCount = onValue(ref(db, channelPath), snapshot => {
      const data = snapshot.val() || {};
      showCount(150 + Object.keys(data).length);
    }, error => {
      console.warn("CRICZONE live-watching count unavailable:", error);
      if (countEl) countEl.textContent = "—";
    });
  } catch (error) {
    console.warn("CRICZONE Firebase presence unavailable:", error);
    if (countEl) countEl.textContent = "—";
    presenceStarted = false;
  }
}

async function leavePresence() {
  if (unsubscribeCount) unsubscribeCount();
  if (presenceRef) {
    try { await remove(presenceRef); } catch (error) {}
    presenceRef = null;
  }
}
window.addEventListener("pagehide", leavePresence);
startPresence();
</script>
