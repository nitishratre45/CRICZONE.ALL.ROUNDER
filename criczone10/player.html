html,body{margin:0;min-height:100%;background:#080807;color:#fffdf5;font-family:Inter,system-ui,sans-serif}
body{min-height:100vh;min-height:100dvh;min-height:100svh}

.kicker{font-size:10px;font-weight:900;letter-spacing:2px;color:var(--gold);margin-bottom:5px}.channel-name{font-size:19px;font-weight:850;overflow-wrap:anywhere}
.frame{position:relative;width:100%;aspect-ratio:16/9;min-height:0;background:#000;overflow:hidden}.frame:before{content:"";display:block;padding-top:56.25%}.frame{aspect-ratio:auto}.frame:before{display:none}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;display:block;border:0;background:#000;max-width:100%}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle,#30270f,#080807 72%);color:#fff0bd;font-size:13px;pointer-events:none}
.loading.hidden{display:none}.spinner{width:30px;height:30px;border:3px solid #6e571b;border-top-color:#ffd34e;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* Cross-device fallbacks for Safari/iOS, Android WebView and narrow screens. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:auto}
button,a{-webkit-appearance:none;appearance:none;touch-action:manipulation}
.frame{height:auto;min-height:0}
@supports not (aspect-ratio:16/9){.frame{height:0;padding-top:56.25%}.frame iframe,.frame .loading{height:100%}}
@media(max-width:380px){.actions{gap:5px}.btn{padding:8px;font-size:10px}.channel-name{font-size:16px}main{padding-left:6px;padding-right:6px}}
@media(orientation:landscape) and (max-height:500px){main{padding-top:8px}.top{padding-top:8px;padding-bottom:8px}.player-head{padding:8px 12px}.frame{max-height:calc(100vh - 120px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

/* Ensure the iframe has real height on mobile: previous overrides collapsed this wrapper to 0px. */
.frame{width:100%;height:auto;min-height:180px;aspect-ratio:16/9;position:relative}
.frame:before{display:none!important;content:none!important}
.frame iframe,.frame .loading{position:absolute;inset:0;width:100%;height:100%}

<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const channelId = params.get('channel');
  const name = document.getElementById('channel-name');
  const frame = document.getElementById('stream-frame');
  const loading = document.getElementById('loading');
  const reload = document.getElementById('reload-player');
  let currentUrl = '';
  function showMessage(message) {
    loading.replaceChildren();
    const text = document.createElement('span');
    text.textContent = message;
    loading.appendChild(text);
  }
  function loadChannel() {
    const item = (window.streamsData || {})[channelId];
    if (!channelId || !item || !item.url || !(item.url.startsWith('https://') || item.url.startsWith('http://'))) {
      name.textContent = 'Channel unavailable';
      showMessage('This channel ID is missing or has no configured stream.');
      const back = document.createElement('a');
      back.className = 'btn primary';
      back.href = './';
      back.textContent = 'Back to all channels';
      loading.appendChild(back);
      return false;
    }
    currentUrl = item.url;
    name.textContent = item.name || 'Live Channel';
    document.title = 'CRICZONE — ' + name.textContent;
    loading.classList.remove('hidden');
    frame.src = currentUrl;
    return true;
  }
  frame.addEventListener('load', () => {
    // load fires for cross-origin frames too; hide the overlay after navigation has started.
    loading.classList.add('hidden');
  });
  reload.addEventListener('click', () => {
    if (!currentUrl) { loadChannel(); return; }
    loading.classList.remove('hidden');
    frame.src = 'about:blank';
    window.setTimeout(() => { frame.src = currentUrl; }, 100);
  });
  // stream.js is loaded synchronously above; retry briefly for slow Safari/WebView startup.
  if (!loadChannel()) {
    let tries = 0;
    const retry = window.setInterval(() => {
      tries += 1;
      if (loadChannel() || tries >= 20) window.clearInterval(retry);
    }, 250);
  }
})();
</script>
<script type="module">
/* Realtime live-watching presence, using the existing CRICZONE Firebase project. */
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getDatabase, ref, onValue, onDisconnect, set, remove } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCFusKEh9wF7O6yux5xLQgafvcr_jCv5aA",
  authDomain: "criczone-4daa2.firebaseapp.com",
  databaseURL: "https://criczone-4daa2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "criczone-4daa2",
  storageBucket: "criczone-4daa2.firebasestorage.app",
  messagingSenderId: "113293633217",
  appId: "1:113293633217:web:a96d9b3af3045bcd99d640",
  measurementId: "G-Q9RJ0VSSPP"
};

const countEl = document.getElementById("live-watching-count");
const params = new URLSearchParams(location.search);
const channelKey = params.get("channel");
const safeKey = String(channelKey || "unknown").replace(/[.#$\[\]\/]/g, "_");
let db, presenceRef, unsubscribeCount, presenceStarted = false;

function showCount(value) {
  if (countEl) countEl.textContent = Number(value).toLocaleString("en-IN");
}

async function startPresence() {
  if (!channelKey || presenceStarted) {
    if (!channelKey && countEl) countEl.textContent = "—";
    return;
  }
  presenceStarted = true;
  try {
    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    db = getDatabase(app);
    const auth = getAuth(app);
    await signInAnonymously(auth);
    const viewerId = globalThis.crypto?.randomUUID?.() || (Date.now() + "_" + Math.random().toString(36).slice(2));
    const channelPath = "liveViewers/" + safeKey;
    presenceRef = ref(db, channelPath + "/" + viewerId);
    await onDisconnect(presenceRef).remove();
    await set(presenceRef, { online: true, joinedAt: Date.now(), page: "criczone10" });
    unsubscribeCount = onValue(ref(db, channelPath), snapshot => {
      const data = snapshot.val() || {};
      showCount(Object.keys(data).length);
    }, error => {
      console.warn("CRICZONE live-watching count unavailable:", error);
      if (countEl) countEl.textContent = "—";
    });
  } catch (error) {
    console.warn("CRICZONE Firebase presence unavailable:", error);
    if (countEl) countEl.textContent = "—";
    presenceStarted = false;
  }
}

async function leavePresence() {
  if (unsubscribeCount) unsubscribeCount();
  if (presenceRef) {
    try { await remove(presenceRef); } catch (error) {}
    presenceRef = null;
  }
}
window.addEventListener("pagehide", leavePresence);
startPresence();
</script>
