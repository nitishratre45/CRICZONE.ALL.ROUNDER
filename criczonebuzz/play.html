<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0e"><title>Opening Match | CRICZONE</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080a0e;color:#f4f8e9;font:600 15px system-ui;text-align:center}.box{padding:28px}.dot{display:inline-block;width:9px;height:9px;margin-right:9px;border-radius:50%;background:#d7ff3f;box-shadow:0 0 14px #d7ff3f}</style>
</head>
<body><main class="box"><p><span class="dot"></span>Opening live match in CRICZONE…</p><a id="fallback" href="index.html" style="color:#d7ff3f">Continue to matches</a></main>
<script>
(function(){
 var p=new URLSearchParams(location.search);
 var match=p.get('match')||p.get('id')||p.get('play')||'';
 var target='index.html'+(match?'?id='+encodeURIComponent(match):'');
 location.replace(target);
 document.getElementById('fallback').href=target;
})();
</script></body></html>
