<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0e"><title>Choose Stream | CRICZONE</title>
<style>
:root{color-scheme:dark;--bg:#080a0e;--panel:#111722;--line:#273244;--gold:#ffc247;--muted:#9aa8ba}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#202b3b 0,transparent 55%),var(--bg);color:#f7f9fc;font:16px Inter,system-ui,sans-serif;min-height:100vh}
.wrap{width:min(920px,100%);margin:auto;padding:22px 18px 40px}.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.back{color:var(--gold);text-decoration:none;font-weight:800;padding:10px 13px;border:1px solid #554525;border-radius:12px;background:#171b22}.brand{font-weight:900;letter-spacing:.04em}.brand span{color:var(--gold)}
.hero{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 18px 50px #0006}.poster{width:100%;aspect-ratio:16/8;object-fit:cover;display:block;background:#171e29}.info{padding:18px}.status{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.08em;padding:6px 10px;border-radius:8px;background:#243044;color:#d8e2f2}.status.live{background:#6d252b;color:white}.title{font-size:clamp(20px,4vw,30px);line-height:1.2;margin:12px 0 8px}.sub{color:var(--muted);font-size:14px}.section{margin:24px 0 12px;font-size:18px}.hint{color:var(--muted);font-size:13px;margin:-4px 0 14px}.servers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.server{min-height:76px;padding:14px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#1b2432,#111722);color:#f4f6fa;text-decoration:none;display:flex;align-items:center;gap:12px;transition:.18s}.server:hover,.server:focus-visible{border-color:var(--gold);transform:translateY(-2px);outline:none}.play{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#ffc247;color:#17120a;font-weight:900;flex:none}.server strong{display:block;font-size:15px}.server small{display:block;color:var(--muted);margin-top:4px}.empty{padding:22px;border:1px dashed #46536a;border-radius:14px;color:var(--muted);text-align:center}.foot{text-align:center;color:#778398;font-size:12px;margin-top:24px}
@media(max-width:520px){.wrap{padding:14px 12px 28px}.servers{gap:9px}.server{min-height:72px;padding:11px;gap:9px}.server strong{font-size:13px}.server small{font-size:11px}.play{width:32px;height:32px}.info{padding:14px}.poster{aspect-ratio:16/9}}
@media(max-width:350px){.servers{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="criczone-premium.css?v=2">
</head>
<body><main class="wrap">
<header class="top"><a class="back" href="index.html">← Back</a><div class="brand">CRICZONE <span>LIVE</span></div></header>
<section class="hero"><img id="poster" class="poster" alt="Match poster"><div class="info"><span id="status" class="status">MATCH</span><h1 id="title" class="title">Loading match…</h1><div id="meta" class="sub">Finding available streams</div></div></section>
<h2 class="section">Choose your server</h2><p class="hint">Select any available server to open the match player.</p>
<div id="servers" class="servers"><div class="empty">Loading available servers…</div></div>
<p class="foot">CRICZONE · Match centre</p></main>
<script>
(function(){
 "use strict";
 const params=new URLSearchParams(location.search);
 const wanted=(params.get('match')||params.get('id')||params.get('play')||'').trim();
 const feeds=[
  'https://sonujson-v4.pages.dev/Data/willow.json',
  'https://sonujson-v4.pages.dev/Data/prime.json',
  'https://sonujson-v5.pages.dev/Data/willow.json'
 ];
 const configs=[
  {key:'fastly_server1',label:'Server 1 (Fast)',quality:'Fast stream'},
  {key:'amazon_server1',label:'Server 2 (Prime)',quality:'Prime stream'},
  {key:'akamai_server1',label:'Server 3 (Akamai 4K)',quality:'4K stream'},
  {key:'cloudfront_server1',label:'Server 4 (CloudFront)',quality:'CloudFront stream'},
  {key:'fastly_server2',label:'Server 5 (Backup)',quality:'Backup stream'},
  {key:'amazon_server2',label:'Server 6 (Backup)',quality:'Backup stream'},
  {key:'akamai_server2',label:'Server 7 (Ultra HD)',quality:'Ultra HD stream'},
  {key:'cloudfront_server2',label:'Server 8 (Backup)',quality:'Backup stream'}
 ];
 const $=id=>document.getElementById(id);
 function extractList(data){
  if(Array.isArray(data)) return data;
  if(!data||typeof data!=='object') return [];
  const keys=['Matches','matches','channels','events','data','results','fixtures','live','upcoming','streams'];
  for(const key of keys) if(Array.isArray(data[key])) return data[key];
  const live=Array.isArray(data['Live Events'])?data['Live Events']:[];
  const upcoming=Array.isArray(data['Upcoming Events'])?data['Upcoming Events']:[];
  return live.concat(upcoming);
 }
 function normalize(raw){
  if(!raw||typeof raw!=='object') return null;
  const alpha=raw.stream_url_alpha||raw.streams_alpha||{};
  const bravo=raw.stream_url_bravo||raw.streams_bravo||{};
  const c=raw.CnpTV||raw.servers||{};
  const cnp={
   fastly_server1:c.fastly_server1||alpha['Fistly Server']||alpha['Fastly Server']||'',
   amazon_server1:c.amazon_server1||alpha['Amazon Server']||'',
   akamai_server1:c.akamai_server1||alpha['Akamai Server']||'',
   cloudfront_server1:c.cloudfront_server1||alpha['Cloudfront Server 1']||alpha['CloudFront Server 1']||alpha['Cloudfront Server']||'',
   fastly_server2:c.fastly_server2||bravo['Fistly Server']||bravo['Fastly Server']||'',
   amazon_server2:c.amazon_server2||bravo['Amazon Server']||'',
   akamai_server2:c.akamai_server2||bravo['Akamai Server']||'',
   cloudfront_server2:c.cloudfront_server2||bravo['Cloudfront Server 1']||bravo['CloudFront Server 1']||bravo['Cloudfront Server']||''
  };
  const id=String(raw.id||raw.match_id||raw.event_id||raw.fixture_id||raw.channel_id||'').trim();
  const streams=Array.isArray(raw.streams)?raw.streams.slice():[];
  const direct=raw.live_stream||raw.url||'';
  if(direct&&streams.length===0) streams.push({name:'Live Stream',url:direct});
  return {
   id,match_id:id,
   event_name:raw.event_name||raw.title||raw.synopsis||raw.name||raw.match||'Live Cricket Event',
   image:raw.image||raw.cover_image||raw.poster||raw.thumbnail||'',
   status:String(raw.status||'').toUpperCase(),
   time:raw.time||raw.start_time||raw.date||'',
   sport:raw.sport||'Cricket',
   series:raw.series||raw.tournament||'',
   drm_key:raw.drm_key||'',
   CnpTV:cnp,streams
  };
 }
 async function fetchFeed(url){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),10000);
  try{
   const response=await fetch(url+(url.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store',signal:controller.signal,headers:{Accept:'application/json'}});
   if(!response.ok) throw new Error('HTTP '+response.status);
   return extractList(await response.json());
  }finally{clearTimeout(timer);}
 }
 function idForms(value){
  const v=String(value||'').trim().toLowerCase();
  return [v,v.replace(/^cb/i,''),v.replace(/^match-/i,''),v.replace(/[^a-z0-9]/g,'')].filter(Boolean);
 }
 function findMatch(matches){
  const wantedForms=idForms(wanted);
  return matches.find(m=>{
   const forms=idForms(m.id||m.match_id);
   return forms.some(a=>wantedForms.some(b=>a===b));
  })||matches.find(m=>{
   const forms=idForms(m.id||m.match_id);
   return forms.some(a=>wantedForms.some(b=>a.includes(b)||b.includes(a)));
  });
 }
 function showError(title,detail){
  $('title').textContent=title;
  $('meta').textContent=detail;
  $('servers').innerHTML='<div class="empty">Match details are currently unavailable. Go back and try again.</div>';
 }
 async function load(){
  $('title').textContent='Loading match…';
  $('meta').textContent='Connecting to match feeds';
  const results=await Promise.allSettled(feeds.map(fetchFeed));
  const merged=new Map();
  results.forEach(result=>{
   if(result.status!=='fulfilled') return;
   result.value.forEach(raw=>{
    const m=normalize(raw);
    if(!m||!m.id) return;
    const key=m.id.toLowerCase();
    if(!merged.has(key)) merged.set(key,m);
    else{
     const old=merged.get(key);
     Object.keys(m.CnpTV).forEach(k=>{if(!old.CnpTV[k]&&m.CnpTV[k])old.CnpTV[k]=m.CnpTV[k];});
     if(!old.image&&m.image)old.image=m.image;
     old.streams=old.streams.concat(m.streams.filter(x=>!old.streams.some(y=>y.url===x.url)));
     if(!old.drm_key&&m.drm_key)old.drm_key=m.drm_key;
    }
   });
  });
  const matches=Array.from(merged.values());
  if(!matches.length){showError('Match feed unavailable','The feed endpoints returned no readable match records. Please retry shortly.');return;}
  const m=findMatch(matches);
  if(!m){showError('Match not found','This match ID was not present in the current Willow/Prime feeds. Go back and open the match again.');return;}
  const live=m.status==='LIVE'||Object.values(m.CnpTV).some(v=>typeof v==='string'&&/^https?:\/\//i.test(v))||m.streams.some(x=>x&&/^https?:\/\//i.test(x.url||''));
  $('poster').src=m.image||'https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?w=1000';
  $('poster').alt=m.event_name;
  $('title').textContent=m.event_name;
  $('status').textContent=live?'● LIVE':'UPCOMING';
  if(live)$('status').classList.add('live');
  $('meta').textContent=[m.sport,m.series,m.time||(live?'Live now':'Match broadcast')].filter(Boolean).join(' · ');
  const list=configs.filter(x=>typeof m.CnpTV[x.key]==='string'&&/^https?:\/\//i.test(m.CnpTV[x.key])).map(x=>({label:x.label,quality:x.quality}));
  m.streams.filter(x=>x&&typeof x.url==='string'&&/^https?:\/\//i.test(x.url)).forEach(x=>list.push({label:x.name||('Server '+(list.length+1)),quality:'Available stream'}));
  const unique=list.filter((x,i,a)=>a.findIndex(y=>y.label===x.label)===i);
  if(!unique.length){$('servers').innerHTML='<div class="empty">No server is available for this match right now. Please check again later.</div>';return;}
  $('servers').innerHTML=unique.map((x,i)=>'<a class="server" href="index.html?id='+encodeURIComponent(m.id)+'&ser='+(i+1)+'"><span class="play">▶</span><span><strong>'+x.label.replace(/[<>]/g,'')+'</strong><small>'+x.quality+'</small></span></a>').join('');
 }
 if(!wanted){showError('No match selected','Open a match poster first.');}
 else load().catch(error=>{console.error('[CRICZONE BUZZ] Match load failed:',error);showError('Unable to load match',error&&error.message?error.message:'Please retry.');});
})();
</script>

ar .cz-tg-logo svg{width:23px;height:23px}#cz-tg-local-bar strong{font-size:11px}#cz-tg-local-bar small{font-size:9px}#cz-tg-local-bar .cz-tg-tap{min-height:34px;padding:0 10px;font-size:10px}#cz-tg-local-modal .cz-tg-card{padding:27px 18px 21px}#cz-tg-local-modal h2{font-size:22px}}@media(prefers-reduced-motion:reduce){#cz-tg-local-modal,#cz-tg-local-modal .cz-tg-card{transition:none}}
</style>

addEventListener("click",close);window.setTimeout(function(){modal.classList.add("cz-open")},5000)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init,{once:true});else init()})();</script>
