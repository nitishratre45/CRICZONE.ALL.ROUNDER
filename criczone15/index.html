<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMAT 2026 - Live Stream Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .player-wrapper {
      width: 100%;
      max-width: 1024px;
      background: #141923;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border: 1px solid #232b3a;
    }
    .header {
      padding: 12px 18px;
      background: #1a2130;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232b3a;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .live-badge {
      background: #e11d48;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .controls-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    select {
      background: #0b0e14;
      color: #fff;
      border: 1px solid #334155;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
    }
    .status-bar {
      padding: 10px 18px;
      font-size: 13px;
      color: #94a3b8;
      background: #11151e;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .error-text {
      color: #f87171;
    }
    .success-text {
      color: #4ade80;
    }
  </style>
</head>
<body>

  <div class="player-wrapper">
    <div class="header">
      <div class="title">
        <span class="live-badge">LIVE</span>
        <span>SMAT 2026 (Hindi)</span>
      </div>
      <div class="controls-top">
        <label for="qualitySelect" style="font-size: 13px; color: #94a3b8;">Quality:</label>
        <select id="qualitySelect">
          <option value="-1">Auto</option>
        </select>
      </div>
    </div>

    <div class="video-container">
      <video id="video" controls autoplay playsinline></video>
    </div>

    <div class="status-bar">
      <span id="status">Stream load ho raha hai...</span>
      <span id="techInfo">HLS.js Player</span>
    </div>
  </div>

  <script>
    const video = document.getElementById("video");
    const qualitySelect = document.getElementById("qualitySelect");
    const statusEl = document.getElementById("status");

    // 1. Apna Cloudflare Worker Proxy URL yahan lagayein (bina proxy ke CORS block hoga)
    const PROXY_URL = "https://your-worker-name.your-subdomain.workers.dev/?url=";

    // 2. Original M3U8 URL
    const RAW_STREAM_URL = "https://absiakjabk3qaaaynzmcy2oikszax.live-cf.cdn.hotstar.com/hls/live/2123138/inallow-smat-2026/hin/1540088634/15mindvrm06fba4e1aacd0a4976890b6c2a1c4a446322november2026/master_ap.m3u8?a=ns&ttl=86400&hdnea=exp=1795325035~acl=/hls/live/2123138/inallow-smat-2026/hin/1540088634/15mindvrm06fba4e1aacd0a4976890b6c2a1c4a446322november2026/master_ap~ttl=1800~type=paid~data=ip=UqbsLoZE9eZAwhSLSbcxRmwNfq9wDvrSA64VhZ0CroBzHzvMlq4yV0o-userid=rmsUO9O3jYFefRG21hDDCoJ4vykaHDwzqKy94JeYg2do-did=FhqmZr8OfkF2p1pQYl76xcvDCmbgAo0jI8SF2rSbsdgD-cc=in-bl=jhs-sp=HotstarPremiumSmp-ctype=sport_live-de=6-pl=web-ap=26.11.12.1-ut=paid-~hmac=9dcfbaba6f40ab499db86622d2c9a90a6a072f1a6e143d38f85b36cf433e25d9&Expires=1795325035&Signature=j5zYXed4gZibnDIvtckZQyCIC7oRFO5BSeZGF2UMn8ZjHOj6uNp5xXM6IwJ2nyIP46WU752moHeGmSbxdzzIFfoN2egomnGLe6icLiKWhi7Sg5By0FdC4qe4dyqvxgbqdTcemIxPM8i747VJCPhIJYcKFYzPESSpnvXpeYQXZ7qJKAXvuDiBZyc6bDRN3-DfSeKcGO2JP~F57JIci1x6Fq8OYrN5FnSP2DBQuICy44znZtdNKySxt1dB4Tc8kGafxqM1GQWXk8PBoYRhnlZrlmEmcocUwukrgzjHpnlOXU5Cg0womyziLI6NXXotqfs~P03slrb76VCyDrt7hbwv3w__&Key-Pair-Id=APKAJC3ILMJXG4AINKJA";

    // Agar PROXY_URL set hai toh proxy use karega, warna direct URL
    const finalStreamUrl = PROXY_URL.includes("your-worker-name")
      ? RAW_STREAM_URL
      : PROXY_URL + encodeURIComponent(RAW_STREAM_URL);

    function initPlayer() {
      if (Hls.isSupported()) {
        const hls = new Hls({
          lowLatencyMode: true,
          backBufferLength: 30,
          maxBufferLength: 20,
          enableWorker: true
        });

        hls.loadSource(finalStreamUrl);
        hls.attachMedia(video);

        // Manifest parse hone par quality levels dropdown mein add karein
        hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
          statusEl.textContent = "Stream connected";
          statusEl.className = "success-text";

          data.levels.forEach((level, index) => {
            const option = document.createElement("option");
            option.value = index;
            option.text = level.height ? `${level.height}p` : `Level ${index + 1}`;
            qualitySelect.appendChild(option);
          });

          video.play().catch(() => {
            statusEl.textContent = "Play button par click karein";
          });
        });

        // Quality change handler
        qualitySelect.addEventListener("change", (e) => {
          hls.currentLevel = parseInt(e.target.value, 10);
        });

        // Error handling
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            const code = data.response ? ` (HTTP ${data.response.code})` : "";
            statusEl.textContent = `Playback Error: ${data.details}${code}`;
            statusEl.className = "error-text";

            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              hls.startLoad();
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hls.recoverMediaError();
            } else {
              hls.destroy();
            }
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        // Safari native HLS support
        video.src = finalStreamUrl;
        video.addEventListener("loadedmetadata", () => {
          statusEl.textContent = "Stream connected (Native HLS)";
          statusEl.className = "success-text";
          video.play();
        });
      } else {
        statusEl.textContent = "Aapka browser HLS playback support nahi karta.";
        statusEl.className = "error-text";
      }
    }

    initPlayer();
  </script>
</body>
</html>
