  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    :root {
      --bg-dark: #0a0c10;
      --surface-dark: #14161c;
      --card-bg: #1e2129;
      --border-light: #2f3340;
      --text-primary: #f0f2f5;
      --text-secondary: #9aa1b0;
      --sony-blue: #1e88e5;
      --live-red: #e53935;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    .sky-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-dark);
      padding: 12px 24px;
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 16px;
    }
    
    .sky-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .sky-logo .material-icons { color: var(--sony-blue); font-size: 28px; }

    /* Search Bar */
    .search-wrapper {
      flex: 1;
      max-width: 420px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-wrapper .material-icons {
      position: absolute;
      left: 14px;
      color: var(--text-secondary);
      font-size: 20px;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      background: #0f1117;
      border: 1px solid var(--border-light);
      border-radius: 30px;
      padding: 9px 38px 9px 42px;
      color: var(--text-primary);
      font-size: 0.88rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      user-select: auto;
      -webkit-user-select: auto;
    }
    .search-input:focus {
      border-color: var(--sony-blue);
      box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.18);
    }
    .search-clear {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .search-clear:hover { color: #fff; }
    .search-clear .material-icons { position: static; font-size: 18px; }
    
    .sky-telegram {
      background: #1f8a4c;
      padding: 8px 18px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 600;
      color: white;
      font-size: 0.9rem;
      transition: 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sky-telegram:hover {
      background: #166b3f;
      transform: scale(0.97);
    }
    
    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Scrollable Category Filter */
    .category-filter-wrapper {
      position: relative;
      margin-bottom: 28px;
    }
    .category-filter {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 10px 2px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--border-light) transparent;
    }
    .category-filter::-webkit-scrollbar {
      height: 6px;
    }
    .category-filter::-webkit-scrollbar-track {
      background: transparent;
    }
    .category-filter::-webkit-scrollbar-thumb {
      background: var(--border-light);
      border-radius: 10px;
    }

    .category-btn {
      background: var(--surface-dark);
      border: 1px solid var(--border-light);
      padding: 8px 18px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
      font-size: 0.85rem;
    }
    .category-btn.active {
      background: var(--sony-blue);
      border-color: var(--sony-blue);
      color: white;
    }
    .category-btn .material-icons { font-size: 18px; }

    .grid-layout {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    
    .sky-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      border: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .sky-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.5);
      border-color: var(--sony-blue);
    }
    
    .sky-card-media {
      height: 140px;
      background: #14161c;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 16px;
    }
    .sky-card-media img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    }
    
    .sky-badge {
      position: absolute;
      bottom: 10px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      padding: 3px 10px;
      border-radius: 30px;
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #e0e0e0;
    }
    .sky-badge.genre { left: 10px; }
    .sky-badge.lang { right: 10px; }

    .sky-card-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--border-light);
    }
    .channel-title {
      font-weight: 700;
      font-size: 1.05rem;
      text-align: center;
      color: var(--text-primary);
    }
    
    .watch-btn {
      width: 100%;
      background: var(--sony-blue);
      border: none;
      padding: 10px;
      border-radius: 30px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: 0.2s;
      color: white;
      font-size: 0.9rem;
    }
    .sky-card:hover .watch-btn {
      background: #1565c0;
    }

    /* Modal Player Styles */
    .player-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .player-modal.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      width: 100%;
      max-width: 960px;
      background: #14161c;
      border: 1px solid var(--border-light);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      position: relative;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: #0f1117;
      border-bottom: 1px solid var(--border-light);
    }
    .modal-title {
      font-weight: 600;
      font-size: 1rem;
      color: #fff;
    }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 50%;
      transition: background 0.2s, color 0.2s;
    }
    .modal-close:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }
    .player-frame-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 ratio */
      background: #000;
    }
    .player-frame-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .loading-spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid var(--sony-blue);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 0.8s linear infinite;
      margin: 60px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-panel {
      background: var(--surface-dark);
      border-left: 4px solid var(--live-red);
      padding: 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 500px;
      margin: 40px auto;
    }
    .hidden { display: none; }

    @media (max-width: 768px) {
      .sky-header {
        flex-wrap: wrap;
        padding: 12px 16px;
      }
      .search-wrapper {
        order: 3;
        max-width: 100%;
        width: 100%;
        margin-top: 4px;
      }
      .container {
        padding: 16px 12px;
      }
      .grid-layout {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .sky-card {
        border-radius: 14px;
      }
      .sky-card-media {
        height: 110px;
        padding: 10px;
      }
      .sky-card-content {
        padding: 12px 10px;
        gap: 8px;
      }
      .channel-title {
        font-size: 0.85rem;
      }
      .watch-btn {
        padding: 8px;
        font-size: 0.8rem;
      }
    }
    
    footer {
      text-align: center;
      padding: 28px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--border-light);
      margin-top: 40px;
    }
  </style>
</head>

<script>
  const M3U_URL = "https://raw.githubusercontent.com/sportlive18/Sonyliv-Playlist-Autoupdate/main/sony.m3u";
  const PLAYER_PREFIX = "https://cineplyr-ios.pages.dev/?url=https://akamaii.lovable.app/api/public/px/sony?url=";

  let channelsList = [];
  let genresSet = new Set();
  let activeGenre = "All";
  let searchQuery = "";

  const container = document.getElementById("channels-container");
  const filterContainer = document.getElementById("categoryFilter");
  const loadingEl = document.getElementById("loading");
  const errorEl = document.getElementById("error");
  const searchInput = document.getElementById("channelSearch");
  const searchClear = document.getElementById("searchClear");

  const playerModal = document.getElementById("playerModal");
  const playerFrame = document.getElementById("playerFrame");
  const modalTitle = document.getElementById("modalTitle");
  const modalClose = document.getElementById("modalClose");

  function getGenreIcon(genre) {
    const g = (genre || '').toLowerCase();
    if (g.includes('sport')) return 'sports_cricket';
    if (g.includes('movie')) return 'movie';
    if (g.includes('entertainment')) return 'tv';
    if (g.includes('kid')) return 'child_care';
    if (g.includes('infotainment') || g.includes('doc')) return 'public';
    if (g.includes('music')) return 'music_note';
    return 'category';
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>'"]/g, tag => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    }[tag] || tag));
  }

  function parseM3U(m3uText) {
    const lines = m3uText.split(/\r?\n/);
    const channels = [];
    let currentChannel = null;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;

      if (line.startsWith("#EXTINF:")) {
        currentChannel = {
          title: "Channel",
          genre: "Entertainment",
          logo: "",
          streamUrl: ""
        };

        const nameMatch = line.match(/tvg-name="([^"]+)"/);
        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
        const groupMatch = line.match(/group-title="([^"]+)"/);

        const commaIndex = line.lastIndexOf(",");
        if (commaIndex !== -1) {
          currentChannel.title = line.substring(commaIndex + 1).trim();
        } else if (nameMatch && nameMatch[1]) {
          currentChannel.title = nameMatch[1];
        }

        if (groupMatch && groupMatch[1]) {
          currentChannel.genre = groupMatch[1].replace(/sonyliv\s*/i, '').trim() || "Entertainment";
        }

        if (logoMatch && logoMatch[1]) {
          currentChannel.logo = logoMatch[1];
        }
      } else if (line.startsWith("http://") || line.startsWith("https://")) {
        if (currentChannel) {
          currentChannel.streamUrl = line;
          channels.push(currentChannel);
          currentChannel = null;
        }
      }
    }
    return channels;
  }

  async function fetchChannels() {
    loadingEl.classList.remove("hidden");
    errorEl.classList.add("hidden");
    container.innerHTML = "";

    try {
      const response = await fetch(M3U_URL, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
      
      const text = await response.text();
      channelsList = parseM3U(text);

      genresSet.clear();
      channelsList.forEach(item => {
        if (item.genre) genresSet.add(item.genre);
      });

      renderFilters();
      setupSearch();
      renderChannels();
    } catch (err) {
      errorEl.classList.remove("hidden");
      errorEl.innerHTML = `
        <span class="material-icons" style="color:var(--live-red); font-size: 32px;">error</span>
        <div>
          <strong>Failed to load playlist</strong><br>
          <span style="font-size:0.85rem; color: var(--text-secondary);">${escapeHtml(err.message)}</span>
        </div>
      `;
    } finally {
      loadingEl.classList.add("hidden");
    }
  }

  function renderFilters() {
    const genres = ["All", ...Array.from(genresSet).sort()];
    filterContainer.innerHTML = "";

    genres.forEach(genre => {
      const btn = document.createElement("button");
      btn.className = `category-btn ${activeGenre === genre ? 'active' : ''}`;
      btn.innerHTML = `<span class="material-icons">${getGenreIcon(genre)}</span>${escapeHtml(genre)}`;
      btn.onclick = () => {
        activeGenre = genre;
        renderFilters();
        renderChannels();
      };
      filterContainer.appendChild(btn);
    });
  }

  function setupSearch() {
    if (!searchInput || !searchClear) return;
    searchInput.addEventListener("input", (e) => {
      searchQuery = (e.target.value || "").trim().toLowerCase();
      searchClear.style.display = searchQuery ? "flex" : "none";
      renderChannels();
    });

    searchClear.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      searchClear.style.display = "none";
      searchInput.focus();
      renderChannels();
    });
  }

  function openPlayer(title, streamUrl) {
    const fullPlayerUrl = PLAYER_PREFIX + encodeURIComponent(streamUrl);
    modalTitle.textContent = title;
    playerFrame.src = fullPlayerUrl;
    playerModal.classList.add("active");
  }

  function closePlayer() {
    playerModal.classList.remove("active");
    playerFrame.src = "";
  }

  modalClose.addEventListener("click", closePlayer);
  playerModal.addEventListener("click", (e) => {
    if (e.target === playerModal) closePlayer();
  });

  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && playerModal.classList.contains("active")) {
      closePlayer();
    }
  });

  function renderChannels() {
    const filtered = channelsList.filter(ch => {
      const matchesCategory = (activeGenre === "All") || (ch.genre === activeGenre);
      const matchesSearch = !searchQuery || (ch.title && ch.title.toLowerCase().indexOf(searchQuery) !== -1);
      return matchesCategory && matchesSearch;
    });

    if (filtered.length === 0) {
      container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-secondary);">No channels found matching your search.</div>`;
      return;
    }

    container.innerHTML = filtered.map((ch, idx) => {
      const fallbackLogo = `https://ui-avatars.com/api/?name=${encodeURIComponent(ch.title || 'TV')}&background=1e88e5&color=fff&rounded=true`;

      return `
        <div class="sky-card" onclick="openPlayer('${escapeHtml(ch.title)}', '${encodeURI(ch.streamUrl)}')">
          <div class="sky-card-media">
            <img src="${ch.logo || fallbackLogo}" alt="${escapeHtml(ch.title)}" onerror="this.src='${fallbackLogo}'">
            <span class="sky-badge genre">
              <span class="material-icons" style="font-size:13px;">${getGenreIcon(ch.genre)}</span>
              ${escapeHtml(ch.genre || 'General')}
            </span>
          </div>
          <div class="sky-card-content">
            <div class="channel-title">${escapeHtml(ch.title)}</div>
            <button class="watch-btn" type="button">
              <span class="material-icons" style="font-size:18px;">play_arrow</span> Watch Live
            </button>
          </div>
        </div>
      `;
    }).join("");
  }

  fetchChannels();
</script>
</body>
</html>
