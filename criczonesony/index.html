<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <meta name="referrer" content="no-referrer">
  <title>CricZone Sony | Live Sports</title>
  <meta name="description" content="CricZone Sony sports channel player">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#080b12;--panel:#111827;--panel2:#151f30;--line:#263247;--text:#f7f9fc;--muted:#93a1b5;--gold:#f5c542;--gold2:#ffdf75;--red:#ed394b}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{background:radial-gradient(ellipse at 50% -25%,#263a59 0,transparent 55%),var(--bg)}
    button,input{font:inherit}
    .app{min-height:100vh}
    .topbar{height:68px;padding:0 clamp(16px,4vw,54px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12;background:#080b12df;backdrop-filter:blur(16px);position:sticky;top:0;z-index:20}
    .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--text);font-weight:900;letter-spacing:.7px;font-size:20px}
    .brand-mark{width:35px;height:35px;border-radius:11px;background:linear-gradient(145deg,var(--gold2),#e89b16);color:#10131a;display:grid;place-items:center;font-weight:1000;font-size:19px;box-shadow:0 5px 22px #f5c54235}
    .brand span:last-child{color:var(--gold)}
    .live-tag{display:inline-flex;align-items:center;gap:8px;color:#ff7883;font-size:11px;font-weight:800;letter-spacing:1.4px}
    .live-dot{width:7px;height:7px;border-radius:50%;background:#ff4355;box-shadow:0 0 0 4px #ff435522}
    main{width:min(1200px,100%);margin:auto;padding:30px clamp(14px,3vw,32px) 50px}
    .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:4px 0 24px}
    .eyebrow{color:var(--gold);font-size:11px;font-weight:850;letter-spacing:2px;text-transform:uppercase;margin-bottom:9px}
    h1{font-size:clamp(27px,5vw,42px);line-height:1.08;letter-spacing:-1.4px;margin:0}
    .sub{color:var(--muted);font-size:13px;margin:10px 0 0}
    .count{white-space:nowrap;border:1px solid var(--line);background:#ffffff08;border-radius:999px;padding:9px 13px;color:#c4cede;font-size:12px}
    .toolbar{display:flex;gap:12px;margin-bottom:20px}
    .search-wrap{position:relative;flex:1}
    .search-wrap:before{content:"⌕";position:absolute;left:15px;top:7px;font-size:25px;color:#8392a8}
    #search{width:100%;height:46px;border:1px solid var(--line);border-radius:13px;background:#101827;color:white;padding:0 15px 0 43px;outline:none}
    #search:focus{border-color:#d6aa38;box-shadow:0 0 0 3px #f5c54218}
    .refresh{border:1px solid #58491f;background:#2b2413;color:var(--gold2);padding:0 17px;border-radius:13px;font-weight:750;cursor:pointer}
    .refresh:hover{background:#3a3019}
    #channel-list{display:block}
    #ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:13px}
    .ch-card{position:relative;min-height:145px;padding:18px 12px 15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;text-align:center;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:17px;background:linear-gradient(155deg,#172235,#101724 70%);overflow:hidden;transition:transform .18s,border-color .18s,background .18s}
    .ch-card:before{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:opacity .18s}
    .ch-card:hover{transform:translateY(-3px);border-color:#a98532;background:linear-gradient(155deg,#202e43,#121b29)}
    .ch-card:hover:before{opacity:1}
    .logo-box{width:82px;height:58px;border-radius:13px;background:#fff;display:grid;place-items:center;padding:7px}
    .ch-logo{max-width:100%;max-height:100%;object-fit:contain}
    .logo-fallback{font-size:22px;font-weight:950;color:#d5ad45}
    .ch-name{font-size:13px;font-weight:750;line-height:1.35}
    .watch-label{font-size:10px;color:var(--gold);font-weight:850;letter-spacing:1px;text-transform:uppercase}
    .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:45px 15px;border:1px dashed var(--line);border-radius:16px}
    #player-container{display:none}
    .player-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
    .back{border:1px solid var(--line);background:#121b29;color:#fff;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:750}
    .back:hover{border-color:var(--gold);color:var(--gold)}
    .now-playing{font-size:13px;color:#dbe3ee;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .player-shell{position:relative;aspect-ratio:16/9;max-height:72vh;background:#000;border:1px solid #344158;border-radius:17px;overflow:hidden;box-shadow:0 20px 65px #0009}
    #player{width:100%;height:100%;background:#000;object-fit:contain}
    .plyr{height:100%;--plyr-color-main:var(--gold);--plyr-video-control-color:#fff}
    #overlay{position:fixed;inset:0;z-index:100;background:#080b12f5;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
    .loader{display:flex;flex-direction:column;align-items:center;gap:14px;color:#c4cede;font-size:13px}
    .spinner{width:34px;height:34px;border:3px solid #ffffff20;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    footer{color:#66758b;text-align:center;font-size:11px;padding:28px 10px 0}
    @media(max-width:600px){.topbar{height:60px}.brand{font-size:18px}.hero{align-items:flex-start;flex-direction:column;gap:13px;margin-top:12px}#ch-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ch-card{min-height:130px;padding:14px 8px}.toolbar{gap:8px}.refresh{padding:0 12px}.player-shell{aspect-ratio:16/9;border-radius:12px}.player-head{align-items:flex-start}.now-playing{max-width:48%}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="./" aria-label="CricZone home"><span class="brand-mark">C</span><span>CRIC<span>ZONE</span></span></a>
    <div class="live-tag"><i class="live-dot"></i> SPORTS HUB</div>
  </header>
  <main>
    <section id="channel-list">
      <div class="hero">
        <div><div class="eyebrow">CRICZONE • LIVE TV</div><h1>Sony Sports</h1><p class="sub">Choose a channel and enjoy the match experience.</p></div>
        <div class="count" id="channel-count">Loading channels…</div>
      </div>
      <div class="toolbar">
        <div class="search-wrap"><input id="search" type="search" placeholder="Search sports channels…" autocomplete="off" aria-label="Search channels"></div>
        <button class="refresh" id="refresh" type="button">↻ Refresh</button>
      </div>
      <div id="ch-grid" aria-live="polite"></div>
    </section>
    <section id="player-container" aria-label="Video player">
      <div class="player-head">
        <button class="back" id="back" type="button">← All channels</button>
        <div class="now-playing" id="now-playing">Now Playing</div>
      </div>
      <div class="player-shell"><video id="player" playsinline webkit-playsinline controls preload="metadata"></video></div>
    </section>
    <footer>CRICZONE · Sports, scores &amp; live action</footer>
  </main>
</div>
<div id="overlay"><div class="loader"><span class="spinner"></span><span id="loadMsg">Loading CricZone channels…</span></div></div>
<script>
(function(){
"use strict";
var M3U_URL="https://sportlink-jtv.pages.dev/sony3.m3u";
var PROXY_BASE="/api/proxy?u=";
var $overlay=document.getElementById("overlay"),$loadMsg=document.getElementById("loadMsg");
var $list=document.getElementById("channel-list"),$grid=document.getElementById("ch-grid");
var $playerContainer=document.getElementById("player-container"),$video=document.getElementById("player");
var $count=document.getElementById("channel-count"),$search=document.getElementById("search");
var allChannels=[],currentPlayer=null,currentHls=null;

function proxyUrl(url){
  if(!url)return url;
  if(url.indexOf(PROXY_BASE)===0)return url;
  return PROXY_BASE+encodeURIComponent(url);
}
function getChId(){return new URLSearchParams(location.search).get("id")||"";}
function parseM3U(text){
  var channels=[],lines=text.split(/\r?\n/),current=null;
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();if(!line)continue;
    if(line.indexOf("#EXTINF:")===0){
      var info=line.substring(8),comma=info.indexOf(",");
      var name=comma>=0?info.substring(comma+1).trim():"Unknown";
      name=name.replace(/@\w+/gi,"").trim();
      var attrs=comma>=0?info.substring(0,comma):info;
      var idMatch=attrs.match(/tvg-id="([^"]*)"/i),logoMatch=attrs.match(/tvg-logo="([^"]*)"/i)||attrs.match(/logo="([^"]*)"/i);
      var safeId=idMatch&&idMatch[1]?idMatch[1]:name.replace(/[^a-z0-9]+/gi,"_").toLowerCase()+"_"+channels.length;
      current={id:safeId,name:name,logo:logoMatch?logoMatch[1]:"",stream_url:""};
    }else if(line.charAt(0)!=="#"&&current){current.stream_url=line;channels.push(current);current=null;}
  }
  return channels.filter(function(c){return c.stream_url;});
}
async function loadData(){
  var response=await fetch(proxyUrl(M3U_URL),{cache:"no-store"});
  if(!response.ok)throw new Error("Playlist request failed (HTTP "+response.status+")");
  return parseM3U(await response.text());
}
function renderChannels(channels){
  $count.textContent=channels.length+" CHANNELS";
  $grid.innerHTML="";
  if(!channels.length){$grid.innerHTML='<div class="empty">No channels match your search.</div>';return;}
  var fragment=document.createDocumentFragment();
  channels.forEach(function(ch){
    var a=document.createElement("a");a.className="ch-card";a.href="?id="+encodeURIComponent(ch.id);
    var logoBox=document.createElement("span");logoBox.className="logo-box";
    if(ch.logo){var img=document.createElement("img");img.className="ch-logo";img.alt=ch.name;img.loading="lazy";img.src=ch.logo;img.onerror=function(){logoBox.innerHTML='<span class="logo-fallback">CZ</span>';};logoBox.appendChild(img);}
    else{var fallback=document.createElement("span");fallback.className="logo-fallback";fallback.textContent="CZ";logoBox.appendChild(fallback);}
    var name=document.createElement("span");name.className="ch-name";name.textContent=ch.name;
    var label=document.createElement("span");label.className="watch-label";label.textContent="▶ Watch channel";
    a.appendChild(logoBox);a.appendChild(name);a.appendChild(label);fragment.appendChild(a);
  });
  $grid.appendChild(fragment);
}
function destroyPlayer(){
  if(currentHls){currentHls.destroy();currentHls=null;}
  if(currentPlayer){currentPlayer.destroy();currentPlayer=null;}
  $video.pause();$video.removeAttribute("src");$video.load();
}
function showList(){
  destroyPlayer();$playerContainer.style.display="none";$list.style.display="block";
  var url=new URL(location.href);url.searchParams.delete("id");history.pushState({}, "",url.pathname+url.search+url.hash);
}
function showPlayer(ch){
  $list.style.display="none";$playerContainer.style.display="block";
  document.getElementById("now-playing").textContent=ch.name;
  $loadMsg.textContent="Connecting to "+ch.name+"…";$overlay.style.display="flex";
  destroyPlayer();
  var source=proxyUrl(ch.stream_url);
  var options={controls:["play","progress","current-time","mute","volume","settings","fullscreen"],settings:["quality"],autoplay:true,muted:false};
  if(window.Hls&&Hls.isSupported()&&/\.m3u8(\?|$)/i.test(ch.stream_url)){
    currentHls=new Hls({enableWorker:true,lowLatencyMode:true,liveSyncDurationCount:3,maxBufferLength:30,maxMaxBufferLength:60,manifestLoadingMaxRetry:3,fragLoadingMaxRetry:3});
    currentHls.loadSource(source);currentHls.attachMedia($video);
    currentHls.on(Hls.Events.MANIFEST_PARSED,function(_,data){
      var heights=data.levels.map(function(level){return level.height;}).filter(Boolean);
      var unique=heights.filter(function(value,index){return heights.indexOf(value)===index;}).sort(function(a,b){return b-a;});
      currentPlayer=new Plyr($video,Object.assign({},options,unique.length?{quality:{default:unique[0],options:unique,forced:true,onChange:function(q){currentHls.levels.forEach(function(level,index){if(level.height===q)currentHls.currentLevel=index;});}}}:{}));
      $video.play().catch(function(){});$overlay.style.display="none";
    });
    currentHls.on(Hls.Events.ERROR,function(_,data){
      if(data.fatal){$loadMsg.textContent="Playback error. The source or proxy may be unavailable.";if(data.type===Hls.ErrorTypes.NETWORK_ERROR)currentHls.startLoad();else if(data.type===Hls.ErrorTypes.MEDIA_ERROR)currentHls.recoverMediaError();else $overlay.style.display="flex";}
    });
  }else{
    $video.src=source;currentPlayer=new Plyr($video,options);
    $video.addEventListener("loadedmetadata",function(){ $overlay.style.display="none";},{once:true});
    $video.addEventListener("error",function(){ $loadMsg.textContent="Unable to play this stream. Check source/proxy access."; $overlay.style.display="flex";},{once:true});
    $video.play().catch(function(){ $loadMsg.textContent="Press play to start the stream.";});
  }
}
async function main(){
  try{
    allChannels=await loadData();renderChannels(allChannels);$overlay.style.display="none";
    var id=getChId();if(id){var ch=allChannels.find(function(item){return item.id===id;});if(ch)showPlayer(ch);}
  }catch(error){$loadMsg.textContent="Could not load playlist. "+error.message;$overlay.style.display="flex";$count.textContent="OFFLINE";}
}
$search.addEventListener("input",function(){var q=$search.value.trim().toLowerCase();renderChannels(allChannels.filter(function(ch){return ch.name.toLowerCase().indexOf(q)!==-1;}));});
document.getElementById("refresh").addEventListener("click",function(){$loadMsg.textContent="Refreshing channels…";$overlay.style.display="flex";main();});
document.getElementById("back").addEventListener("click",showList);
window.addEventListener("popstate",function(){var id=getChId();if(!id){showList();}else{var ch=allChannels.find(function(item){return item.id===id;});if(ch)showPlayer(ch);}});
document.addEventListener("DOMContentLoaded",main);
})();
</script>
</body>
</html>
