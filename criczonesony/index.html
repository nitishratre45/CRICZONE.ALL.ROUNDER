<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <meta name="referrer" content="no-referrer">
  <title>CricZone Sony | Live Sports</title>
  <meta name="description" content="CricZone Sony sports channel player">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>
  <style>
    :root{
      color-scheme:dark;
      --bg:#070b12;--surface:#0e1624;--surface-2:#121e30;--surface-3:#18263a;
      --line:rgba(185,205,232,.13);--line-strong:rgba(245,197,66,.38);
      --text:#f5f7fb;--muted:#91a0b5;--gold:#f5c542;--gold-bright:#ffe28a;
      --red:#ff5366;--green:#52d69a;--shadow:0 22px 60px rgba(0,0,0,.38);
    }
    *{box-sizing:border-box}
    html{min-height:100%;scroll-behavior:smooth;background:var(--bg)}
    body{
      margin:0;min-height:100vh;color:var(--text);
      background:
        radial-gradient(ellipse at 12% -8%,rgba(44,82,132,.30),transparent 42%),
        radial-gradient(ellipse at 92% 12%,rgba(150,105,24,.10),transparent 32%),
        linear-gradient(180deg,#080e18 0%,#070b12 58%,#090f19 100%);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    }
    button,input{font:inherit}
    button,a{-webkit-tap-highlight-color:transparent}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px}
    .app{min-height:100vh;display:flex;flex-direction:column}
    .topbar{
      min-height:76px;padding:0 clamp(16px,5vw,76px);display:flex;align-items:center;justify-content:space-between;gap:18px;
      border-bottom:1px solid rgba(255,255,255,.075);background:rgba(7,11,18,.82);
      backdrop-filter:blur(20px) saturate(145%);-webkit-backdrop-filter:blur(20px) saturate(145%);
      position:sticky;top:0;z-index:30;box-shadow:0 8px 32px rgba(0,0,0,.16)
    }
    .brand{display:flex;align-items:center;gap:13px;text-decoration:none;color:var(--text);font-weight:950;letter-spacing:.8px;font-size:21px;min-width:0}
    .brand-mark{
      width:46px;height:46px;flex:0 0 46px;border-radius:50%;padding:2px;
      background:linear-gradient(145deg,#fff0ae,#d99b20 48%,#fff5c9);
      display:grid;place-items:center;overflow:hidden;
      box-shadow:0 0 0 4px rgba(245,197,66,.09),0 8px 26px rgba(245,197,66,.22);
      transition:transform .25s ease,box-shadow .25s ease
    }
    .brand:hover .brand-mark{transform:translateY(-1px) scale(1.045);box-shadow:0 0 0 5px rgba(245,197,66,.13),0 10px 30px rgba(245,197,66,.28)}
    .brand-mark img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:top center;background:#111827;transition:opacity .18s ease}
    .brand-name{display:block;line-height:1.05}
    .brand-name>span{color:var(--gold)}
    .brand small{display:block;margin-top:5px;color:#8d9bb0;font-size:8px;letter-spacing:2px;font-weight:850}
    .live-tag{
      display:inline-flex;align-items:center;gap:9px;padding:9px 13px;border:1px solid rgba(255,83,102,.2);
      border-radius:999px;background:rgba(255,83,102,.065);color:#ff8491;font-size:10px;font-weight:900;letter-spacing:1.6px;white-space:nowrap
    }
    .live-dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(255,83,102,.12);animation:livePulse 1.8s infinite}
    main{width:min(1260px,100%);margin:0 auto;padding:clamp(24px,4vw,46px) clamp(14px,3.5vw,38px) 54px;flex:1}
    .hero{
      position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
      margin:2px 0 27px;padding:clamp(20px,3.2vw,32px);border:1px solid var(--line);
      border-radius:23px;overflow:hidden;
      background:linear-gradient(115deg,rgba(24,39,61,.96),rgba(12,20,33,.94) 58%,rgba(47,37,17,.58));
      box-shadow:0 18px 46px rgba(0,0,0,.18)
    }
    .hero:before{content:"";position:absolute;width:280px;height:280px;right:7%;top:-190px;border-radius:50%;border:1px solid rgba(245,197,66,.16);box-shadow:0 0 0 24px rgba(245,197,66,.025),0 0 0 52px rgba(245,197,66,.02);pointer-events:none}
    .hero-copy{position:relative;z-index:1}
    .eyebrow{display:flex;align-items:center;gap:9px;color:var(--gold);font-size:10px;font-weight:950;letter-spacing:2.2px;text-transform:uppercase;margin-bottom:12px}
    .eyebrow:before{content:"";width:24px;height:2px;border-radius:4px;background:var(--gold)}
    h1{font-size:clamp(30px,5vw,48px);line-height:1.02;letter-spacing:-1.8px;margin:0;font-weight:950}
    .sub{color:#a5b1c3;font-size:13px;line-height:1.6;margin:12px 0 0;max-width:470px}
    .count{position:relative;z-index:1;white-space:nowrap;border:1px solid rgba(245,197,66,.23);background:rgba(245,197,66,.075);border-radius:999px;padding:10px 15px;color:#f7d978;font-size:11px;font-weight:900;letter-spacing:.7px}
    .toolbar{display:flex;gap:11px;margin-bottom:19px}
    .search-wrap{position:relative;flex:1;min-width:0}
    .search-wrap:before{content:"⌕";position:absolute;left:16px;top:50%;transform:translateY(-54%);font-size:25px;color:#8292aa;pointer-events:none}
    #search{
      width:100%;height:50px;border:1px solid var(--line);border-radius:14px;
      background:linear-gradient(180deg,#111c2c,#0e1725);color:var(--text);
      padding:0 16px 0 45px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s
    }
    #search::placeholder{color:#728198}
    #search:focus{border-color:rgba(245,197,66,.65);box-shadow:0 0 0 4px rgba(245,197,66,.10);background:#121e2f}
    .refresh{
      min-height:50px;border:1px solid rgba(245,197,66,.3);
      background:linear-gradient(135deg,#3b3018,#211d15);color:var(--gold-bright);
      padding:0 19px;border-radius:14px;font-weight:850;font-size:12px;letter-spacing:.2px;
      cursor:pointer;transition:transform .18s,border-color .18s,background .18s,box-shadow .18s
    }
    .refresh:hover{transform:translateY(-2px);border-color:rgba(245,197,66,.62);background:linear-gradient(135deg,#4a3b1d,#292216);box-shadow:0 8px 22px rgba(0,0,0,.22)}
    .refresh:active{transform:translateY(0)}
    #channel-list{display:block}
    #ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:15px}
    .ch-card{
      position:relative;isolation:isolate;min-width:0;min-height:174px;padding:20px 13px 17px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;text-align:center;
      text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:19px;
      background:linear-gradient(155deg,rgba(25,39,59,.96),rgba(13,21,34,.98) 72%);
      overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.13);
      transition:transform .22s ease,border-color .22s ease,background .22s ease,box-shadow .22s ease
    }
    .ch-card:before{content:"";position:absolute;z-index:-1;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.3;transition:opacity .2s}
    .ch-card:after{content:"";position:absolute;z-index:-1;width:130px;height:130px;right:-75px;bottom:-90px;border-radius:50%;background:rgba(245,197,66,.07);filter:blur(3px);transition:transform .3s}
    .ch-card:hover{transform:translateY(-5px);border-color:rgba(245,197,66,.48);background:linear-gradient(155deg,#22334d,#121e30 75%);box-shadow:0 18px 38px rgba(0,0,0,.30),0 0 0 1px rgba(245,197,66,.06)}
    .ch-card:hover:before{opacity:1}
    .ch-card:hover:after{transform:scale(1.4)}
    .logo-box{
      width:94px;height:66px;border-radius:15px;background:linear-gradient(145deg,#fff,#e8edf5);
      display:grid;place-items:center;padding:9px;box-shadow:0 7px 18px rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.75);transition:transform .22s ease
    }
    .ch-card:hover .logo-box{transform:translateY(-2px) scale(1.035)}
    .ch-logo{max-width:100%;max-height:100%;object-fit:contain}
    .logo-fallback{font-size:22px;font-weight:950;letter-spacing:-1px;color:#b58a24}
    .ch-name{font-size:13px;font-weight:850;line-height:1.35;max-width:100%;overflow-wrap:anywhere}
    .watch-label{display:inline-flex;align-items:center;gap:6px;font-size:9px;color:var(--gold-bright);font-weight:950;letter-spacing:1.15px;text-transform:uppercase}
    .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:52px 16px;border:1px dashed rgba(185,205,232,.22);border-radius:18px;background:rgba(255,255,255,.018)}
    #player-container{display:none;animation:fadeUp .35s ease both}
    .player-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:15px}
    .back{
      flex:0 0 auto;border:1px solid var(--line);background:linear-gradient(145deg,#172438,#101a29);
      color:#e8edf5;border-radius:12px;padding:11px 15px;cursor:pointer;font-size:12px;font-weight:850;
      transition:border-color .18s,color .18s,transform .18s
    }
    .back:hover{border-color:var(--gold);color:var(--gold-bright);transform:translateX(-2px)}
    .now-playing{font-size:14px;color:#f1d477;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
    .player-shell{
      position:relative;aspect-ratio:16/9;max-height:74vh;background:#000;
      border:1px solid rgba(245,197,66,.25);border-radius:20px;overflow:hidden;
      box-shadow:var(--shadow),0 0 0 5px rgba(245,197,66,.035)
    }
    #player{display:block;width:100%;height:100%;background:#000;object-fit:contain}
    .plyr{height:100%;--plyr-color-main:var(--gold);--plyr-video-control-color:#fff;--plyr-menu-background:#111b2a;--plyr-menu-color:#f5f7fb;--plyr-tooltip-background:#f5c542;--plyr-tooltip-color:#111}
    .plyr__control--overlaid{background:var(--gold)!important;color:#111!important;box-shadow:0 8px 28px rgba(245,197,66,.28)}
    .plyr__control--overlaid:hover{background:var(--gold-bright)!important}
    #overlay{
      position:fixed;inset:0;z-index:100;background:rgba(5,9,15,.91);backdrop-filter:blur(12px);
      display:flex;align-items:center;justify-content:center;text-align:center;padding:24px
    }
    .loader{display:flex;flex-direction:column;align-items:center;gap:16px;color:#d5deeb;font-size:13px;font-weight:700;max-width:min(420px,90vw)}
    .spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--gold);border-right-color:var(--gold-bright);border-radius:50%;animation:spin .8s linear infinite;box-shadow:0 0 24px rgba(245,197,66,.10)}
    footer{color:#66758b;text-align:center;font-size:10px;font-weight:750;letter-spacing:1.1px;padding:30px 10px 0}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes livePulse{50%{box-shadow:0 0 0 7px rgba(255,83,102,.035);opacity:.72}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:760px){
      .topbar{min-height:68px;padding-inline:18px}
      main{padding-top:25px}
      #ch-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
      .ch-card{min-height:155px;padding:15px 9px}
      .logo-box{width:82px;height:58px}
    }
    @media(max-width:560px){
      .topbar{min-height:62px;padding-inline:14px}
      .brand{font-size:18px;gap:10px}.brand-mark{width:40px;height:40px;flex-basis:40px}
      .brand small{font-size:7px;letter-spacing:1.4px}
      .live-tag{font-size:9px;padding:8px 10px;letter-spacing:1px}
      main{padding:20px 13px 38px}
      .hero{align-items:flex-start;flex-direction:column;gap:15px;margin:0 0 18px;padding:20px 17px;border-radius:18px}
      h1{font-size:34px;letter-spacing:-1.2px}
      .sub{font-size:12px;margin-top:9px}
      .count{font-size:10px;padding:8px 11px}
      .toolbar{gap:8px;margin-bottom:14px}
      #search,.refresh{height:46px;min-height:46px;border-radius:12px}
      .refresh{padding-inline:12px;font-size:11px}
      #ch-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
      .ch-card{min-height:146px;padding:14px 8px;border-radius:16px;gap:11px}
      .logo-box{width:80px;height:56px;border-radius:12px;padding:7px}
      .ch-name{font-size:12px}
      .watch-label{font-size:8px;letter-spacing:.9px}
      .player-head{align-items:center;gap:9px}
      .back{padding:10px 11px;font-size:11px}
      .now-playing{font-size:12px;max-width:54%}
      .player-shell{aspect-ratio:16/9;border-radius:14px;max-height:none}
      footer{padding-top:24px;font-size:9px}
    }
    @media(max-width:360px){
      .brand{font-size:16px}.live-tag{font-size:8px;padding:7px 8px}
      #ch-grid{gap:8px}.ch-card{min-height:135px}
      .logo-box{width:72px;height:51px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="./" aria-label="CricZone home"><span class="brand-mark"><img id="cz-brand-photo" src="https://www.bcci.tv/_next/image?q=75&url=%2Fapi%2Fteam-assets%3Fpathname%3Dsquad%252F11326.png%26brand%3Dbcci%26fallback%3Dfallback-player-men&w=3840" alt="CRICZONE sports"></span><span>CRIC<span>ZONE</span><small style="display:block;margin-top:2px;color:#91a0b5;font-size:8px;letter-spacing:1.5px;font-weight:800">LIVE SPORTS NETWORK</small></span></a>
    <div class="live-tag"><i class="live-dot"></i> SPORTS HUB</div>
  </header>
  <main>
    <section id="channel-list">
      <div class="hero">
        <div><div class="eyebrow">CRICZONE • LIVE TV</div><h1>Sony Sports</h1><p class="sub">Choose a channel and enjoy the match experience.</p></div>
        <div class="count" id="channel-count">Loading channels…</div>
      </div>
      <div class="toolbar">
        <div class="search-wrap"><input id="search" type="search" placeholder="Search sports channels…" autocomplete="off" aria-label="Search channels"></div>
        <button class="refresh" id="refresh" type="button">↻ Refresh</button>
      </div>
      <div id="ch-grid" aria-live="polite"></div>
    </section>
    <section id="player-container" aria-label="Video player">
      <div class="player-head">
        <button class="back" id="back" type="button">← All channels</button>
        <div class="now-playing" id="now-playing">Now Playing</div>
      </div>
      <div class="player-shell"><video id="player" playsinline webkit-playsinline controls preload="metadata"></video></div>
    </section>
    <footer>CRICZONE · Sports, scores &amp; live action</footer>
  </main>
</div>
<div id="overlay"><div class="loader"><span class="spinner"></span><span id="loadMsg">Loading CricZone channels…</span></div></div>
<script>
(function(){
"use strict";
var M3U_URL="https://sportlink-jtv.pages.dev/sony3.m3u";
var PROXY_BASE = "https://criczone.pages.dev/api/proxy?u=";
var $overlay=document.getElementById("overlay"),$loadMsg=document.getElementById("loadMsg");
var $list=document.getElementById("channel-list"),$grid=document.getElementById("ch-grid");
var $playerContainer=document.getElementById("player-container"),$video=document.getElementById("player");
var $count=document.getElementById("channel-count"),$search=document.getElementById("search");
var allChannels=[],currentPlayer=null,currentHls=null;

function proxyUrl(url){
  if(!url)return url;
  if(url.indexOf(PROXY_BASE)===0)return url;
  return PROXY_BASE+encodeURIComponent(url);
}
function getChId(){return new URLSearchParams(location.search).get("id")||"";}
function parseM3U(text){
  var channels=[],lines=text.split(/\r?\n/),current=null;
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();if(!line)continue;
    if(line.indexOf("#EXTINF:")===0){
      var info=line.substring(8),comma=info.indexOf(",");
      var name=comma>=0?info.substring(comma+1).trim():"Unknown";
      name=name.replace(/@\w+/gi,"").trim();
      var attrs=comma>=0?info.substring(0,comma):info;
      var idMatch=attrs.match(/tvg-id="([^"]*)"/i),logoMatch=attrs.match(/tvg-logo="([^"]*)"/i)||attrs.match(/logo="([^"]*)"/i);
      var safeId=idMatch&&idMatch[1]?idMatch[1]:name.replace(/[^a-z0-9]+/gi,"_").toLowerCase()+"_"+channels.length;
      current={id:safeId,name:name,logo:logoMatch?logoMatch[1]:"",stream_url:""};
    }else if(line.charAt(0)!=="#"&&current){current.stream_url=line;channels.push(current);current=null;}
  }
  return channels.filter(function(c){return c.stream_url;});
}
async function loadData(){
  var response=await fetch(proxyUrl(M3U_URL),{cache:"no-store"});
  if(!response.ok)throw new Error("Playlist request failed (HTTP "+response.status+")");
  return parseM3U(await response.text());
}
function renderChannels(channels){
  $count.textContent=channels.length+" CHANNELS";
  $grid.innerHTML="";
  if(!channels.length){$grid.innerHTML='<div class="empty">No channels match your search.</div>';return;}
  var fragment=document.createDocumentFragment();
  channels.forEach(function(ch){
    var a=document.createElement("a");a.className="ch-card";a.href="?id="+encodeURIComponent(ch.id);
    var logoBox=document.createElement("span");logoBox.className="logo-box";
    if(ch.logo){var img=document.createElement("img");img.className="ch-logo";img.alt=ch.name;img.loading="lazy";img.src=ch.logo;img.onerror=function(){logoBox.innerHTML='<span class="logo-fallback">CZ</span>';};logoBox.appendChild(img);}
    else{var fallback=document.createElement("span");fallback.className="logo-fallback";fallback.textContent="CZ";logoBox.appendChild(fallback);}
    var name=document.createElement("span");name.className="ch-name";name.textContent=ch.name;
    var label=document.createElement("span");label.className="watch-label";label.textContent="▶ Watch channel";
    a.appendChild(logoBox);a.appendChild(name);a.appendChild(label);fragment.appendChild(a);
  });
  $grid.appendChild(fragment);
}
function destroyPlayer(){
  if(currentHls){currentHls.destroy();currentHls=null;}
  if(currentPlayer){currentPlayer.destroy();currentPlayer=null;}
  $video.pause();$video.removeAttribute("src");$video.load();
}
function showList(){
  destroyPlayer();$playerContainer.style.display="none";$list.style.display="block";
  var url=new URL(location.href);url.searchParams.delete("id");history.pushState({}, "",url.pathname+url.search+url.hash);
}
function showPlayer(ch){
  $list.style.display="none";$playerContainer.style.display="block";
  document.getElementById("now-playing").textContent=ch.name;
  $loadMsg.textContent="Connecting to "+ch.name+"…";$overlay.style.display="flex";
  destroyPlayer();
  var source=proxyUrl(ch.stream_url);
  var options={controls:["play","progress","current-time","mute","volume","settings","fullscreen"],settings:["quality"],autoplay:true,muted:false};
  if(window.Hls&&Hls.isSupported()&&/\.m3u8(\?|$)/i.test(ch.stream_url)){
    currentHls=new Hls({enableWorker:true,lowLatencyMode:true,liveSyncDurationCount:3,maxBufferLength:30,maxMaxBufferLength:60,manifestLoadingMaxRetry:3,fragLoadingMaxRetry:3});
    currentHls.loadSource(source);currentHls.attachMedia($video);
    currentHls.on(Hls.Events.MANIFEST_PARSED,function(_,data){
      var heights=data.levels.map(function(level){return level.height;}).filter(Boolean);
      var unique=heights.filter(function(value,index){return heights.indexOf(value)===index;}).sort(function(a,b){return b-a;});
      currentPlayer=new Plyr($video,Object.assign({},options,unique.length?{quality:{default:unique[0],options:unique,forced:true,onChange:function(q){currentHls.levels.forEach(function(level,index){if(level.height===q)currentHls.currentLevel=index;});}}}:{}));
      $video.play().catch(function(){});$overlay.style.display="none";
    });
    currentHls.on(Hls.Events.ERROR,function(_,data){
      if(data.fatal){$loadMsg.textContent="Playback error. The source or proxy may be unavailable.";if(data.type===Hls.ErrorTypes.NETWORK_ERROR)currentHls.startLoad();else if(data.type===Hls.ErrorTypes.MEDIA_ERROR)currentHls.recoverMediaError();else $overlay.style.display="flex";}
    });
  }else{
    $video.src=source;currentPlayer=new Plyr($video,options);
    $video.addEventListener("loadedmetadata",function(){ $overlay.style.display="none";},{once:true});
    $video.addEventListener("error",function(){ $loadMsg.textContent="Unable to play this stream. Check source/proxy access."; $overlay.style.display="flex";},{once:true});
    $video.play().catch(function(){ $loadMsg.textContent="Press play to start the stream.";});
  }
}
async function main(){
  try{
    allChannels=await loadData();renderChannels(allChannels);$overlay.style.display="none";
    var id=getChId();if(id){var ch=allChannels.find(function(item){return item.id===id;});if(ch)showPlayer(ch);}
  }catch(error){$loadMsg.textContent="Could not load playlist. "+error.message;$overlay.style.display="flex";$count.textContent="OFFLINE";}
}
$search.addEventListener("input",function(){var q=$search.value.trim().toLowerCase();renderChannels(allChannels.filter(function(ch){return ch.name.toLowerCase().indexOf(q)!==-1;}));});
document.getElementById("refresh").addEventListener("click",function(){$loadMsg.textContent="Refreshing channels…";$overlay.style.display="flex";main();});
document.getElementById("back").addEventListener("click",showList);
window.addEventListener("popstate",function(){var id=getChId();if(!id){showList();}else{var ch=allChannels.find(function(item){return item.id===id;});if(ch)showPlayer(ch);}});
document.addEventListener("DOMContentLoaded",main);
})();
</script>

<script>
(function(){
  var photos=[
    "https://www.bcci.tv/_next/image?q=75&url=%2Fapi%2Fteam-assets%3Fpathname%3Dsquad%252F11326.png%26brand%3Dbcci%26fallback%3Dfallback-player-men&w=3840",
    "https://static-files.cricket-australia.pulselive.com/headshots/440/10917-camedia.png"
  ];
  var photo=document.getElementById("cz-brand-photo"),index=0;
  if(!photo)return;
  photo.addEventListener("error",function(){photo.style.display="none";photo.parentElement.textContent="CZ";});
  window.setInterval(function(){
    index=(index+1)%photos.length;
    photo.style.opacity="0";
    window.setTimeout(function(){photo.src=photos[index];photo.style.opacity="1";},180);
  },4000);
})();
</script>

</body>
</html>
