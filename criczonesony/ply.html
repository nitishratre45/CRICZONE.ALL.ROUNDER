<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>CRICZONE Player</title>
<style>
:root{color-scheme:dark;--gold:#f5c542;--line:#26344a;--muted:#9aa8ba}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#172944,#070b12 62%);color:#f5f7fb;font-family:Inter,system-ui,Arial,sans-serif}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,3vw,36px);background:#080d16;border-bottom:1px solid var(--line)}
.brand{font-weight:950;letter-spacing:.5px}.brand span{color:var(--gold)}.back{color:#111;background:var(--gold);text-decoration:none;border-radius:10px;padding:10px 15px;font-size:12px;font-weight:900}
main{width:min(1500px,100%);margin:auto;padding:clamp(14px,3vw,34px)}
.panel{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#121e30,#0a111d);padding:clamp(12px,2vw,22px);box-shadow:0 20px 60px #0006}
h1{font-size:clamp(18px,2.3vw,27px);margin:0 0 6px}.sub{color:var(--muted);font-size:12px;margin:0 0 16px}
.player{position:relative;width:100%;aspect-ratio:16/9;max-height:78vh;background:#000;border-radius:12px;overflow:hidden;border:1px solid #ffffff18}
iframe{width:100%;height:100%;display:block;border:0;background:#000}
#status{color:var(--muted);font-size:12px;padding:12px 2px 2px;min-height:32px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.actions button{border:1px solid var(--line);background:#1a2940;color:#fff;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
@media(max-width:600px){header{height:58px}.player{aspect-ratio:16/9}.panel{padding:10px}}
</style>
</head>
<body>
<header><div class="brand">⚡ CRIC<span>ZONE</span> PLAYER</div><a class="back" href="./">← BACK TO SONY</a></header>
<main><section class="panel">
<h1 id="title">Live Event</h1><p class="sub">CRICZONE Embedded Live Player</p>
<div class="player"><iframe id="stream-frame" title="Live event stream" src="about:blank" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe></div>
<div id="status" role="status">Opening embedded stream…</div>
<div class="actions"><button id="retry" type="button">↻ Reload Stream</button><button id="fullscreen" type="button">⛶ Fullscreen</button></div>
</section></main>
<script>
(function(){
"use strict";
var params=new URLSearchParams(location.search),url=params.get("url"),title=params.get("title")||"Live Event";
var frame=document.getElementById("stream-frame"),status=document.getElementById("status"),titleEl=document.getElementById("title");
titleEl.textContent=title;document.title="CRICZONE Player — "+title;
function load(){
 if(!url){status.textContent="Invalid or missing stream URL.";frame.src="about:blank";return;}\n var parsed;try{parsed=new URL(url);}catch(e){parsed=null;}\n if(!parsed||!(parsed.protocol==="https:"||parsed.protocol==="http:")){status.textContent="Invalid or missing stream URL.";frame.src="about:blank";return;}
 status.textContent="Opening stream inside embedded player…";
 frame.src=url;
}
document.getElementById("retry").addEventListener("click",load);
document.getElementById("fullscreen").addEventListener("click",function(){if(frame.requestFullscreen)frame.requestFullscreen();});
frame.addEventListener("load",function(){if(frame.src!=="about:blank")status.textContent="Embedded stream page loaded. If playback does not appear, the source may not support iframe embedding.";});
load();
})();
</script>
<script src="/assets/js/cz-global-community.js" defer></script>
</body></html>
