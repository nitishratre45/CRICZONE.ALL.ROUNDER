<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08111e">
<title>CRICZONE Sony Event Player</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#070d17;color:#f7f9fc;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column}
header{height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(14px,3vw,34px);background:#080f1b;border-bottom:1px solid #26364b}
.brand{font-weight:950;letter-spacing:.4px;font-size:20px}.brand span{color:#f6c94f}
.brand small{display:block;color:#91a0b5;font-size:8px;letter-spacing:1.7px;margin-top:2px}
a,button{font:inherit}
.back{color:#111;background:#f6c94f;text-decoration:none;border-radius:999px;padding:10px 16px;font-size:12px;font-weight:900;white-space:nowrap}
main{width:min(1500px,100%);margin:0 auto;padding:clamp(12px,2.5vw,30px);flex:1;display:flex;flex-direction:column}
.title{font-size:clamp(16px,2vw,23px);font-weight:950;color:#ffe18a;line-height:1.35;overflow-wrap:anywhere;margin:0 0 14px}
.stage{width:100%;aspect-ratio:16/9;max-height:calc(100vh - 150px);min-height:220px;background:#000;border:1px solid rgba(246,201,79,.28);border-radius:16px;overflow:hidden;box-shadow:0 18px 50px #0008}
iframe{display:block;width:100%;height:100%;border:0;background:#000}
.note{color:#91a0b5;font-size:11px;line-height:1.5;margin:10px 2px}
@media(max-width:600px){header{height:58px;padding-inline:12px}.brand{font-size:17px}.back{padding:9px 12px;font-size:11px}main{padding:12px}.title{font-size:15px;margin-bottom:10px}.stage{aspect-ratio:16/9;min-height:210px;max-height:58vh;border-radius:11px}}
</style>
</head>
<body>
<header><div class="brand">⚡ CRIC<span>ZONE</span><small>SONY EVENT PLAYER</small></div><a class="back" href="./index.html">← BACK TO SONY EVENTS</a></header>
<main>
<h1 class="title" id="event-title">Sony LIV Event</h1>
<div class="stage"><iframe id="stream-frame" title="Sony LIV event stream" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe></div>
<div class="note">Stream is loaded from the public URL supplied by the Sony events feed. Availability and playback are controlled by the stream provider.</div>
</main>
<script>
(function(){
 const p=new URLSearchParams(location.search);
 const u=p.get("url");
 const t=p.get("title")||"Sony LIV Event";
 document.getElementById("event-title").textContent=t;
 if(u && /^https:\/\//i.test(u)) document.getElementById("stream-frame").src=u;
 else document.querySelector(".note").textContent="Invalid or missing stream URL.";
})();
</script>
</body>
</html>
