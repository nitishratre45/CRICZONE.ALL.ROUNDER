<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07110D">
<title>CRICZONE — Live Cricket & Sports</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Shaka Player (DASH + ClearKey) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">

<style>
:root{
  --bg:#0A0F1D;
  --surface:#121A2F;
  --surface-2:#1A243D;
  --ink:#E8F1FF;
  --muted:#8CA5C9;
  --line:#233152;
  --brand:#2E7DFF;
  --brand-2:#4FC3F7;
  --purple:#8B5CF6;
  --purple-2:#A78BFA;
  --live:#FF4D6D;
  --soon:#4FC3F7;
  --done:#64748B;
  --chip:#1A243D;
  --font-d:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --font-b:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font:400 15px/1.45 var(--font-b);
  color:var(--ink);
  min-height:100vh;
  background:var(--bg);
  padding-bottom:calc(env(safe-area-inset-bottom,0) + 28px);
  -webkit-font-smoothing:antialiased;
}

button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--brand-2);text-decoration:none}
:focus-visible{outline:3px solid var(--brand-2);outline-offset:2px;border-radius:6px}

.container{max-width:1320px;margin:0 auto;padding:0 16px}
.view{display:none}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ================= HEADER ================= */
.top-header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 0;border-bottom:1px solid var(--line);
  flex-wrap:wrap;
}
.header-left{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand-badge{
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#2E7DFF,#4FC3F7);
  padding:8px 16px;border-radius:50px;font-weight:700;font-size:14px;
  color:#fff;box-shadow:0 4px 16px rgba(46,125,255,.4);
}
.brand-logo{
  display:flex;align-items:center;gap:10px;
}
.brand-logo .icon{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,#2E7DFF,#4FC3F7);
  display:grid;place-items:center;font-size:20px;
}
.brand-logo .text h1{
  font:800 26px/1 var(--font-d);letter-spacing:.02em;
  background:linear-gradient(100deg,#fff,#4FC3F7);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-logo .text p{font-size:12px;color:var(--muted)}
.header-right{display:flex;align-items:center;gap:16px}
.live-indicator{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,77,109,.12);border:1px solid rgba(255,77,109,.3);
  padding:6px 14px;border-radius:50px;font-size:13px;font-weight:600;color:#FF4D6D;
}
.live-indicator .dot{
  width:8px;height:8px;border-radius:50%;background:#FF4D6D;
  animation:pulse 1.2s infinite;
}
@keyframes pulse{50%{opacity:.3}}
.header-clock{font-size:13px;color:var(--muted);font-weight:500}

/* ================= FILTERS ================= */
.filter-section{padding:18px 0 8px}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}

.filter-pill{
  flex:none;display:flex;align-items:center;gap:7px;
  padding:9px 16px;border-radius:50px;font-size:13.5px;font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  transition:.2s ease;white-space:nowrap;
}
.filter-pill:hover{border-color:var(--brand);color:var(--ink)}
.filter-pill.active{
  background:linear-gradient(135deg,#8B5CF6,#A78BFA);
  color:#fff;border-color:transparent;
  box-shadow:0 4px 16px rgba(139,92,246,.35);
}
.filter-pill .count{
  font-size:11px;font-weight:700;padding:2px 7px;border-radius:50px;
  background:rgba(255,255,255,.15);color:inherit;
}
.filter-pill.active .count{background:rgba(255,255,255,.25)}
.filter-pill.status-pill{
  background:var(--surface-2);border-color:var(--line);
}
.filter-pill.status-pill.active{
  background:var(--surface-2);border-color:var(--purple);
  color:var(--purple-2);box-shadow:0 0 0 1px var(--purple) inset;
}
.filter-pill.status-pill .count{background:rgba(139,92,246,.2);color:var(--purple-2)}
.filter-pill.status-pill.active .count{background:rgba(139,92,246,.3);color:#fff}

/* ================= MATCH GRID ================= */
.match-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:14px;
  padding:12px 0 40px;
}

.match-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease;
  cursor:pointer;
}
.match-card:hover{
  border-color:rgba(46,125,255,.5);
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(0,0,0,.4);
}
.match-card.live-card{border-color:rgba(255,77,109,.4)}

.card-header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 14px;border-bottom:1px solid var(--line);
  background:rgba(0,0,0,.15);
}
.card-header .sport-label{
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:6px;
}
.card-header .sport-label .sport-icon{font-size:14px}

.stream-count{
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:50px;
  display:flex;align-items:center;gap:4px;
}
.stream-count.no-streams{
  color:#FF4D6D;background:rgba(255,77,109,.12);
}
.stream-count.has-streams{
  color:var(--purple-2);background:rgba(139,92,246,.15);
}
.stream-count .signal{font-size:10px}

.card-body{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 14px;gap:8px;
}

.team{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;
  min-width:0;
}
.team-logo{
  width:52px;height:52px;border-radius:50%;
  background:var(--surface-2);
  display:grid;place-items:center;overflow:hidden;
  border:2px solid var(--line);
  font-size:16px;font-weight:700;color:var(--muted);
}
.team-logo img{width:100%;height:100%;object-fit:contain}
.team-name{
  font-size:13px;font-weight:600;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  max-width:100%;
}

.match-info{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:0 6px;
}
.match-time{
  font:800 22px/1 var(--font-d);letter-spacing:.01em;
  color:var(--brand-2);white-space:nowrap;
}
.match-date{font-size:11px;color:var(--muted)}
.match-tz{font-size:10px;color:var(--muted);opacity:.7}

.match-badge{
  margin-top:4px;font-size:10.5px;font-weight:700;letter-spacing:.04em;
  padding:3px 10px;border-radius:50px;text-transform:uppercase;
  white-space:nowrap;
}
.match-badge.live{
  background:rgba(255,77,109,.15);color:#FF4D6D;
  border:1px solid rgba(255,77,109,.3);
}
.match-badge.soon{
  background:rgba(79,195,247,.1);color:#4FC3F7;
  border:1px solid rgba(79,195,247,.25);
}
.match-badge.done{
  background:rgba(100,116,139,.15);color:#94A3B8;
  border:1px solid rgba(100,116,139,.25);
}

/* ================= PLAYER VIEW ================= */
.player-header{
  display:flex;align-items:center;gap:14px;
  padding:18px 0;
}
.back-btn{
  width:42px;height:42px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;font-size:18px;color:var(--ink);
  transition:.2s ease;flex:none;
}
.back-btn:hover{border-color:var(--brand);color:var(--brand)}
.player-header .titles{flex:1;min-width:0}
.player-title{font:800 clamp(20px,4vw,28px)/1.05 var(--font-d);overflow-wrap:anywhere}
.player-sub{color:var(--muted);font-size:13px;margin-top:3px}

.screen{
  position:relative;background:#000;border-radius:16px;overflow:hidden;
  aspect-ratio:16/9;border:1px solid var(--line);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  max-width:960px;margin:0 auto;
}
#player-container{position:absolute;inset:0}
#player-container video{width:100%;height:100%;object-fit:contain;background:#000}
/* Hide Shaka buffering spinner/indicator only; keep playback controls visible */
.shaka-spinner-container,.shaka-spinner-svg-container,.shaka-spinner-svg,.shaka-spinner-container[shaka-controls],.shaka-spinner-container[shown]{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}
.screen-msg{
  position:absolute;inset:0;display:grid;place-items:center;
  color:#93A7C6;font-size:14px;text-align:center;padding:20px;
}
.engine{
  position:absolute;top:6px;left:6px;z-index:5;
  font-weight:600;font-size:8px;letter-spacing:.02em;
  padding:2px 5px;border-radius:50px;
  background:rgba(10,15,29,.72);color:#CFE2FF;
  border:1px solid rgba(46,125,255,.28);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}

.player-h2{
  font:700 18px var(--font-d);letter-spacing:.04em;
  margin:24px auto 12px;color:var(--muted);text-transform:uppercase;
  max-width:960px;
}

.streams{display:flex;flex-direction:column;gap:8px;max-width:960px;margin:0 auto}
.stream-btn{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;padding:14px 16px;border-radius:12px;text-align:left;
  border:1px solid var(--line);background:var(--surface);
  color:var(--ink);transition:.18s ease;
}
.stream-btn:hover{border-color:var(--brand);background:var(--surface-2)}
.stream-btn.active{
  border-color:var(--purple);
  background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(167,139,250,.08));
  box-shadow:0 0 0 1px var(--purple) inset;
}
.stream-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.type{
  flex:none;font-size:10px;font-weight:700;letter-spacing:.06em;
  color:var(--purple-2);background:rgba(139,92,246,.15);
  padding:4px 9px;border-radius:50px;
}
.stream-btn.active .type{background:rgba(255,255,255,.15);color:#fff}

.note{
  max-width:960px;margin:20px auto 40px;font-size:12.5px;line-height:1.6;
  color:var(--muted);
}

/* ================= RESPONSIVE ================= */
@media(max-width:768px){
  .top-header{padding:12px 0}
  .brand-badge{padding:6px 12px;font-size:12px}
  .brand-logo .icon{width:34px;height:34px;font-size:16px}
  .brand-logo .text h1{font-size:20px}
  .header-right{gap:10px}
  .live-indicator{padding:4px 10px;font-size:11px}
  .header-clock{font-size:11px}
  .match-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
}
@media(max-width:480px){
  .match-grid{grid-template-columns:1fr}
  .team-logo{width:44px;height:44px}
  .match-time{font-size:20px}
  .card-body{padding:12px 10px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

body{background:radial-gradient(ellipse at 10% -10%,rgba(0,208,132,.14),transparent 42%),radial-gradient(ellipse at 100% 0%,rgba(21,138,96,.12),transparent 35%),var(--bg)}

button:hover,.btn:hover{transform:translateY(-1px)}

a{color:#71edb1}::selection{background:#00D084;color:#04110A}

<div class="container">

  <!-- ============ HUB VIEW ============ -->
  <section id="hubView" class="view active">
    <header class="top-header">
      <div class="header-left">
        <div class="brand-badge">
          <span>✈️</span> @CricZone
        </div>
        <div class="brand-logo">
          <div class="icon">📺</div>
          <div class="text">
            <h1>CricZone</h1>
            <p>Live Sports Streaming Hub</p>
          </div>
        </div>
      </div>
      <div class="header-right">
        <div class="live-indicator"><span class="dot"></span> Live Now</div>
        <div class="header-clock" id="clock"></div>

      <button class="back-btn" id="backHub" aria-label="Back to matches">←</button>

      <div id="player-container"></div>

    <div class="streams" id="streams"></div>

      All streams are DASH (MPD). For best performance, use a modern browser
      that supports DASH playback. ClearKey DRM is handled automatically.

<script>
"use strict";

/* =====================================================================
   CONFIG
   ===================================================================== */
const DATA_URL = "/api/all-feed";
const PROXY_URL = "https://sportlink-10.lovable.app/api/public/proxy?url=";
const $ = id => document.getElementById(id);

const state = {
  events: [],
  tab: "all",
  sport: "All",
  currentEvent: null,
  currentStreams: [],
  currentIndex: 0
};

let booted = false;

/* =====================================================================
   HELPERS
   ===================================================================== */
function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function toDate(value){
  if(!value) return null;
  const d = new Date(
    String(value).trim().replace(/\//g,"-").replace(" ","T").replace(/\s*\+0000$/,"Z")
  );
  return isNaN(d.getTime()) ? null : d;
}

function getStatus(event){
  const now = Date.now();
  if(now < event.st) return "soon";
  if(now <= event.en) return "live";
  return "done";
}

function duration(ms){
  const minutes = Math.max(0, Math.round(ms / 60000));
  const hours = Math.floor(minutes / 60);
  const mins = minutes % 60;
  if(hours > 0) return `${hours}h ${mins}m`;
  return `${mins}m`;
}

function timeString(date){
  return date.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
}

function dateString(date){
  return date.toLocaleDateString([], {day:"numeric", month:"short"});
}

/* =====================================================================
   PROXY HELPER
   ===================================================================== */
function proxyUrl(url){
  if(!url) return url;
  const raw = String(url).trim();
  // Already proxied?
  if(raw.startsWith(PROXY_URL)) return raw;
  return PROXY_URL + encodeURIComponent(raw);
}

/* =====================================================================
   DATA NORMALIZATION (DASH ONLY — HLS REMOVED)
   ===================================================================== */
function normalize(data){
  if(!Array.isArray(data)) throw new Error("JSON root must be an array.");

  return data.map((item, index) => {
    const x = item.eventInfo || {};
    const st = toDate(x.startTime);
    if(!st) return null;

    const en = toDate(x.endTime) || new Date(st.getTime() + 3 * 3600000);

    const streams = Array.isArray(item.resolved_streams)
      ? item.resolved_streams
          .filter(s => s && s.link && String(s.type) === "1")
          .map((s, i) => ({
            title: String(s.title || `Stream ${i+1}`),
            link: String(s.link),
            type: "1",
            api: String(s.api || "")
          }))
      : [];

    return {
      id: item.id ?? index,
      sport: x.eventCat || "Other",
      comp: x.eventName || "",
      a: x.teamA || "",
      b: x.teamB || "",
      fa: x.teamAFlag || "",
      fb: x.teamBFlag || "",
      logo: x.eventLogo || item.image || "",
      st, en, streams
    };
  }).filter(Boolean);
}

async function loadData(){
  try{
    const response = await fetch(DATA_URL, {cache:"no-store"});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);

    state.events = normalize(await response.json());
    renderHub();

    if(!booted){
      booted = true;
      route();
    }
  }catch(error){
    $("list").innerHTML =
      `<div class="status err" style="grid-column:1/-1"><b>Could not load events.</b> ${esc(error.message)}</div>`;
  }
}

/* =====================================================================
   HUB RENDERING
   ===================================================================== */
function sportIcon(sport){
  const s = String(sport).toLowerCase();
  if(s.includes("cricket")) return "🏏";
  if(s.includes("football") || s.includes("soccer")) return "⚽";
  if(s.includes("wwe") || s.includes("wrestling")) return "🤼";
  if(s.includes("basketball")) return "🏀";
  if(s.includes("tennis")) return "🎾";
  if(s.includes("baseball")) return "⚾";
  if(s.includes("hockey")) return "🏒";
  return "🏆";
}

function flag(url, name){
  const initials = esc(
    String(name || "").replace(/[^A-Za-z0-9 ]/g,"").split(" ")
      .filter(Boolean).map(x => x[0]).join("").slice(0,3).toUpperCase() || "?"
  );
  if(!url || url === "null"){
    return `<div class="team-logo">${initials}</div>`;
  }
  return `<div class="team-logo">
    <img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">
  </div>`;
}

function eventCard(event){
  const s = getStatus(event);
  const now = Date.now();
  const isLive = s === "live";
  
  let badgeClass = "", badgeText = "";
  if(s === "live"){
    badgeClass = "live"; badgeText = "LIVE";
  } else if(s === "soon"){
    badgeClass = "soon"; badgeText = `in ${duration(event.st - now)}`;
  } else {
    badgeClass = "done"; badgeText = "Finished";
  }

  const streamCount = event.streams.length;
  const streamBadge = streamCount === 0
    ? `<span class="stream-count no-streams">🚫 No streams</span>`
    : `<span class="stream-count has-streams">📶 ${streamCount} link${streamCount > 1 ? "s" : ""}</span>`;

  const sameTeam = !event.b || event.a === event.b;
  const teamA = `
    <div class="team">
      ${flag(event.fa, event.a || event.comp)}
      <div class="team-name">${esc(event.a || event.comp)}</div>
    </div>`;
  const teamB = sameTeam ? "" : `
    <div class="team">
      ${flag(event.fb, event.b)}
      <div class="team-name">${esc(event.b)}</div>
    </div>`;

  return `
    <article class="match-card ${isLive ? "live-card" : ""}" 
             data-watch-event="${esc(event.id)}" 
             data-watch-stream="0"
             role="button" tabindex="0"
             aria-label="${esc(event.a)} vs ${esc(event.b || "TBD")}">
      <div class="card-header">
        <div class="sport-label">
          <span class="sport-icon">${sportIcon(event.sport)}</span>
          ${esc(event.sport)} · ${esc(event.comp)}
        </div>
        ${streamBadge}
      </div>
      <div class="card-body">
        ${teamA}
        <div class="match-info">
          <div class="match-time">${timeString(event.st)}</div>
          <div class="match-date">${dateString(event.st)}</div>
          <div class="match-tz">IST</div>
          <div class="match-badge ${badgeClass}">${badgeText}</div>
        </div>
        ${teamB}
      </div>
    </article>
  `;
}

function renderHub(){
  const counts = {live:0, soon:0, done:0};
  state.events.forEach(e => counts[getStatus(e)]++);

  const sports = ["All", ...new Set(state.events.map(e => e.sport).filter(Boolean))];
  $("sports").innerHTML = sports.map(sport => {
    const count = sport === "All" ? state.events.length : state.events.filter(e => e.sport === sport).length;
    return `<button class="filter-pill ${state.sport === sport ? "active" : ""}" data-sport="${esc(sport)}">
      ${sport === "All" ? "🏆" : sportIcon(sport)} ${esc(sport)} <span class="count">${count}</span>
    </button>`;
  }).join("");

  const tabs = [
    ["all", "All", state.events.length],
    ["live", "Live", counts.live],
    ["soon", "Upcoming", counts.soon]
  ];
  $("tabs").innerHTML = tabs.map(([key, label, count]) =>
    `<button class="filter-pill status-pill ${state.tab === key ? "active" : ""}" data-tab="${key}">
      ${key === "live" ? "🔴" : key === "soon" ? "📅" : "✅"} ${label} <span class="count">${count}</span>
    </button>`
  ).join("");

  const rows = state.events
    .filter(e =>
      (state.tab === "all" || getStatus(e) === state.tab) &&
      (state.sport === "All" || e.sport === state.sport)
    )
    .sort((a, b) => {
      const order = {live:0, soon:1, done:2};
      const sa = order[getStatus(a)] ?? 3;
      const sb = order[getStatus(b)] ?? 3;
      if(sa !== sb) return sa - sb;
      return a.st - b.st;
    });

  $("list").innerHTML = rows.length
    ? rows.map(eventCard).join("")
    : `<div class="empty" style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)">
         <b style="color:var(--ink);font-size:18px">No matches found</b><br>Try another filter.
       </div>`;

  $("clock").textContent = new Date().toLocaleString([], {
    day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"
  }) + " IST";
}

/* =====================================================================
   ROUTER
   ===================================================================== */
function route(){
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, qs] = raw.split("?");
  const params = new URLSearchParams(qs || "");

  if(path === "watch"){
    openPlayer(params.get("id"), Number(params.get("stream") || 0));
  }else{
    showHub();
  }
}

function showHub(){
  stopPlayback();
  state.currentEvent = null;
  state.currentStreams = [];
  $("playerView").classList.remove("active");
  $("hubView").classList.add("active");
  window.scrollTo(0, 0);
}

async function openPlayer(id, index){
  $("hubView").classList.remove("active");
  $("playerView").classList.add("active");
  window.scrollTo(0, 0);

  const event = state.events.find(e => String(e.id) === String(id));

  if(!event){
    state.currentEvent = null;
    state.currentStreams = [];
    $("playerTitle").textContent = "Match not found";
    $("playerSub").textContent = "";
    $("streams").innerHTML =
      `<div class="status err"><b>Match not found</b><br>This match is no longer available in the current feed.</div>`;
    $("engine").textContent = "Idle";
    $("player-container").innerHTML = "";
    return;
  }

  state.currentEvent = event;
  state.currentStreams = event.streams || [];
  state.currentIndex = index;

  $("playerTitle").textContent =
    event.a && event.b ? `${event.a} vs ${event.b}` : (event.comp || "CRICZONE Player");
  $("playerSub").textContent =
    [event.sport, event.comp].filter(Boolean).join(" · ");

  renderPlayerStreams(index);

  const record = state.currentStreams[index];
  if(record){
    await playRecord(record, index);
  }else{
    $("engine").textContent = "Idle";
    $("player-container").innerHTML =
      `<div class="screen-msg">No playable DASH stream for this match</div>`;
  }
}

/* =====================================================================
   PLAYER (Shaka / DASH only, routed via proxy)
   ===================================================================== */
let shakaPlayer = null;
let shakaOverlay = null;
let playbackToken = 0;
let recoveryTimer = null;
let recoveryAttempts = 0;
let recoveryBusy = false;

function clearRecoveryTimer(){
  if(recoveryTimer){
    clearTimeout(recoveryTimer);
    recoveryTimer = null;
  }
}

function scheduleAutoReconnect(record, index, token, delay = 9000){
  if(token !== playbackToken || recoveryTimer || recoveryBusy) return;
  recoveryTimer = setTimeout(async () => {
    recoveryTimer = null;
    if(token !== playbackToken || recoveryBusy) return;
    const video = $("shaka-video");
    if(video && !video.paused && !video.ended && video.readyState >= 3){
      return;
    }
    recoveryBusy = true;
    recoveryAttempts++;
    $("engine").textContent = `Reconnecting… (${recoveryAttempts}/5)`;
    try{
      if(shakaPlayer && token === playbackToken){
        try{ shakaPlayer.retryStreaming(); }catch(e){}
      }
      // Give Shaka a short chance to recover before reloading the selected live link.
      await new Promise(resolve => setTimeout(resolve, 2500));
      if(token !== playbackToken) return;
      const currentVideo = $("shaka-video");
      if(currentVideo && !currentVideo.paused && !currentVideo.ended && currentVideo.readyState >= 3){
        $("engine").textContent = "Shaka · DASH";
        recoveryAttempts = 0;
        return;
      }
      if(recoveryAttempts <= 5 && state.currentStreams[index]){
        recoveryBusy = false;
        playRecord(state.currentStreams[index], index);
        return;
      }
      $("engine").textContent = "Reconnect failed";
    }finally{
      recoveryBusy = false;
    }
  }, delay);
}

async function destroyShaka(){
  clearRecoveryTimer();
  if(shakaOverlay){
    try{ shakaOverlay.destroy(); }catch(e){}
    shakaOverlay = null;
  }
  if(shakaPlayer){
    try{ await shakaPlayer.destroy(); }catch(e){}
    shakaPlayer = null;
  }
  const container = $("player-container");
  if(container) container.innerHTML = "";
}

async function stopPlayback(){
  playbackToken++;
  await destroyShaka();
  const engine = $("engine");
  if(engine) engine.textContent = "Idle";
}

function getClearKey(record){
  const raw = String(record && record.api || "").trim();
  if(!raw || !raw.includes(":")) return null;
  const parts = raw.split(":");
  if(parts.length < 2) return null;
  const keyId = parts.shift().trim().replace(/^0x/i, "").toLowerCase();
  const key = parts.join(":").trim().replace(/^0x/i, "").toLowerCase();
  if(/^[0-9a-f]+$/.test(keyId) && /^[0-9a-f]+$/.test(key)){
    return {keyId, key};
  }
  return null;
}

async function initShaka(url, record, token){
  if(!window.shaka || !window.shaka.Player) throw new Error("Shaka Player failed to load.");
  window.shaka.polyfill.installAll();
  if(!window.shaka.Player.isBrowserSupported()){
    throw new Error("This browser does not support DASH playback.");
  }

  const container = $("player-container");
  container.innerHTML = `<video id="shaka-video" autoplay playsinline preload="auto"></video>`;
  const video = $("shaka-video");

  shakaPlayer = new window.shaka.Player(video);
  shakaOverlay = new window.shaka.ui.Overlay(shakaPlayer, container, video);

  shakaPlayer.configure({
    streaming:{
      // Prefer stable playback over chasing the live edge.
      lowLatencyMode: false,
      bufferingGoal: 18,
      rebufferingGoal: 5,
      bufferBehind: 30,
      retryParameters:{ timeout:30000, stallTimeout:10000, connectionTimeout:15000, maxAttempts:5, baseDelay:500, backoffFactor:2 },
      stallEnabled: true, stallThreshold: 1, gapDetectionThreshold: 0.5, smallGapLimit: 0.5,
      jumpLargeGaps: true, minTimeBetweenRecoveries: 2
    },
    abr:{ enabled:true, defaultBandwidthEstimate:2500000, switchInterval:8, bandwidthUpgradeTarget:0.8, bandwidthDowngradeTarget:0.9 },
    manifest:{ dash:{ ignoreMinBufferTime: true } },
    drm:{ retryParameters:{ timeout:30000, stallTimeout:10000, connectionTimeout:15000, maxAttempts:4, baseDelay:500, backoffFactor:2 } }
  });

  const clearKey = getClearKey(record);
  if(clearKey){
    shakaPlayer.configure({ drm:{ clearKeys:{ [clearKey.keyId]: clearKey.key } } });
  }

  // ---------------------------------------------------------------
  // Route every manifest + segment request through the proxy.
  // This guarantees sub-resources (init segments, media segments)
  // also pass through sportlink-10.lovable.app, avoiding CORS/403
  // issues on the upstream CDN.
  // ---------------------------------------------------------------
  shakaPlayer.getNetworkingEngine().registerRequestFilter((type, request) => {
    const uri = request.uris && request.uris[0];
    if(!uri) return;
    if(uri.startsWith(PROXY_URL)) return;      // already proxied
    if(!/^https?:\/\//i.test(uri)) return;     // skip non-http (blobs, data)
    request.uris = [PROXY_URL + encodeURIComponent(uri)];
  });

  shakaPlayer.addEventListener("error", ev => {
    if(token !== playbackToken) return;
    try{ shakaPlayer.retryStreaming(); }catch(e){}
    scheduleAutoReconnect(record, state.currentIndex, token, 2500);
  });

  video.addEventListener("playing", () => {
    if(token !== playbackToken) return;
    clearRecoveryTimer();
    recoveryAttempts = 0;
    $("engine").textContent = clearKey ? "Shaka · DASH · ClearKey" : "Shaka · DASH";
  });
  video.addEventListener("waiting", () => scheduleAutoReconnect(record, state.currentIndex, token, 10000));
  video.addEventListener("stalled", () => scheduleAutoReconnect(record, state.currentIndex, token, 10000));
  video.addEventListener("error", () => scheduleAutoReconnect(record, state.currentIndex, token, 2500));

  $("engine").textContent = "Loading…";
  await shakaPlayer.load(url);
  if(token !== playbackToken) return;

  $("engine").textContent = clearKey ? "Shaka · DASH · ClearKey" : "Shaka · DASH";
  video.play().catch(() => {});
}

async function playRecord(record, index){
  if(!record) return;
  document.querySelectorAll("[data-player-stream]").forEach((btn, i) =>
    btn.classList.toggle("active", i === index)
  );

  const token = ++playbackToken;
  clearRecoveryTimer();
  recoveryAttempts = 0;
  recoveryBusy = false;
  await destroyShaka();

  // Extract raw URL (strip pipe params) then wrap with proxy
  const rawUrl = String(record.link || "").split("|")[0].trim();

  if(!/^https?:\/\//i.test(rawUrl)){
    $("engine").textContent = "Invalid link";
    $("player-container").innerHTML = `<div class="screen-msg">This stream link is not valid.</div>`;
    return;
  }

  // Prepend proxy so the MPD itself is fetched through sportlink-10
  const url = proxyUrl(rawUrl);

  try{
    await initShaka(url, record, token);
  }catch(error){
    if(token === playbackToken){
      $("engine").textContent = "Playback error";
      $("player-container").innerHTML =
        `<div class="screen-msg">Could not play this DASH stream.<br>${esc(error.message || "")}</div>`;
      console.error("Playback error:", error);
    }
  }
}

function renderPlayerStreams(activeIndex){
  const box = $("streams");
  if(!state.currentStreams.length){
    box.innerHTML = `<div class="status">No DASH stream links were found for this event.</div>`;
    return;
  }
  box.innerHTML = state.currentStreams.map((stream, index) =>
    `<button class="stream-btn ${index === activeIndex ? "active" : ""}" data-player-stream="${index}">
       <span class="stream-title">${esc(stream.title)}</span>
       <span class="type">DASH</span>
     </button>`
  ).join("");
}

/* =====================================================================
   EVENTS
   ===================================================================== */
$("list").addEventListener("click", event => {
  const card = event.target.closest("[data-watch-event]");
  if(!card) return;
  const id = card.dataset.watchEvent;
  const stream = Number(card.dataset.watchStream || 0);
  location.hash = `#watch?id=${encodeURIComponent(id)}&stream=${stream}`;
});

$("sports").addEventListener("click", event => {
  const btn = event.target.closest("[data-sport]");
  if(!btn) return;
  state.sport = btn.dataset.sport;
  renderHub();
});

$("tabs").addEventListener("click", event => {
  const btn = event.target.closest("[data-tab]");
  if(!btn) return;
  state.tab = btn.dataset.tab;
  renderHub();
});

$("streams").addEventListener("click", event => {
  const btn = event.target.closest("[data-player-stream]");
  if(!btn || !state.currentEvent) return;
  const index = Number(btn.dataset.playerStream);
  if(!state.currentStreams[index]) return;
  state.currentIndex = index;
  history.replaceState(null, "", `#watch?id=${encodeURIComponent(state.currentEvent.id)}&stream=${index}`);
  playRecord(state.currentStreams[index], index);
});

$("backHub").onclick = () => { location.hash = "#/"; };
window.addEventListener("hashchange", route);

/* =====================================================================
   BOOT
   ===================================================================== */
loadData();
setInterval(() => { if(booted) renderHub(); }, 30000);
setInterval(() => { if(booted && !location.hash.includes("watch")) loadData(); }, 120000);
</script>
