<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>CRICZONE · FanCode Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css"/>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>

  <style>
    :root {
      --paper:#f6f0df; --paper2:#ffffff; --ink:#0c0c0c;
      --yellow:#ffd60a; --red:#ff3b30; --blue:#0a84ff; --muted:#6b6252;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;min-height:100%;background:var(--paper);font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
    ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-track{background:transparent;} ::-webkit-scrollbar-thumb{background:var(--ink);border-radius:0;}

    /* ─── TELEGRAM BADGE ─── */
    #tgBadge{position:fixed;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));z-index:10001;display:inline-flex;align-items:center;gap:9px;padding:10px 18px 10px 12px;background:var(--yellow);color:var(--ink);font-size:13.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;text-decoration:none;border-radius:12px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg);transition:transform .15s,box-shadow .15s,background .15s;-webkit-tap-highlight-color:transparent;}
    #tgBadge:hover{transform:rotate(0deg) translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink);background:#ffe14d;}
    #tgBadge:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
    #tgBadge svg{width:20px;height:20px;flex-shrink:0;fill:var(--ink)}
    #tgBadge span{white-space:nowrap}
    @media(max-width:400px){#tgBadge{padding:8px 14px 8px 9px;font-size:11.5px;gap:7px}#tgBadge svg{width:17px;height:17px}}
    @media(max-width:340px){#tgBadge span{display:none}#tgBadge{padding:9px 12px}}

    /* ─── LOADER ─── */
    #overlay{position:fixed;inset:0;background:var(--paper);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;}
    #overlay .spinner{width:52px;height:52px;border:4px solid var(--ink);background:var(--yellow);animation:brutalspin 1s steps(4) infinite;}
    @keyframes brutalspin{to{transform:rotate(360deg);}}
    #overlay p{color:var(--ink);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;}

    /* ─── STATUS TOAST ─── */
    #status{position:fixed;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:9997;padding:8px 14px;background:var(--paper2);border:3px solid var(--ink);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-radius:10px;pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:3px 3px 0 var(--ink);}
    #status.show{opacity:1;} #status.warn{background:var(--yellow);} #status.err{background:var(--red);color:#fff;} #status.ok{background:var(--yellow);}

    /* ─── HEADER ─── */
    #app-header{position:sticky;top:0;z-index:100;background:var(--paper);border-bottom:3px solid var(--ink);padding:0 24px;}
    #header-inner{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px;}
    .logo-wrap{display:flex;align-items:center;gap:12px;}
    .logo-icon{width:44px;height:44px;border-radius:10px;background:var(--yellow);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transform:rotate(-4deg);}
    .logo-text{font-size:20px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--ink);line-height:1;}
    .logo-sub{font-size:9.5px;font-weight:600;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
    #theme-toggle{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--paper2);border:3px solid var(--ink);border-radius:11px;box-shadow:3px 3px 0 var(--ink);color:var(--ink);font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:inherit;transition:transform .1s,box-shadow .1s,background .15s;}
    #theme-toggle:hover{background:var(--yellow);}
    #theme-toggle:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink);}

    /* ─── LAYOUT ─── */
    #channel-list{display:none;min-height:100vh;}
    #channel-list.visible{display:block;}
    #content-wrap{max-width:1320px;margin:0 auto;padding:28px 24px 48px;}

    /* ─── SECTION HEAD ─── */
    .section-head{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
    .live-dot{width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--ink);animation:pulse 1.2s ease-in-out infinite;flex-shrink:0;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
    .section-label{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink);}
    .section-count{font-size:11px;font-weight:700;color:#fff;background:var(--red);border:2.5px solid var(--ink);padding:2px 10px;border-radius:8px;box-shadow:2px 2px 0 var(--ink);}

    /* ─── FILTER PILLS ─── */
    #category-filter{display:flex;gap:8px;margin-bottom:26px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px;}
    #category-filter::-webkit-scrollbar{display:none;}
    .filter-pill{flex-shrink:0;padding:8px 18px;border-radius:9px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;white-space:nowrap;background:var(--paper2);color:var(--ink);border:2.5px solid var(--ink);font-family:inherit;box-shadow:2px 2px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .15s;}
    .filter-pill:hover{background:var(--yellow);}
    .filter-pill:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink);}
    .filter-pill.active{background:var(--yellow);box-shadow:3px 3px 0 var(--ink);}

    /* ─── AD SLOTS ─── */

    /* ─── GRID ─── */
    #ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px;}

    /* ─── CARD ─── */
    .ch-card{background:var(--paper2);border:3px solid var(--ink);border-radius:18px;overflow:hidden;cursor:pointer;color:inherit;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;box-shadow:6px 6px 0 var(--ink);-webkit-tap-highlight-color:transparent;}
    .ch-card:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--yellow),8px 8px 0 3px var(--ink);}
    .ch-card:active{transform:translate(6px,6px);box-shadow:0 0 0 var(--ink);}
    .ch-card.disabled{opacity:.6;cursor:not-allowed;}
    .ch-card.disabled:hover{transform:none;box-shadow:6px 6px 0 var(--ink);}
    .card-thumb{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--ink);display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--ink);}
    .card-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s;}
    .ch-card:hover .card-thumb img{transform:scale(1.04);}
    .card-thumb .thumb-placeholder{width:100%;height:100%;background:linear-gradient(135deg,#222,#111);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;letter-spacing:4px;color:var(--yellow);}
    .badge-live{position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:7px;background:var(--red);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#fff;}
    .badge-live::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.2s ease-in-out infinite;}
    .badge-upcoming{position:absolute;top:12px;left:12px;padding:4px 10px;border-radius:7px;background:var(--yellow);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink);}
    .badge-cat{position:absolute;top:12px;right:12px;padding:4px 10px;border-radius:7px;background:var(--paper);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink);}
    .card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;flex:1;}
    .card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .meta-event{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
    .meta-lang{font-size:9px;font-weight:700;padding:2.5px 8px;border-radius:6px;background:var(--paper);border:2px solid var(--ink);color:var(--ink);letter-spacing:1px;text-transform:uppercase;}
    .card-title{font-size:16px;font-weight:700;line-height:1.35;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .card-info{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
    .info-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.3px;}
    .info-chip svg{width:13px;height:13px;flex-shrink:0;stroke-width:2.2;}
    .watch-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 0;border-radius:11px;background:var(--yellow);color:var(--ink);font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;font-family:inherit;transition:transform .1s,box-shadow .1s,background .15s;-webkit-tap-highlight-color:transparent;margin-top:auto;}
    .watch-btn:hover{background:#ffe14d;}
    .watch-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
    .watch-btn svg{width:16px;height:16px;}
    .watch-btn:disabled{background:var(--paper);color:var(--muted);cursor:not-allowed;box-shadow:2px 2px 0 var(--ink);}
    .watch-btn:disabled:active{transform:none;box-shadow:2px 2px 0 var(--ink);}

    /* ─── EMPTY ─── */
    #empty-state{display:none;text-align:center;padding:80px 24px;}
    #empty-state p{color:var(--ink);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:2px;}

    /* ─── PLAYER CONTAINER ─── */
    #player-container{position:fixed;inset:0;background:#000;z-index:9997;display:none;align-items:center;justify-content:center;}
    #player-container video{width:100%;height:100%;object-fit:contain;}
    .plyr{height:100%;width:100%;background:#000;}
    .plyr__controls{background:linear-gradient(0,rgba(0,0,0,.92),transparent)!important;padding:16px!important;}
    .plyr__control--overlaid{background:var(--yellow)!important;color:var(--ink)!important;border:3px solid var(--ink)!important;box-shadow:5px 5px 0 var(--ink)!important;border-radius:14px!important;width:76px!important;height:76px!important;}
    .plyr__control--overlaid svg{width:32px!important;height:32px!important;margin-left:4px!important;}
    .plyr__control--overlaid:hover{background:#ffe14d!important;}
    .plyr__progress__played{background:var(--yellow)!important;}
    .plyr__progress__buffer{background:rgba(255,255,255,.2)!important;}
    .plyr__control svg{fill:currentColor;}

    /* ─── AD CONTAINER ─── */
    #ad-container{position:absolute;inset:0;z-index:5;background:#000;display:none;overflow:hidden;}
    #ad-container.active{display:block;}
    #ad-container video,#ad-container iframe{width:100%;height:100%;}

    /* ─── QUALITY PICKER ─── */
    #quality-wrap{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:20;display:none;}
    #quality-wrap.show{display:block;}
    #quality-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:var(--paper);border:3px solid var(--ink);border-radius:11px;box-shadow:3px 3px 0 var(--ink);color:var(--ink);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;font-family:'Space Grotesk',system-ui,sans-serif;transition:transform .1s,box-shadow .1s,background .15s;}
    #quality-btn:hover{background:var(--yellow);}
    #quality-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink);}
    #quality-btn svg{width:15px;height:15px;}
    #quality-btn.open{background:var(--yellow);}
    #quality-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:150px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px;box-shadow:5px 5px 0 var(--yellow),5px 5px 0 3px var(--ink);display:none;max-height:60vh;overflow-y:auto;}
    #quality-menu.show{display:block;}
    .q-header{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:4px 10px 8px;border-bottom:2px solid var(--ink);margin-bottom:6px;}
    .q-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:9px 12px;background:transparent;border:none;border-radius:7px;color:var(--ink);font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-family:'Space Grotesk',system-ui,sans-serif;cursor:pointer;transition:background .15s;text-align:left;}
    .q-item:hover{background:var(--yellow);}
    .q-item.active{background:var(--yellow);}
    .q-item.active::after{content:'✓';font-weight:700;color:var(--ink);}
    .q-item .q-auto{font-size:9px;padding:2px 7px;border-radius:5px;background:var(--ink);color:var(--yellow);letter-spacing:1px;font-weight:700;}

    @media(max-width:640px){
      #quality-btn span{display:none;}
      #quality-btn{padding:9px;}
      #quality-menu{min-width:130px;}
      #content-wrap{padding:20px 16px 40px;}
      #ch-grid{grid-template-columns:1fr;gap:16px;}
      #header-inner{height:64px;}
      #app-header{padding:0 16px;}
      .logo-icon{width:38px;height:38px;font-size:17px;}
      .logo-text{font-size:17px;letter-spacing:1.5px;}
      #theme-toggle{padding:7px 10px;font-size:10px;}
    }
    @media(min-width:641px) and (max-width:1024px){
      #ch-grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}
    }

  </style>
<style id="criczone-premium-theme">

.logo-text{font-size:23px;font-weight:900;letter-spacing:-1.3px;color:#f3f7fb}.logo-sub{font-size:9px;color:#8d9ba5;letter-spacing:1.7px}

.ch-card:hover{transform:translateY(-4px);border-color:rgba(184,255,53,.42);box-shadow:0 16px 36px rgba(0,0,0,.34),0 0 0 1px rgba(184,255,53,.08)}.ch-card:active{transform:scale(.99)}

</style>
<style id="cz-navbar-rotating-player">

}

/* ─── TOAST ─── */
function toast(msg,type,dur){$status.textContent=msg;$status.className="show "+(type||"ok");if(_stTmr)clearTimeout(_stTmr);if(dur!==0)_stTmr=setTimeout(function(){$status.className="";_stTmr=null;},dur||4000);}
function setMsg(m){if($loadMsg)$loadMsg.textContent=m;}

function getMatchId(){return new URLSearchParams(location.search).get("id")||"";}

/* ─── PROXY (for explicit proxy config) ─── */
function proxyUrl(url){if(!url)return url;if(!USE_PROXY)return url;if(url.indexOf(PROXY_BASE)===0)return url;return PROXY_BASE+encodeURIComponent(url);}

/* ─── LOAD JSON ─── */
async function loadData(){
  var r=await fetch(JSON_URL,{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  var data=await r.json();
  if(!data||!Array.isArray(data.matches))throw new Error("Bad JSON shape");
  if(!data.matches.length)throw new Error("No matches in feed");
  return data.matches;
}

function getPlayable(match){
  if(match.status!=='LIVE')return null;
  if(match.auto_streams){
    var langs=Object.keys(match.auto_streams);
    for(var i=0;i<langs.length;i++){
      var entry=match.auto_streams[langs[i]];
      if(entry&&entry.streams){
        var url=entry.streams['1080p']||entry.streams['720p']||entry.streams['540p']||entry.streams['480p']||entry.streams['360p']||entry.streams['240p'];
        if(url)return{url:url,cookie:entry.cookie||'',language:langs[i]};
      }
    }
  }
  if(match.streams&&match.streams.primary)return{url:match.streams.primary,cookie:'',language:match.language||''};
  return null;
}

function buildQualities(match,preferredLang){
  var out={};
  if(match.auto_streams){
    Object.keys(match.auto_streams).forEach(function(lang){
      var entry=match.auto_streams[lang];
      if(!entry||!entry.streams)return;
      Object.keys(entry.streams).forEach(function(res){
        var score=(lang===preferredLang)?1:0;
        if(!out[res]||score>(out[res]._score||0))out[res]={url:entry.streams[res],cookie:entry.cookie||'',lang:lang,_score:score};
      });
    });
  }
  if(!Object.keys(out).length&&match.streams&&match.streams.primary)out['Auto']={url:match.streams.primary,cookie:'',lang:match.language||''};
  return out;
}

function bestQualityKey(){
  var order=['1080p','720p','540p','480p','360p','240p'];
  for(var i=0;i<order.length;i++){if(currentQualities[order[i]])return order[i];}
  if(currentQualities['Auto'])return'Auto';
  return null;
}

/* ─── FILTERS ─── */
function renderFilters(matches){
  var seen={},cats=['All'];
  matches.forEach(function(m){if(m.category)seen[m.category]=true;});
  Object.keys(seen).sort().forEach(function(c){cats.push(c);});
  var f=document.createDocumentFragment();
  cats.forEach(function(cat){
    var pill=document.createElement('button');
    pill.className='filter-pill'+(cat===currentCategory?' active':'');
    pill.textContent=cat;pill.dataset.category=cat;
    pill.addEventListener('click',function(){
      currentCategory=cat;
      document.querySelectorAll('.filter-pill').forEach(function(p){p.classList.toggle('active',p.dataset.category===cat);});
      renderMatches(matches);
    });
    f.appendChild(pill);
  });

}

/* ─── CARDS ─── */
function renderMatches(matches){
  var filtered=currentCategory==='All'?matches:matches.filter(function(m){return m.category===currentCategory;});
  filtered=filtered.slice().sort(function(a,b){var aL=a.status==='LIVE'?0:1,bL=b.status==='LIVE'?0:1;if(aL!==bL)return aL-bL;return String(a.startTime||'').localeCompare(String(b.startTime||''));});
  var liveCount=filtered.filter(function(m){return m.status==='LIVE';}).length;
  if(liveCount>0){$liveHead.style.display='flex';$liveCount.textContent=liveCount;}else{$liveHead.style.display='none';}
  $empty.style.display=filtered.length?'none':'block';
  $grid.innerHTML='';
  if(!filtered.length)return;
  var f=document.createDocumentFragment();

    var statusBadge=isLive?'<span class="badge-live">LIVE</span>':'<span class="badge-upcoming">UPCOMING</span>';
    var init=getInitials(m.title);
    var thumbInner=m.image&&m.image.trim()?'<img src="'+esc(m.image)+'" alt="'+esc(m.title)+'" loading="lazy" onerror="this.onerror=null;this.outerHTML=\'<div class=&quot;thumb-placeholder&quot;>'+init+'</div>\'">':'<div class="thumb-placeholder">'+init+'</div>';

    var tournamentChip=m.tournament?'<span class="meta-event">'+esc(m.tournament)+'</span>':'';

    var btnLabel=playable?'<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Watch Live':(isLive?'Stream Loading…':'Not Started');
    card.innerHTML='<div class="card-thumb">'+thumbInner+statusBadge+catBadge+'</div><div class="card-body">'+((tournamentChip||langChip)?'<div class="card-meta">'+tournamentChip+langChip+'</div>':'')+'<div class="card-title">'+esc(m.title)+'</div>'+(startChip?'<div class="card-info">'+startChip+'</div>':'')+'<button class="watch-btn"'+(playable?'':' disabled')+'>'+btnLabel+'</button></div>';
    if(playable){
      var play=function(e){
        e.preventDefault();
        if(window.history&&window.history.pushState)window.history.pushState({},'','?id='+encodeURIComponent(m.match_id));
        document.title='CRICZONE · '+m.title;
        var info=getPlayable(m);
        setupHLSPlayer(info.url,m.title,info.cookie,m);

      card.addEventListener('click',function(){toast(isLive?'Stream not ready yet':'Match has not started','warn',3000);});

function setupFullscreenIntercept(){
  if(!currentPlayer||!currentPlayer.elements||!currentPlayer.elements.buttons)return;

  if(fsBtn.dataset.fsIntercepted==='1')return;

}

async function togglePlayerContainerFullscreen(){
  var fsEl=document.fullscreenElement||document.webkitFullscreenElement;
  if(fsEl){
    try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}
    try{if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();}catch(e){}
  }else{
    try{
      if($pCont.requestFullscreen)await $pCont.requestFullscreen();
      else if($pCont.webkitRequestFullscreen)$pCont.webkitRequestFullscreen();
      await new Promise(function(r){setTimeout(r,100);});
      try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}
    }catch(e){console.warn('Fullscreen failed:',e);}
  }
  syncFullscreenBtnState();
}

function syncFullscreenBtnState(){
  if(!currentPlayer||!currentPlayer.elements||!currentPlayer.elements.buttons)return;
  var btn=currentPlayer.elements.buttons.fullscreen;if(!btn)return;

  if(!fsEl){try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}}
}

  if(currentPlayer){try{currentPlayer.destroy();}catch(e){}currentPlayer=null;}

  buildFreshPlayer();
  if(unmuteHandler){document.removeEventListener('click',unmuteHandler);document.removeEventListener('touchstart',unmuteHandler);unmuteHandler=null;}
}

/* ═══ STALE PLAYLIST EXTENSION ═══
 * When a live CDN stops refreshing the manifest, synthesises future .ts
 * segment URLs from the last known sequence + timestamp so the player
 * does not stall with 404s on new segments.
 */
function extendStalePlaylist(text){
  if(vodExtendOff||!text)return text;
  if(text.indexOf('#EXTINF:')===-1)return text;
  if(text.indexOf('#EXT-X-ENDLIST')!==-1)return text;  /* true VOD — leave alone */

  var lines=text.split('\n'),entries=[],headerLines=[],inH=true,curDur='4.000',curPdt='';
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim();if(!l)continue;
    if(l.indexOf('#EXTINF:')===0){inH=false;var dm=l.match(/#EXTINF:([0-9.]+)/);if(dm)curDur=dm[1];}
    else if(l.indexOf('#EXT-X-PROGRAM-DATE-TIME:')===0){inH=false;curPdt=l.substring(25).trim();}
    else if(l.charAt(0)==='#'){if(inH&&l.indexOf('#EXT-X-MEDIA-SEQUENCE:')!==0)headerLines.push(l);}
    else{inH=false;entries.push({dur:curDur,pdt:curPdt,uri:l});curPdt='';}
  }
  if(!entries.length)return text;
  var last=entries[entries.length-1];
  if(!last.pdt)return text;
  var lastMs=Date.parse(last.pdt);if(!lastMs||isNaN(lastMs))return text;
  var seg=last.uri.match(/^(.*-)(\d+)(\.ts.*)$/i);if(!seg)return text;
  var prefix=seg[1],lastSeq=parseInt(seg[2],10),suffix=seg[3];
  var segDurMs=Math.max(1000,Math.round((parseFloat(last.dur)||4)*1000));
  var elapsed=Math.floor((Date.now()-lastMs-vodSafetyMs)/segDurMs);
  if(elapsed<=0||elapsed>10800)return text;

  var windowSize=75;
  var seqMatch=text.match(/#EXT-X-MEDIA-SEQUENCE:(\d+)/),baseSeq=seqMatch?parseInt(seqMatch[1],10):0;
  var startOff=Math.max(1,elapsed-(windowSize-1)),totalV=entries.length+elapsed,newBase=baseSeq+Math.max(0,totalV-windowSize);
  var finals=[];
  if(startOff===1){var keep=Math.max(0,entries.length-(windowSize-elapsed));finals=entries.slice(keep);}
  for(var k=startOff;k<=elapsed;k++)finals.push({dur:last.dur,pdt:new Date(lastMs+k*segDurMs).toISOString(),uri:prefix+(lastSeq+k)+suffix});
  var out=headerLines.slice();out.push('#EXT-X-MEDIA-SEQUENCE:'+newBase);
  for(var j=0;j<finals.length;j++){out.push('#EXTINF:'+finals[j].dur+',');if(finals[j].pdt)out.push('#EXT-X-PROGRAM-DATE-TIME:'+finals[j].pdt);out.push(finals[j].uri);}
  return out.join('\n')+'\n';
}

/* ═══ NO-CACHE PLAYLIST LOADER ═══
 * Fetches manifests without browser cache (keeps live streams fresh)
 * and runs extendStalePlaylist on direct CDN playlists.
 */
function NoCacheLoader(){}
NoCacheLoader.prototype.destroy=function(){this._aborted=true;};
NoCacheLoader.prototype.abort=function(){this._aborted=true;};
NoCacheLoader.prototype.load=function(ctx,cfg,cb){
  var self=this,t0=performance.now();
  fetch(ctx.url,{cache:'no-store'})
    .then(function(r){
      if(self._aborted)return;
      if(!r.ok){cb.onError({code:r.status,text:'HTTP '+r.status},ctx,r,{});return;}
      return r.text().then(function(d){
        if(self._aborted)return;
        var isDirect=isDirectCors(ctx.url);
        var final=isDirect?extendStalePlaylist(d):d;
        var now=performance.now();
        cb.onSuccess({url:ctx.url,data:final},{trequest:t0,tfirst:now,tload:now,loaded:final.length,total:final.length,retry:0,chunkCount:0,bwEstimate:0,aborted:false,loading:{start:t0,first:now,end:now},parsing:{start:0,end:0},buffering:{start:0,end:0}},ctx,r);
      });
    })
    .catch(function(e){if(!self._aborted)cb.onError({code:0,text:(e&&e.message)||'Network error'},ctx,null,{});});
};

/* ═══ QUALITY SWITCH ═══ */
function switchQuality(url,cookie,label){
  closeQualityMenu();
  toast('Switching to '+label+'…','warn',2000);
  var streamUrl=url;
  if(cookie)streamUrl+=(streamUrl.indexOf('?')===-1?'?':'&')+'hdntl_cookie='+encodeURIComponent(cookie);
  var playUrl=proxyUrl(streamUrl);
  var isM3U8=/\.m3u8(\?|$)/i.test(url)||url.indexOf('.m3u8')!==-1;
  var token=playToken;

  /* Seamless HLS level switch via loadSource (no full rebuild) */
  if(currentHls&&isM3U8){
    try{
      currentHls.stopLoad();currentHls.detachMedia();
      currentHls.loadSource(playUrl);currentHls.attachMedia($video);
      currentHls.once(Hls.Events.MANIFEST_PARSED,function(){
        if(token!==playToken)return;
        try{if($video.duration&&isFinite($video.duration))$video.currentTime=Math.max(0,$video.duration-2);}catch(e){}
        var p=$video.play();if(p&&p.catch)p.catch(function(){});
        toast('● '+label,'ok',2000);
      });
      /* error handling on reused instance */
      currentHls.on(Hls.Events.ERROR,function(_,data){
        if(token!==playToken||!data.fatal)return;
        if(data.type===Hls.ErrorTypes.NETWORK_ERROR)currentHls.startLoad();
        else if(data.type===Hls.ErrorTypes.MEDIA_ERROR)currentHls.recoverMediaError();
      });
      return;
    }catch(e){console.warn('Hls reuse failed, falling back to rebuild:',e);}
  }

  /* Full rebuild fallback */
  buildFreshPlayer();
  startHlsEngine(playUrl,label,token,isM3U8);
}

/* ═══ HLS ENGINE — with proxy rotation + stale extension ═══ */
function startHlsEngine(playUrl,label,token,isM3U8,proxyIdx,networkRetries,mediaRecovered){
  if(token!==playToken)return;
  proxyIdx=proxyIdx||0;networkRetries=networkRetries||0;mediaRecovered=mediaRecovered||false;
  var rawUrl=playUrl;  /* keep original for proxy rotation */

  var hlsSupported=(typeof Hls!=='undefined'&&Hls.isSupported&&Hls.isSupported());
  if(hlsSupported&&isM3U8){
    if(currentHls){try{currentHls.destroy();}catch(e){}currentHls=null;}
    var hls=new Hls({
      autoStartLoad:true,enableWorker:true,lowLatencyMode:false,
      liveSyncDurationCount:3,liveMaxLatencyDurationCount:10,
      maxBufferLength:30,maxMaxBufferLength:60,
      pLoader:NoCacheLoader,
      xhrSetup:function(xhr){xhr.withCredentials=false;}
    });
    currentHls=hls;
    hls.loadSource(playUrl);
    hls.attachMedia($video);

    hls.on(Hls.Events.MANIFEST_PARSED,function(){
      if(token!==playToken)return;
      networkRetries=0;
      hideOverlay();
      toast('● '+(label||'Live'),'ok',3000);
      var p=$video.play();if(p&&p.catch)p.catch(function(){});
    });

    hls.on(Hls.Events.FRAG_LOADED,function(){networkRetries=0;hideOverlay();});

    hls.on(Hls.Events.FRAG_LOAD_ERROR,function(ev,data){
      if(data&&data.response&&data.response.code===404){
        vod404Count++;vodSafetyMs=Math.min(60000,vodSafetyMs+8000);
        if(vod404Count>=5)vodExtendOff=true;
      }
    });

    hls.on(Hls.Events.ERROR,function(_,data){
      if(token!==playToken||!data.fatal)return;
      if(data.type===Hls.ErrorTypes.NETWORK_ERROR){
        /* try next engine proxy */
        var nextPx=proxyIdx+1;
        if(nextPx<ENGINE_PROXIES.length){
          var altUrl=ENGINE_PROXIES[nextPx]+encodeURIComponent(unwrapEngineProxy(rawUrl));
          hls.loadSource(altUrl);hls.startLoad();
          proxyIdx=nextPx;return;
        }
        /* one retry on same URL */
        if(networkRetries<1){networkRetries++;try{hls.startLoad();}catch(e){}return;}
        toast('Reconnecting…','warn',0);
        if(retryTmr)clearTimeout(retryTmr);
        retryTmr=setTimeout(function(){retryTmr=null;if(token!==playToken)return;try{hls.startLoad();}catch(e){};},2000);
      }else if(data.type===Hls.ErrorTypes.MEDIA_ERROR&&!mediaRecovered){
        mediaRecovered=true;try{hls.recoverMediaError();}catch(e){}
      }else{
        toast('Stream error','err',4000);
      }
    });

    /* auto-resume */
    if(resumeTmr)clearInterval(resumeTmr);
    var myResumeTmr=setInterval(function(){
      if(token!==playToken){clearInterval(myResumeTmr);return;}
      if($video&&$video.paused&&$video.readyState>2){var p=$video.play();if(p&&p.catch)p.catch(function(){});}
    },3000);
    resumeTmr=myResumeTmr;

  }else if($video.canPlayType('application/vnd.apple.mpegurl')&&isM3U8){
    /* Safari native HLS */
    $video.src=playUrl;
    $video.addEventListener('loadedmetadata',function onM(){
      $video.removeEventListener('loadedmetadata',onM);
      if(token!==playToken)return;
      hideOverlay();toast('● '+(label||'Live'),'ok',3000);
    });
  }else{
    $video.src=playUrl;
    hideOverlay();toast('● '+(label||'Live'),'ok',3000);
  }
}

/* ═══ STREAM ENTRY ═══ */
function startStream(url,cookie,token){
  if(token!==playToken)return;
  var streamUrl=url;
  if(cookie)streamUrl+=(streamUrl.indexOf('?')===-1?'?':'&')+'hdntl_cookie='+encodeURIComponent(cookie);
  var playUrl=proxyUrl(streamUrl);
  var isM3U8=/\.m3u8(\?|$)/i.test(url)||url.indexOf('.m3u8')!==-1;

  function attachUnmute(){
    if(unmuteHandler){document.removeEventListener('click',unmuteHandler);document.removeEventListener('touchstart',unmuteHandler);}
    unmuteHandler=function(){try{$video.muted=false;$video.volume=1;}catch(e){}document.removeEventListener('click',unmuteHandler);document.removeEventListener('touchstart',unmuteHandler);unmuteHandler=null;};
    document.addEventListener('click',unmuteHandler);
    document.addEventListener('touchstart',unmuteHandler);
  }
  attachUnmute();
  startHlsEngine(playUrl,'Live',token,isM3U8);
}

/* ═══ ADS ═══ */
function playAdThenContent(url,name,cookie,token){
  var canRequest=VAST_TAG&&window.google&&google.ima&&google.ima.AdsLoader;
  if(!canRequest){startStream(url,cookie,token);return;}
  var adContainer=document.getElementById('ad-container');
  if(!adContainer){startStream(url,cookie,token);return;}
  adContainer.classList.add('active');
  toast('Advertisement','warn',0);
  var done=false,adTimer=null;
  function finish(){
    if(done)return;done=true;if(adTimer){clearTimeout(adTimer);adTimer=null;}
    if(currentAdsManager){try{currentAdsManager.destroy();}catch(e){}currentAdsManager=null;}
    if(currentAdsLoader){try{currentAdsLoader.destroy();}catch(e){}currentAdsLoader=null;}
    var ac=document.getElementById('ad-container');if(ac){ac.classList.remove('active');try{ac.innerHTML='';}catch(e){}}
    if(token!==playToken)return;
    startStream(url,cookie,token);
  }
  try{
    var displayContainer=new google.ima.AdDisplayContainer(adContainer,$video);displayContainer.initialize();
    var adsLoader=new google.ima.AdsLoader(displayContainer);currentAdsLoader=adsLoader;
    adsLoader.addEventListener(google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED,function(e){
      if(done||token!==playToken){finish();return;}
      try{var mgr=e.getAdsManager($video,null);currentAdsManager=mgr;mgr.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR,finish);mgr.addEventListener(google.ima.AdEvent.Type.ALL_ADS_COMPLETED,finish);mgr.addEventListener(google.ima.AdEvent.Type.CONTENT_RESUME_REQUESTED,finish);mgr.addEventListener(google.ima.AdEvent.Type.SKIPPED,finish);mgr.init(window.innerWidth,window.innerHeight,google.ima.ViewMode.NORMAL);mgr.start();}catch(err){finish();}
    },false);
    adsLoader.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR,finish,false);
    var req=new google.ima.AdsRequest();req.adTagUrl=VAST_TAG;req.linearAdSlotWidth=window.innerWidth;req.linearAdSlotHeight=window.innerHeight;req.nonLinearAdSlotWidth=window.innerWidth;req.nonLinearAdSlotHeight=Math.round(window.innerHeight*.2);adsLoader.requestAds(req);
  }catch(e){finish();return;}
  adTimer=setTimeout(finish,AD_TIMEOUT);
}

/* ═══ ENTRY POINT ═══ */
function setupHLSPlayer(url,name,cookie,match){
  var token=++playToken;
  currentMatchObj=match||null;currentQualityKey='auto';
  showPlayer();destroyPlayer();showOverlay("Connecting to stream…");
  if(match){var info=getPlayable(match);var lang=info?info.language:(match.language||'');currentQualities=buildQualities(match,lang);}
  else{currentQualities={};}
  var keyCount=Object.keys(currentQualities).length;
  if(keyCount>1){$qualityWrap.classList.add('show');renderQualityMenu();}else{$qualityWrap.classList.remove('show');}
  toast('Loading…','warn',0);
  playAdThenContent(url,name,cookie,token);
}

/* ═══ ERROR ═══ */
function errMsg(msg){showOverlay('Unable to load — '+msg);toast(msg,'err',0);$list.classList.add('visible');if($qualityWrap)$qualityWrap.classList.remove('show');}

/* ═══ EVENTS ═══ */
window.addEventListener('popstate',function(){if($pCont.style.display==='flex')hidePlayer();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$pCont.style.display==='flex')hidePlayer();});

/* ═══ MAIN ═══ */
async function main(){
  var id=getMatchId(),matches;
  try{setMsg('Loading matches…');matches=await loadData();}
  catch(e){console.error(e);errMsg('Connection error: '+e.message);return;}
  if(!id){renderList(matches);return;}
  var m=matches.find(function(x){return String(x.match_id)===String(id);});
  if(!m){errMsg('Match not found.');return;}
  var info=getPlayable(m);
  if(!info){errMsg('Stream not available for this match yet.');return;}
  document.title='CRICZONE · '+m.title;
  renderList(matches);setupHLSPlayer(info.url,m.title,info.cookie,m);
}
document.addEventListener('DOMContentLoaded',main);
})();
</script>
