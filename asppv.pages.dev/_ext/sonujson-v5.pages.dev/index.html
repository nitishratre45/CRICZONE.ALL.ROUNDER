<!doctype html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            margin-top: 15px;
            text-align: center;
            width: 100%;
        }
        h1 {
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 10px 0;
        }
        hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 0 0 10px 0;
            width: 100%;
        }
        .footer {
            font-size: 12px;
            color: #000000;
            margin-bottom: 6px;
        }
        .request-id {
            font-family: monospace;
            font-size: 11px;
            color: #555555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>403 Forbidden</h1>
        <hr>
        <div class="footer">nginx</div>
        <div class="request-id" id="requestId"></div>
    </div>

    <script>
        function generateRequestId() {
            const chars = '0123456789abcdefghijklmnopqrstuvwxyz';
            let prefix = '';
            let suffix = '';
            
            for (let i = 0; i < 4; i++) {
                prefix += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            for (let i = 0; i < 5; i++) {
                suffix += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            return prefix + 'sayan' + suffix;
        }

        document.getElementById('requestId').innerText = 'Request ID: ' + generateRequestId();
    </script>


</body></html>
