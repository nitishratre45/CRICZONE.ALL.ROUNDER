  if (ev.source !== joinFrame.contentWindow) return;
  var d = ev.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'joinNowClicked') {
    if (isMobileDevice()) {
      window.location.href = WA_CHANNEL;
    } else {
      openTab(WA_CHANNEL);
    }
    closePopup();
  } else if (d.type === 'joinFrameHeight' && typeof d.height === 'number' && d.height > 0) {
    joinFrame.style.height = Math.max(40, d.height) + 'px';
  }
}, false);

setTimeout(function(){
  popup.classList.add('visible');
  setTimeout(function(){
    try { joinFrame.contentWindow.postMessage({type:'measureNow'}, '*'); } catch(e){}
  }, 60);
}, 4000);

var popunderState = 'idle';
var popunderRetryCount = 0;
var popunderRetryTimer = null;
var popunderRetryDelays = [500, 1500];
var initialPopupClosed = false;
var popupClosing = false;

function startPopunder() {
  if (typeof POPUNDER_AD_URL !== 'string' || !POPUNDER_AD_URL.trim()) return;
  if (!initialPopupClosed || popup.classList.contains('visible')) return;
  if (popunderState === 'loading' || popunderState === 'ready') return;
  if (navigator.onLine === false) return;
  clearTimeout(popunderRetryTimer);
  popunderRetryTimer = null;
  popunderState = 'loading';

  var adScript = document.createElement('script');
  adScript.setAttribute('data-cfasync', 'false');
  adScript.setAttribute('fetchpriority', 'high');
  adScript.async = true;
  adScript.onload = function(){
    popunderState = 'ready';
    adScript.onload = adScript.onerror = null;
  };
  adScript.onerror = function(){
    adScript.onload = adScript.onerror = null;
    if (adScript.parentNode) adScript.parentNode.removeChild(adScript);
    popunderState = 'failed';
    if (popunderRetryCount < popunderRetryDelays.length) {
      popunderRetryTimer = setTimeout(startPopunder, popunderRetryDelays[popunderRetryCount++]);
    }
  };
  adScript.src = POPUNDER_AD_URL;
  document.body.appendChild(adScript);
}

window.addEventListener('online', function(){
  if (popunderState === 'loading' || popunderState === 'ready') return;
  popunderRetryCount = 0;
  startPopunder();
}, false);

function closePopup() {
  if (popupClosing || !popup.classList.contains('visible')) return;
  popupClosing = true;
  popup.style.opacity    = '0';
  popup.style.transition = 'opacity .2s';
  setTimeout(function(){
    popup.classList.remove('visible');
    popup.style.opacity    = '';
    popup.style.transition = '';
    popupClosing = false;
    initialPopupClosed = true;
    startPopunder();
  }, 220);
}

skipBtn.addEventListener('click', function(){
  closePopup();
});

revenueBtn.addEventListener('click', function(e){
  e.stopPropagation();
  openTab(AD3);
});

var loaderHidden = false;
var safetyTimer = null;
var loaderFadeTimer = null;
var activeStreamAssigned = false;

function hideLoader() {
  if (!activeStreamAssigned || loaderHidden || errScreen.classList.contains('show')) return;
  loaderHidden = true;
  clearTimeout(safetyTimer);
  clearTimeout(loaderFadeTimer);
  loadScreen.style.transition = 'opacity .35s';
  loadScreen.style.opacity    = '0';
  iframe.style.visibility     = 'visible';
  loaderFadeTimer = setTimeout(function(){ loadScreen.style.display = 'none'; }, 370);
}
iframe.addEventListener('load', function(){
  if (!activeStreamAssigned) return;
  try { if (iframe.contentWindow.location.href === 'about:blank') return; } catch(e){}
  hideLoader();
});

var retryTimer = null;

function showError(id, reason) {
  clearTimeout(safetyTimer);
  clearTimeout(loaderFadeTimer);
  activeStreamAssigned = false;
  loaderHidden = true;
  loadScreen.style.display = 'none';
  iframe.style.visibility  = 'hidden';
  clearTimeout(retryTimer);
  retryBtn.disabled = reason === 'missing';
  retryBtn.removeAttribute('aria-busy');
  if (reason === 'missing') {
    errTitle.textContent = 'No Channel Selected';
    errBody.textContent  = 'No Channel ID Was Given In The Link. Please Use A Valid Channel Link.';
    errBadge.style.display = 'none';
    document.getElementById('eretry-note').style.display = 'none';
  } else if (reason === 'network') {
    errTitle.textContent = 'Connection Problem';
    errBody.textContent  = "Couldn't Reach The Server Right Now. Please Check Your Internet Connection.";
    errBadge.style.display = 'none';
    document.getElementById('eretry-note').style.display = 'flex';
    retryTimer = setTimeout(function(){ fetchAndLoad(id); }, RETRY_DELAY);
  } else {
    errTitle.textContent = 'Stream Not Found';
    errBody.textContent  = 'The Requested Stream Is Not Available Right Now. Please Check The Link Or Try Again Later.';
    errBadge.style.display = '';
    errBadge.textContent = id ? '"' + id + '"' : '"Unknown"';
    document.getElementById('eretry-note').style.display = 'flex';
    retryTimer = setTimeout(function(){ fetchAndLoad(id); }, RETRY_DELAY);
  }
  errScreen.classList.add('show');
}
retryBtn.addEventListener('click', function(){
  var id = getStreamId();
  if (id) fetchAndLoad(id);
});
function hideError() {
  errScreen.classList.remove('show');
  clearTimeout(retryTimer);
}

function onFSChange() {
  var el = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement;
  if (el) {
    if (screen.orientation && typeof screen.orientation.lock === 'function') {
      try {
        var lockResult = screen.orientation.lock('landscape');
        if (lockResult && typeof lockResult.catch === 'function') lockResult.catch(function(){});
      } catch(e){}
    }
  } else {
    if (screen.orientation && screen.orientation.unlock) try { screen.orientation.unlock(); } catch(e){}
  }
}
document.addEventListener('fullscreenchange', onFSChange);
document.addEventListener('webkitfullscreenchange', onFSChange);
document.addEventListener('mozfullscreenchange', onFSChange);

function freshUrl(url){ return url + (url.indexOf('?') === -1 ? '?' : '&') + 'nc=' + Date.now(); }

function fetchJSON(url) {
  var ctrl  = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, FETCH_TIMEOUT);
  return fetch(freshUrl(url), {cache:'no-store', signal:ctrl.signal})
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data){ clearTimeout(timer); return data; }, function(e){ clearTimeout(timer); throw e; });
}

function getStreamId() {
  var s = window.location.search, raw = null;
  if (s.length > 1) {
    var params = new URLSearchParams(s);
    if (params.has('id')) {
      raw = params.get('id');
      return raw && raw.trim() ? raw.trim() : null;
    }
    raw = s.slice(1);
    var eq = raw.indexOf('=');
    if (eq !== -1) raw = raw.slice(eq + 1);
    raw = raw.split('&')[0];
    try { raw = decodeURIComponent(raw); } catch(e){}
  } else {
    var p = window.location.pathname.replace(/\/+$/,'').split('/');
    raw = p[p.length - 1];
  }
  return (raw && raw.trim()) ? raw.trim() : null;
}

var metaDescEl  = document.querySelector('meta[name="description"]');
var ogTitleEl   = document.querySelector('meta[property="og:title"]');
var ogDescEl    = document.querySelector('meta[property="og:description"]');
var twTitleEl   = document.querySelector('meta[name="twitter:title"]');
var twDescEl    = document.querySelector('meta[name="twitter:description"]');
var canonicalEl = document.querySelector('link[rel="canonical"]');

function updatePageMeta(channelName){
  channelName = channelName == null ? '' : String(channelName).trim();
  if (!channelName) return;
  var title = channelName + ' - Streaming By CnpTV | SPORTS HUB';
  var desc  = 'Watch ' + channelName + ' Live Streaming Free On SPORTS HUB. Live Cricket Scores, IPL Updates & Instant Match Alerts - Join Our WhatsApp Channel Now.';
  document.title = title;
  if (metaDescEl)  metaDescEl.setAttribute('content', desc);
  if (ogTitleEl)   ogTitleEl.setAttribute('content', title);
  if (ogDescEl)    ogDescEl.setAttribute('content', desc);
  if (twTitleEl)   twTitleEl.setAttribute('content', title);
  if (twDescEl)    twDescEl.setAttribute('content', desc);
  if (canonicalEl) canonicalEl.setAttribute('href', window.location.href.split('#')[0]);
}

function applyStream(item) {
  clearTimeout(safetyTimer);
  clearTimeout(loaderFadeTimer);
  loaderHidden = false;
  activeStreamAssigned = true;
  hideError();
  loadScreen.style.transition = '';
  loadScreen.style.opacity = '';
  loadScreen.style.display = 'flex';
  iframe.style.visibility = 'hidden';
  iframe.src = item.iframeSrc;
  safetyTimer = setTimeout(hideLoader, SAFETY_MS);
  updatePageMeta(item.name);
  if (item.hit) fetch(item.hit, {cache:'no-store'}).catch(function(){});
}

function findStream(data, id) {
  var list = data && Array.isArray(data.iframes) ? data.iframes : [];
  for (var i = 0; i < list.length; i++) {
    var item = list[i];
    if (!item || typeof item !== 'object' || String(item.id) !== String(id)) continue;
    if (typeof item.iframeSrc !== 'string' || !item.iframeSrc.trim()) continue;
    try {
      var target = new URL(item.iframeSrc, window.location.href);
      if (target.protocol !== 'https:' && target.protocol !== 'http:') continue;
      return {iframeSrc:target.href, name:item.name, hit:item.hit};
    } catch(e){}
  }
  return null;
}

var streamFetchInProgress = false;
function fetchAndLoad(id) {
  if (!id || streamFetchInProgress) return;
  streamFetchInProgress = true;
  clearTimeout(retryTimer);
  retryBtn.disabled = true;
  retryBtn.setAttribute('aria-busy', 'true');

  function completeFetch() {
    streamFetchInProgress = false;
    retryBtn.disabled = false;
    retryBtn.removeAttribute('aria-busy');
  }
  function fulfilled(data) { return {ok:true, data:data}; }
  function rejected() { return {ok:false, data:null}; }
  var primary = fetchJSON(PRIMARY_JSON).then(fulfilled, rejected);
  var fallback = FALLBACK_JSON ? fetchJSON(FALLBACK_JSON).then(fulfilled, rejected) : Promise.resolve({ok:false, data:null});
  primary.then(function(p){
    var item = findStream(p.data, id);
    if (item) {
      completeFetch();
      applyStream(item);
      return;
    }
    return fallback.then(function(f){
      var fallbackItem = findStream(f.data, id);
      completeFetch();
      if (fallbackItem) applyStream(fallbackItem);
      else showError(id, (p.ok || f.ok) ? null : 'network');
    });
  }).catch(function(){
    completeFetch();
    showError(id, 'network');
  });
}

var sid = getStreamId();
if (sid) { fetchAndLoad(sid); } else { showError(null, 'missing'); }
try {
  if (navigator.modelContext && typeof navigator.modelContext.registerTool === 'function') {
    var openTelegramAbort = new AbortController();
    navigator.modelContext.registerTool({

      description: 'Open the official SPORTS HUB Telegram channel in a new tab',

      execute: function(){
        openTab(CONTACT_LINK);
        return { status: 'opened', url: CONTACT_LINK };
      }
    }, { signal: openTelegramAbort.signal });
  }
} catch(e){}

})();
