    <p>Have an issue with a stream, a match request, or feedback to improve CRICZONE? Let us know below.</p>
    <form onsubmit="event.preventDefault(); alert('Thank you for your feedback! Our team will review it shortly.'); window.location.href='/';">

      <select id="topic" required="">

        <option value="request">Match / Tournament Request</option>
        <option value="feature">Feature Suggestion</option>
        <option value="other">Other</option>
      </select>

      <label for="name">Your Name (Optional)</label>
      <input type="text" id="name" placeholder="John Doe">

      <label for="msg">Message / Description</label>
      <textarea id="msg" rows="4" placeholder="Describe the stream or match issue..." required=""></textarea>

      <button type="submit">Submit Feedback</button>
    </form>
