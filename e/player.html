<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover"><meta name="theme-color" content="#11100b"><meta name="color-scheme" content="dark"><title>CRICZONE — Live Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#c6a66b;--ink:#090b0e;--panel:#17191c;--muted:#b8b1a3;--line:#5e5036}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -15%,#292316 0%,#121313 43%,#090b0e 82%);color:#f4f0e7;font-family:Inter,system-ui,sans-serif}body{min-height:100vh;min-height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(14px,env(safe-area-inset-left));background:linear-gradient(110deg,#252219,#121416);border-bottom:1px solid #5d4e33;box-shadow:0 8px 28px #0004}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900;letter-spacing:-.5px}.brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#e0d0a8,#b49a67);color:#272116;font-weight:1000}.brand span{color:#dfc895}.actions{display:flex;gap:8px}.btn{min-height:40px;display:inline-flex;align-items:center;justify-content:center;padding:9px 13px;border:1px solid #655438;border-radius:11px;background:linear-gradient(135deg,#29261f,#171819);color:#e3ce9d;font:700 12px Inter,sans-serif;text-decoration:none;cursor:pointer}.btn.primary{background:linear-gradient(120deg,#e0d0a8,#b99b65);color:#211c12;border-color:#e8d7af}
main{width:min(100%,1120px);margin:0 auto;padding:18px 14px 40px}.player-card{overflow:hidden;border:1px solid #5e5036;border-radius:18px;background:#0d0f11;box-shadow:0 22px 70px #0008}.player-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 17px;background:linear-gradient(110deg,#252219,#141516);border-bottom:1px solid #3f3728}.kicker{font-size:10px;font-weight:900;letter-spacing:2px;color:#d6bd88;margin-bottom:5px}.channel-name{font-size:clamp(17px,3vw,22px);font-weight:850;overflow-wrap:anywhere}.channel-category{font-size:10px;color:#b6aa91;letter-spacing:1.2px;margin-top:4px}.frame{position:relative;width:100%;aspect-ratio:16/9;min-height:200px;background:#000}.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle,#29251b,#08090a 72%);color:#ead8ad;font-size:13px;text-align:center;padding:20px;pointer-events:none}.loading.hidden{display:none}.spinner{width:30px;height:30px;border:3px solid #66563a;border-top-color:#d3bb87;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.player-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 15px;background:linear-gradient(110deg,#211f19,#141516);border-top:1px solid #5b4c32;color:#b8b1a3;font-size:11px}.player-foot strong{color:#d9c28f}.channel-section{margin-top:22px;padding:20px;border:1px solid #303640;border-radius:20px;background:linear-gradient(145deg,rgba(27,29,32,.96),rgba(17,19,22,.98));box-shadow:0 22px 65px #0004}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:15px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:800;color:#d6bd88}.section-head h2{margin:6px 0 3px;font-size:24px}.section-head p{margin:0;color:#b9b2a4;font-size:12px}.search{width:min(100%,270px);padding:12px 14px;border:1px solid #5f5137;border-radius:12px;background:#0e1115;color:#f4f0e7;font:inherit;outline:none}.search:focus{border-color:#c6a66b;box-shadow:0 0 0 3px #c6a66b22}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.channel{display:flex;align-items:center;gap:11px;min-width:0;padding:13px;border:1px solid #303640;border-radius:15px;background:linear-gradient(145deg,#1b2027,#11151b);color:#f4f0e7;text-align:left;cursor:pointer;transition:.18s}.channel:hover{border-color:#8c774f;transform:translateY(-2px)}.channel.active{border-color:#c6a66b;background:linear-gradient(145deg,#302b20,#1b1a16);box-shadow:0 0 0 1px #c6a66b24}.logo{display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:linear-gradient(145deg,#e0d0a8,#b49a67);color:#272116;font-size:10px;font-weight:900}.meta{min-width:0;flex:1}.meta strong{display:block;font-size:12px;overflow-wrap:anywhere}.meta small{display:block;margin-top:4px;color:#b6aa91;font-size:9px;letter-spacing:1px}.arrow{color:#d6bd88}.empty{display:none;padding:25px;text-align:center;color:#b9b2a4;border:1px dashed #66563a;border-radius:14px}
@media(max-width:760px){main{padding:12px 9px 30px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.channel-section{padding:14px}.section-head{align-items:stretch;flex-direction:column}.search{width:100%}}@media(max-width:480px){.top{padding:calc(10px + env(safe-area-inset-top)) 12px 10px}.brand{font-size:16px}.brand-mark{width:35px;height:35px}.btn{min-height:38px;padding:8px 10px;font-size:11px}.grid{grid-template-columns:1fr}.player-card{border-radius:13px}.player-head{padding:12px}.frame{min-height:180px}.player-foot{padding:10px 12px}.section-head h2{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header class="top"><div class="brand"><div class="brand-mark">C</div>CRIC<span>ZONE</span></div><div class="actions"><a class="btn" href="./">← Channels</a><button class="btn primary" id="reload" type="button">↻ Reload</button></div></header>
<main><section class="player-card"><div class="player-head"><div><div class="kicker">NOW PLAYING · CRICZONE</div><div class="channel-name" id="name">Loading channel…</div><div class="channel-category" id="category"></div></div><a class="btn" href="./" aria-label="Back to channels">✕</a></div><div class="frame"><div class="loading" id="loading"><span class="spinner"></span><span>Connecting to channel…</span></div><iframe id="frame" title="CRICZONE live channel player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen webkitallowfullscreen playsinline referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="player-foot"><span>● <strong>LIVE PLAYER</strong> · Select another channel below</span><span>Use fullscreen for a larger view</span></div></section>
<section class="channel-section"><div class="section-head"><div><div class="eyebrow">LIVE SPORTS HUB</div><h2>All Channels</h2><p>Switch channels without leaving the player page.</p></div><input class="search" id="search" type="search" placeholder="Search channels…" aria-label="Search channels"></div><div class="grid" id="grid"></div><div class="empty" id="empty">No channels found.</div></section></main>
<script>
const channels=[{"id":"fox1","name":"Fox Sports 501","url":"https://trend48.st/live-tv?ch=fox-sports-501","category":"FOX SPORTS"},{"id":"fox2","name":"Fox Sports 502","url":"https://trend48.st/live-tv?ch=fox-sports-502","category":"FOX SPORTS"},{"id":"fox3","name":"Fox Sports 503","url":"https://trend48.st/live-tv?ch=fox-sports-503","category":"FOX SPORTS"},{"id":"skymain4k","name":"Sky Main 4K","url":"https://trend48.st/live-tv?ch=skysportsmaineventuhd-uk","category":"SKY SPORTS"},{"id":"fox5","name":"Fox Sports 505","url":"https://trend48.st/live-tv?ch=fox-sports-505","category":"FOX SPORTS"},{"id":"fox6","name":"Fox Sports 506","url":"https://trend48.st/live-tv?ch=fox-sports-506","category":"FOX SPORTS"},{"id":"fox7","name":"Fox Sports 507","url":"https://trend48.st/live-tv?ch=fox-sports-507","category":"FOX SPORTS"},{"id":"skyukmain","name":"Sky UK Main Event","url":"https://trend48.st/live-tv?ch=skysportsmainevent-uk","category":"SKY SPORTS"},{"id":"skyukcric","name":"Sky Sports Cricket (UK)","url":"https://trend48.st/live-tv?ch=skysportscricket-uk","category":"SKY SPORTS"},{"id":"tnt1","name":"TNT Sports 1 (UK)","url":"https://trend48.st/live-tv?ch=tntsports1-uk","category":"TNT SPORTS"},{"id":"tnt2","name":"TNT Sports 2 (UK)","url":"https://trend48.st/live-tv?ch=tntsports2-uk","category":"TNT SPORTS"},{"id":"tnt3","name":"TNT Sports 3 (UK)","url":"https://trend48.st/live-tv?ch=tntsports3-uk","category":"TNT SPORTS"},{"id":"tnt4","name":"TNT Sports 4 (UK)","url":"https://trend48.st/live-tv?ch=tntsports4-uk","category":"TNT SPORTS"},{"id":"willow-2","name":"Willow 2 (USA)","url":"https://trend48.st/live-tv?ch=willow2-usa","category":"WILLOW"},{"id":"willow","name":"Willow (USA)","url":"https://trend48.st/live-tv?ch=willow-usa","category":"WILLOW"}];
const params=new URLSearchParams(location.search);let current=params.get('channel');const frame=document.getElementById('frame'),name=document.getElementById('name'),category=document.getElementById('category'),loading=document.getElementById('loading'),grid=document.getElementById('grid'),search=document.getElementById('search'),empty=document.getElementById('empty');
function choose(id){const c=channels.find(x=>x.id===id);if(!c)return;current=id;name.textContent=c.name;category.textContent=c.category;document.title='CRICZONE — '+c.name;loading.classList.remove('hidden');frame.src=c.url;history.replaceState({},'', '?channel='+encodeURIComponent(id));render();}
frame.addEventListener('load',()=>loading.classList.add('hidden'));
document.getElementById('reload').addEventListener('click',()=>{const c=channels.find(x=>x.id===current);if(!c)return;loading.classList.remove('hidden');frame.src='about:blank';setTimeout(()=>frame.src=c.url,120);});
function render(){const q=search.value.trim().toLowerCase();const list=channels.filter(c=>(c.name+' '+c.category).toLowerCase().includes(q));grid.innerHTML=list.map(c=>'<button class="channel '+(c.id===current?'active':'')+'" type="button" data-id="'+c.id+'"><span class="logo">'+(c.category==='FOX SPORTS'?'FOX':c.category==='SKY SPORTS'?'SKY':c.category==='TNT SPORTS'?'TNT':'W')+'</span><span class="meta"><strong>'+c.name+'</strong><small>'+c.category+'</small></span><span class="arrow">▶</span></button>').join('');empty.style.display=list.length?'none':'block';}
grid.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)choose(b.dataset.id)});search.addEventListener('input',render);
if(!channels.some(c=>c.id===current))current=channels[0].id;choose(current);render();
</script></body></html>
