  <script>
    const manifestUri = 'https://livetv.hotstar.com/mp1/gec-india-1540065788/fa6a4f0005ef4f90ab24484d165b0aaf/index.mpd';
    
    // ClearKey DRM Key Pair
    const keyId = '81872faa1d6b45fa9045cdeb2e310000';
    const key = '9b88168e61274587a471962c46b94675';

    // Headers & Auth Cookie
    const headers = {
      'User-Agent': 'Virat Kohli',
      'Referer': 'https://www.hotstar.com/',
      'Origin': 'https://www.hotstar.com',
      'Cookie': 'hdntl=exp=1792582023~acl=%2f*~id=fcae02712aa6d7b4c882e43566d9fb58~data=hdntl~hmac=48cfc623b7e21c1b13b00ead5d8de137814fe0c9aedb56d59a695a7dcc82bff3'
    };

    // Global Working Proxy
    const proxyUrl = 'https://api.allorigins.win/raw?url=';

    async function initPlayer() {
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        console.error('Browser not supported!');
        return;
      }

      const video = document.getElementById('video');
      const player = new shaka.Player(video);

      // Configure DRM
      player.configure({
        drm: {
          clearKeys: {
            [keyId]: key
          }
        }
      });

      // Intercept and rewrite network requests
      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        // Apply custom headers
        for (const [header, value] of Object.entries(headers)) {
          request.headers[header] = value;
        }

        // Pass request through working proxy to resolve 1006 / CORS
        if (!request.uri.includes('api.allorigins.win')) {
          request.uri = proxyUrl + encodeURIComponent(request.uri);
        }
      });

      player.addEventListener('error', (e) => {
        console.error('Player error code:', e.detail.code, e.detail);
      });

      try {
        await player.load(proxyUrl + encodeURIComponent(manifestUri));
        console.log('Stream successfully loaded!');
      } catch (error) {
        console.error('Failed to load stream:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', initPlayer);
  </script>
