    async function initPlayer() {

      const video = document.getElementById('video');

          }
        }
      });

      // Intercept and rewrite network requests
      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        // Apply custom headers
        for (const [header, value] of Object.entries(headers)) {
          request.headers[header] = value;
        }

        // Pass request through working proxy to resolve 1006 / CORS
        if (!request.uri.includes('api.allorigins.win')) {
          request.uri = proxyUrl + encodeURIComponent(request.uri);
        }
      });

      player.addEventListener('error', (e) => {
        console.error('Player error code:', e.detail.code, e.detail);
      });

      try {
        await player.load(proxyUrl + encodeURIComponent(manifestUri));
        console.log('Stream successfully loaded!');
      } catch (error) {
        console.error('Failed to load stream:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', initPlayer);
