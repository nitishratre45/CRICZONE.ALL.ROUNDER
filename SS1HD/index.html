<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Sports 1 Hindi HD - Shaka Player</title>
  
  <!-- Shaka Player UI compiled library and CSS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/shaka-player.ui.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/controls.css" crossorigin="anonymous">
  
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 {
      margin-bottom: 20px;
    }
    .video-container {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
    }
    video {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <h2>STAR SPORTS 1 Hindi HD</h2>

  <div class="video-container" data-shaka-player-container>
    <video data-shaka-player id="video" poster="https://img.media.jio.com/tvpimages/5/6/301982_1749665314605_l_medium.jpg" autoplay controls></video>
  </div>

  <script>
    const manifestUri = 'https://livetv.hotstar.com/mp1/gec-india-1540065788/fa6a4f0005ef4f90ab24484d165b0aaf/index.mpd';
    
    // ClearKey configuration (Hex format conversion)
    const keyId = '81872faa1d6b45fa9045cdeb2e310000';
    const key = '9b88168e61274587a471962c46b94675';
    
    // Custom Headers and Cookie
    const userAgent = 'Virat Kohli';
    const referer = 'https://www.hotstar.com/';
    const origin = 'https://www.hotstar.com';
    const cookie = 'hdntl=exp=1792582023~acl=%2f*~id=fcae02712aa6d7b4c882e43566d9fb58~data=hdntl~hmac=48cfc623b7e21c1b13b00ead5d8de137814fe0c9aedb56d59a695a7dcc82bff3';

    async function initPlayer() {
      // Install built-in polyfills
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        console.error('Browser not supported!');
        return;
      }

      const video = document.getElementById('video');
      const player = new shaka.Player(video);

      // Attach player to window for debugging
      window.player = player;

      // Configure DRM ClearKey
      player.configure({
        drm: {
          clearKeys: {
            [keyId]: key
          }
        }
      });

      // Intercept network requests to append custom headers and cookie
      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['Referer'] = referer;
        request.headers['Origin'] = origin;
        request.headers['User-Agent'] = userAgent;
        request.headers['Cookie'] = cookie;
      });

      // Error handling
      player.addEventListener('error', (event) => {
        console.error('Error code', event.detail.code, 'object', event.detail);
      });

      // Load stream
      try {
        await player.load(manifestUri);
        console.log('The video has been loaded successfully!');
      } catch (e) {
        console.error('Error loading stream', e);
      }
    }

    document.addEventListener('DOMContentLoaded', initPlayer);
  </script>
</body>
</html>
