<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CRICZONE — Sports & Movies</title>
<!-- Material Icons & Inter Font -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

:root {
  --bg-dark: #0a0c10;
  --surface-dark: #14161c;
  --card-bg: #1e2129;
  --border-light: #2f3340;
  --text-primary: #f0f2f5;
  --text-secondary: #9aa1b0;
  --prime-blue: #1e88e5;
  --live-red: #e53935;
  --upcoming-gold: #ffb74d;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-dark);
  color: var(--text-primary);
  overflow-x: hidden;
  min-height: 100vh;
}

/* Loading Overlay */
#overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-dark);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
}
.loading-spinner {
  border: 3px solid rgba(255, 255, 255, 0.1);
  border-top: 3px solid var(--prime-blue);
  border-radius: 50%;
  width: 44px;
  height: 44px;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#overlay p {
  color: var(--text-secondary);
  font-size: 13px;
  letter-spacing: .5px;
  text-align: center;
  font-weight: 500;
}

/* Header */
.sky-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface-dark);
  padding: 12px 24px;
  border-bottom: 1px solid var(--border-light);
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 16px;
}

.sky-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 1.3rem;
  color: var(--text-primary);
  text-decoration: none;
  flex-shrink: 0;
}
.sky-logo .material-icons { color: var(--prime-blue); font-size: 28px; }

/* Search Bar */
.search-wrapper {
  flex: 1;
  max-width: 460px;
  position: relative;
  display: flex;
  align-items: center;
}
.search-wrapper .material-icons {
  position: absolute;
  left: 14px;
  color: var(--text-secondary);
  font-size: 20px;
  pointer-events: none;
}
.search-input {
  width: 100%;
  background: #0f1117;
  border: 1px solid var(--border-light);
  border-radius: 30px;
  padding: 9px 38px 9px 42px;
  color: var(--text-primary);
  font-size: 0.88rem;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  user-select: auto;
  -webkit-user-select: auto;
}
.search-input:focus {
  border-color: var(--prime-blue);
  box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.18);
}
.search-clear {
  position: absolute;
  right: 12px;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.search-clear:hover { color: #fff; }
.search-clear .material-icons { position: static; font-size: 18px; }

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.sky-telegram {
  background: #1f8a4c;
  padding: 8px 18px;
  border-radius: 40px;
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  font-weight: 600;
  color: white;
  font-size: 0.9rem;
  transition: 0.2s;
  white-space: nowrap;
}
.sky-telegram:hover {
  background: #166b3f;
  transform: scale(0.97);
}

/* Main Container */
.container {
  max-width: 1440px;
  margin: 0 auto;
  padding: 24px;
}

/* Category Filter Wrapper */
.category-filter-wrapper {
  position: relative;
  margin-bottom: 28px;
}
.category-filter {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 4px 2px 10px 2px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--border-light) transparent;
}
.category-filter::-webkit-scrollbar { height: 6px; }
.category-filter::-webkit-scrollbar-track { background: transparent; }
.category-filter::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }

.category-btn {
  background: var(--surface-dark);
  border: 1px solid var(--border-light);
  padding: 8px 18px;
  border-radius: 40px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 500;
  cursor: pointer;
  transition: 0.2s;
  color: var(--text-secondary);
  font-size: 0.85rem;
  white-space: nowrap;
  flex-shrink: 0;
}
.category-btn.active {
  background: var(--prime-blue);
  border-color: var(--prime-blue);
  color: white;
}
.category-btn .material-icons { font-size: 18px; }

/* Grid Layout */
.grid-layout {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
  margin-top: 8px;
}

/* Movie Cards */
.sky-card {
  background: var(--card-bg);
  border-radius: 16px;
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
  border: 1px solid var(--border-light);
  display: flex;
  flex-direction: column;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}
.sky-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 28px rgba(0,0,0,0.4);
  border-color: var(--prime-blue);
}

.sky-card-media {
  height: 280px;
  background: #14161c;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.sky-card-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.sky-category {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(4px);
  padding: 3px 10px;
  border-radius: 30px;
  font-size: 0.7rem;
  font-weight: 600;
  color: #e0e0e0;
  z-index: 2;
  text-transform: uppercase;
}

.sky-card-content {
  padding: 14px;
  background: var(--card-bg);
  display: flex;
  flex-direction: column;
  flex-grow: 1;
  justify-content: space-between;
  gap: 10px;
  border-top: 1px solid var(--border-light);
}
.movie-title {
  font-weight: 700;
  font-size: 0.9rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--text-primary);
  line-height: 1.3;
}

.watch-btn {
  width: 100%;
  background: var(--prime-blue);
  border: none;
  padding: 8px;
  border-radius: 30px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  transition: 0.2s;
  color: white;
  font-size: 0.85rem;
}
.sky-card:hover .watch-btn {
  background: #1565c0;
}

/* Load More Container */
.load-more-container {
  display: flex;
  justify-content: center;
  margin-top: 36px;
}
.load-more-btn {
  background: var(--surface-dark);
  border: 1px solid var(--border-light);
  color: var(--text-primary);
  padding: 12px 32px;
  border-radius: 30px;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  transition: 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.load-more-btn:hover {
  background: var(--prime-blue);
  border-color: var(--prime-blue);
  color: #fff;
}

/* Detail Modal / Popup */
#detailModal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9998;
  padding: 20px;
  backdrop-filter: blur(8px);
}
.detail-content {
  position: relative;
  width: 100%;
  max-width: 900px;
  max-height: 90vh;
  background: var(--surface-dark);
  border-radius: 20px;
  overflow-y: auto;
  border: 1px solid var(--border-light);
  box-shadow: 0 25px 50px rgba(0,0,0,0.7);
  display: flex;
  flex-direction: column;
  padding: 24px;
  gap: 20px;
}
.detail-close {
  position: absolute;
  top: 16px;
  right: 16px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid var(--border-light);
  color: #fff;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  transition: 0.2s;
}
.detail-close:hover {
  background: var(--live-red);
  border-color: var(--live-red);
}

.detail-header-flex {
  display: flex;
  gap: 20px;
}
.detail-poster {
  width: 160px;
  height: 230px;
  border-radius: 12px;
  object-fit: cover;
  flex-shrink: 0;
  border: 1px solid var(--border-light);
}
.detail-info {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-grow: 1;
}
.detail-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.3;
}
.detail-meta-row {
  font-size: 0.85rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.meta-badge {
  background: var(--card-bg);
  padding: 3px 8px;
  border-radius: 6px;
  border: 1px solid var(--border-light);
  color: var(--upcoming-gold);
  font-weight: 600;
}
.detail-desc {
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.5;
}

/* Sections for Episodes / Qualities */
.section-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.episodes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
  max-height: 240px;
  overflow-y: auto;
  padding-right: 4px;
}
.episode-btn {
  background: var(--card-bg);
  border: 1px solid var(--border-light);
  color: var(--text-primary);
  padding: 10px 14px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  transition: 0.2s;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.episode-btn:hover {
  background: var(--prime-blue);
  border-color: var(--prime-blue);
  color: #fff;
  transform: translateY(-2px);
}

/* Video Player Modal Container */
#playerModal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.9);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 20px;
}
.player-modal-content {
  position: relative;
  width: 100%;
  max-width: 1100px;
  height: 80vh;
  background: #000;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--border-light);
  display: flex;
  flex-direction: column;
}
.player-close {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(0, 0, 0, 0.7);
  border: 1px solid var(--border-light);
  color: #fff;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  transition: 0.2s;
}
.player-close:hover {
  background: var(--live-red);
  border-color: var(--live-red);
}
#playerFrame {
  width: 100%;
  height: 100%;
  border: none;
  background: #000;
}

/* Status Toast */
#status {
  position: fixed;
  top: max(14px, env(safe-area-inset-top));
  right: 12%;
  transform: translateY(-10px);
  z-index: 10000;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 15px 6px 11px;
  background: rgba(10, 12, 16, 0.92);
  border: 1px solid var(--border-light);
  font-size: 11.5px;
  font-weight: 500;
  border-radius: 24px;
  pointer-events: none;
  opacity: 0;
  transition: opacity .25s ease, transform .25s ease;
  backdrop-filter: blur(14px);
  white-space: nowrap;
  box-shadow: 0 2px 14px rgba(0,0,0,.5);
}
#status.show { opacity: 1; transform: translateY(0); }
.st-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
#status.ok { color: #c0c0c0; } #status.ok .st-dot { background: var(--prime-blue); }
#status.live { color: #c8c8c8; } #status.live .st-dot { background: #22d3a0; }
#status.err { color: #fca5a5; } #status.err .st-dot { background: var(--live-red); }

/* Responsive adjustments */
@media (max-width: 768px) {
  .sky-header { flex-wrap: wrap; padding: 12px 16px; }
  .search-wrapper { order: 3; max-width: 100%; width: 100%; margin-top: 4px; }
  .grid-layout { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .container { padding: 16px 12px; }
  .sky-card-media { height: 200px; }
  .detail-header-flex { flex-direction: column; align-items: center; text-align: center; }
  .detail-poster { width: 130px; height: 180px; }
  .detail-meta-row { justify-content: center; }
  .player-modal-content { height: 100vh; border-radius: 0; max-width: 100%; }
}

footer {
  text-align: center;
  padding: 28px;
  font-size: 0.8rem;
  border-top: 1px solid var(--border-light);
  margin-top: 40px;
  color: var(--text-secondary);
}

/* CRICZONE unified hub navigation */
.cz-hub-header{position:sticky;top:0;z-index:500;min-height:72px;padding:10px clamp(14px,3vw,38px);display:flex;align-items:center;justify-content:space-between;gap:18px;background:#080d18;border-bottom:1px solid #263650;box-shadow:0 8px 28px #0004}
.cz-hub-brand{display:flex;align-items:center;gap:10px;color:#f4f7ff;text-decoration:none;font-size:20px;font-weight:900;letter-spacing:.2px;white-space:nowrap}
.cz-hub-brand>span:last-child>span{color:#ffc857}.cz-hub-brand small{display:block;font-size:9px;letter-spacing:2px;color:#8ea3bf;font-weight:700;margin-top:2px}
.cz-brand-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#258cff,#1453bd);color:white;font-size:23px;font-weight:900;box-shadow:0 6px 20px #1674e544}
.cz-hub-tabs{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.cz-tab{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 17px;border:1px solid #2c405e;border-radius:12px;background:#111d30;color:#aebed4;font:700 13px Inter,sans-serif;cursor:pointer;transition:.18s}
.cz-tab .material-icons{font-size:18px}.cz-tab:hover{border-color:#398eea;color:#fff}.cz-tab.active{background:linear-gradient(120deg,#1679e5,#1557b8);border-color:#348ff5;color:#fff;box-shadow:0 5px 18px #1265ca44}
.cz-hub-telegram{padding:10px 15px;border-radius:11px;background:#168fd1;color:#fff;text-decoration:none;font-size:12px;font-weight:800;white-space:nowrap}
.cz-sports-panel{height:calc(100dvh - 72px);min-height:520px;background:#050a0f}
.cz-sports-panel iframe{display:block;width:100%;height:100%;border:0;background:#050a0f}
#app-wrapper[hidden],.cz-sports-panel[hidden]{display:none!important}
@media(max-width:700px){.cz-hub-header{position:sticky;min-height:auto;padding:9px 10px;gap:8px;flex-wrap:wrap}.cz-hub-brand{font-size:16px;gap:7px}.cz-brand-mark{width:34px;height:34px;border-radius:10px}.cz-hub-brand small{font-size:7px;letter-spacing:1.4px}.cz-hub-tabs{order:3;width:100%;display:grid;grid-template-columns:1fr 1fr}.cz-tab{padding:10px 7px;font-size:11px;gap:5px}.cz-hub-telegram{padding:9px 11px;font-size:11px}.cz-sports-panel{height:calc(100dvh - 116px);min-height:480px}}
\n</style>
</head>

<script>
(function(){
"use strict";

var API_URL = "https://cinearena-movies-api.asifadmincinearena.workers.dev/";

var $overlay = document.getElementById("overlay");
var $loadMsg = document.getElementById("loadMsg");
var $status  = document.getElementById("status");
var $grid    = document.getElementById("movie-grid");
var $catBar  = document.getElementById("category-bar");
var $search  = document.getElementById("movieSearch");
var $clear   = document.getElementById("searchClear");
var $loadMoreContainer = document.getElementById("loadMoreContainer");
var $loadMoreBtn = document.getElementById("loadMoreBtn");

var $detailModal = document.getElementById("detailModal");
var $detailClose = document.getElementById("detailClose");
var $detailPoster = document.getElementById("detailPoster");
var $detailTitle = document.getElementById("detailTitle");
var $detailMetaRow = document.getElementById("detailMetaRow");
var $detailDesc = document.getElementById("detailDesc");
var $episodesGrid = document.getElementById("episodesGrid");

var $playerModal = document.getElementById("playerModal");
var $playerClose = document.getElementById("playerClose");
var $frame       = document.getElementById("playerFrame");

var _stTmr   = null;
var allMovies = [];
var filteredMovies = [];
var displayedCount = 0;
var PAGE_SIZE = 50;
var selectedCategory = "All";
var searchQuery = "";

function toast(msg, type, dur){
  $status.innerHTML = '<span class="st-dot"></span><span>' + msg + '</span>';
  $status.className = "show " + (type || "ok");
  if(_stTmr){ clearTimeout(_stTmr); _stTmr = null; }
  if(dur !== 0){
    _stTmr = setTimeout(function(){
      $status.className = $status.className.replace("show","").trim();
      _stTmr = null;
    }, dur || 4000);
  }
}

function setMsg(m)    { if($loadMsg) $loadMsg.textContent = m; }
function hideOverlay(){ if($overlay) $overlay.style.display = "none"; }

async function loadData(){
  var res = await fetch(API_URL, {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP " + res.status);
  var json = await res.json();
  return json.matches || [];
}

function renderCategories(movies){
  var set = new Set(["All"]);
  movies.forEach(function(m){
    if(m.categories){
      m.categories.split(",").forEach(function(cat){
        var cleanCat = cat.trim();
        if(cleanCat) set.add(cleanCat);
      });
    }
  });

  $catBar.innerHTML = "";
  set.forEach(function(grp){
    var b = document.createElement("button");
    b.className = "category-btn" + (grp === selectedCategory ? " active" : "");
    b.innerHTML = '<span class="material-icons">category</span>' + grp;
    b.onclick = function(){
      selectedCategory = grp;
      document.querySelectorAll(".category-btn").forEach(function(el){ el.classList.remove("active"); });
      b.classList.add("active");
      filterMovies();
    };
    $catBar.appendChild(b);
  });
}

function filterMovies(){
  filteredMovies = allMovies.filter(function(m){
    var matchesCategory = (selectedCategory === "All") || (m.categories && m.categories.toLowerCase().indexOf(selectedCategory.toLowerCase()) !== -1);
    var matchesSearch = !searchQuery || (m.title.toLowerCase().indexOf(searchQuery) !== -1);
    return matchesCategory && matchesSearch;
  });

  displayedCount = 0;
  $grid.innerHTML = "";
  renderNextBatch();
}

function renderNextBatch(){
  if(!filteredMovies.length){
    $grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-secondary);"><span class="material-icons" style="font-size: 48px; opacity: 0.5; margin-bottom: 8px;">search_off</span><br>No movies or series found matching "' + searchQuery + '"</div>';
    $loadMoreContainer.style.display = "none";
    return;
  }

  var nextBatch = filteredMovies.slice(displayedCount, displayedCount + PAGE_SIZE);
  var f = document.createDocumentFragment();

  nextBatch.forEach(function(movie){
    var div = document.createElement("div");
    div.className = "sky-card";
    var fb = "https://ui-avatars.com/api/?name=" + encodeURIComponent(movie.title) + "&background=1e88e5&color=fff&rounded=true";
    var posterImg = movie.poster || fb;
    var primaryCategory = movie.categories ? movie.categories.split(",")[0].trim() : "Movie";

    div.innerHTML = 
      '<div class="sky-card-media">' +
        '<span class="sky-category">' + primaryCategory + '</span>' +
        '<img src="' + posterImg + '" loading="lazy" onerror="this.src=\'' + fb + '\'" alt="">' +
      '</div>' +
      '<div class="sky-card-content">' +
        '<div class="movie-title" title="' + movie.title + '">' + movie.title + '</div>' +
        '<div class="watch-button-wrapper">' +
          '<button class="watch-btn" type="button"><span class="material-icons" style="font-size:16px;">play_arrow</span> Watch Now</button>' +
        '</div>' +
      '</div>';
      
    div.addEventListener("click", function(){
      openDetailModal(movie);
    });

    f.appendChild(div);
  });

  $grid.appendChild(f);
  displayedCount += nextBatch.length;

  if(displayedCount < filteredMovies.length){
    $loadMoreContainer.style.display = "flex";
  } else {
    $loadMoreContainer.style.display = "none";
  }
}

$loadMoreBtn.addEventListener("click", function(){
  renderNextBatch();
});

function openDetailModal(movie){
  var fb = "https://ui-avatars.com/api/?name=" + encodeURIComponent(movie.title) + "&background=1e88e5&color=fff&rounded=true";
  $detailPoster.src = movie.poster || fb;
  $detailTitle.textContent = movie.title;

  var meta = movie.metadata || {};
  var imdb = meta.imdbRating ? '<span class="meta-badge">IMDb: ' + meta.imdbRating + '</span>' : '';
  var lang = meta.language ? '<span><b>Language:</b> ' + meta.language + '</span>' : '';
  var qual = meta.quality ? '<span><b>Quality:</b> ' + meta.quality + '</span>' : '';
  $detailMetaRow.innerHTML = imdb + lang + qual;

  var descParts = [];
  if(meta.genre && meta.genre.length) descParts.push("<b>Genre:</b> " + meta.genre.join(", "));
  if(meta.stars && meta.stars.length) descParts.push("<b>Cast:</b> " + meta.stars.join(", "));
  if(meta.director) descParts.push("<b>Director:</b> " + meta.director);
  $detailDesc.innerHTML = descParts.join("<br>") || (movie.heading || "");

  $episodesGrid.innerHTML = "";
  var channels = movie.channels || [];
  
  if(!channels.length){
    $episodesGrid.innerHTML = '<div style="color:var(--text-secondary); font-size:0.85rem;">No stream sources available.</div>';
  } else {
    channels.forEach(function(ch){
      var btn = document.createElement("button");
      btn.className = "episode-btn";
      btn.textContent = ch.name || "Play";
      btn.title = ch.name || "Play";
      btn.addEventListener("click", function(){
        closeDetailModal();
        openPlayer(ch.streamUrl, movie.title + " - " + (ch.name || "Play"));
      });
      $episodesGrid.appendChild(btn);
    });
  }

  $detailModal.style.display = "flex";
}

function closeDetailModal(){
  $detailModal.style.display = "none";
}

function openPlayer(streamUrl, title){
  if(!streamUrl){
    toast("Stream URL is missing for this selection.", "err", 4000);
    return;
  }
  var iframeUrl = "https://cineplyr-ios.pages.dev/?url=" + encodeURIComponent(streamUrl);
  $frame.src = iframeUrl;
  $playerModal.style.display = "flex";
  toast("Loading " + title + "…", "live", 3000);
}

function closePlayer(){
  $frame.src = "";
  $playerModal.style.display = "none";
}

$detailClose.addEventListener("click", closeDetailModal);
$detailModal.addEventListener("click", function(e){
  if(e.target === $detailModal) closeDetailModal();
});

$playerClose.addEventListener("click", closePlayer);
$playerModal.addEventListener("click", function(e){
  if(e.target === $playerModal) closePlayer();
});

function setupSearch(){
  if(!$search || !$clear) return;
  $search.addEventListener("input", function(e){
    searchQuery = (e.target.value || "").trim().toLowerCase();
    $clear.style.display = searchQuery ? "flex" : "none";
    filterMovies();
  });

  $clear.addEventListener("click", function(){
    $search.value = "";
    searchQuery = "";
    $clear.style.display = "none";
    $search.focus();
    filterMovies();
  });
}

async function main(){
  try{
    setMsg("Fetching Movies Database…");
    allMovies = await loadData();
    hideOverlay();
    renderCategories(allMovies);
    setupSearch();
    filterMovies();
  }catch(e){
    setMsg("Connection Error. Please Check Your Internet or CORS policy.");
    toast("Failed to load catalog.", "err", 0);
  }
}

document.addEventListener("DOMContentLoaded", function(){

document.querySelectorAll(".cz-tab").forEach(function(tab){
  tab.addEventListener("click",function(){
    var section=tab.getAttribute("data-section");
    document.querySelectorAll(".cz-tab").forEach(function(item){item.classList.toggle("active",item===tab);});
    document.getElementById("sportsPanel").hidden=section!=="sports";
    document.getElementById("app-wrapper").hidden=section!=="movies";
    if(section==="sports"){
      var frame=document.getElementById("sportsFrame");
      if(frame.dataset.loaded!=="yes"){frame.dataset.loaded="yes";frame.src="/criczone-old/";}
    }
    window.scrollTo({top:0,behavior:"instant"});
  });
});

main();
});
})();
</script>
</body>
</html>
