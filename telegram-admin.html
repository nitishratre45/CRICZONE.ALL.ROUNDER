<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRICZONE · Telegram Categories</title><style>
:root{color-scheme:dark;font-family:system-ui;background:#08110d;color:#f4fff7}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:900px;margin:auto}.panel{background:#101d16;border:1px solid #294435;border-radius:16px;padding:20px;margin:16px 0}h1{font-size:26px}.muted{color:#9db3a5;font-size:13px}input,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #345441;background:#0b1710;color:#fff}input{width:100%;margin:5px 0 12px}button{cursor:pointer;background:#167348;border:0;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid #294435}.item small{display:block;color:#9db3a5;overflow-wrap:anywhere}.actions{display:flex;gap:6px}.danger{background:#8b3434}.secondary{background:#345441}@media(max-width:600px){body{padding:12px}.grid{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><h1>🏏 Telegram Category Manager</h1><p class="muted">Manage the category buttons shown by CRICZONE BOT. Destination URLs must belong to this website so the 12-hour first-party session cookie can work.</p><section class="panel"><label>Admin dashboard key<input id="key" type="password" autocomplete="current-password" placeholder="ADMIN_DASHBOARD_KEY"></label><button id="load">Connect</button><span id="status" class="muted"></span></section><section class="panel"><h2 id="formTitle">Add category</h2><form id="form"><input id="id" type="hidden"><div class="grid"><label>Category name<input id="name" required maxlength="60" placeholder="SONY"></label><label>Emoji<input id="emoji" maxlength="16" value="📺"></label></div><label>Website URL<input id="url" type="url" required placeholder="https://your-domain.com/sony/"></label><div class="grid"><label>Display order<input id="order" type="number" min="0" value="0"></label><label><input id="enabled" type="checkbox" checked style="width:auto"> Enabled</label></div><button type="submit">Save category</button> <button type="button" class="secondary" id="reset">Clear</button></form></section><section class="panel"><h2>Saved categories</h2><div id="list" class="muted">Connect to load categories.</div></section></main><script>
const $=id=>document.getElementById(id);let rows=[];const headers=()=>({"Content-Type":"application/json","X-Admin-Key":$("key").value.trim()});async function api(method,body){const r=await fetch("/api/telegram/categories",{method,headers:headers(),...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}function reset(){$("form").reset();$("id").value="";$("emoji").value="📺";$("order").value="0";$("enabled").checked=true;$("formTitle").textContent="Add category"}function render(){$("list").innerHTML=rows.length?rows.map(x=>`<div class="item"><div><b>${esc(x.emoji)} ${esc(x.name)}</b><small>${esc(x.url)}</small><small>${x.enabled?"Enabled":"Disabled"} · Order ${x.sort_order}</small></div><div class="actions"><button class="secondary" data-edit="${esc(x.id)}">Edit</button><button class="danger" data-del="${esc(x.id)}">Delete</button></div></div>`).join(""):"No categories added yet."}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}async function load(){try{const d=await api("GET");rows=d.categories||[];render();$("status").textContent=" · Connected"}catch(e){$("status").textContent=" · "+e.message}}$("load").onclick=load;$("reset").onclick=reset;$("form").onsubmit=async e=>{e.preventDefault();try{await api($("id").value?"PUT":"POST",{id:$("id").value||undefined,name:$("name").value,emoji:$("emoji").value,url:$("url").value,sort_order:Number($("order").value),enabled:$("enabled").checked});reset();await load()}catch(e){alert(e.message)}};$("list").onclick=async e=>{const edit=e.target.dataset.edit,del=e.target.dataset.del;if(edit){const x=rows.find(v=>v.id===edit);if(!x)return;$("id").value=x.id;$("name").value=x.name;$("emoji").value=x.emoji;$("url").value=x.url;$("order").value=x.sort_order;$("enabled").checked=!!x.enabled;$("formTitle").textContent="Edit category";window.scrollTo({top:0,behavior:"smooth"})}if(del&&confirm("Delete this category?")){try{await api("DELETE",{id:del});await load()}catch(e){alert(e.message)}}};
</script></body></html>
