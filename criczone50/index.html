<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
        <meta name="theme-color" content="#54219a">
        <title>CRICZONE LIVE — Channels</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0
            }

            :root {
                --bg: #f7f3ff;
                --panel: #fff;
                --line: #e6d8ff;
                --lav: #9b5cff;
                --lav2: #c69bff;
                --deep: #28104d;
                --text: #21113b;
                --muted: #76658f;
                --red: #ef233c;
                --red2: #ff5267;
                --shadow: 0 12px 32px rgba(107,55,173,.14)
            }

            html {
                scroll-behavior: smooth
            }

            body {
                min-height: 100vh;
                background: radial-gradient(ellipse at 10% 0%,#eadbff 0,transparent 38%),radial-gradient(ellipse at 95% 15%,#ffe3eb 0,transparent 30%),var(--bg);
                color: var(--text);
                font-family: Manrope,system-ui,sans-serif;
                overflow-x: hidden
            }

            body:before {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: -1;
                background: linear-gradient(120deg,transparent 20%,rgba(190,151,255,.10),transparent 65%);
                background-size: 200% 200%;
                animation: bgflow 16s ease infinite
            }

            @keyframes bgflow {
                0%,100% {
                    background-position: 0 0
                }

                50% {
                    background-position: 100% 100%
                }
            }

            button,input {
                font: inherit
            }

            #loading {
                position: fixed;
                inset: 0;
                z-index: 50;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                background: #170b2d;
                color: #e8d8ff;
                font-size: 13px
            }

            .spinner {
                width: 48px;
                height: 48px;
                border: 3px solid #ffffff24;
                border-top-color: #c69bff;
                border-right-color: #fff;
                border-radius: 50%;
                animation: spin .8s linear infinite;
                box-shadow: 0 0 24px #a45cff66
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg)
                }
            }

            #app {
                display: none;
                min-height: 100vh
            }

            .topbar {
                position: sticky;
                top: 0;
                z-index: 10;
                overflow: hidden;
                background: linear-gradient(105deg,#241044,#54219a 55%,#32105e);
                border-bottom: 2px solid #c69bff;
                padding: 15px clamp(14px,4vw,48px);
                box-shadow: 0 8px 28px #36105d35
            }

            .topbar:before {
                content: "";
                position: absolute;
                width: 340px;
                height: 180px;
                right: 12%;
                top: -115px;
                border: 1px solid #d9baff55;
                border-radius: 50%;
                box-shadow: 0 0 0 18px #c69bff0c,0 0 0 38px #c69bff0a;
                pointer-events: none
            }

            .toprow {
                display: flex;
                align-items: center;
                gap: 12px;
                max-width: 1500px;
                margin: auto;
                position: relative
            }

            .brand {
                font-family: Archivo,sans-serif;
                font-size: clamp(21px,3vw,29px);
                font-weight: 900;
                letter-spacing: 1.7px;
                color: #fff;
                white-space: nowrap;
                text-shadow: 0 2px 16px #d4b4ff88
            }

            .brand:before {
                content: "▶";
                display: inline-grid;
                place-items: center;
                width: 34px;
                height: 34px;
                margin-right: 9px;
                border: 2px solid #d7b5ff;
                border-radius: 50%;
                font-size: 15px;
                color: #fff;
                vertical-align: middle;
                box-shadow: 0 0 15px #c69bff88
            }

            .brand span {
                color: #ff435b
            }

            .live {
                font-size: 9px;
                letter-spacing: 1px;
                font-weight: 900;
                color: #fff;
                border: 1px solid #ff8797;
                background: linear-gradient(135deg,#e91e3c,#ff5267);
                border-radius: 20px;
                padding: 6px 10px;
                box-shadow: 0 0 16px #ff294e66;
                animation: livepulse 2s infinite
            }

            @keyframes livepulse {
                50% {
                    box-shadow: 0 0 23px #ff294eaa
                }
            }

            .spacer {
                flex: 1
            }

            .tg:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 24px #d0a7ff88
            }

            .tg svg {
                width: 17px;
                height: 17px;
                fill: currentColor
            }

            main {
                max-width: 1500px;
                margin: auto;
                padding: 24px clamp(14px,4vw,48px) 48px
            }

            .intro {
                position: relative;
                overflow: hidden;
                display: flex;
                justify-content: space-between;
                align-items: end;
                gap: 14px;
                margin: 0 0 20px;
                padding: 23px 24px;
                border: 1px solid #d8c0ff;
                border-radius: 22px;
                background: linear-gradient(105deg,#fff 0%,#f0e4ff 55%,#e7d5ff 100%);
                box-shadow: var(--shadow)
            }

            .intro:after {
                content: "";
                position: absolute;
                width: 260px;
                height: 260px;
                right: 7%;
                top: -170px;
                border: 1px solid #b989f966;
                border-radius: 50%;
                box-shadow: 0 0 0 20px #a66bff0c,0 0 0 42px #a66bff0a
            }

            h1 {
                font-family: Archivo,sans-serif;
                font-size: clamp(25px,4vw,38px);
                font-weight: 900;
                letter-spacing: -.8px;
                color: #271044
            }

            .subtitle {
                font-size: 13px;
                color: #71558f;
                margin-top: 6px
            }

            #count {
                color: #785a98;
                font-size: 11px;
                white-space: nowrap;
                background: #fff;
                border: 1px solid #e4d2ff;
                padding: 8px 12px;
                border-radius: 30px;
                position: relative;
                z-index: 1
            }

            .searchbox {
                position: relative;
                margin-bottom: 14px
            }

            .searchbox span {
                position: absolute;
                left: 16px;
                top: 50%;
                transform: translateY(-50%);
                color: #8855c5;
                font-size: 18px
            }

            #search {
                width: 100%;
                padding: 14px 44px;
                border-radius: 14px;
                background: #fff;
                border: 1.5px solid #caa7ff;
                outline: none;
                color: #271044;
                font-size: 13px;
                box-shadow: 0 5px 18px #8f54d51a;
                transition: border-color .2s,box-shadow .2s
            }

            #search:focus {
                border-color: #9650e8;
                box-shadow: 0 0 0 4px #b984ff2b,0 8px 22px #8f54d526
            }

            #search::placeholder {
                color: #9a89ad
            }

            #clear {
                position: absolute;
                right: 8px;
                top: 50%;
                transform: translateY(-50%);
                display: none;
                background: #f1e7ff;
                border: 0;
                color: #65418b;
                border-radius: 8px;
                padding: 6px 9px;
                cursor: pointer
            }

            #filters {
                display: flex;
                gap: 9px;
                overflow: auto;
                padding: 4px 0 17px;
                scrollbar-width: none
            }

            #filters::-webkit-scrollbar {
                display: none
            }

            .pill {
                border: 1px solid #d8c2f5;
                border-radius: 30px;
                background: #fff;
                color: #523777;
                padding: 9px 15px;
                white-space: nowrap;
                font-size: 10px;
                font-weight: 900;
                text-transform: uppercase;
                letter-spacing: .5px;
                cursor: pointer;
                box-shadow: 0 3px 10px #7846a515;
                transition: all .2s
            }

            .pill:hover {
                transform: translateY(-2px);
                border-color: #a66af0;
                box-shadow: 0 7px 16px #8f54d52b
            }

            .pill.active {
                color: #fff;
                border-color: transparent;
                background: linear-gradient(110deg,#8e42df,#bd85ff);
                box-shadow: 0 6px 18px #9c5be966
            }

            #grid {
                display: grid;
                grid-template-columns: repeat(auto-fill,minmax(190px,1fr));
                gap: 16px
            }

            .card {
                min-width: 0;
                overflow: hidden;
                position: relative;
                border: 1px solid #e0cdfb;
                border-radius: 17px;
                background: linear-gradient(150deg,#fff,#f7f0ff);
                cursor: pointer;
                box-shadow: 0 7px 18px #7641a51a;
                transition: transform .22s,border-color .22s,box-shadow .22s;
                animation: cardin .45s both
            }

            @keyframes cardin {
                from {
                    opacity: 0;
                    transform: translateY(12px)
                }

                to {
                    opacity: 1;
                    transform: translateY(0)
                }
            }

            .card:before {
                content: "";
                position: absolute;
                inset: 0 0 auto;
                height: 4px;
                background: linear-gradient(90deg,#8c45dc,#d5b4ff,#f02c49);
                opacity: .85
            }

            .card:hover {
                transform: translateY(-5px);
                border-color: #b37af2;
                box-shadow: 0 15px 30px #7842ad30
            }

            .poster {
                aspect-ratio: 16/9;
                position: relative;
                display: grid;
                place-items: center;
                overflow: hidden;
                background: radial-gradient(circle at 50% 40%,#fff,#eee2ff 75%)
            }

            .poster img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                transition: transform .35s
            }

            .card:hover .poster img {
                transform: scale(1.05)
            }

            .poster:after {
                content: '▶';
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                font-size: 25px;
                color: #fff;
                text-shadow: 0 2px 10px #55208b;
                background: linear-gradient(180deg,#6f36a000,#35105b25);
                pointer-events: none
            }

            .fallback {
                font-family: Archivo,sans-serif;
                font-size: 28px;
                font-weight: 900;
                letter-spacing: 2px;
                color: #9251d8
            }

            .cardbody {
                padding: 12px 13px 15px;
                text-align: center
            }

            .channelname {
                font-size: 13px;
                font-weight: 900;
                line-height: 1.4;
                overflow-wrap: anywhere;
                color: #271044
            }

            .category {
                display: inline-block;
                margin-top: 8px;
                font-size: 9px;
                letter-spacing: .7px;
                font-weight: 900;
                color: #fff;
                background: linear-gradient(100deg,#8139d0,#b47bf0);
                padding: 4px 11px;
                border-radius: 20px;
                text-transform: uppercase
            }

            .card:after {
                content: "LIVE";
                position: absolute;
                right: 9px;
                top: 10px;
                font-size: 9px;
                font-weight: 900;
                letter-spacing: .5px;
                color: #fff;
                background: linear-gradient(120deg,#e51e3b,#ff5368);
                padding: 5px 9px;
                border-radius: 20px;
                box-shadow: 0 3px 10px #e51e3b55
            }

            #empty {
                display: none;
                text-align: center;
                color: #806b98;
                padding: 60px 15px;
                font-size: 13px
            }

            footer {
                position: relative;
                overflow: hidden;
                border-top: 1px solid #e2d0fb;
                padding: 22px 16px;
                text-align: center;
                color: #755d90;
                font-size: 11px;
                background: linear-gradient(90deg,#f1e5ff,#fff,#ffe8ed)
            }

            footer a {
                color: #8b39d5;
                text-decoration: none;
                font-weight: 900
            }

            #player {
                display: none;
                position: fixed;
                inset: 0;
                z-index: 30;
                background: #07050d
            }

            #frame {
                width: 100%;
                height: 100%;
                border: 0;
                background: #000
            }

            .player-watermark {
                position: absolute;
                z-index: 4;
                top: max(18px,env(safe-area-inset-top));
                left: 18px;
                display: flex;
                align-items: center;
                gap: 9px;
                padding: 8px 13px;
                border: 1px solid #d8baff77;
                border-radius: 12px;
                background: linear-gradient(110deg,#1d1036dd,#32135ddd);
                backdrop-filter: blur(10px);
                box-shadow: 0 4px 22px #0008;
                color: #fff;
                font-family: Archivo,sans-serif;
                font-size: clamp(14px,2vw,20px);
                font-weight: 900;
                letter-spacing: 1px;
                text-shadow: 0 0 12px #c69bff99;
                pointer-events: none
            }

            .player-watermark:before {
                content: "▶";
                display: grid;
                place-items: center;
                width: 27px;
                height: 27px;
                border: 1.5px solid #d6b5ff;
                border-radius: 50%;
                font-size: 12px;
                color: #fff
            }

            .player-watermark span {
                color: #ff4059
            }

            .player-watermark em {
                font-style: normal;
                font-family: Manrope,sans-serif;
                font-size: 8px;
                letter-spacing: 1px;
                color: #fff;
                background: #e92340;
                padding: 3px 6px;
                border-radius: 20px
            }

            .playerbar {
                position: absolute;
                z-index: 5;
                top: max(12px,env(safe-area-inset-top));
                left: 12px;
                right: 12px;
                display: flex;
                align-items: center;
                gap: 10px;
                pointer-events: none
            }

            .playerbar button,.playertitle {
                pointer-events: auto;
                background: #1a1028d9;
                color: #fff;
                border: 1px solid #d9c0ff66;
                border-radius: 10px;
                padding: 10px 12px;
                font-size: 12px;
                backdrop-filter: blur(8px)
            }

            .playerbar button {
                cursor: pointer;
                font-weight: 800
            }

            .playertitle {
                margin-left: auto;
                max-width: 65%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap
            }

            #error {
                max-width: 650px;
                padding: 20px;
                line-height: 1.7;
                text-align: center
            }

            #error strong {
                display: block;
                color: #ff7184;
                margin-bottom: 8px
            }

            #retry {
                display: block;
                margin: 14px auto 0;
                border: 0;
                border-radius: 9px;
                padding: 10px 16px;
                background: #a86bf0;
                color: #fff;
                font-weight: 900;
                cursor: pointer
            }

            @media(max-width: 560px) {
                .topbar {
                    padding:13px
                }

                .brand {
                    font-size: 20px
                }

                .brand:before {
                    width: 29px;
                    height: 29px;
                    margin-right: 6px
                }

                .tglabel {
                    display: none
                }

                main {
                    padding-top: 15px
                }

                .intro {
                    padding: 17px;
                    border-radius: 16px
                }

                #grid {
                    grid-template-columns: repeat(2,minmax(0,1fr));
                    gap: 10px
                }

                .cardbody {
                    padding: 9px
                }

                .channelname {
                    font-size: 11px
                }

                .category {
                    font-size: 8px
                }

                .player-watermark {
                    top: 58px;
                    left: 12px;
                    padding: 6px 9px;
                    font-size: 14px
                }

                .playerbar {
                    top: 10px
                }

                .playertitle {
                    max-width: 45%
                }
            }

            @media(prefers-reduced-motion:reduce) {
                *,*:before,*:after {
                    animation-duration: .01ms!important;
                    animation-iteration-count: 1!important;
                    scroll-behavior: auto!important;
                    transition-duration: .01ms!important
                }
            }
        </style>
        </head>
    <body>
        <div id="loading">
            <div class="spinner"></div>
            <div id="loadingText">Loading CRICZONE LIVE channels…</div>
        </div>
        <div id="app">
            <header class="topbar">
                <div class="toprow">
                    <div class="brand">
                        CRIC ZONE
                    </div>
                    <span class="live">● LIVE</span>
                    <div class="spacer"></div>
                    
                </div>
            </header>
            <main>
                <div class="intro">
                    <div>
                        <h1>Live Channels</h1>
                        <p class="subtitle">Your matchday starts here.</p>
                    </div>
                    <div id="count">0 channels</div>
                </div>
                <div class="searchbox">
                    <span>⌕</span>
                    <input id="search" type="search" placeholder="Search channels or categories…" autocomplete="off">
                    <button id="clear" type="button" aria-label="Clear search">✕</button>
                </div>
                <nav id="filters" aria-label="Channel categories"></nav>
                <section id="grid" aria-label="Available channels"></section>
                <div id="empty">
                    📺<br>
                    <br>No channels match your search.
                </div>
            </main>
            <footer>
                Made for cricket fans · 
            </footer>
        </div>
        <section id="player">
            <div class="player-watermark" aria-label="CRICZONE LIVE live watermark">
                CRIC ZONE
                <em>LIVE</em>
            </div>
            <iframe id="frame" title="CRICZONE LIVE player" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="no-referrer"></iframe>
            <div class="playerbar">
                <button id="back" type="button">← All channels</button>
                <div class="playertitle" id="playerTitle"></div>
            </div>
        </section>
        <script>
            ( () => {
                'use strict';
                const JSON_URLS = ['https://sportlink-json.pages.dev/id.json'];
                const FETCH_TIMEOUT = 10000
                  , $ = id => document.getElementById(id);
                let channels = []
                  , activeCategory = 'All'
                  , query = '';
                function normalize(raw) {
                    if (Array.isArray(raw)) return raw;
                    if (!raw || typeof raw !== 'object') return [];
                    for (const key of ['iframes', 'channels', 'streams', 'data']) {
                        if (Array.isArray(raw[key])) return raw[key];
                    }
                    const nested = raw.data && typeof raw.data === 'object' ? raw.data : raw;
                    for (const key of ['iframes', 'channels', 'streams']) {
                        if (Array.isArray(nested[key])) return nested[key];
                    }
                    const values = Object.values(nested);
                    return values.length && values.every(v => v && typeof v === 'object') ? values : [raw];
                }
                async function fetchJson(url) {
                    const controller = new AbortController()
                      , timer = setTimeout( () => controller.abort(), FETCH_TIMEOUT);
                    try {
                        const r = await fetch(url, {
                            cache: 'no-store',
                            headers: {
                                Accept: 'application/json'
                            },
                            signal: controller.signal
                        });
                        if (!r.ok)
                            throw Error('HTTP ' + r.status);
                        return await r.json()
                    } finally {
                        clearTimeout(timer)
                    }
                }
                function toChannel(x, index) {
                    if (!x || typeof x !== 'object') return null;
                    const id = x.id ?? x.channelId ?? x.key ?? index;
                    const name = x.name || x.title || x.channel || x.label;
                    const source = x.iframeSrc || x.url || x.link || x.stream || x.file || x.source || x.src;
                    if (id == null || !name || !source) return null;
                    let parsed;
                    try {
                        parsed = new URL(String(source), location.href);
                        if (!['https:', 'http:'].includes(parsed.protocol)) return null;
                    } catch { return null; }
                    return {
                        id: String(id),
                        name: String(name),
                        iframeSrc: parsed.href,
                        category: String(x.category || x.group || 'General'),
                        logo: String(x.logourl || x.logo || x.logoUrl || x.image || x.poster || '')
                    };
                }
                async function loadChannels() {
                    const results = await Promise.allSettled(JSON_URLS.map(fetchJson))
                      , seen = new Set()
                      , out = []
                      , errors = [];
                    results.forEach( (r, i) => {
                        if (r.status === 'rejected') {
                            const e = r.reason;
                            errors.push(JSON_URLS[i] + ' — ' + (e?.name === 'AbortError' ? 'timed out' : e?.message || 'failed'));
                            return
                        }
                        normalize(r.value).forEach((x, index) => {
                            const c = toChannel(x, index);
                            if (c && !seen.has(c.id)) {
                                seen.add(c.id);
                                out.push(c)
                            }
                        }
                        )
                    }
                    );
                    if (!out.length)
                        throw Error('No valid channels could be loaded. ' + errors.join(' | '));
                    return out
                }
                function esc(v) {
                    return String(v).replace(/[&<>"']/g, c => ({
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    }[c]))
                }
                function renderFilters() {
                    const cats = ['All', ...Array.from(new Set(channels.map(c => c.category).filter(c => c && c !== 'General'))).sort()];
                    $('filters').innerHTML = cats.map(c => '<button type="button" class="pill ' + (c === activeCategory ? 'active' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>').join('');
                    $('filters').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
                        activeCategory = b.dataset.cat;
                        renderFilters();
                        render()
                    }
                    ))
                }
                function render() {
                    const q = query.trim().toLowerCase()
                      , list = channels.filter(c => (activeCategory === 'All' || c.category === activeCategory) && (!q || c.name.toLowerCase().includes(q) || c.category.toLowerCase().includes(q)));
                    $('count').textContent = list.length + (list.length === 1 ? ' channel' : ' channels');
                    $('empty').style.display = list.length ? 'none' : 'block';
                    $('grid').style.display = list.length ? 'grid' : 'none';
                    $('grid').innerHTML = list.map(c => '<article class="card" tabindex="0" role="button" aria-label="Play ' + esc(c.name) + '" data-id="' + esc(c.id) + '"><div class="poster">' + (c.logo ? '<img loading="lazy" src="' + esc(c.logo) + '" alt="' + esc(c.name) + '" onerror="this.remove()">' : '<span class="fallback">CC</span>') + '</div><div class="cardbody"><div class="channelname">' + esc(c.name) + '</div>' + (c.category !== 'General' ? '<div class="category">' + esc(c.category) + '</div>' : '') + '</div></article>').join('');
                    $('grid').querySelectorAll('.card').forEach(card => {
                        const play = () => {
                            const c = channels.find(x => x.id === card.dataset.id);
                            if (c)
                                openPlayer(c)
                        }
                        ;
                        card.addEventListener('click', play);
                        card.addEventListener('keydown', e => {
                            if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                play()
                            }
                        }
                        )
                    }
                    )
                }
                function openPlayer(c, push=true) {
                    let url;
                    try {
                        url = new URL(c.iframeSrc,location.href);
                        if (!['https:', 'http:'].includes(url.protocol))
                            throw Error()
                    } catch {
                        showError('This channel has an invalid player URL.');
                        return
                    }
                    if (push) {
                        const next = new URL(location.href);
                        next.searchParams.set('id', c.id);
                        history.pushState({
                            id: c.id
                        }, '', next)
                    }
                    $('playerTitle').textContent = c.name;
                    $('frame').src = url.href;
                    $('player').style.display = 'block';
                    $('app').style.display = 'none';
                    document.title = 'CRICZONE LIVE · ' + c.name
                }
                function closePlayer(push=true) {
                    $('frame').src = 'about:blank';
                    $('player').style.display = 'none';
                    $('app').style.display = 'block';
                    document.title = 'CRICZONE LIVE — Live Channels';
                    if (push) {
                        const next = new URL(location.href);
                        next.searchParams.delete('id');
                        history.pushState({}, '', next)
                    }
                }
                function route() {
                    const id = new URLSearchParams(location.search).get('id')
                      , c = channels.find(x => x.id === id);
                    if (c)
                        openPlayer(c, false);
                    else
                        closePlayer(false)
                }
                function showError(msg) {
                    $('loadingText').innerHTML = '<div id="error"><strong>Unable to load channels</strong>' + esc(msg) + '<br><button id="retry" type="button">Try again</button></div>';
                    $('retry').addEventListener('click', () => location.reload())
                }
                $('search').addEventListener('input', e => {
                    query = e.target.value;
                    $('clear').style.display = query ? 'block' : 'none';
                    render()
                }
                );
                $('clear').addEventListener('click', () => {
                    $('search').value = '';
                    query = '';
                    $('clear').style.display = 'none';
                    render();
                    $('search').focus()
                }
                );
                $('back').addEventListener('click', () => closePlayer(true));
                window.addEventListener('popstate', route);
                (async () => {
                    try {
                        channels = await loadChannels();
                        renderFilters();
                        render();
                        $('loading').style.display = 'none';
                        $('app').style.display = 'block';
                        route()
                    } catch (e) {
                        showError(e?.message || 'Unexpected error')
                    }
                }
                )();
            }
            )();
        </script>
