#waBadge{

<script>

const params = new URLSearchParams(window.location.search);
const encoded = params.get("data");
let streamUrl = encoded ? atob(encoded) : "";

const video = document.getElementById("video");
const loading = document.getElementById("loading");

/* ── Detect fullscreen state (kept for any future needs) ── */
function updateFsState(){
  const inFs = !!(
    document.fullscreenElement ||
    document.webkitFullscreenElement ||
    document.mozFullScreenElement ||
    document.msFullscreenElement
  );
  document.body.classList.toggle('fs-active', inFs);
}
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange']
  .forEach(function(ev){ document.addEventListener(ev, updateFsState); });

async function initPlayer(){

  if(!streamUrl){
    alert("Stream URL missing");
    return;
  }

  try{

    const player = new shaka.Player(video);
    const container = document.querySelector(".shaka-video-container");
    const ui = new shaka.ui.Overlay(player, container, video);

    ui.configure({
      controlPanelElements:[
        'play_pause',
        'mute',
        'time_and_duration',
        'spacer',
        'quality',
        'language',
        'picture_in_picture',
        'fullscreen',
        'overflow_menu'
      ],
      addSeekBar:true
    });

    player.configure({
      streaming:{
        bufferingGoal:10,
        rebufferingGoal:2,
        bufferBehind:30
      }
    });

    await player.load(streamUrl);

    video.play().catch(()=>{
      video.muted=true;
      video.play();
    });

    video.addEventListener("playing",()=>{
      loading.style.display="none";
    });

  }

  catch(e){

    console.log("Shaka error:",e);

    video.src = streamUrl;
    video.play();

    video.addEventListener("playing",()=>{
      loading.style.display="none";
    });

  }

}

document.addEventListener("DOMContentLoaded", initPlayer);

</script>
