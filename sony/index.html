<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <meta name="referrer" content="no-referrer"/>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>CRICZONE | Sony LIV</title>\n<!-- Plyr CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css"/>

  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- Plyr JS -->
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#0a0a0a;overflow:hidden;
      font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

    /* Custom scrollbar */
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:#0a0a0a}
    ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ef4444,#f97316);border-radius:4px}

    /* ════════════════════════════════════════════
       TELEGRAM BADGE (top-left, BIG STYLE)
    ════════════════════════════════════════════ */
    #tgBadge{
      position:fixed;
      top:max(14px,env(safe-area-inset-top));
      left:max(14px,env(safe-area-inset-left));
      z-index:10001;
      display:inline-flex;align-items:center;gap:10px;
      padding:11px 20px;
      background:linear-gradient(135deg,#1e88e5,#1565c0);
      color:#fff;
      font-size:15px;
      font-weight:600;
      letter-spacing:.3px;
      text-decoration:none;
      border-radius:12px;
      box-shadow:0 4px 14px rgba(0,0,0,0.5);
      transition:transform .2s ease,box-shadow .2s ease;
      -webkit-tap-highlight-color:transparent;
      font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    }
    #tgBadge:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(30,136,229,0.55)}
    #tgBadge:active{transform:scale(.97)}
    #tgBadge svg{width:20px;height:20px;flex-shrink:0;fill:#fff}
    #tgBadge span{white-space:nowrap}

    /* ─── Z-INDEX SCALE (higher = on top) ───
       #player-container   → 9997
       #channel-list       → 9998
       .player-toolbar     → 9999
       #status             → 9999
       #overlay            → 10000
       #tgBadge            → 10001
       #tgOverlay          → 999999
    ──────────────────────────────────────── */

    /* Overlay */
    #overlay{position:fixed;inset:0;background:#0a0a0a;z-index:10000;
      display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
    #overlay svg{animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #overlay p{color:#555;font-size:13px;letter-spacing:.4px;
      text-align:center;padding:0 24px;font-weight:500}

    /* Channel List — pushed below the big badge */
    #channel-list{
      position:fixed;
      inset:0;
      background:#0a0a0a;
      z-index:9998;
      display:none;
      flex-direction:column;
      overflow:hidden;
      padding:max(76px,calc(env(safe-area-inset-top) + 62px)) 16px max(24px,env(safe-area-inset-bottom));
    }

    #channel-list .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding-bottom:12px;
      border-bottom:1px solid #141414;
      flex-shrink:0;
    }
    #channel-list .header h1{
      color:#fff;
      font-size:18px;
      font-weight:700;
      letter-spacing:.5px;
      background:linear-gradient(135deg,#ef4444,#f97316,#eab308);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    #channel-list .header .subtitle{
      color:#555;
      font-size:10px;
      font-weight:400;
      letter-spacing:.8px;
      text-transform:uppercase;
      background:rgba(255,255,255,0.05);
      padding:4px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.05);
    }
    #channel-list .header .count{
      color:#666;
      font-size:11px;
      font-weight:500;
    }

    /* Category filter */
    #category-filter{
      display:flex;
      gap:8px;
      overflow-x:auto;
      padding:12px 0 12px 0;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      flex-shrink:0;
      border-bottom:1px solid rgba(255,255,255,0.03);
    }
    #category-filter::-webkit-scrollbar{display:none}
    .filter-pill{
      flex-shrink:0;
      padding:6px 16px;
      border-radius:20px;
      font-size:10px;
      font-weight:600;
      letter-spacing:.3px;
      text-transform:uppercase;
      cursor:pointer;
      background:#111;
      color:#666;
      border:1px solid #1a1a1a;
      transition:all .25s;
      white-space:nowrap;
    }
    .filter-pill:hover{
      background:#1a1a1a;
      color:#aaa;
      transform:translateY(-1px);
    }
    .filter-pill.active{
      background:linear-gradient(135deg,#ef4444,#f97316);
      color:#fff;
      border-color:transparent;
      box-shadow:0 4px 15px rgba(239,68,68,0.3);
    }

    /* Grid wrapper */
    #grid-wrapper{
      flex:1;
      overflow-y:auto;
      overflow-x:hidden;
      padding-top:12px;
      margin:0 -4px;
      padding-right:4px;
    }
    #grid-wrapper::-webkit-scrollbar{width:4px}
    #grid-wrapper::-webkit-scrollbar-track{background:transparent}
    #grid-wrapper::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ef4444,#f97316);border-radius:4px}

    #ch-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      gap:14px;
    }

    .ch-card{
      background:linear-gradient(145deg,#111,#0d0d0d);
      border:1px solid #1a1a1a;
      border-radius:14px;
      padding:16px 12px;
      cursor:pointer;
      text-decoration:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:10px;
      transition:all .3s cubic-bezier(.4,0,.2,1);
      -webkit-tap-highlight-color:transparent;
      min-height:130px;
      justify-content:center;
      position:relative;
      overflow:hidden;
    }
    .ch-card::before{
      content:'';
      position:absolute;
      inset:0;
      border-radius:14px;
      padding:1px;
      background:linear-gradient(135deg,transparent,transparent);
      -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
      -webkit-mask-composite:xor;
      mask-composite:exclude;
      transition:all .4s;
    }
    .ch-card:hover{
      transform:translateY(-3px);
      border-color:#ef4444;
      box-shadow:0 8px 30px rgba(239,68,68,0.15);
    }
    .ch-card:hover::before{
      background:linear-gradient(135deg,#ef4444,#f97316,#eab308);
    }
    .ch-card:active{
      transform:scale(.96);
    }
    .ch-card:focus-visible{
      outline:2px solid #ef4444;
      outline-offset:2px;
    }

    .ch-card .category-badge{
      position:absolute;
      top:8px;
      right:8px;
      font-size:7px;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:.5px;
      padding:2px 8px;
      border-radius:8px;
      background:rgba(255,255,255,0.06);
      color:#666;
      border:1px solid rgba(255,255,255,0.04);
    }

    .ch-card .ch-logo{
      width:100%;
      max-width:110px;
      height:auto;
      max-height:55px;
      object-fit:contain;
      border-radius:6px;
      padding:4px;
      transition:transform .3s;
    }
    .ch-card:hover .ch-logo{
      transform:scale(1.05);
    }

    .ch-card .ch-name{
      color:#e0e0e0;
      font-size:12px;
      font-weight:600;
      line-height:1.3;
      letter-spacing:.2px;
    }

    .ch-card .ch-placeholder{
      width:100%;
      max-width:110px;
      height:55px;
      background:linear-gradient(135deg,#1a1a1a,#111);
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#333;
      font-size:14px;
      font-weight:700;
      letter-spacing:1px;
      border:1px solid #1a1a1a;
    }
    .ch-card .ch-placeholder .initials{
      background:linear-gradient(135deg,#ef4444,#f97316);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }

    /* Player */
    #player-container{
      position:fixed;
      inset:0;
      background:#000;
      z-index:9997;
      display:none;
      align-items:center;
      justify-content:center;
    }
    #player-container video{
      width:100%;
      height:100%;
      object-fit:contain;
      background:#000;
    }
    #sonyExternalFrame{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;z-index:1}
    .plyr{
      height:100%;
      width:100%;
      background:#000;
    }
    .plyr__controls{
      background:linear-gradient(0deg,rgba(0,0,0,0.9),transparent)!important;
    }
    .plyr__control--overlaid{
      background:linear-gradient(135deg,#ef4444,#f97316)!important;
    }
    .plyr__control.plyr__control--overlaid:hover{
      background:linear-gradient(135deg,#dc2626,#ea580c)!important;
    }
    .plyr__control[data-plyr="play"]:hover,
    .plyr__control[data-plyr="fullscreen"]:hover{
      background:rgba(239,68,68,0.2)!important;
    }
    .plyr__progress__buffer{
      background:rgba(239,68,68,0.3)!important;
    }
    .plyr__progress__played{
      background:linear-gradient(90deg,#ef4444,#f97316)!important;
    }
    .plyr__menu__container .plyr__control[role="menuitemradio"][aria-checked="true"]::before{
      background:linear-gradient(135deg,#ef4444,#f97316)!important;
    }

    /* ════════════════════════════════════════════
       CSS-ROTATION FALLBACK
       Applied when native orientation lock is unavailable
       (iOS Safari, Android WebViews). Rotates the fixed
       player container 90° so the video fills a portrait
       screen in landscape orientation.
       ════════════════════════════════════════════ */
    #player-container.rotate-90{
      position:fixed !important;
      top:50% !important;
      left:50% !important;
      width:100vh !important;
      height:100vw !important;
      transform:translate(-50%,-50%) rotate(90deg) !important;
      transform-origin:50% 50% !important;
      z-index:9997 !important;
    }
    #player-container.rotate-90 video{
      width:100%;height:100%;object-fit:contain;
    }

    /* ══ PLAYER TOP-LEFT TOOLBAR (shifted below badge) ══ */
    .player-toolbar{
      position:fixed;
      top:calc(max(14px,env(safe-area-inset-top)) + 62px);
      left:max(12px,env(safe-area-inset-left));
      z-index:9999;
      display:none;
      align-items:center;
      gap:6px;
      flex-wrap:wrap;
      max-width:calc(100vw - 24px);
      pointer-events:none;
    }
    .player-toolbar.show{display:flex}
    .player-toolbar > *{pointer-events:auto}

    /* ══ ROTATE FULLSCREEN BUTTON ══ */
    .rotate-btn{
      padding:6px 12px;
      background:rgba(0,0,0,0.8);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:10px;
      color:#fff;
      font-size:11px;
      font-weight:500;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:5px;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      transition:all .25s;
      font-family:inherit;
      -webkit-tap-highlight-color:transparent;
    }
    .rotate-btn:hover{
      background:rgba(239,68,68,0.2);
      border-color:#ef4444;
    }
    .rotate-btn:active{transform:scale(.95)}
    .rotate-btn.active{
      background:rgba(239,68,68,0.3);
      border-color:#ef4444;
    }
    .rotate-btn svg{
      width:14px;
      height:14px;
      flex-shrink:0;
    }

    #status{
      position:fixed;
      top:calc(max(14px,env(safe-area-inset-top)) + 62px);
      right:max(12px,env(safe-area-inset-right));
      z-index:9999;
      padding:5px 13px;
      background:rgba(8,8,8,.9);
      border:1px solid rgba(255,255,255,.05);
      font-size:11px;
      font-weight:500;
      letter-spacing:.02em;
      border-radius:20px;
      pointer-events:none;
      opacity:0;
      transition:opacity .3s;
      max-width:260px;
      text-align:right;
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
      color:#ef4444;
    }
    #status.show{opacity:1}
    #status.ok{color:#ef4444}
    #status.warn{color:#fb923c}
    #status.err{color:#f87171}

    @media (max-width:400px){
      #ch-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
      .ch-card{min-height:110px;padding:12px 8px}
      .ch-card .ch-logo{max-height:40px}
      .ch-card .ch-name{font-size:10px}
      #channel-list .header h1{font-size:15px}
      .filter-pill{font-size:8px;padding:4px 12px}
      #category-filter{padding:10px 0 10px 0}
      .player-toolbar{gap:4px}
      .rotate-btn{padding:5px 10px;font-size:10px}
      .rotate-btn svg{width:12px;height:12px}
      /* Slightly smaller badge, still prominent */
      #tgBadge{padding:9px 15px;font-size:13px;gap:8px}
      #tgBadge svg{width:17px;height:17px}
    }
    @media (max-width:340px){
      .rotate-btn span{display:none}
      .rotate-btn{padding:5px 8px}
      #tgBadge span{display:none}
      #tgBadge{padding:9px 12px}
    }
    @media (min-width:768px){
      #ch-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
      .ch-card{min-height:150px;padding:20px 16px}
      .ch-card .ch-logo{max-height:65px}
      .ch-card .ch-name{font-size:14px}
    }

    /* ════════════════════════════════════════════
       TELEGRAM POPUP
    ════════════════════════════════════════════ */
    #tgOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      padding: 20px;
      animation: fadeInPopup 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    #tgOverlay.show { display: flex; }

    #tgCard {
      width: 100%;
      max-width: 400px;
      background: linear-gradient(160deg, #121821, #0a0c0f);
      border: 1px solid rgba(79, 195, 247, 0.15);
      border-radius: 24px;
      padding: 36px 28px 28px;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 60px rgba(79, 195, 247, 0.03);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    #tgClose{
      position:absolute;top:13px;right:13px;z-index:3;
      width:36px;height:36px;display:grid;place-items:center;
      padding:0;border-radius:50%;
      color:#d8e7f8;background:rgba(255,255,255,.075);
      border:1px solid rgba(190,215,245,.2);
      font:400 25px/1 Arial,sans-serif;cursor:pointer;
      transition:background .2s ease,color .2s ease,transform .2s ease;
      -webkit-tap-highlight-color:transparent;
    }
    #tgClose:hover{background:rgba(255,255,255,.16);color:#fff;transform:rotate(90deg)}
    #tgClose:focus-visible{outline:2px solid #f1c66b;outline-offset:3px}
    #tgCard::before {
      content: "";
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(79, 195, 247, 0.04), transparent 60%);
      pointer-events: none;
    }
    #tgIcon {
      width: 72px; height: 72px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2AABEE, #229ED9);
      box-shadow: 0 0 40px rgba(42, 171, 238, 0.2);
      position: relative;
      z-index: 1;
    }
    #tgIcon svg { width: 36px; height: 36px; }

    #tgCard h2 {
      margin: 0 0 8px;
      font-size: clamp(1.3rem, 2.5vw, 1.8rem);
      font-weight: 700;
      color: #ffffff;
      position: relative;
      z-index: 1;
      letter-spacing: -0.01em;
    }
    #tgCard p {
      margin: 0 0 24px;
      color: #8e9baf;
      font-size: clamp(0.9rem, 1.2vw, 1.05rem);
      line-height: 1.6;
      position: relative;
      z-index: 1;
    }
    .tgBtns { display: flex; gap: 12px; position: relative; z-index: 1; }
    .tgBtn {
      flex: 1;
      height: 48px;
      border-radius: 40px;
      font-weight: 700;
      font-size: clamp(0.85rem, 1vw, 1rem);
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
      font-family: inherit;
      letter-spacing: 0.01em;
    }
    #joinNow {
      background: linear-gradient(135deg, #4fc3f7, #2196f3);
      color: #ffffff;
      box-shadow: 0 6px 24px rgba(79, 195, 247, 0.25);
    }
    #joinNow:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(79, 195, 247, 0.35);
    }
    #joinedBtn {
      background: rgba(255, 255, 255, 0.05);
      color: #8e9baf;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    #joinedBtn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    @keyframes fadeInPopup {
      from { opacity: 0; transform: scale(0.95) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @media (max-width: 480px) {
      #tgCard { padding: 24px 18px 20px; border-radius: 20px; }
      #tgIcon { width: 60px; height: 60px; }
      #tgIcon svg { width: 30px; height: 30px; }
      #tgCard h2 { font-size: 1.2rem; }
      #tgCard p { font-size: 0.85rem; margin-bottom: 18px; }
      .tgBtn { height: 42px; font-size: 0.8rem; }
    }

    /* CRICZONE premium UI refresh */
    body{background:radial-gradient(ellipse at 50% -18%,#172b49 0%,#0b111b 48%,#070a10 100%);color:#f5f7fb}
    #tgBadge{background:linear-gradient(120deg,#1677ed,#0753bd);border:1px solid #72b6ff55;box-shadow:0 8px 28px #006eff40}
    #tgBadge:hover{box-shadow:0 10px 32px #1685ff66}
    #channel-list{background:linear-gradient(180deg,#0c1421,#080c13)}
    #channel-list .header{border-bottom-color:#26364d;padding:10px 2px 16px}
    #channel-list .header h1{background:linear-gradient(110deg,#fff 8%,#8dc8ff 48%,#f5c96b 95%);-webkit-background-clip:text;background-clip:text}
    #channel-list .header .subtitle{color:#d8e8ff;background:#14243a;border-color:#2a4669}
    .filter-pill{background:#111d2d;color:#a9bad0;border-color:#263950}
    .filter-pill.active{background:linear-gradient(120deg,#1677ed,#0b55bd);box-shadow:0 5px 18px #087bff40}
    .ch-card{background:linear-gradient(145deg,#142238,#0b1422);border-color:#263b57;box-shadow:0 8px 22px #0003}
    .ch-card:hover{border-color:#4b9cff;box-shadow:0 12px 30px #087bff26}
    .ch-card:hover::before{background:linear-gradient(135deg,#238bff,#f1c66b)}
    .ch-card .category-badge{background:#1b2e48;color:#b8d7ff;border-color:#355273}
    .ch-card .ch-name{color:#f0f5fc}
    .ch-card .ch-placeholder{background:linear-gradient(135deg,#1b2e48,#101a2a);border-color:#2d4667}
    .ch-card .ch-placeholder .initials{background:linear-gradient(135deg,#66b6ff,#f2ca72);-webkit-background-clip:text;background-clip:text}
    #grid-wrapper::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#238bff,#f1c66b)}
    ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#238bff,#f1c66b)}
    #status{color:#8fc6ff;border-color:#294667}
    #status.ok{color:#6ee7b7}
    #status.warn{color:#f5c96b}
    #status.err{color:#ff8585}
    /* CRICZONE premium Telegram popup */
    #tgOverlay{
      z-index:2147483000;
      padding:clamp(16px,4vw,28px);
      background:rgba(2,7,16,.82);
      backdrop-filter:blur(18px) saturate(125%);
      -webkit-backdrop-filter:blur(18px) saturate(125%);
    }
    #tgOverlay.show #tgCard{animation:tgCardEnter .48s cubic-bezier(.2,.8,.2,1) both}
    #tgCard{
      width:min(100%,430px);
      padding:54px clamp(22px,5vw,34px) 28px;
      border:1px solid rgba(111,178,255,.42);
      border-radius:26px;
      background:
        radial-gradient(ellipse at 50% -8%,rgba(35,139,255,.25),transparent 54%),
        linear-gradient(155deg,#172b45 0%,#101d30 48%,#091321 100%);
      box-shadow:0 34px 100px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.035) inset,0 0 54px rgba(22,133,255,.13);
    }
    #tgCard::before{
      inset:0;
      top:0;left:0;width:100%;height:100%;
      background:linear-gradient(125deg,rgba(255,255,255,.055),transparent 35%,transparent 70%,rgba(241,201,107,.035));
      pointer-events:none;
    }
    #tgCard::after{

<script>
(function(){
"use strict";

// ============ CONFIG ============
var M3U_URL = "https://sportlink-jtv.pages.dev/sony3.m3u";
var PROXY_BASE = "https://criczone.pages.dev/api/proxy?u=";
var $overlay = document.getElementById("overlay");
var $loadMsg = document.getElementById("loadMsg");
var $status = document.getElementById("status");
var $list = document.getElementById("channel-list");
var $grid = document.getElementById("ch-grid");
var $gridWrapper = document.getElementById("grid-wrapper");
var $filter = document.getElementById("category-filter");
var $playerContainer = document.getElementById("player-container");
var $video = document.getElementById("player");
var $rotateBtn = document.getElementById("rotateBtn");
var $toolbar = document.getElementById("playerToolbar");
var _stTmr = null;
var allChannels = [];
var currentCategory = 'All';
var currentPlayer = null;
var currentHls = null;
var resumeTmr = null;

function toast(msg,type,dur){
  $status.textContent=msg;
  $status.className="show "+(type||"ok");
  if(_stTmr) clearTimeout(_stTmr);
  if(dur!==0){
    _stTmr=setTimeout(function(){
      $status.className=$status.className.replace("show","").trim();
      _stTmr=null;
    },dur||4000);
  }
}

function cleanSourceTag(value){
  return String(value || "")
    .replace(/\s+by\s+@sayan10\b/ig, "")
    .replace(/@sayan10\b/ig, "")
    .replace(/\s{2,}/g, " ")
    .trim();
}

function setMsg(m) { $loadMsg && ($loadMsg.textContent = m); }
function hideOverlay() { $overlay && ($overlay.style.display = "none"); }
function getChId() { return new URLSearchParams(location.search).get("id") || ""; }

// ============ PROXY HELPER ============
function proxyUrl(url){
  if(!url) return url;
  if(url.indexOf(PROXY_BASE) === 0) return url;
  return PROXY_BASE + encodeURIComponent(url);
}

// ============ M3U PARSER ============
function parseM3U(text){
  var channels = [];
  var lines = text.split(/\r?\n/);
  var current = null;

  for(var i=0;i<lines.length;i++){
    var line = lines[i].trim();
    if(!line) continue;

    if(line.indexOf("#EXTINF:") === 0){
      var info = line.substring(8);
      var commaIdx = info.indexOf(",");
      var name = commaIdx >= 0 ? info.substring(commaIdx+1).trim() : "Unknown";
      var attrs = commaIdx >= 0 ? info.substring(0,commaIdx) : info;

      var id = "";
      var logo = "";
      var group = "General";

      var idMatch = attrs.match(/tvg-id="([^"]*)"/i);
      if(idMatch) id = idMatch[1];

      var logoMatch = attrs.match(/tvg-logo="([^"]*)"/i) || attrs.match(/logo="([^"]*)"/i);
      if(logoMatch) logo = logoMatch[1];

      var groupMatch = attrs.match(/group-title="([^"]*)"/i);
      if(groupMatch) group = groupMatch[1] || "General";

      var safeId = id || (name.replace(/[^a-z0-9]+/gi,"_").toLowerCase() + "_" + channels.length);

      current = {
        id: safeId,
        name: name,
        logo: logo,
        category: group,
        stream_url: ""
      };
    }
    else if(line.charAt(0) === "#"){
      if(line.indexOf("#EXTGRP:") === 0 && current){
        var g = line.substring(8).trim();
        if(g) current.category = g;
      }
      continue;
    }
    else if(current){
      current.stream_url = line;
      channels.push(current);
      current = null;
    }
  }

  return channels;
}

// ============ LOAD DATA ============
async function loadData(){
  var r = await fetch(M3U_URL, {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  var text = await r.text();
  var channels = parseM3U(text);

  channels = channels.filter(function(c){ return c.stream_url && c.stream_url.length > 0; });

  if(!channels.length) throw new Error("No channels found");
  return { channels: channels };
}

// ============ RENDER FILTERS ============
function renderFilters(channels){
  var categories = ['All'];
  var cats = {};
  channels.forEach(function(ch){
    if(ch.category && ch.category !== 'General') {
      cats[ch.category] = true;
    }
  });
  Object.keys(cats).sort().forEach(function(c){ categories.push(c); });

  var f = document.createDocumentFragment();
  categories.forEach(function(cat){
    var pill = document.createElement('span');
    pill.className = 'filter-pill' + (cat === currentCategory ? ' active' : '');
    pill.textContent = cleanSourceTag(cat);
    pill.dataset.category = cat;
    pill.addEventListener('click', function(){
      currentCategory = cat;
      document.querySelectorAll('.filter-pill').forEach(function(p){
        p.classList.toggle('active', p.dataset.category === cat);
      });
      renderChannels(channels);
      if($gridWrapper) $gridWrapper.scrollTop = 0;
    });
    f.appendChild(pill);
  });
  $filter.innerHTML = '';
  $filter.appendChild(f);
}

// ============ RENDER CHANNELS ============
function renderChannels(channels){
  var filtered = channels;
  if(currentCategory !== 'All') {
    filtered = channels.filter(function(ch){ return ch.category === currentCategory; });
  }

  var countEl = document.querySelector('.header .count');
  if(!countEl) {
    var header = document.querySelector('.header');
    var count = document.createElement('span');
    count.className = 'count';
    header.appendChild(count);
  }
  document.querySelector('.header .count').textContent = filtered.length + ' channels';

  var f = document.createDocumentFragment();
  filtered.forEach(function(ch){
    var a = document.createElement("a");
    a.className = "ch-card";
    a.href = "?id=" + encodeURIComponent(ch.id);

    var badgeHtml = '';
    if(ch.category && ch.category !== 'General') {
      badgeHtml = '<span class="category-badge">'+cleanSourceTag(ch.category)+'</span>';
    }

    var logoHtml = '';
    if(ch.logo && ch.logo.trim()) {
      logoHtml = '<img class="ch-logo" src="'+ch.logo+'" alt="'+cleanSourceTag(ch.name)+'" loading="lazy" onerror="this.style.display=\'none\'">';
    } else {
      var initials = ch.name.split(' ').slice(0,2).map(function(w){ return w[0]; }).join('');
      logoHtml = '<div class="ch-placeholder"><span class="initials">'+initials+'</span></div>';
    }

    a.innerHTML = badgeHtml + logoHtml + '<span class="ch-name">'+cleanSourceTag(ch.name)+'</span>';
    f.appendChild(a);
  });

  $grid.innerHTML = '';
  $grid.appendChild(f);
}

// ============ RENDER LIST ============
function renderList(data){
  hideOverlay();
  var channels = data.channels || data;
  allChannels = channels;
  renderFilters(channels);
  renderChannels(channels);
  $list.style.display = "flex";
}

// ============ PLAYER SHOW / HIDE ============
function showPlayer(){
  $list.style.display = "none";
  $playerContainer.style.display = "flex";
  $toolbar.classList.add("show");
}

function hidePlayer(){
  // ✅ Exit fullscreen + unlock orientation + reset CSS rotation first
  try {
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsEl) {
      if (document.exitFullscreen) {
        document.exitFullscreen().catch(function(){});
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }
    unlockOrientation();
    applyCssRotation(false);
  } catch(e){}

  $list.style.display = "flex";
  $playerContainer.style.display = "none";
  var externalFrame = document.getElementById("sonyExternalFrame");
  if(externalFrame) externalFrame.src = "about:blank";
  $video.style.display = "";
  $toolbar.classList.remove("show");

  if(resumeTmr) { clearInterval(resumeTmr); resumeTmr = null; }

  if(currentHls) {
    try { currentHls.destroy(); } catch(e){}
    currentHls = null;
  }
  if(currentPlayer) {
    try { currentPlayer.destroy(); } catch(e){}
    currentPlayer = null;
  }
  try {
    $video.pause();
    $video.removeAttribute('src');
    $video.load();
  } catch(e){}

  if(window.history && window.history.pushState) {
    window.history.pushState({}, document.title, window.location.pathname);
  }
}

// ============ ✅ ROTATE FULLSCREEN (with CSS fallback) ============
var cssRotated = false;

function isPortrait(){ return window.innerHeight > window.innerWidth; }

function applyCssRotation(on){
  var el = $playerContainer;
  if(!el) return;
  el.classList.toggle("rotate-90", !!on);
  cssRotated = !!on;
  syncRotateBtn();
}

async function tryLockLandscape(){
  var so = screen.orientation;
  if(so && typeof so.lock === "function"){
    for(var i=0;i<3;i++){
      try { await so.lock("landscape"); return true; }
      catch(e){ await new Promise(function(r){ setTimeout(r,150); }); }
    }
  }
  var legacy = screen.lockOrientation || screen.mozLockOrientation || screen.msLockOrientation;
  if(typeof legacy === "function"){
    try { return legacy.call(screen,"landscape") !== false; }
    catch(e){ return false; }
  }
  return false;
}

function unlockOrientation(){
  try { if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e){}
  try {
    var legacy = screen.unlockOrientation || screen.mozUnlockOrientation || screen.msUnlockOrientation;
    if(typeof legacy === "function") legacy.call(screen);
  } catch(e){}
}

async function toggleRotateFullscreen(){
  var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  var isFauxFs = $playerContainer.style.display === "flex" && cssRotated;

  /* ── EXIT ── */
  if (fsEl || isFauxFs) {
    unlockOrientation();
    applyCssRotation(false);
    if (fsEl) {
      try {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      } catch(e){}
    }
    syncRotateBtn();
    return;
  }

  /* ── ENTER: page fullscreen (keeps toolbar + Plyr controls) ── */
  var enteredPageFs = false;
  try {
    var root = document.documentElement;
    if (root.requestFullscreen) { await root.requestFullscreen(); enteredPageFs = true; }
    else if (root.webkitRequestFullscreen) { root.webkitRequestFullscreen(); enteredPageFs = true; }
  } catch(e){ /* iOS & some WebViews reject this */ }

  /* ── Try native landscape lock ── */
  var locked = false;
  if (enteredPageFs) locked = await tryLockLandscape();

  /* ── Fallback: rotate with CSS ── */
  if (!locked) {
    if (isPortrait()) applyCssRotation(true);
    else applyCssRotation(false);
    syncRotateBtn();
  }
}

function syncRotateBtn(){
  if (!$rotateBtn) return;
  var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  $rotateBtn.classList.toggle("active", !!(fsEl || cssRotated));
}

/* Keep the CSS rotation correct if the user physically turns the phone */
function handleViewportRotation(){
  if (!cssRotated) return;
  if (!isPortrait()) {
    applyCssRotation(false);
  }
}
window.addEventListener("resize", handleViewportRotation);
if (screen.orientation && screen.orientation.addEventListener) {
  screen.orientation.addEventListener("change", handleViewportRotation);
} else {
  window.addEventListener("orientationchange", function(){
    setTimeout(handleViewportRotation, 250);
  });
}

if ($rotateBtn) {
  $rotateBtn.addEventListener("click", toggleRotateFullscreen);
}
document.addEventListener("fullscreenchange", function(){
  if (!document.fullscreenElement && !cssRotated) syncRotateBtn();
});
document.addEventListener("webkitfullscreenchange", function(){
  if (!document.webkitFullscreenElement && !cssRotated) syncRotateBtn();
});

// ============ PLAYER SETUP ============
function setupHLSPlayer(url){
  showPlayer();
  toast("Loading stream…", "warn", 0);

  if(currentHls) {
    try { currentHls.destroy(); } catch(e){}
    currentHls = null;
  }
  if(currentPlayer) {
    try { currentPlayer.destroy(); } catch(e){}
    currentPlayer = null;
  }

  var playUrl = proxyUrl(url);

  var defaultOptions = {
    controls: [
      'play', 'progress', 'current-time', 'mute', 'volume',
      'captions', 'settings', 'fullscreen'
    ],
    settings: ['quality'],
    autoplay: true,
    muted: true
  };

  var isM3U8 = /\.m3u8(\?|$)/i.test(url) || url.indexOf('.m3u8') !== -1;

  if(Hls.isSupported() && isM3U8) {
    var hls = new Hls({
      autoStartLoad: true,
      enableWorker: true,
      lowLatencyMode: true,
      backbufferLength: 30,
      manifestLoadingTimeOut: 20000,
      manifestLoadingMaxRetry: 6,
      levelLoadingTimeOut: 20000,
      fragLoadingTimeOut: 30000
    });
    currentHls = hls;

    hls.loadSource(playUrl);
    hls.attachMedia($video);

    hls.on(Hls.Events.MANIFEST_PARSED, function(_, data) {
      var qualities = data.levels.map(function(l) { return l.height; })
        .filter(function(h){ return h; })
        .sort(function(a,b){ return b-a; });

      qualities = qualities.filter(function(v,i){ return qualities.indexOf(v) === i; });

      currentPlayer = new Plyr($video, Object.assign({}, defaultOptions, qualities.length ? {
        quality: {
          default: qualities[0],
          options: qualities,
          forced: true,
          onChange: function(q) {
            hls.levels.forEach(function(level, index) {
              if(level.height === q) {
                hls.currentLevel = index;
              }
            });
          }
        }
      } : {}));

      // Plyr's own fullscreen button also triggers rotation handling
      currentPlayer.on("enterfullscreen", async function(){
        var locked = await tryLockLandscape();
        if(!locked && isPortrait()) applyCssRotation(true);
      });
      currentPlayer.on("exitfullscreen", function(){
        unlockOrientation();
        applyCssRotation(false);
      });

      $video.play().catch(function(){});
      hideOverlay();
      toast("● Live", "ok", 3000);
    });

    hls.on(Hls.Events.ERROR, function(_, data) {
      if(data.fatal) {
        toast("Reconnecting…", "warn", 0);
        setTimeout(function(){
          try {
            if(data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if(data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
            else { hls.destroy(); setupHLSPlayer(url); }
          } catch(e){}
        }, 2000);
      }
    });

  } else if($video.canPlayType("application/vnd.apple.mpegurl") && isM3U8) {
    $video.src = playUrl;
    $video.addEventListener("loadedmetadata", function onMeta(){
      $video.removeEventListener("loadedmetadata", onMeta);
      currentPlayer = new Plyr($video, defaultOptions);

      currentPlayer.on("enterfullscreen", async function(){
        var locked = await tryLockLandscape();
        if(!locked && isPortrait()) applyCssRotation(true);
      });
      currentPlayer.on("exitfullscreen", function(){
        unlockOrientation();
        applyCssRotation(false);
      });

      $video.play().catch(function(){});
      hideOverlay();
      toast("● Live", "ok", 3000);
    });
    $video.addEventListener("error", function(){
      toast("Stream error", "err", 0);
    });
  } else {
    $video.src = playUrl;
    currentPlayer = new Plyr($video, defaultOptions);

    currentPlayer.on("enterfullscreen", async function(){
      var locked = await tryLockLandscape();
      if(!locked && isPortrait()) applyCssRotation(true);
    });
    currentPlayer.on("exitfullscreen", function(){
      unlockOrientation();
      applyCssRotation(false);
    });

    $video.addEventListener("loadedmetadata", function(){
      hideOverlay();
      toast("● Live", "ok", 3000);
    });
    $video.play().catch(function(){});
  }

  if(resumeTmr) clearInterval(resumeTmr);
  resumeTmr = setInterval(function() {
    if($video.paused && $video.readyState > 2) {
      $video.play().catch(function(){});
    }
  }, 3000);

  function unmute() {
    $video.muted = false;
    $video.volume = 1;
    document.removeEventListener("click", unmute);
    document.removeEventListener("touchstart", unmute);
  }
  document.addEventListener("click", unmute);
  document.addEventListener("touchstart", unmute);
}

function errMsg(msg){ setMsg(msg); $overlay.style.display="flex"; toast(msg,"err",0); }

// ============ MAIN ============
async function main(){
  var id = getChId();
  var data;

  try {
    setMsg("Loading channels…");
    data = await loadData();
  } catch(e) {
    console.error(e);
    errMsg("Connection error.");
    return;
  }

  if(!id) {
    renderList(data);
    return;
  }

  var channels = data.channels || data;
  var ch = channels.find(function(c){ return c.id === id; });
  if(!ch) {
    errMsg("Channel not found.");
    return;
  }

  document.title = "CRICZONE · " + ch.name;
  renderList(data);
  // Play the exact stream URL from the Sony playlist on this page.
  // Do not forward the channel ID to a second site with a different playlist.
  var externalFrame = document.getElementById("sonyExternalFrame");
  if(externalFrame) {
    externalFrame.src = "about:blank";
    externalFrame.style.display = "none";
  }
  $video.style.display = "block";
  setupHLSPlayer(ch.stream_url);
  if (window.startSonyRealtimeWatching) window.startSonyRealtimeWatching(ch.id || id);
}

// Handle browser back button
window.addEventListener("popstate", function(e){
  if($playerContainer.style.display === "flex") {
    hidePlayer();
  }
});

// Handle escape key
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && $playerContainer.style.display === "flex") {
    hidePlayer();
  }
});

document.addEventListener("DOMContentLoaded", main);
})();
</script>

import { getDatabase, ref, onValue, onDisconnect, set, remove, runTransaction } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

 apiKey:"AIzaSyCFusKEh9wF7O6yux5xLQgafvcr_jCv5aA",
 authDomain:"criczone-4daa2.firebaseapp.com",
 databaseURL:"https://criczone-4daa2-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"criczone-4daa2",
 storageBucket:"criczone-4daa2.firebasestorage.app",
 messagingSenderId:"113293633217",
 appId:"1:113293633217:web:a96d9b3af3045bcd99d640",
 measurementId:"G-Q9RJ0VSSPP"
};
const appName="criczone-sony-audience";
const app=getApps().find(x=>x.name===appName)||initializeApp(firebaseConfig,appName);
const db=getDatabase(app);
const watchingEl=document.getElementById("sonyWatchingCount");
const totalEl=document.getElementById("sonyTotalVisits");
const WATCH_BASE=220,TOTAL_BASE=10000;
let activeRef=null,watchOff=null,totalOff=null,activeChannel=null;
function show(el,n,min){if(el)el.textContent=Math.max(min,Number(n)||min).toLocaleString("en-IN")}
async function initSonyTotal(){
 const totalRef=ref(db,"siteStats/sonyTotalVisits");
 try{await runTransaction(totalRef,current=>current===null?TOTAL_BASE+1:Math.max(TOTAL_BASE,Number(current)||TOTAL_BASE)+1)}
 catch(e){console.warn("Sony total visits write failed",e)}
 totalOff=onValue(totalRef,s=>show(totalEl,s.val(),TOTAL_BASE),e=>console.warn("Sony total visits read failed",e));
}
async function stopSonyWatching(){
 if(watchOff){watchOff();watchOff=null}
 if(activeRef){const old=activeRef;activeRef=null;await remove(old).catch(()=>{})}
 activeChannel=null;show(watchingEl,WATCH_BASE,WATCH_BASE);
}
async function startSonyRealtimeWatching(channelId){
 const safe=String(channelId||"all").replace(/[^a-zA-Z0-9_-]/g,"_");
 if(activeChannel===safe&&activeRef)return;
 await stopSonyWatching();activeChannel=safe;
 const uid=globalThis.crypto?.randomUUID?.()||(Date.now()+"_"+Math.random().toString(36).slice(2));
 const viewersRef=ref(db,"sonyLiveViewers/"+safe);
 activeRef=ref(db,"sonyLiveViewers/"+safe+"/"+uid);
 try{
  await onDisconnect(activeRef).remove();
  await set(activeRef,{online:true,joinedAt:Date.now(),section:"sony"});
  watchOff=onValue(viewersRef,s=>show(watchingEl,WATCH_BASE+(s.size??s.numChildren()),WATCH_BASE),
    e=>console.warn("Sony viewer count read failed",e));
 }catch(e){console.error("Sony live watching Firebase error",e);show(watchingEl,WATCH_BASE,WATCH_BASE)}
}
window.startSonyRealtimeWatching=startSonyRealtimeWatching;
window.stopSonyWatching=stopSonyWatching;
show(watchingEl,WATCH_BASE,WATCH_BASE);show(totalEl,TOTAL_BASE,TOTAL_BASE);
initSonyTotal();
window.addEventListener("pagehide",()=>{if(activeRef)remove(activeRef).catch(()=>{});if(watchOff)watchOff();if(totalOff)totalOff()});
</script>
