name: CRICZONE Connection Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: criczone-connection-health
  cancel-in-progress: true

jobs:
  health-check:
    name: Check website, APIs and feeds
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check website and channel feeds
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p health-report
          : > health-report/results.txt

          check_url() {
            local label="$1"
            local url="$2"
            local expected="$3"
            local body_file="health-report/${label}.body"
            local code="000"
            local attempt

            for attempt in 1 2 3; do
              code=$(curl -L -sS --connect-timeout 10 --max-time 25 --retry 2 --retry-all-errors --retry-delay 2 -o "$body_file" -w "%{http_code}" "$url" || true)
              if [ "$code" = "$expected" ]; then
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 3))
              fi
            done

            if [ "$code" != "$expected" ]; then
              echo "$label|FAIL|HTTP $code; expected $expected after retries" | tee -a health-report/results.txt
              return 1
            fi

            if ! python3 -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$body_file" >/dev/null 2>&1; then
              echo "$label|FAIL|HTTP $code but response is not valid JSON" | tee -a health-report/results.txt
              return 1
            fi

            echo "$label|PASS|HTTP $code; valid JSON" | tee -a health-report/results.txt
          }

          site_code="000"
          for attempt in 1 2 3; do
            site_code=$(curl -L -sS --connect-timeout 10 --max-time 25 --retry 2 --retry-all-errors --retry-delay 2 -o /dev/null -w "%{http_code}" https://criczone.pages.dev/ || true)
            if [[ "$site_code" =~ ^[0-9]{3}$ ]] && [ "$site_code" -ge 200 ] && [ "$site_code" -lt 400 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 3)); fi
          done

          if [[ "$site_code" =~ ^[0-9]{3}$ ]] && [ "$site_code" -ge 200 ] && [ "$site_code" -lt 400 ]; then
            echo "website|PASS|HTTP $site_code" | tee -a health-report/results.txt
          else
            echo "website|FAIL|HTTP $site_code" | tee -a health-report/results.txt
          fi

          check_url channels_route "https://criczone.pages.dev/api/channels?feed=__healthcheck_invalid__" 400 || true
          check_url sports_feed "https://criczone.pages.dev/api/channels?feed=sports" 200 || true
          check_url directory_feed "https://criczone.pages.dev/api/channels?feed=directory" 200 || true
          check_url select_feed "https://criczone.pages.dev/api/channels?feed=select" 200 || true

          if grep -q '|FAIL|' health-report/results.txt; then
            echo "::error::One or more CRICZONE endpoints failed. See the health report artifact."
            exit 1
          fi

      - name: Publish health report
        if: always()
        shell: bash
        run: |
          {
            echo "## CRICZONE Connection Health"
            echo
            echo "| Connection | Result | Details |"
            echo "|---|---|---|"
            if [ -f health-report/results.txt ]; then
              while IFS='|' read -r name status detail; do
                echo "| $name | $status | $detail |"
              done < health-report/results.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criczone-connection-health
          path: health-report/
          if-no-files-found: ignore
          retention-days: 7
