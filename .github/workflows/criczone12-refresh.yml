name: CRICZONE12 Playlist Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract playlist metadata
        env:
          PLAYLIST_URL: http://sflex.fun/Sflex-Jio/ZioTvPlus.php
        run: python criczone12/tools/extract_playlist.py

      - name: Commit refreshed channel catalogue
        run: |
          if git diff --quiet -- criczone12/data/channels.json; then
            echo "Channel catalogue is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add criczone12/data/channels.json
          git commit -m "Refresh CRICZONE12 channel catalogue"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "Push race on attempt ${attempt}; retrying..."
            sleep $((attempt * 3))
          done
          echo "::error::Could not push refreshed catalogue after 3 attempts."
          exit 1
