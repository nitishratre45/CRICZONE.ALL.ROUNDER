name: CRICZONE1 Daily UI Polish

on:
  schedule:
    # 08:00 IST (02:30 UTC) every day
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: criczone1-daily-ui
  cancel-in-progress: false

jobs:
  polish:
    name: Review and polish CRICZONE1 UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check required files and API secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -f criczone1/index.html
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add GEMINI_API_KEY in GitHub → Settings → Secrets and variables → Actions. The workflow needs it to generate a safe CSS improvement."
            exit 1
          fi

      - name: Generate one small CSS-only improvement
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path

          import time
          path = Path("criczone1/index.html")
          html = path.read_text(encoding="utf-8")

          # Send the page's existing styles and a compact markup sample to Gemini.
          styles = "\\n\\n".join(re.findall(r"<style\\b[^>]*>(.*?)</style>", html, flags=re.I | re.S))
          markup = re.sub(r"<(script|style)\\b[^>]*>.*?</\\1>", "", html, flags=re.I | re.S)
          markup = re.sub(r"\\s+", " ", markup)[:18000]

          prompt = """Improve the CRICZONE1 cricket streaming website with ONE small,
          high-quality visual-only CSS improvement. Return ONLY plain CSS, no fences,
          no style tags. Prioritize responsive layout, accessibility, consistency,
          or performance. Use selectors grounded in this markup. Do not use @import,
          url(), JavaScript, HTML, destructive resets, or hide any controls, channels,
          banners, popups, stats, or player UI. Preserve all functionality.
          If no worthwhile safe improvement exists, return exactly NO_CHANGE.

          EXISTING CSS:
          """ + styles[:26000] + """

          PAGE MARKUP SAMPLE:
          """ + markup

          payload = {
              "systemInstruction": {
                  "parts": [{"text": "You are a cautious senior frontend engineer. Output CSS only."}]
              },
              "contents": [{"role": "user", "parts": [{"text": prompt}]}],
              "generationConfig": {"temperature": 0.2, "maxOutputTokens": 1200}
          }
          endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"
          data = json.dumps(payload).encode()
          headers = {
              "x-goog-api-key": os.environ["GEMINI_API_KEY"],
              "Content-Type": "application/json"
          }
          result = None
          for attempt in range(1, 4):
              try:
                  req = urllib.request.Request(endpoint, data=data, headers=headers, method="POST")
                  with urllib.request.urlopen(req, timeout=180) as response:
                      result = json.loads(response.read())
                  break
              except Exception as exc:
                  print(f"Gemini request attempt {attempt}/3 failed: {type(exc).__name__}: {exc}")
                  if attempt == 3:
                      raise
                  time.sleep(15 * attempt)

          candidates = result.get("candidates", [])
          if not candidates:
              raise SystemExit("Gemini returned no candidate content: " + json.dumps(result)[:1200])
          css = "".join(
              part.get("text", "")
              for part in candidates[0].get("content", {}).get("parts", [])
          ).strip()
          css = re.sub(r"^\\x60{3}(?:css)?\\s*|\\s*\\x60{3}$", "", css, flags=re.I).strip()

          if css == "NO_CHANGE" or not css:
              print("No worthwhile safe CSS improvement found; no commit created.")
              raise SystemExit(0)
          if len(css) > 12000 or "</style" in css.lower() or "<script" in css.lower():
              raise SystemExit("Generated output failed safety checks.")
          if "@import" in css.lower() or "url(" in css.lower():
              raise SystemExit("External CSS imports/URLs are not allowed.")
          if css.count("{") != css.count("}") or css.count("{") == 0:
              raise SystemExit("Generated CSS has unbalanced braces.")

          marker = "CRICZONE1 DAILY UI POLISH"
          if marker in html:
              html = re.sub(
                  r"\n?<!-- " + marker + r" START -->.*?<!-- " + marker + r" END -->\n?",
                  "",
                  html,
                  flags=re.S
              )
          addition = (
              "\n<!-- " + marker + " START -->\n"
              "<style id=\"criczone1-daily-ui-polish\">\n"
              + css + "\n</style>\n"
              "<!-- " + marker + " END -->\n"
          )
          if "</body>" in html.lower():
              match = re.search(r"</body\s*>", html, flags=re.I)
              html = html[:match.start()] + addition + html[match.start():]
          else:
              html += addition
          path.write_text(html, encoding="utf-8")
          print("Generated CSS improvement and appended it to criczone1/index.html.")
          PY

      - name: Validate HTML structure and diff
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from collections import Counter
          import re

          source = Path("criczone1/index.html").read_text(encoding="utf-8")
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.stack = []
                  self.void = {"area","base","br","col","embed","hr","img","input","link","meta","param","source","track","wbr"}
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  if tag not in self.void:
                      self.stack.append(tag)
              def handle_endtag(self, tag):
                  if tag in self.void:
                      return
                  if tag in self.stack:
                      while self.stack:
                          current = self.stack.pop()
                          if current == tag:
                              break

          parser = Audit()
          parser.feed(source)
          duplicates = [key for key, count in Counter(parser.ids).items() if count > 1]
          if duplicates:
              raise SystemExit("Duplicate HTML IDs: " + ", ".join(duplicates))
          if parser.stack:
              raise SystemExit("Unclosed HTML tags detected: " + ", ".join(parser.stack[-10:]))
          if len(re.findall(r"<style\b", source, re.I)) != len(re.findall(r"</style\s*>", source, re.I)):
              raise SystemExit("Unbalanced style tags.")
          if len(re.findall(r"<script\b", source, re.I)) != len(re.findall(r"</script\s*>", source, re.I)):
              raise SystemExit("Unbalanced script tags.")
          if not re.search(r"</html\s*>\s*$", source, re.I):
              raise SystemExit("HTML document does not close correctly.")
          print("HTML structure, IDs, style/script tags, and document ending passed.")
          PY
          git diff --check

      - name: Commit verified CSS improvement
        run: |
          if git diff --quiet -- criczone1/index.html; then
            echo "No UI change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add criczone1/index.html
          git commit -m "style(criczone1): daily UI polish"
          git push
