name: Cricinfo Live Scraper

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4

      - name: Run Scraper Script
        env:
          CRICINFO_COOKIE: ${{ secrets.CRICINFO_COOKIE }}
        run: python score.py

      - name: Commit and Push Results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.bots'
          git add scorecard.json scorecard_backups/
          git diff --staged --quiet || git commit -m "Auto-update scorecard: $(date -u)"
          git push
