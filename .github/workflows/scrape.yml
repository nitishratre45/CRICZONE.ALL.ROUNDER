name: Cricbuzz Live Scraper

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cricbuzz-live-scraper
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check scraper availability
        id: scraper
        shell: bash
        run: |
          if [ -f score.py ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Scraper script found."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::score.py is not present in the repository. Scrape and commit steps are safely skipped until the actual scraper is restored."
          fi

      - name: Set up Python
        if: steps.scraper.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        if: steps.scraper.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4

      - name: Run Scraper Script
        if: steps.scraper.outputs.available == 'true'
        run: python score.py

      - name: Commit and Push Results
        if: steps.scraper.outputs.available == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scorecard.json scorecard_backups/
          git diff --staged --quiet || git commit -m "Auto-update live scores: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
