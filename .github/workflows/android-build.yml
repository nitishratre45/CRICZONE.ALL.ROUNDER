name: Android Build

on:
  push:
    branches:
      - main
      - android-app-foundation
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches:
      - main
      - android-app-foundation
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build CRICZONE APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Accept SDK licences and install packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify Android project configuration
        working-directory: android
        run: gradle --no-daemon tasks --all

      - name: Run unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify debug APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: criczone-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release signing keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CRICZONE_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CRICZONE_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CRICZONE_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CRICZONE_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed release APK skipped: configure all four CRICZONE_RELEASE_* repository secrets."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/criczone-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "CRICZONE_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "CRICZONE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "CRICZONE_KEY_ALIAS=$KEY_ALIAS"
            echo "CRICZONE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Assemble signed release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Verify release APK signature
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: criczone-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CRICZONE Android build"
            echo
            echo "- Debug APK: built and uploaded when the job succeeds."
            if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
              echo "- Signed release APK: built, signature-verified and uploaded."
            else
              echo "- Signed release APK: skipped because signing secrets are not configured."
              echo "- Required secrets: CRICZONE_RELEASE_KEYSTORE_BASE64, CRICZONE_RELEASE_KEYSTORE_PASSWORD, CRICZONE_RELEASE_KEY_ALIAS, CRICZONE_RELEASE_KEY_PASSWORD."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
