name: CRICZONE34 - Refresh Channel Catalogue
on:
  schedule:
    - cron: "30 0 * * *" # Daily at 06:00 IST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: criczone34-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch and build channel JSON
        env:
          CRICZONE34_PLAYLIST_URL: https://sportlink-playlist.pages.dev/Combined.m3u
        run: python scripts/criczone34.py
      - name: Commit updated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add criczone34/channels.json
          git diff --cached --quiet || git commit -m "chore(criczone34): refresh channel catalogue"
          git push
