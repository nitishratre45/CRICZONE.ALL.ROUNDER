<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: #0d121d;
      --bg-card-hover: #131b2b;
      --bg-surface: rgba(13, 18, 29, 0.75);

      --cyan: #38bdf8;
      --cyan-glow: rgba(56, 189, 248, 0.35);
      --blue: #2563eb;
      --indigo: #6366f1;
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.4);
      --red-live: #ef4444;
      --green: #22c55e;

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(56, 189, 248, 0.3);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100%;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    body {
      background-image:
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 100% 40%, rgba(99, 102, 241, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 0% 80%, rgba(14, 165, 233, 0.06) 0%, transparent 50%);
      background-attachment: fixed;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(16px, 4vw, 40px);
      background: rgba(7, 9, 14, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 100;
      transition: all 0.3s ease;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      flex-shrink: 0;
    }
    .logo .sport {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
    }
    .logo .link { color: #ffffff; }
    .logo .live-dot {
      width: 8px; height: 8px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 12px #38bdf8;
      animation: pulseGlow 2s infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: clamp(4px, 1.2vw, 16px);
    }
    .header-nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.87rem;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: var(--radius-full);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .header-nav a:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }

    .nav-live-pill {
      background: rgba(239, 68, 68, 0.15) !important;
      color: #f87171 !important;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 14px !important;
      font-weight: 700 !important;
    }
    .nav-live-pill:hover {
      background: rgba(239, 68, 68, 0.28) !important;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.3);
    }

    .btn-telegram-nav {
      background: linear-gradient(135deg, #0284c7, #6366f1) !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      padding: 8px 18px !important;
      box-shadow: 0 0 20px rgba(14, 165, 233, 0.35);
      border: none;
    }
    .btn-telegram-nav:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 25px rgba(14, 165, 233, 0.55);
    }

    .hamburger {
      display: none;
      background: transparent;
      border: none;
      cursor: pointer;
      flex-direction: column;
      gap: 5px;
      padding: 8px;
    }
    .hamburger span {
      width: 24px; height: 2.5px;
      background: #ffffff;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .mobile-menu {
      position: fixed;
      top: 70px; left: 0; right: 0;
      background: rgba(7, 9, 14, 0.98);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 20px clamp(16px, 5vw, 32px);
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 99;
      animation: slideDown 0.3s ease;
      max-height: calc(100vh - 70px);
      overflow-y: auto;
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 1.02rem;
      font-weight: 600;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      transition: all 0.2s ease;
    }
    .mobile-menu a:hover {
      color: #ffffff;
      background: rgba(56, 189, 248, 0.1);
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1150px) { .header-nav .nav-live-pill { display: none; } }
    @media (max-width: 980px) {
      .header-nav { display: none; }
      .hamburger { display: flex; }
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: clamp(24px, 4vw, 48px) clamp(16px, 4vw, 40px);
      display: flex;
      flex-direction: column;
      gap: clamp(36px, 5vw, 56px);
    }
    .stream-section { scroll-margin-top: 92px; }

    .section-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .section-hd-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .section-bar {
      width: 4px; height: 28px;
      border-radius: 4px;
      background: linear-gradient(180deg, var(--cyan) 0%, var(--indigo) 100%);
      box-shadow: 0 0 14px var(--cyan-glow);
      flex-shrink: 0;
    }
    .section-title {
      font-size: clamp(1.25rem, 2.2vw, 1.7rem);
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .section-title em { font-style: normal; color: var(--cyan); }
    .section-badge {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      white-space: nowrap;
    }
    .section-hd-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--cyan);
      text-decoration: none;
      padding: 7px 14px;
      border-radius: var(--radius-full);
      border: 1px solid rgba(56, 189, 248, 0.25);
      background: rgba(56, 189, 248, 0.08);
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .section-link:hover {
      background: rgba(56, 189, 248, 0.22);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
    }
    .section-link .material-icons { font-size: 15px; }

    .carousel-controls { display: flex; align-items: center; gap: 8px; }
    .nav-arrow {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }
    .nav-arrow:hover {
      background: var(--cyan);
      color: #07090e;
      border-color: var(--cyan);
      transform: scale(1.08);
      box-shadow: 0 0 16px var(--cyan-glow);
    }
    .nav-arrow:active { transform: scale(0.95); }

    .stream-track {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      padding: 10px 4px 24px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .stream-track::-webkit-scrollbar { display: none; }

    .stream-card {
      flex: 0 0 clamp(250px, 23vw, 310px);
      scroll-snap-align: start;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .stream-card:hover {
      transform: translateY(-8px);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.2);
      background: var(--bg-card-hover);
    }
    .card-media {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      background: #090c13;
    }
    .card-media img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .stream-card:hover .card-media img { transform: scale(1.08); }

    /* Team vs Team thumbnail */
    .card-media.team-vs {
      padding-top: 56.25%;
      background: linear-gradient(135deg, #0b0f17 0%, #131b2b 100%);
    }
    .card-media.team-vs > .team-vs-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
    }
    .card-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }
    .card-crest {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #1a2330;
      border: 2px solid rgba(255, 255, 255, 0.12);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      font-size: 13px;
      font-weight: 800;
      color: #94a3b8;
      flex-shrink: 0;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .stream-card:hover .card-crest {
      transform: scale(1.06);
      border-color: rgba(56, 189, 248, 0.4);
    }
    .card-crest img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #1a2330;
      padding: 4px;
    }
    .card-team-name {
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      max-width: 88px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #cbd5e1;
      line-height: 1.2;
    }
    .vs-badge {
      font-size: 10px;
      font-weight: 800;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 3px 9px;
      border-radius: 999px;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    .card-live-tag {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(239, 68, 68, 0.9);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.5);
      z-index: 2;
    }
    .card-live-tag.is-live { background: rgba(239, 68, 68, 0.95); }
    .card-live-tag.is-upcoming { background: rgba(14, 165, 233, 0.95); }

    .card-free-tag {
      position: absolute;
      top: 10px; right: 10px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ffffff;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
      letter-spacing: 0.05em;
      z-index: 2;
      box-shadow: 0 2px 8px rgba(34, 197, 94, 0.5);
    }
    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.35;
      color: #ffffff;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .card-btn {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--cyan);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .skeleton-card {
      flex: 0 0 clamp(250px, 23vw, 310px);
      height: 240px;
      border-radius: var(--radius-md);
      background: linear-gradient(90deg, #0d121d 0%, #151e30 50%, #0d121d 100%);
      background-size: 200% 100%;
      animation: shimmer 1.8s infinite;
      border: 1px solid var(--border-subtle);
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .track-empty {
      color: var(--text-muted);
      padding: 20px;
      font-size: 0.92rem;
    }

    footer {
      background: #05070b;
      border-top: 1px solid var(--border-subtle);
      padding: clamp(40px, 6vw, 60px) clamp(16px, 4vw, 40px) 30px;
      margin-top: 40px;
    }
    .footer-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
    }
    @media (min-width: 768px) { .footer-inner { grid-template-columns: 1.5fr 1fr 1fr; } }

    .footer-brand-col p {
      color: var(--text-muted);
      font-size: 0.92rem;
      line-height: 1.6;
      margin: 16px 0 20px;
      max-width: 360px;
    }
    .footer-telegram-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--cyan);
      padding: 10px 20px;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .footer-telegram-btn:hover {
      background: var(--cyan);
      color: #07090e;
      box-shadow: 0 0 20px var(--cyan-glow);
    }
    .footer-col h4 {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 18px;
    }
    .footer-col a {
      display: block;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 6px 0;
      transition: all 0.2s ease;
    }
    .footer-col a:hover { color: var(--cyan); padding-left: 4px; }

    .footer-bottom {
      max-width: 1400px;
      margin: 40px auto 0;
      padding-top: 20px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--text-dim);
      font-size: 0.82rem;
    }
  </style>

<style id="criczone-match-center-unified-v2">

 const input=toolbar.querySelector('input'),buttons=[...toolbar.querySelectorAll('button')];
 const savedKey='criczone-match-center-saved-v3';let mode='all',saved=new Set();

 function statusFor(card){return (card.querySelector('.card-live-tag')?.textContent||'').trim().toUpperCase()}
 function isLive(card){const status=statusFor(card);return /\bLIVE\b|INPLAY|IN PLAY|ONGOING/.test(status)}
 function isUpcoming(card){const status=statusFor(card);return !isLive(card)&&!(/FINISHED|ENDED|RESULT|CANCELLED|CANCELED|ABANDONED/.test(status))}
 function decorate(card){

 }
