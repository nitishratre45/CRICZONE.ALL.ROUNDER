<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRICZONE Match Center | Live Scores & Fixtures</title><meta name="description" content="CRICZONE Match Center — cricket and football updates, fixtures and results."><meta name="theme-color" content="#080d18">
<style>
:root{--bg:#080d18;--panel:#101a2b;--line:#25334a;--text:#edf4ff;--muted:#91a3bd;--blue:#39a9ff;--red:#ff4d5d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#17345b 0,transparent 48%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}button,input{font:inherit}.wrap{max-width:1240px;margin:auto;padding:0 20px}.top{position:sticky;top:0;z-index:20;background:#080d18e8;backdrop-filter:blur(18px);border-bottom:1px solid #23334a}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;letter-spacing:-1.2px;font-size:23px}.brand span{color:var(--blue)}.navlinks{display:flex;gap:10px}.navlinks a{color:var(--muted);font-weight:700;font-size:13px;padding:9px 12px;border-radius:10px}.navlinks a:hover{background:#142138;color:white}.hero{padding:34px 0 20px}.eyebrow{color:var(--blue);font-size:11px;letter-spacing:2px;font-weight:900}.hero h1{font-size:clamp(28px,5vw,44px);letter-spacing:-1.4px;margin:10px 0}.hero p{color:var(--muted);margin:0;line-height:1.6}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0}.search{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);color:white;padding:12px 15px;border-radius:12px;outline:none}.search:focus{border-color:var(--blue)}.filter{display:flex;gap:7px;flex-wrap:wrap}.pill,.refresh{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:10px 14px;border-radius:11px;cursor:pointer;font-size:12px;font-weight:800}.pill.active{background:#12375a;border-color:#247ac0;color:#fff}.refresh{color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.stat{border:1px solid var(--line);background:linear-gradient(135deg,#111d31,#0c1422);border-radius:14px;padding:14px}.stat b{font-size:23px;display:block}.stat span{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.7px}.section{margin:24px 0 36px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.section-title h2{font-size:17px;margin:0}.count{color:var(--muted);font-size:11px;font-weight:800}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.match{border:1px solid var(--line);background:linear-gradient(145deg,var(--panel),#0c1422);border-radius:16px;padding:16px;transition:.2s;min-width:0}.match:hover{transform:translateY(-3px);border-color:#3376ac;box-shadow:0 12px 28px #0004}.match-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.sport-tag{font-size:10px;font-weight:900;color:var(--blue);letter-spacing:.7px}.status{font-size:10px;font-weight:900;border-radius:999px;padding:5px 8px;background:#1a2b42;color:#a8bdd6}.status.live{background:#421e2a;color:#ff8290}.status.done{background:#19382e;color:#71e1b1}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.team{text-align:center;font-weight:800;font-size:14px;line-height:1.35;overflow-wrap:anywhere}.versus{color:#526782;font-size:10px;font-weight:900}.match-title{margin:12px 0 0;color:var(--muted);font-size:12px;line-height:1.45;min-height:34px}.meta{border-top:1px solid #24334a;margin-top:12px;padding-top:11px;display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}.details{color:var(--blue);font-weight:900}.empty{border:1px dashed var(--line);padding:30px;text-align:center;color:var(--muted);border-radius:14px;grid-column:1/-1}.foot{padding:26px 0 40px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:12px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr)}}@media(max-width:600px){.wrap{padding:0 13px}.nav{height:60px}.brand{font-size:21px}.navlinks a{padding:8px 9px;font-size:12px}.hero{padding-top:26px}.cards{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:11px}.stat b{font-size:20px}.match{padding:14px}.team{font-size:13px}}
</style></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="./">CRIC<span>ZONE</span></a><nav class="navlinks"><a href="#live">Live</a><a href="#upcoming">Upcoming</a><a href="#results">Results</a></nav></div></header>
<main class="wrap"><section class="hero"><div class="eyebrow">SPORTS • LIVE • FIXTURES</div><h1>Match Center</h1><p>Live updates, upcoming fixtures and recent results — all in one place.</p>
<div class="toolbar"><input class="search" id="search" placeholder="Search team, tournament or match…" aria-label="Search matches"><div class="filter" id="filters"><button class="pill active" data-filter="all">All</button><button class="pill" data-filter="cricket">Cricket</button><button class="pill" data-filter="football">Football</button></div><button class="refresh" id="refresh">↻ Refresh</button></div>
<div class="stats"><div class="stat"><b id="liveCount">—</b><span>LIVE NOW</span></div><div class="stat"><b id="upCount">—</b><span>UPCOMING</span></div><div class="stat"><b id="resultCount">—</b><span>RESULTS</span></div></div></section>
<section class="section" id="live"><div class="section-title"><h2>🔴 Live Matches</h2><span class="count" id="liveLabel">0 MATCHES</span></div><div class="cards" id="liveCards"></div></section>
<section class="section" id="upcoming"><div class="section-title"><h2>🗓 Upcoming</h2><span class="count" id="upLabel">0 MATCHES</span></div><div class="cards" id="upCards"></div></section>
<section class="section" id="results"><div class="section-title"><h2>🏁 Results</h2><span class="count" id="resultLabel">0 MATCHES</span></div><div class="cards" id="resultCards"></div></section></main><footer class="wrap foot">CRICZONE Match Center · Auto-refresh every 90 seconds</footer>
<script>
(()=>{'use strict';
const FEEDS=[{sport:'Cricket',url:'https://sonujson-v6.pages.dev/Data/events/cricket.json'},{sport:'Football',url:'https://sonujson-v6.pages.dev/Data/events/football.json'}];
const state={all:[],filter:'all',search:''};const $=id=>document.getElementById(id);
function clean(v){return String(v??'').replace(/[<>]/g,'').trim()}
function statusOf(m){let s=String(m.status||m.state||'').toLowerCase();if(m.isLive===true||m.live===true||s.includes('live')||s.includes('in progress'))return'live';if(s.includes('finish')||s.includes('complete')||s.includes('result')||s.includes('ended'))return'done';return'upcoming'}
function teams(m){let e=m.event||m;let a=e.teamA||m.teamA||m.homeTeam||m.home||m.team1||'',b=e.teamB||m.teamB||m.awayTeam||m.away||m.team2||'';if(!a&&!b){let t=m.title||m.match_name||m.event_name||'Match';let p=t.split(/\s+(?:vs\.?|v\.?|@)\s+/i);if(p.length>1){a=p[0];b=p.slice(1).join(' vs ')}else a=t}return[clean(a)||'Team A',clean(b)||'Team B']}
function norm(m,sport){let ab=teams(m),title=clean(m.title||m.match_name||m.event_name||ab[0]+' vs '+ab[1]);return{id:clean(m.id||m.match_id||m.eventId||title),sport,status:statusOf(m),a:ab[0],b:ab[1],title,competition:clean(m.tournament||m.tournament_name||m.competition||m.event?.type||sport),time:clean(m.start_time||m.startTime||m.date||m.time||''),score:clean(m.score||m.scoreText||m.result||m.statusText||'')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function url(m){let p=new URLSearchParams({id:m.id,sport:m.sport,a:m.a,b:m.b,title:m.title,status:m.status,competition:m.competition,time:m.time,score:m.score});return'match.html?'+p}
function card(m){let st=m.status==='live'?'LIVE':m.status==='done'?'COMPLETED':'UPCOMING';return'<article class="match"><div class="match-top"><span class="sport-tag">'+esc(m.sport.toUpperCase())+'</span><span class="status '+(m.status==='live'?'live':m.status==='done'?'done':'')+'">'+st+'</span></div><div class="teams"><div class="team">'+esc(m.a)+'</div><span class="versus">VS</span><div class="team">'+esc(m.b)+'</div></div><p class="match-title">'+esc(m.title)+'</p><div class="meta"><span>'+esc(m.competition)+(m.time?' · '+esc(m.time):'')+'</span><a class="details" href="'+url(m)+'">Details ↗</a></div></article>'}
function render(){let f=state.all.filter(m=>(state.filter==='all'||m.sport.toLowerCase()===state.filter)&&(!state.search||[m.a,m.b,m.title,m.competition,m.sport].join(' ').toLowerCase().includes(state.search)));let l=f.filter(m=>m.status==='live'),u=f.filter(m=>m.status==='upcoming'),d=f.filter(m=>m.status==='done');$('liveCount').textContent=state.all.filter(m=>m.status==='live').length;$('upCount').textContent=state.all.filter(m=>m.status==='upcoming').length;$('resultCount').textContent=state.all.filter(m=>m.status==='done').length;$('liveLabel').textContent=l.length+' MATCHES';$('upLabel').textContent=u.length+' MATCHES';$('resultLabel').textContent=d.length+' MATCHES';$('liveCards').innerHTML=l.length?l.map(card).join(''):'<div class="empty">No live matches right now.</div>';$('upCards').innerHTML=u.length?u.map(card).join(''):'<div class="empty">No upcoming fixtures found in feeds.</div>';$('resultCards').innerHTML=d.length?d.slice(0,30).map(card).join(''):'<div class="empty">No recent results found in feeds.</div>'}
async function load(){$('refresh').textContent='Loading…';$('refresh').disabled=true;let results=await Promise.allSettled(FEEDS.map(async f=>{let r=await fetch(f.url,{cache:'no-store'});if(!r.ok)throw Error('Feed HTTP '+r.status);let d=await r.json();let raw=d.events||d.matches||d.Matches||(Array.isArray(d)?d:[]);return raw.map(m=>norm(m,f.sport))}));state.all=results.flatMap(x=>x.status==='fulfilled'?x.value:[]);render();$('refresh').textContent='↻ Refresh';$('refresh').disabled=false}
$('filters').addEventListener('click',e=>{let b=e.target.closest('[data-filter]');if(!b)return;state.filter=b.dataset.filter;document.querySelectorAll('.pill').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').addEventListener('input',e=>{state.search=e.target.value.toLowerCase().trim();render()});$('refresh').addEventListener('click',load);load();setInterval(load,90000)
})();
</script></body></html>
