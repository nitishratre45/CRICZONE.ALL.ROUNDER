<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criczone Live</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050812;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            text-align: center;
            padding: 35px;
        }

        .logo {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        p {
            color: #8d99ad;
            margin-bottom: 25px;
        }

        .loader {
            width: 38px;
            height: 38px;
            margin: auto;
            border: 3px solid rgba(255,255,255,.15);
            border-top-color: #229ed9;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            border-radius: 10px;
            background: #229ed9;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="logo">🏏</div>

        <h1>Criczone Live</h1>

        <p>Opening Criczone Telegram...</p>

        <div class="loader"></div>

        <a
            class="btn"
            href="https://t.me/+MueCDjlpoS8yNmJl"
        >
            OPEN TELEGRAM
        </a>

    </div>


    <script>

        const telegram =
            "https://t.me/+MueCDjlpoS8yNmJl";

        /*
         * Automatically open Telegram
         * after 800 milliseconds.
         */

        setTimeout(() => {

            window.location.href =
                telegram;

        }, 800);

    </script>

</body>
</html>
