        :root {
            color-scheme: dark;
            --bg: #08100d;
            --panel: #101a15;
            --panel-hover: #14221b;
            --text: #f1f6f2;
            --muted: #9aa99f;
            --line: rgba(210, 230, 216, .13);
            --mint: #72e0aa;
            --lime: #d5ef7b;
            --blue: #70c7e8;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            background:
                linear-gradient(rgba(8, 16, 13, .96), rgba(8, 16, 13, .98)),
                repeating-linear-gradient(0deg, transparent 0 63px, rgba(210, 230, 216, .05) 64px),
                var(--bg);
            font-family: "Manrope", sans-serif;
        }

        a { color: inherit; }

        .shell {
            width: min(100% - 40px, 1040px);
            margin-inline: auto;
            padding: 28px 0 36px;
        }

        .masthead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 54px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 18px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            text-decoration: none;
        }

        .brand-mark {
            display: grid;
            width: 42px;
            aspect-ratio: 1;
            place-items: center;
            border: 1px solid rgba(114, 224, 170, .32);
            border-radius: 12px;
            background: linear-gradient(145deg, rgba(114, 224, 170, .16), rgba(112, 199, 232, .08));
            font-size: 22px;
        }

        .brand-name {
            display: block;
            font: 700 17px/1 "Space Grotesk", sans-serif;
        }

        .brand-sub {
            display: block;
            margin-top: 5px;
            color: var(--muted);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .live-state {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--mint);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .live-state::before {
            width: 7px;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--mint);
            box-shadow: 0 0 12px rgba(114, 224, 170, .6);
            content: "";
        }

        main { padding-top: clamp(34px, 7vw, 70px); }

        .intro {
            max-width: 650px;
            margin-bottom: 30px;
            animation: rise-in .55s cubic-bezier(.2, .7, .2, 1) both;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 14px;
            color: var(--mint);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.8px;
        }

        .eyebrow::before {
            width: 24px;
            height: 1px;
            background: var(--mint);
            content: "";
        }

        h1 {
            margin: 0;
            font: 700 clamp(34px, 7vw, 58px)/1.02 "Space Grotesk", sans-serif;
        }

        h1 span { color: var(--lime); }

        .intro p {
            max-width: 470px;
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65;
        }

        .hub-grid {
            display: grid;
            grid-template-columns: minmax(0, 520px);
            gap: 12px;
        }

        .hub-card {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr) 24px;
            align-items: center;
            gap: 13px;
            min-height: 92px;
            padding: 16px 18px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: linear-gradient(115deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, .012));
            text-decoration: none;
            animation: rise-in .48s cubic-bezier(.2, .7, .2, 1) both;
            transition: background .18s ease, border-color .18s ease, transform .18s ease;
        }

        .hub-card:nth-child(2) { animation-delay: .05s; }
        .hub-card:nth-child(3) { animation-delay: .1s; }
        .hub-card:nth-child(4) { animation-delay: .15s; }
        .hub-card:nth-child(5) { animation-delay: .2s; }

        .hub-card:hover {
            transform: translateY(-2px);
            border-color: rgba(114, 224, 170, .42);
            background: var(--panel-hover);
        }

        .hub-card:focus-visible,
        .community-link:focus-visible {
            outline: 2px solid var(--lime);
            outline-offset: 3px;
        }

        .hub-number {
            color: var(--mint);
            font: 700 13px "Space Grotesk", sans-serif;
        }

        .hub-copy { min-width: 0; }

        .hub-title {
            display: block;
            overflow-wrap: anywhere;
            font: 700 15px/1.25 "Space Grotesk", sans-serif;
        }

        .hub-detail {
            display: block;
            margin-top: 5px;
            color: var(--muted);
            font-size: 10px;
            line-height: 1.4;
        }

        .hub-arrow {
            color: var(--lime);
            font-size: 19px;
            text-align: right;
            transition: transform .18s ease;
        }

        .hub-card:hover .hub-arrow { transform: translateX(3px); }

        .redirect-spinner {
            width: 24px;
            aspect-ratio: 1;
            margin-top: 22px;
            border: 2px solid rgba(210, 230, 216, .18);
            border-top-color: var(--mint);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            color: #77867d;
            font-size: 10px;
        }

        .community-link {
            color: var(--blue);
            font-weight: 700;
            text-decoration: none;
        }

        @keyframes rise-in {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 620px) {
            .shell { width: min(100% - 28px, 460px); padding-top: 16px; }
            main { padding-top: 36px; }
            .hub-grid { grid-template-columns: 1fr; gap: 9px; }
            .hub-card { min-height: 78px; padding: 13px 14px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }

<!-- CRICZONE anti-popunder guard: block unsolicited script-opened tabs/windows -->
<script>
(() => {
  // Block scripted popup handlers attached to taps/clicks, while preserving normal site controls and links.
  document.addEventListener('click', event => {
    const link = event.target && event.target.closest ? event.target.closest('a[href]') : null;
    if (link && link.target === '_blank') {
      const href = link.getAttribute('href') || '';
      if (/^(javascript:|data:)/i.test(href.trim())) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    }
  }, true);
  // Sandboxed iframes must not be granted allow-popups; this observer removes it if added later.
  const sandboxFrames = root => {
    if (!root || !root.querySelectorAll) return;
    root.querySelectorAll('iframe').forEach(frame => {
      if (frame.hasAttribute('sandbox')) {
        const tokens = frame.getAttribute('sandbox').split(/\s+/).filter(Boolean).filter(token => token !== 'allow-popups' && token !== 'allow-popups-to-escape-sandbox');
        frame.setAttribute('sandbox', tokens.join(' '));
      }
    });
  };
  const watch = () => {
    const host = document.querySelector('criczone-ui');
    if (!host || !host.shadowRoot) return;
    sandboxFrames(host.shadowRoot);
    new MutationObserver(() => sandboxFrames(host.shadowRoot)).observe(host.shadowRoot, { childList: true, subtree: true, attributes: true, attributeFilter: ['sandbox'] });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch, { once: true });
  else watch();
})();
</script>
